</script>

<link rel="stylesheet" href="/film/film.css">
<style>
  .films{display:grid;gap:18px;margin:8px 0 0}
  .films a{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .films a:hover{border-color:var(--accent)}
  .films img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .films .t{padding:12px 14px 14px}
  .films h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 4px}
  .films p{margin:0;color:var(--muted);font-size:.875rem;line-height:1.5}
  .films .meta{margin-top:6px;font-size:.75rem;color:var(--accent);letter-spacing:.05em}
  .films .new{display:inline-block;margin-left:6px;font-size:.6875rem;color:#14110b;background:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:2px}
  @media (min-width:720px){ .films{grid-template-columns:1fr 1fr} .films a:first-child{grid-column:1/-1} .films a:first-child h2{font-size:1.625rem} }

<body>
<main>
  <div class="top"><span class="dot"></span><a class="brand" href="/?lang=ko">한눈에 보는 성경 이야기</a><span class="spacer"></span></div>
  <header class="hero">
  <div class="kicker">영상</div>
  <h1>영상으로 보는 <span class="em">성경 이야기</span></h1>
  <p class="sub">영상을 보고, 나온 말씀을 성경에서 직접 읽어 보세요. 그림은 브라우저에서 실시간으로 그려집니다.</p>
  </header>
  <div class="films" id="films">
    <!-- filled from films.json; the same links for crawlers and no-JS readers -->
    <a href="/film/silence/"><div class="t"><h2>침묵의 400년</h2><p>구약과 신약 사이, 하나님은 무엇을 준비하셨나</p></div></a>
    <a href="/film/story/"><div class="t"><h2>영상으로 보는 성경 이야기</h2><p>창조에서 새 하늘과 새 땅까지, 21개 장면</p></div></a>
  </div>
  <footer>
    성경 인용: 「성경전서 개역개정판」 © 대한성서공회. 저작권은 대한성서공회에 있으며, 출처를 밝혀 인용했습니다.
    그림은 모두 코드로 그렸고, 해설 목소리·음악·효과음은 ElevenLabs(AI)로 만들었습니다.
  </footer>
</main>
<script>
(function () {
  var box = document.getElementById('films'), NEW = 7 * 864e5;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  fetch('/film/films.json').then(function (r) { return r.json(); }).then(function (F) {
    box.innerHTML = F.map(function (f) {
      var fresh = Date.now() - Date.parse(f.date) < NEW;
      return '<a href="' + esc(f.path) + '" data-film="' + esc(f.id) + '"><img src="' + esc(f.card) + '" alt="" loading="lazy"><div class="t"><h2>' + esc(f.title) +
        (fresh ? '<span class="new">새 영상</span>' : '') + '</h2><p>' + esc(f.sub) + '</p><div class="meta">' + esc(f.len) + '</div></div></a>';
    }).join('');
    box.querySelectorAll('a').forEach(function (a) { a.onclick = function () { if (window.gtag) try { gtag('event', 'nav_click', { to: 'film', film: a.dataset.film, site_language: 'ko' }); } catch (e) {} }; });
  }).catch(function () {});
})();
</script>
</body>
