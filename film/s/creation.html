<!doctype html>
<html lang="ko">
<head>

<title>시안 · 창조</title>

<body>
<script src="lib.js"></script>
<script>
/* 01 창조 — a 3D particle light event with IMAX grain, re-meant as "빛이 있으라".
   A  total darkness over the deep; the word is spoken; one point of light
   B  white flash → a billowing gold sphere of light over the water, a ring of light skimming the deep
   C  the camera rises into the light; its particles swirl apart into galaxies and stars
   D  a blue planet ahead; the camera falls toward it through the clouds
   E  dawn in the garden: two small figures, and the light beside them (Gen 1:31) */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, hex, mix, rgb, ramp, speckle, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 35;
const F = V ? 1500 : 1080;                     // focal length (px)
const HC = H * .6;                             // horizon on screen (lens shift)
const T_IGN = 4.9, T_FL = 6.8;                 // the point of light appears; the flash
const BX = 0, BY = -4.6, BZ = 46, WY = 1.4;    // the light's centre; the water plane
const S = { A: [0, T_FL], B: [T_FL, 14], C: [14, 21], D: [21, 26.4], E: [26.4, DUR] };
let RAYS, GAL, B, bx, R, rx, Hal, hx, grains = [], sprites = [], dark, P, NP, stars, NS, streaks, NWS, earthMap, cloudTex, eden, edenFg, motes;

// ---------- camera: push in, then rise toward the heavens ----------
function cam(t) {
  const k = eio(clamp((t - 13.6) / 8.4)), ph = 1.08 * eio(clamp((t - 13.4) / 6.5)), fw = 320 * Math.pow(clamp((t - 20.4) / 6), 2);
  return { x: 0, y: -260 * k - fw * Math.sin(ph), z: lerp(0, 4.5, eo(clamp((t - T_FL) / 7))) + 150 * k + fw * Math.cos(ph), ph };
}
function unproj(c, sx, sy, d) {       // screen point at view depth d → world
  const xc = (sx - W / 2) * d / F, yc = (sy - HC) * d / F, cp = Math.cos(c.ph), sp = Math.sin(c.ph);
  return [c.x + xc, c.y + yc * cp - d * sp, c.z + yc * sp + d * cp];
}
function proj(c, X, Y, Z) {            // world → screen; returns [sx, sy, scale] or null
  const x = X - c.x, y = Y - c.y, z = Z - c.z, cp = Math.cos(c.ph), sp = Math.sin(c.ph);
  const yc = y * cp + z * sp, zc = -y * sp + z * cp; if (zc < .6) return null;
  const s = F / zc; return [W / 2 + x * s, HC + yc * s, s];
}

// ---------- the light: puffs of particles on shells ----------
const HEAT = [[0, '#2a0c04'], [.2, '#8a3214'], [.4, '#ff9a50'], [.6, '#ffc46a'], [.8, '#fff0c8'], [1, '#ffffff']];
function buildLight() {
  const r = rng(11), list = [];
  const sph = () => { const u = r() * 2 - 1, a = r() * 6.283, q = Math.sqrt(1 - u * u); return [q * Math.cos(a), u, q * Math.sin(a)]; };
  for (let p = 0; p < 1000; p++) {                  // billows: clusters on shells, denser outside
    const d = sph(), sh = p < 160 ? r() * .45 : .55 + .45 * Math.sqrt(r()), pr = .07 + r() * .12, n = p < 160 ? 8 : 13, nz = r();
    for (let i = 0; i < n; i++) { const o = sph(), q = Math.cbrt(r()) * pr;
      list.push({ dx: d[0] * sh + o[0] * q, dy: d[1] * sh * .92 + o[1] * q, dz: d[2] * sh + o[2] * q, sh, ph: d, nz, sz: .05 + r() * .09, h0: r(), kind: 0 }); }
  }
  for (let i = 0; i < 900; i++) { const d = sph(); list.push({ dx: d[0], dy: d[1], dz: d[2], v: 14 + r() * 26, sz: .02, h0: r(), kind: 1 }); }   // sparks
  for (let i = 0; i < 1500; i++) { const a = r() * 6.283; list.push({ a, rr: .8 + r() * .45, sz: .02, h0: r(), kind: 2, tw: r() * 6.28 }); }      // light skimming the deep
  // targets: every particle becomes a star or part of a galaxy
  // galaxies are placed where the rising camera will see them (screen position + depth at t = 19.6)
  const c19 = cam(19.6), at = (fx, fy, d) => unproj(c19, W * fx, H * fy, d);
  const G = V ? [ { c: at(.42, .36, 150), R: 44, tx: 3.1, tz: .35, rot: 1 }, { c: at(.74, .6, 240), R: 40, tx: 2.4, tz: -.5, rot: -1 }, { c: at(.3, .76, 200), R: 16, tx: 3.5, tz: .9, rot: 1 } ]
              : [ { c: at(.32, .42, 150), R: 46, tx: 3.1, tz: .35, rot: 1 }, { c: at(.75, .3, 250), R: 42, tx: 2.35, tz: -.5, rot: -1 }, { c: at(.64, .76, 200), R: 16, tx: 3.5, tz: .9, rot: 1 } ];
  list.forEach((p, i) => {
    if (i % 4 === 0 || p.kind === 2) { p.g = -1; p.tx = (r() - .5) * 600; p.ty = -60 - r() * 520; p.tz = 120 + r() * 420; return; }
    const gi = i % 7 < 3 ? 0 : i % 7 < 6 ? 1 : 2, g = G[gi], arm = (i >> 2) % 2, u = Math.pow(r(), .7), rr = g.R * u, th = arm * Math.PI + u * 3.6 + (r() - .5) * (.9 + .5 * r()) * (1 - u * .4), h = (r() - .5) * g.R * .12 * (1 - u * .7);
    p.g = gi; p.gr = rr * (1 + (r() - .5) * .25); p.gth = th; p.gh = h; p.gp = g; p.core = u < .2; p.blue = !p.core && r() < .5;
  });
  GAL = G; return list;
}
function galPos(p, t) {               // a galaxy star at time t (differential rotation)
  const g = p.gp, th = p.gth + g.rot * .16 * Math.max(0, t - 14) / (.4 + p.gr / g.R);
  let x = p.gr * Math.cos(th), y = p.gh, z = p.gr * Math.sin(th);
  let y1 = y * Math.cos(g.tx) - z * Math.sin(g.tx), z1 = y * Math.sin(g.tx) + z * Math.cos(g.tx);
  let x2 = x * Math.cos(g.tz) - y1 * Math.sin(g.tz), y2 = x * Math.sin(g.tz) + y1 * Math.cos(g.tz);
  return [g.c[0] + x2, g.c[1] + y2, g.c[2] + z1];

function drawLight(ctx, t, c) {
  const tau = t - T_FL; if (tau < -.05) return 0;
  const Rb = 6.4 * (1 - Math.exp(-tau / .7)) + .5 * tau, rot = .045 * tau;
  const mk = i => clamp((t - 14.2 - (i % 97) / 97 * 2.2) / 3.4);     // morph progress per particle
  bx.globalCompositeOperation = 'source-over'; bx.clearRect(0, 0, W / 2, H / 2); bx.globalCompositeOperation = 'lighter';
  const fadeB = 1 - ss(22, 23.8, t), cr = Math.cos(rot), sr = Math.sin(rot), veins = [];
  let litX = 0, litY = 0;
  for (let i = 0; i < NP; i++) {
    const p = P[i]; let X, Y, Z, heat, a, sz;
    if (p.kind === 0) {
      const wob = 1 + .5 * (noise(p.ph[0] * 2.2 + p.nz * 9 + tau * .32, p.ph[1] * 2.2 + p.ph[2] * 1.7) - .5);
      const lx = p.dx * wob, ly = p.dy * wob - .03 * tau * (1 - p.sh), lz = p.dz * wob;
      X = BX + (lx * cr - lz * sr) * Rb; Y = BY + ly * Rb; Z = BZ + (lx * sr + lz * cr) * Rb;
      heat = clamp(1.12 - p.sh * .78 - tau * .055 + (p.h0 - .5) * .34 + (ly < -.6 ? -.1 : 0)); a = (p.sh < .5 ? .022 : .05) * (.35 + .65 * heat); sz = p.sz * Rb;
      if (p.sh > .85 && p.dy < -.55 && p.h0 < .35) veins.push(i);

      const rr = p.v / .7 * (1 - Math.exp(-.7 * tau)); X = BX + p.dx * rr; Y = BY + p.dy * rr * .8 + .15 * tau * tau; Z = BZ + p.dz * rr;
      heat = clamp(1 - tau * .12 + p.h0 * .3); a = .9 * (1 - ss(2, 7, tau)); sz = .07;
    } else {
      const rr = (34 * (1 - Math.exp(-tau / 1.6)) + 2.4 * tau) * p.rr; X = BX + Math.cos(p.a) * rr; Y = WY - .02; Z = BZ + Math.sin(p.a) * rr;
      heat = .7; a = (.5 + .5 * Math.sin(t * 7 + p.tw)) * (1 - ss(1.5, 6.5, tau)) * .9; sz = .09;
    }
    const m = p.g >= 0 || p.kind === 2 || p.tx !== undefined ? eio(mk(i)) : 0;
    if (m > 0) { let T; if (p.g >= 0) T = galPos(p, t); else T = [p.tx, p.ty, p.tz];
      X = lerp(X, T[0], m); Y = lerp(Y, T[1], m); Z = lerp(Z, T[2], m);
      const hs = p.g >= 0 ? (p.core ? .95 : .62 + .3 * p.h0) : .85; heat = lerp(heat, hs, m); a = lerp(a, p.g >= 0 ? (p.core ? .5 : .32) * Math.min(1, Math.pow(p.gp.R / 40, 1.5)) : .55, m); sz = lerp(sz, p.g >= 0 ? .55 + p.h0 * .5 : .5, m);
      if (p.kind !== 0) a *= ss(0, .3, m) + (1 - m) * 0;
    } else if (p.kind !== 0 && t > 14.2) a *= 1 - ss(14.2, 15, t);
    if (p.kind === 0) { a *= lerp(.16, 1, ss(0, .6, m)); heat = Math.min(heat, lerp(.74, 1, m)); }   // until they turn into galaxies: a soft dusty corona, not a lumpy fireball
    else if (p.kind === 2) a *= .45;
    if (p.kind === 0 && Y > WY && m < .2) continue;                   // hidden under the water
    const q = proj(c, X, Y, Z); if (!q) continue;
    if (q[0] < -60 || q[0] > W + 60 || q[1] < -60 || q[1] > H + 60) continue;
    const px = Math.max(1.2, sz * q[2] * .5), sp = p.blue && m > .5 ? sprites[16] : sprites[Math.round(heat * 15)];
    bx.globalAlpha = Math.min(1, a * fadeB); if (bx.globalAlpha < .01) continue;
    if (p.kind === 2) bx.drawImage(sp, q[0] / 2 - px * 2, q[1] / 2 - px * .35, px * 4, px * .7);
    else bx.drawImage(sp, q[0] / 2 - px, q[1] / 2 - px, px * 2, px * 2);
  }
  // thin dark veins along the top edge (under 15%)
  bx.globalCompositeOperation = 'source-over';
  if (tau > .6 && t < 15.5) { bx.globalAlpha = .1 * ss(.6, 2.5, tau) * (1 - ss(14.2, 15.4, t));
    for (const i of veins) { const p = P[i], wob = 1 + .5 * (noise(p.ph[0] * 2.2 + p.nz * 9 + tau * .32, p.ph[1] * 2.2 + p.ph[2] * 1.7) - .5);
      const lx = p.dx * wob * 1.02, lz = p.dz * wob * 1.02, q = proj(c, BX + (lx * cr - lz * sr) * Rb, BY + p.dy * wob * 1.02 * Rb, BZ + (lx * sr + lz * cr) * Rb); if (!q) continue;
      const px = p.sz * Rb * q[2] * .45; bx.drawImage(dark, q[0] / 2 - px, q[1] / 2 - px, px * 2, px * 2); } }
  bx.globalAlpha = 1;

}

// ---------- the core of the light: a star being born, not an explosion ----------
// I = intensity (peaks at the word, settles, fades as the light becomes the heavens). Drawn into the half-res buffer B.
function coreI(t) { const u = t - T_FL; if (u < -.05) return 0;
  return (ss(-.05, .12, u) * (1 + 1.1 * Math.exp(-u / .55)) + .06 * Math.sin(t * 1.7)) * (1 - ss(14, 16.2, t)); }
function drawCore(x, t, c) {
  const q = proj(c, BX, BY, BZ), I = coreI(t); if (!q || I <= 0) return; const cx = q[0] / 2, cy = q[1] / 2, k = q[2] / 23.5, u = t - T_FL;
  x.globalCompositeOperation = 'lighter';
  // the glory: two layers of fine rays, turning slowly against each other, growing as the light settles
  const rr = (300 + 120 * ss(0, 3, u)) * k * Math.min(1.25, .55 + .45 * I);
  const hq = proj(c, 0, 0, 1e5), hy = hq ? hq[1] / 2 : H;
  for (let l = 0; l < 2; l++) for (const [y0, y1, f] of [[0, hy, 1], [hy, H / 2, .25]]) { if (y1 <= y0) continue;
    x.save(); x.beginPath(); x.rect(0, y0, W / 2, y1 - y0); x.clip(); x.translate(cx, cy); x.rotate((l ? -.011 : .016) * t + l * .7); x.globalAlpha = Math.min(1, (l ? .3 : .42) * I * f);
    x.drawImage(RAYS[l], -rr, -rr, rr * 2, rr * 2); x.restore(); }
  // layered falloff: a small white-hot heart, a warm corona, a wide amber air
  for (const [r, cA, cB, a] of [[16, '255,255,252', '255,246,226', 1], [60, '255,244,214', '255,214,150', .7], [190, '255,214,160', '255,170,96', .32], [520, '255,190,130', '255,150,80', .14]]) {
    const R0 = r * k * (.8 + .2 * I), g = x.createRadialGradient(cx, cy, 0, cx, cy, R0);
    g.addColorStop(0, `rgba(${cA},${Math.min(1, a * I)})`); g.addColorStop(.3, `rgba(${cB},${Math.min(1, a * I * .45)})`); g.addColorStop(1, `rgba(${cB},0)`);
    x.globalAlpha = 1; x.fillStyle = g; x.fillRect(cx - R0, cy - R0, R0 * 2, R0 * 2); }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
}
function streak(x, t, c) {               // anamorphic streak: a warm line with cool ends, as a real lens draws a point that bright (full res, not reflected)
  const q = proj(c, BX, BY, BZ), I = coreI(t); if (!q || I <= 0) return; x.globalCompositeOperation = 'lighter';
  for (const [sy, col, a, wr] of [[.012, '255,236,206', .42, .55], [.005, '170,200,255', .26, .95]]) {
    x.save(); x.translate(q[0], q[1]); x.scale(1, sy); const R0 = W * wr, g = x.createRadialGradient(0, 0, 0, 0, 0, R0);
    g.addColorStop(0, `rgba(${col},${Math.min(1, a * I)})`); g.addColorStop(.25, `rgba(${col},${a * I * .35})`); g.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = g; x.fillRect(-R0, -R0, R0 * 2, R0 * 2); x.restore(); }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
}
function lensEvent(ctx, t, c) {          // the word spoken: an exposure bloom from the point + lens ghosts, never a flat white card
  const q = proj(c, BX, BY, BZ); if (!q) return; const u = t - T_FL, f = ss(-.06, 0, u) * Math.exp(-Math.max(0, u) / .42); if (f < .005) return;
  const R0 = W * (.25 + 1.5 * ss(-.06, .35, u));
  ctx.globalCompositeOperation = 'screen';
  const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], R0);
  g.addColorStop(0, `rgba(255,253,246,${Math.min(1, f * 1.05)})`); g.addColorStop(.18, `rgba(255,242,218,${.8 * f})`); g.addColorStop(.5, `rgba(255,214,168,${.34 * f})`); g.addColorStop(1, `rgba(255,190,140,${.04 * f})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // ghosts on the line from the light through the centre of the frame
  const dx = W / 2 - q[0], dy = H / 2 - q[1];
  for (const [k, r, col, a] of [[.55, 46, '150,190,255', .16], [1.15, 110, '255,190,130', .1], [1.6, 36, '190,255,220', .14], [2.05, 170, '140,170,255', .07]]) {
    const gx = q[0] + dx * k * 2, gy = q[1] + dy * k * 2 + (V ? 0 : 60 * k), gr = r * (V ? 1.2 : 1), gg = ctx.createRadialGradient(gx, gy, gr * .55, gx, gy, gr);
    gg.addColorStop(0, `rgba(${col},${a * f * .4})`); gg.addColorStop(.85, `rgba(${col},${a * f})`); gg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 6.283); ctx.fill(); }

}

// ---------- the deep ----------
function drawDeep(ctx, t, c, lit) {
  const q0 = proj(c, 0, 0, 1e5); if (!q0) return; const hz = q0[1]; if (hz > H + 10) return;
  // the deep: black at the horizon (continuous with the darkness above), a faint body, darker again toward the camera
  const g = ctx.createLinearGradient(0, hz, 0, H); g.addColorStop(0, rgb(mix([0, 0, 0], [104, 92, 100], lit))); g.addColorStop(.05, rgb(mix([2, 3, 5], [76, 58, 50], lit))); g.addColorStop(.18, rgb(mix([4, 5, 9], [46, 32, 24], lit)));
  g.addColorStop(.5, rgb(mix([3, 4, 7], [20, 14, 11], lit))); g.addColorStop(1, rgb(mix([0, 0, 1], [5, 3, 3], lit)));
  ctx.fillStyle = g; ctx.fillRect(0, hz, W, H - hz);
  const lq = proj(c, BX, BY, BZ), lx0 = lq ? lq[0] : W / 2;
  // ripples on the deep: cold and faint before the light, gold after; a breath moves across ("하나님의 영은 수면 위에 운행하시니라")
  const breath = x => .5 + 1.4 * Math.exp(-((((x + 120 - t * 26) % 260 + 260) % 260 - 130) ** 2) / 900);
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass ? '#ffd8a0' : '#6c7ea8';
    for (let i = 0; i < NWS; i++) { const s = streaks[i], q = proj(c, s.x, WY, s.z); if (!q || q[1] < hz) continue;
      const len = s.l * q[2] * (pass ? .4 : .55), th = Math.min(pass ? 1.6 : 2.2, Math.max(.7, q[2] * .016));
      let a; if (!pass) a = (.035 + .04 * Math.sin(t * s.sp + s.ph)) * breath(s.x) * (1 - lit * .7);
      else { const col = Math.exp(-(((q[0] - lx0) / (90 + q[2] * 4)) ** 2)); a = lit * (.04 + .6 * col * Math.pow(.5 + .5 * Math.sin(t * s.sp * 1.7 + s.ph), 3)); }
      if (a < .01) continue; ctx.globalAlpha = Math.min(1, a); ctx.fillRect(q[0] - len / 2, q[1], len, th); }
  }
  ctx.globalAlpha = 1;
  // haze along the horizon: no ruler-straight edge between the deep and the sky
  const hzH = H * .12, hg = ctx.createLinearGradient(0, hz - hzH, 0, hz + hzH * .8);
  hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(.55, lit > 0 ? `rgba(255,200,160,${.28 * lit})` : 'rgba(14,18,30,.35)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = hg; ctx.fillRect(0, hz - hzH, W, hzH * 1.8);
  if (lit > 0) { const gx = ctx.createRadialGradient(lx0, hz, 0, lx0, hz, W * .5); gx.addColorStop(0, `rgba(255,200,150,${.22 * lit})`); gx.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.save(); ctx.translate(lx0, hz); ctx.scale(1, .16); ctx.translate(-lx0, -hz); ctx.fillStyle = gx; ctx.fillRect(lx0 - W * .5, hz - W * .5, W, W); ctx.restore(); }
  ctx.globalCompositeOperation = 'source-over';
}
function reflect(ctx, t, c, lit) {     // the light mirrored in the water, broken by ripples
  const q0 = proj(c, 0, 0, 1e5), qm = proj(c, BX, WY, BZ); if (!q0 || !qm || lit <= 0) return; const ym = q0[1] + (qm[1] - q0[1]) * .6;
  rx.clearRect(0, 0, W / 4, H / 4); rx.filter = 'blur(2px)'; rx.drawImage(B, 0, 0, W / 4, H / 4); rx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter';
  for (let y = Math.ceil(ym); y < H; y += 3) { const sy = 2 * ym - y; if (sy < 0) break; const d = (y - ym) / H;
    const off = Math.sin(y * .09 + t * 2.3) * (4 + 60 * d) + Math.sin(y * .023 - t * 1.1) * 20 * d;
    ctx.globalAlpha = lit * .55 * (1 - d * .6); ctx.drawImage(R, 0, sy / 4, W / 4, .75, off - d * 30, y, W + d * 60, 3); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

let hs1, hs2;
function softHorizon(ctx, y) {          // re-lay a feathered, blurred band over the horizon so it reads as haze, not a ruled line
  const bh = 90; if (!hs1) { hs1 = canvas(W, bh * 2); hs2 = canvas(W, bh * 2); }
  const a = hs1.getContext('2d'), b = hs2.getContext('2d'); a.clearRect(0, 0, W, bh * 2); a.drawImage(ctx.canvas, 0, y - bh, W, bh * 2, 0, 0, W, bh * 2);
  b.globalCompositeOperation = 'source-over'; b.clearRect(0, 0, W, bh * 2); b.filter = 'blur(7px)'; b.drawImage(hs1, 0, 0); b.filter = 'none';
  const g = b.createLinearGradient(0, 0, 0, bh * 2); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  b.globalCompositeOperation = 'destination-in'; b.fillStyle = g; b.fillRect(0, 0, W, bh * 2); b.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(hs2, 0, y - bh); ctx.restore();

// ---------- the heavens ----------
function drawStars(ctx, t, c, a) {
  if (a <= 0) return; ctx.fillStyle = '#fff6e6';
  const sp = c.zv || 0;
  for (let i = 0; i < NS; i++) { const s = stars[i], q = proj(c, s.x, s.y, s.z); if (!q || q[0] < 0 || q[0] > W || q[1] < 0 || q[1] > H) continue;

function drawGarden(ctx, t) {
  const k = eio(clamp((t - S.E[0]) / 8.2)), dy = lerp(240, 0, k), z = lerp(1.08, 1.0, k);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(eden, 0, -120 + dy * .5);      // the eden canvas is 240 px taller than the frame: the crane tilts down into the meadow
  const lx = W * L_.lt[0], ly = H * L_.lt[1] + dy * .5, cx = W * L_.cpl[0], cy = H * L_.cpl[1] + dy * .5, fh = L_.fh;
  // the light beside them: a column of warm light, rays across the meadow
  ctx.globalCompositeOperation = 'lighter';
  const pul = 1 + .05 * Math.sin(t * 2.1) + .03 * Math.sin(t * 5.3);
  for (let i = 0; i < 14; i++) { const a = -Math.PI * .95 + i * Math.PI * .9 / 13 + Math.sin(t * .4 + i) * .02, l = 1300;
    ctx.fillStyle = `rgba(255,226,170,${.035 + .02 * Math.sin(t * 1.1 + i * 1.7)})`; ctx.beginPath(); ctx.moveTo(lx, ly - fh * .55); ctx.lineTo(lx + Math.cos(a - .04) * l, ly - fh * .55 + Math.sin(a - .04) * l); ctx.lineTo(lx + Math.cos(a + .04) * l, ly - fh * .55 + Math.sin(a + .04) * l); ctx.fill(); }
  let g = ctx.createRadialGradient(lx, ly - fh * .55, 0, lx, ly - fh * .55, 520 * pul); g.addColorStop(0, 'rgba(255,246,220,.9)'); g.addColorStop(.12, 'rgba(255,214,140,.42)'); g.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = g; ctx.fillRect(lx - 600, ly - 1200, 1200, 1800);
  ctx.save(); ctx.translate(lx, ly - fh * .5); ctx.scale(.42, 1.25); g = ctx.createRadialGradient(0, 0, 0, 0, 0, fh * .7); g.addColorStop(0, 'rgba(255,255,245,.95)'); g.addColorStop(.4, 'rgba(255,230,170,.5)'); g.addColorStop(1, 'rgba(255,210,140,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, fh * .7, 0, 6.283); ctx.fill(); ctx.restore();
  // light pooled on the grass
  ctx.save(); ctx.translate(lx, ly + 4); ctx.scale(1, .16); g = ctx.createRadialGradient(0, 0, 0, 0, 0, 520); g.addColorStop(0, 'rgba(255,220,150,.55)'); g.addColorStop(1, 'rgba(255,200,130,0)'); ctx.fillStyle = g; ctx.fillRect(-520, -520, 1040, 1040); ctx.restore();
  // motes rising from it
  for (const m of motes) { const age = ((t * m.v + m.ph) % 1), px = lx + m.dx * (40 + age * 160) + Math.sin(t * m.w + m.ph * 6) * 12, py = ly - fh * .2 - age * m.h;
    ctx.fillStyle = `rgba(255,236,190,${(1 - age) * m.a})`; ctx.fillRect(px, py, m.s, m.s); }
  ctx.globalCompositeOperation = 'source-over';
  // their shadows fall away from the light
  ctx.fillStyle = "rgba(20,24,12,.48)"; [[-fh * .16, 1], [fh * .14, 0]].forEach(([ox]) => { ctx.save(); ctx.translate(cx + ox, cy); ctx.transform(1, 0, 2.4, .24, 0, 0); ctx.beginPath(); ctx.ellipse(0, -fh * .45, fh * .13, fh * .5, 0, 0, 6.283); ctx.fill(); ctx.restore(); });
  // the two figures, backlit: gold rim on the side that faces the light
  const fig = (col, dx) => { ctx.fillStyle = col; ctx.strokeStyle = col;
    person(ctx, cx - fh * .16 + dx, cy, fh, false, 1); person(ctx, cx + fh * .14 + dx, cy, fh * .93, true, -1);
    ctx.lineWidth = 3.4 * fh / 100; ctx.beginPath(); ctx.moveTo(cx - fh * .16 + dx + 20 * fh / 100, cy - fh * .47); ctx.quadraticCurveTo(cx + dx, cy - fh * .43, cx + fh * .14 + dx - 16.5 * fh / 100, cy - fh * .44); ctx.stroke(); };
  fig('#ffd99a', 0); fig('#1b1610', -2.6 * fh / 100);
  ctx.restore();
  ctx.drawImage(edenFg, 0, -dy * .9);
}

Pilot.run({ W, H, dur: DUR, audio: 'creation.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    B = canvas(W / 2, H / 2); bx = B.getContext('2d'); R = canvas(W / 4, H / 4); rx = R.getContext('2d'); Hal = canvas(W / 8, H / 8); hx = Hal.getContext('2d');
    for (let i = 0; i < 6; i++) grains.push(speckle(W / 2, H / 2, 46, 300 + i, .6));

    { const s = canvas(64, 64), x = s.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(214,226,255,1)'); g.addColorStop(.35, 'rgba(150,180,255,.45)'); g.addColorStop(1, 'rgba(120,150,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); sprites.push(s); }

    P = buildLight(); NP = P.length;

      for (let i = 0; i < (l ? 150 : 260); i++) { const a = r() * 6.283, L = N / 2 * (.25 + .75 * Math.pow(r(), 1.6)), w = .002 + r() * (l ? .02 : .008), g = x.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, L);
        g.addColorStop(0, `rgba(255,236,200,${.25 + r() * .35})`); g.addColorStop(.35, `rgba(255,214,160,${.08 + r() * .1})`); g.addColorStop(1, 'rgba(255,190,120,0)');
        x.fillStyle = g; x.beginPath(); x.moveTo(N / 2, N / 2); x.arc(N / 2, N / 2, L, a - w, a + w); x.closePath(); x.fill(); }
      const s2 = canvas(N, N), x2 = s2.getContext('2d'); x2.filter = 'blur(2.5px)'; x2.drawImage(s, 0, 0); return s2; });
    const r = rng(21); stars = []; for (let i = 0; i < 5200; i++) stars.push({ x: (r() - .5) * 900, y: -40 - r() * 700, z: 80 + r() * 600, r: .002 + Math.pow(r(), 6) * .06, b: .25 + r() * .75, sp: 1 + r() * 3, ph: r() * 6.28, warm: r() < .2, blue: r() < .2 });
    NS = stars.length;
    streaks = []; for (let i = 0; i < 5200; i++) { const z = 2 + Math.pow(r(), 1.8) * 300; streaks.push({ x: (r() - .5) * (40 + z * 2.2), z, l: .4 + r() * 1.6, sp: 1 + r() * 2, ph: r() * 6.28 }); } NWS = streaks.length;
    earthMap = new Uint8ClampedArray(512 * 256 * 4);
    for (let j = 0; j < 256; j++) for (let i = 0; i < 512; i++) { const lat = (.5 - j / 256) * Math.PI, a = i / 512 * 6.2832, cx = Math.cos(a) * 1.6, cz = Math.sin(a) * 1.6;
      const n = fbm(cx + 5 + Math.cos(lat) * .3, cz + lat * 1.3 + 9, 5) * .7 + fbm(cx * 2 + 3, lat * 2.6 + cz * 2, 4) * .3, cl = fbm(cx * 3 + 11, lat * 6 + cz * 2, 5), ice = Math.abs(lat) > 1.25;
      let c = n > .53 ? (n > .63 ? [150, 122, 80] : mix([54, 96, 46], [96, 110, 60], clamp((n - .53) * 10))) : mix([8, 30, 80], [14, 48, 110], clamp((n - .3) * 4));

    cloudTex = canvas(640, 400); { const x = cloudTex.getContext('2d'), d = x.createImageData(640, 400);
      for (let j = 0; j < 400; j++) for (let i = 0; i < 640; i++) { const v = fbm(i * .012, j * .018, 5), e = Math.min(1, Math.min(i, 639 - i, j * 1.6, (399 - j) * 1.6) / 120), a = clamp((v - .42) * 2.6) * e, k = (j * 640 + i) * 4;
        d.data[k] = 255; d.data[k + 1] = 246 - (1 - v) * 20; d.data[k + 2] = 230 - (1 - v) * 40; d.data[k + 3] = a * 255; } x.putImageData(d, 0, 0);
      const c2 = canvas(640, 400), x2 = c2.getContext('2d'); x2.filter = 'blur(7px)'; x2.drawImage(cloudTex, 0, 0); cloudTex = c2; }
