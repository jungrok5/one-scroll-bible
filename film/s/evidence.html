<script src="lib.js"></script>
<script>
/* 18 FAQ · 성경이 진짜 실화인가요? — an explorer's scrapbook, in watercolour (after The English Patient, 1996).
   A traveller-archaeologist's journal lies open on a desk in warm desert light; the camera glides and pushes across
   pages crowded edge to edge with taped watercolours, pasted sepia photographs, a graphite rubbing, maps, tickets,
   pressed leaves and notes in ink and pencil. Pages turn.
     A  the library — a watercolour of a room of scrolls and books; the numbers become hand notes and tallies:
        66 권, 약 1,500년, 40 strokes for 40여 명의 저자, three scraps of Hebrew / Aramaic / Greek; then golden ink lines
        gather everything into one circled phrase: 그리스도를 통한 구원.
     B  the ground — a map of the land; a watercolour of the dig at Dan; a photograph and a rubbing of the Tel Dan stele
        (“다윗의 집” circled), a photograph of the Pilate stone (PILATVS circled).
     C  the manuscripts — a watercolour of the Qumran caves; a strip of the Isaiah scroll above a printed page, word joined
        to word by hand; clippings of Tacitus and Josephus; Bethlehem, and a line from the prophecy back to the scroll.
     D  the last page — the camera pushes into a watercolour of a traveller reading by a lantern at dusk until the page
        edges slide away: the site's honest note, and Rom 10:17.
   Facts are only those of the old scene / index.html FAQ q4. Every object is a drawn reconstruction (tagged 재현).
   Hebrew = Isa 53:4–6 (Masoretic text: consonants on the scroll, pointed in print); scraps: Gen 1:1, Dan 5:25, John 1:1. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, speckle } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 60;
const tr = Pilot.tr, KO = Pilot.lang === 'ko';
let RTL = false;                                      // set in init, once the language file (and its direction) has loaded
const SERIF = "'Noto Serif KR',serif", SANS = "'Noto Sans KR',sans-serif", HEB = "'FreeSerif','DejaVu Serif',serif";
const INK = '#2a1e16';
const PW = 1400, PH = 1900, PS = .8;                 // one page, world units; page bitmaps are baked at PS
const TURN = [15.0, 26.8, 41.6], TD = 1.45;           // page turns
const HEB_SCROLL = ['אכן חלינו הוא נשא ומכאבינו סבלם ואנחנו חשבנהו נגוע מכה אלהים ומענה', 'והוא מחלל מפשענו מדכא מעונתינו מוסר שלומנו עליו ובחברתו נרפא לנו', 'כלנו כצאן תעינו איש לדרכו פנינו ויהוה הפגיע בו את עון כלנו'];
const HEB_PRINT = ['אָכֵן חֳלָיֵנוּ הוּא נָשָׂא וּמַכְאֹבֵינוּ סְבָלָם וַאֲנַחְנוּ חֲשַׁבְנֻהוּ נָגוּעַ מֻכֵּה אֱלֹהִים וּמְעֻנֶּה', 'וְהוּא מְחֹלָל מִפְּשָׁעֵנוּ מְדֻכָּא מֵעֲוֺנֹתֵינוּ מוּסַר שְׁלוֹמֵנוּ עָלָיו וּבַחֲבֻרָתוֹ נִרְפָּא־לָנוּ', 'כֻּלָּנוּ כַּצֹּאן תָּעִינוּ אִישׁ לְדַרְכּוֹ פָּנִינוּ וַיהֹוָה הִפְגִּיעַ בּוֹ אֵת עֲוֺן כֻּלָּנוּ'];

// ================= geometry =================
function wob(pts, amp, seed, step = 12, closed = true) {          // subdivide a polygon and let its edge wander
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % n], L = Math.hypot(x1 - x0, y1 - y0) || 1, k = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let j = 0; j < k; j++) { const u = j / k, x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u;
      const d = amp ? ((fbm(x * .011 + seed, y * .011 + seed * .7, 3) - .5) * 2 + (noise(x * .09 + seed * 3, y * .09) - .5) * .5) * amp : 0;
      out.push([x + nx * d, y + ny * d]); } }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}
const P2 = (pts, closed = true) => { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); if (closed) p.closePath(); return p; };
const bbx = pts => { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, y] of pts) { if (x < a) a = x; if (y < b) b = y; if (x > c) c = x; if (y > d) d = y; } return [a, b, c, d]; };
const S = (pts, amp = 3, seed = 1, step = 12) => { const q = amp ? wob(pts, amp, seed, step) : pts; return { path: P2(q), bb: bbx(q), pts: q }; };
const R4 = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const EL = (cx, cy, rx, ry, n = 36, a0 = 0) => Array.from({ length: n }, (_, i) => { const a = a0 + i / n * 6.2832; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
function cr(pts, seg = 8) {                                        // Catmull-Rom through points
  const out = []; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let j = 0; j < seg; j++) { const t = j / seg, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); } }
  out.push(pts[pts.length - 1].slice()); return out;
}
const bez = (p0, p1, p2, p3, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, a = 1 - u; return [0, 1].map(k => a * a * a * p0[k] + 3 * a * a * u * p1[k] + 3 * a * u * u * p2[k] + u * u * u * p3[k]); });
function limb(pts, w0, w1 = w0) {                                   // a thick stroke as a polygon (arms, legs)
  const A = [], B = []; for (let i = 0; i < pts.length; i++) { const o = pts[Math.max(i - 1, 0)], q = pts[Math.min(i + 1, pts.length - 1)], dx = q[0] - o[0], dy = q[1] - o[1], d = Math.hypot(dx, dy) || 1, ww = lerp(w0, w1, i / (pts.length - 1)) / 2;
    A.push([pts[i][0] - dy / d * ww, pts[i][1] + dx / d * ww]); B.push([pts[i][0] + dy / d * ww, pts[i][1] - dx / d * ww]); }
  return A.concat(B.reverse());
}
function PL(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, cum, L: cum[cum.length - 1] }; }
function partTo(x, pl, k) { const lim = pl.L * clamp(k); x.moveTo(pl.pts[0][0], pl.pts[0][1]);
  for (let i = 1; i < pl.pts.length; i++) { if (pl.cum[i] >= lim) { const f = (lim - pl.cum[i - 1]) / ((pl.cum[i] - pl.cum[i - 1]) || 1); x.lineTo(lerp(pl.pts[i - 1][0], pl.pts[i][0], f), lerp(pl.pts[i - 1][1], pl.pts[i][1], f)); return; } x.lineTo(pl.pts[i][0], pl.pts[i][1]); } }
const hx = Pilot.hex, rgbS = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const dk = (h, k = .45) => rgbS(Pilot.mix(hx(h), [40, 22, 18], k));

// ================= watercolour =================
let MOTT, GRANC, GRANDK, TOOTH;
const SC = [null, null], SCX = [null, null];
function scr(i, w, h) {
  if (!SC[i] || SC[i].width < w || SC[i].height < h) { SC[i] = canvas(Math.max(w, SC[i] ? SC[i].width : 0), Math.max(h, SC[i] ? SC[i].height : 0)); SCX[i] = SC[i].getContext('2d'); }
  const x = SCX[i]; if (x._c) x.restore(); x.save(); x._c = 1;     // clip to the box in use, so filters only work on it
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.filter = 'none'; x.clearRect(0, 0, w + 4, h + 4);
  x.beginPath(); x.rect(0, 0, w, h); x.clip(); return x;
}
function alphaTex(w, h, fn) { const c = canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) d.data[(j * w + i) * 4 + 3] = clamp(fn(i, j)) * 255; x.putImageData(d, 0, 0); return c; }
function makePaint(w, h, s, seed, clear) {                          // a sheet of cold-press watercolour paper (or a clear layer)
  const c = canvas(Math.ceil(w * s), Math.ceil(h * s)), x = c.getContext('2d');
  if (!clear) { x.fillStyle = '#f4e9d0'; x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .55; x.fillStyle = x.createPattern(TOOTH, 'repeat'); x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; }
  x.setTransform(s, 0, 0, s, 0, 0); return { c, x, w, h, s, r: rng(seed), seed };
}
// one transparent wash: pigment pools at the edge, blooms of a second pigment wet-in-wet, uneven density, granulation
function wash(P, sh, col, o = {}) {
  const s = P.s, pad = (o.soft || 0) * 2.5 + 8;
  const bx = Math.max(0, Math.floor((sh.bb[0] - pad) * s)), by = Math.max(0, Math.floor((sh.bb[1] - pad) * s));
  const bw = Math.min(P.c.width, Math.ceil((sh.bb[2] + pad) * s)) - bx, bh = Math.min(P.c.height, Math.ceil((sh.bb[3] + pad) * s)) - by;
  if (bw < 2 || bh < 2) return;
  const L = scr(0, bw, bh); L.setTransform(s, 0, 0, s, -bx, -by);
  if (o.soft) L.filter = `blur(${o.soft * s}px)`;
  L.fillStyle = col; L.fill(sh.path); L.filter = 'none';
  if (o.cut) { L.globalCompositeOperation = 'destination-out'; if (o.cutSoft) L.filter = `blur(${o.cutSoft * s}px)`; for (const c of o.cut) L.fill(c.path); L.filter = 'none'; }
  if (o.clip) { L.globalCompositeOperation = 'destination-in'; L.fill(o.clip.path); }
  L.setTransform(1, 0, 0, 1, 0, 0);
  if (o.col2) { const T = scr(1, bw, bh), rw = Math.min(512, Math.max(24, bw / (o.bsc || 1.6))), rh = Math.min(512, Math.max(24, bh / (o.bsc || 1.6)));
    T.drawImage(MOTT, P.r() * (512 - rw), P.r() * (512 - rh), rw, rh, 0, 0, bw, bh); T.globalCompositeOperation = 'source-in'; T.fillStyle = o.col2; T.fillRect(0, 0, bw, bh);
    L.globalCompositeOperation = 'source-atop'; L.globalAlpha = o.mix == null ? .7 : o.mix; L.drawImage(SC[1], 0, 0, bw, bh, 0, 0, bw, bh); L.globalAlpha = 1; }
  const e = o.edge == null ? .5 : o.edge;
  if (e > 0) { L.globalCompositeOperation = 'source-atop'; L.setTransform(s, 0, 0, s, -bx, -by); L.filter = `blur(${(o.ew || 3) * .55 * s}px)`; L.globalAlpha = e;
    L.strokeStyle = o.ec || dk(col, .5); L.lineWidth = (o.ew || 3) * 2; L.stroke(sh.path); L.filter = 'none'; L.globalAlpha = 1; L.setTransform(1, 0, 0, 1, 0, 0); }
  const gd = o.gd == null ? .3 : o.gd;     // pigment settling in the tooth: dark specks, in clumps
  if (gd > 0) { L.globalCompositeOperation = 'source-atop'; L.globalAlpha = gd; const ox = P.r() * 256, oy = P.r() * 256; L.translate(-ox, -oy); L.fillStyle = L.createPattern(GRANDK, 'repeat'); L.fillRect(0, 0, bw + ox, bh + oy); L.setTransform(1, 0, 0, 1, 0, 0); L.globalAlpha = 1; }
  L.globalCompositeOperation = 'destination-out';
  const m = o.mott == null ? .4 : o.mott; if (m > 0) { const rw = Math.min(512, bw / 1.3), rh = Math.min(512, bh / 1.3); L.globalAlpha = m; L.drawImage(MOTT, P.r() * (512 - rw), P.r() * (512 - rh), rw, rh, 0, 0, bw, bh); }
  const g = o.gran == null ? .3 : o.gran; if (g > 0) { L.globalAlpha = g; const ox = P.r() * 256, oy = P.r() * 256; L.translate(-ox, -oy); L.fillStyle = L.createPattern(GRANC, 'repeat'); L.fillRect(0, 0, bw + ox, bh + oy); L.setTransform(1, 0, 0, 1, 0, 0); }
  const X = P.x; X.save(); X.setTransform(1, 0, 0, 1, 0, 0); X.globalCompositeOperation = o.mode || 'multiply'; X.globalAlpha = o.a == null ? .8 : o.a;
  X.drawImage(SC[0], 0, 0, bw, bh, bx, by, bw, bh); X.restore();
}
function pen(P, pts, o = {}) {                                       // a dip-pen contour: wandering, swelling, sometimes lifting
  const X = P.x, q = o.amp === 0 ? pts : wob(pts, o.amp == null ? 1.2 : o.amp, P.r() * 50, 8, !!o.closed), sd = P.r() * 40;
  if (o.closed) q.push(q[0]);
  X.save(); X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = o.col || INK; if (o.mode) X.globalCompositeOperation = o.mode;
  for (let i = 1; i < q.length; i += 5) { const nz = noise(i * .13 + sd, sd); if (o.brk && nz > 1 - o.brk) continue;
    X.globalAlpha = (o.a == null ? .8 : o.a) * (.6 + .4 * nz); X.lineWidth = (o.w || 1.5) * (.6 + .8 * noise(i * .07, sd + 3));
    X.beginPath(); X.moveTo(q[i - 1][0], q[i - 1][1]); for (let j = i; j < Math.min(q.length, i + 5); j++) X.lineTo(q[j][0], q[j][1]); X.stroke(); }
  X.restore();
}
function glowP(P, cx, cy, r, col, a) { const X = P.x; X.save(); X.globalCompositeOperation = 'screen'; const g = X.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, rgbS(hx(col), a)); g.addColorStop(.4, rgbS(hx(col), a * .35)); g.addColorStop(1, rgbS(hx(col), 0)); X.fillStyle = g; X.fillRect(cx - r, cy - r, 2 * r, 2 * r); X.restore(); }
function splat(P, x0, y0, x1, y1, n, col, a = .5) { const X = P.x, r = P.r; X.save(); X.globalCompositeOperation = 'multiply'; X.fillStyle = col;
  for (let i = 0; i < n; i++) { X.globalAlpha = a * (.3 + .7 * r()); X.beginPath(); X.arc(lerp(x0, x1, r()), lerp(y0, y1, r()), .6 + r() * r() * 4, 0, 6.3); X.fill(); } X.restore(); }

// ================= the paintings =================
function pLibrary() {                     // A — a room of scrolls and books; a lamp; the desert bright through the window
  const w = 1180, h = 900, P = makePaint(w, h, 1, 11), r = P.r;
  const WX = 760, WY = 110, WW = 260, WH = 470, rr = WW / 2;
  const ac = (i, rad) => { const a = Math.PI + i / 22 * Math.PI; return [WX + rr + Math.cos(a) * rad, WY + rr + Math.sin(a) * rad]; };
  const archPts = []; archPts.push([WX, WY + WH]); for (let i = 0; i <= 22; i++) archPts.push(ac(i, rr)); archPts.push([WX + WW, WY + WH]);
  const win_ = S(archPts, 1.5, 3, 10);
  wash(P, S(R4(-40, -40, w + 80, h + 80), 0), '#d8954a', { cut: [win_], col2: '#b0602e', mix: .55, a: .72, edge: 0 });
  wash(P, S([[-40, -40], [520, -40], [640, 260], [520, 940], [-40, 940]], 40, 5, 30), '#7c5a76', { soft: 46, a: .36, edge: 0, cut: [win_] });
  wash(P, win_, '#b9cfd4', { col2: '#f2d39c', mix: .65, a: .5, edge: .15, mott: .2 });
  wash(P, S([[WX - 10, 430], [WX + 60, 404], [WX + 130, 420], [WX + 200, 392], [WX + WW + 10, 402], [WX + WW + 10, 600], [WX - 10, 600]], 3, 7), '#e7b56c', { a: .7, edge: .45, clip: win_ });
  wash(P, S([[WX - 10, 486], [WX + 90, 462], [WX + 170, 480], [WX + WW + 10, 466], [WX + WW + 10, 600], [WX - 10, 600]], 3, 8), '#cf8f4e', { a: .6, edge: .5, clip: win_ });
  pen(P, [[WX + 6, 432], [WX + 60, 406], [WX + 130, 421], [WX + 200, 393], [WX + WW - 4, 402]], { w: 1.1, a: .45, brk: .25 });
  const rev = [[WX, WY + WH], [WX, WY + rr]]; for (let i = 1; i <= 12; i++) rev.push(ac(i, rr)); for (let i = 12; i >= 0; i--) rev.push(ac(i, rr - 30)); rev.push([WX + 30, WY + WH]);
  wash(P, S(rev, 1, 4, 8), '#7b5873', { a: .62, edge: .55 });
  wash(P, S(R4(WX - 16, WY + WH - 4, WW + 32, 22), 1.5, 41), '#b07848', { a: .8, edge: .5 });
  // the floor in shade, a patch of sun from the window
  const patch = S([[WX + 26, 600], [WX + WW - 6, 600], [WX + 40, 910], [WX - 250, 910]], 3, 9, 14);
  wash(P, S([[230, 596], [w + 40, 596], [w + 40, h + 40], [230, h + 40]], 5, 10), '#4e3240', { cut: [patch], a: .7, edge: .3 });
  wash(P, patch, '#ffe2a6', { mode: 'screen', a: .35, edge: 0, gran: .1 });
  // shelves of pigeonholes, scrolls heaped end-on, codices standing
  const SX = 46, SY = 64, CW = 138, CH = 128, NC = 4, NR = 4;
  wash(P, S(R4(SX - 20, SY - 20, NC * CW + 40, NR * CH + 40), 1.5, 12), '#7a4a2c', { a: .88, edge: .55, col2: '#4e2c1c', mix: .4 });
  const cols = ['#a9584a', '#c99a54', '#6f7f86', '#8b6a4a', '#9c6a86', '#b9764a'];
  for (let j = 0; j < NR; j++) for (let i = 0; i < NC; i++) {
    const cx = SX + i * CW, cy = SY + j * CH, sd = 100 + j * 7 + i;
    wash(P, S(R4(cx + 9, cy + 9, CW - 18, CH - 18), 1.2, sd), '#3a2427', { a: .82, edge: .35 });
    if ((i + j * 3) % 4 !== 1) {
      const n = 4 + ((r() * 4) | 0), rad = 14 + r() * 5; let k = 0;
      for (let row = 0; k < n && row < 3; row++) for (let q = 0; q <= 3 - row && k < n; q++, k++) {
        const px = cx + 28 + q * rad * 2.05 + row * rad + (r() - .5) * 3, py = cy + CH - 14 - rad - row * rad * 1.75;
        wash(P, S(EL(px, py, rad, rad * .96, 20), .8, sd + k), r() < .3 ? '#cfa86c' : '#dcbb84', { mode: 'source-over', a: .9, edge: .75, ec: '#8a6034', ew: 2.5, gran: .15, mott: .2 });
        pen(P, Array.from({ length: 9 }, (_, q) => { const a = .1 + q * .22; return [px + Math.cos(a) * rad * .9, py + Math.sin(a) * rad * .86]; }), { col: '#4a2c1e', w: 2.6, a: .5, amp: 0 });
        wash(P, S(EL(px + 1, py + 1, rad * .3, rad * .28, 12), .4, sd + k + 50), '#7a5232', { mode: 'source-over', a: .85, edge: 0 }); }
    } else {
      let bx = cx + 18;
      while (bx < cx + CW - 30) { const bw = 15 + r() * 13, bh = CH - 36 - r() * 24;
        wash(P, S(R4(bx, cy + CH - 12 - bh, bw, bh), .6, sd + bx), cols[(r() * cols.length) | 0], { mode: 'source-over', a: .92, edge: .6, gran: .2 });
        pen(P, [[bx + 2, cy + CH - bh + 4], [bx + bw - 2, cy + CH - bh + 4]], { col: '#e8bd6c', w: 1.3, a: .75, amp: 0 });
        bx += bw + 2; } }
    wash(P, S([[cx + 9, cy + 9], [cx + CW - 9, cy + 9], [cx + CW - 9, cy + 24], [cx + 9, cy + 40]], .8, sd + 9), '#2a1a2a', { a: .42, edge: .2 });
  }
  for (let j = 0; j <= NR; j++) pen(P, [[SX - 18, SY + j * CH], [SX + NC * CW + 18, SY + j * CH]], { w: 1.6, a: .7, brk: .12 });
  for (let i = 0; i <= NC; i++) pen(P, [[SX + i * CW, SY - 18], [SX + i * CW, SY + NR * CH + 18]], { w: 1.4, a: .6, brk: .15 });
  // table, an open codex, a clay lamp
  wash(P, S([[-40, 690], [700, 672], [712, 716], [-40, 738]], 2, 13), '#7a4a2a', { a: .92, edge: .6, col2: '#a0643a', mix: .5 });
  wash(P, S([[-40, 738], [712, 716], [712, 782], [-40, 802]], 2, 14), '#3c2520', { a: .9, edge: .3 });

}
function spreadAt(t) { for (let i = 0; i < 3; i++) { if (t < TURN[i]) return { k: i }; if (t < TURN[i] + TD) return { k: i, turn: (t - TURN[i]) / TD }; } return { k: 3 }; }

// ================= frame =================
function draw(ctx, t) {
  const cam = camAt(t), push = ss(43.8, 47.6, t);

  ctx.drawImage(DESK, -DX, -DY, 2 * DX, 2 * DY);

  if (t > 39.9 && t < TURN[2] + .5) { const a = 1 - ss(TURN[2] - .05, TURN[2] + .3, t); ctx.save(); ctx.globalAlpha = a; ink(ctx, LIVE.cross, clamp((t - 40.0) / 1.0), 'red'); arrowHead(ctx, LIVE.cross, clamp((t - 40.0) / 1.0), 'red'); ctx.restore(); }

      ctx.fillStyle = `rgba(255,230,180,${m.a * lk * (.6 + .4 * Math.sin(t * 1.3 + m.ph))})`; ctx.beginPath(); ctx.arc(mx, my, m.s, 0, 6.3); ctx.fill(); } ctx.restore(); }
  ctx.restore();
  // grade: grain, a gentle vignette
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .1; ctx.drawImage(grains[Math.floor(t * 24) % grains.length], 0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .42, W / 2, H / 2, Math.max(W, H) * .78); vg.addColorStop(0, 'rgba(20,10,4,0)'); vg.addColorStop(1, 'rgba(20,10,4,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // words
  Pilot.text(ctx, '18  ·  성경은 실화인가', RTL ? W - (V ? 80 : 110) : (V ? 80 : 110), V ? 200 : 116, { align: RTL ? 'right' : 'left', size: 30, weight: 600, color: '#f6ecd8', shadow: 'rgba(10,5,2,.9)', shadowBlur: 12, alpha: win(t, .8, 5.4, 1, 1), ls: 4, maxW: W * .6 });
  sub(ctx, V ? '그런데도 ‘그리스도를 통한 구원’이라는\n하나의 주제로 흐트러짐 없이 모입니다.' : '그런데도 ‘그리스도를 통한 구원’이라는 하나의 주제로 흐트러짐 없이 모입니다.', win(t, 12.4, 17.0, .6, .6));
  sub(ctx, '땅속에서 계속 확인됩니다(고고학).', win(t, 17.2, 21.9, .6, .6));
  sub(ctx, '가장 잘 보존된 고대 문서입니다(사본).', win(t, 28.6, 33.4, .6, .6));
  const ty = V ? 520 : 150, st = { weight: 600, color: '#fbf0dc', shadow: 'rgba(30,12,20,.95)', shadowBlur: 22 };
  Pilot.text(ctx, V ? '이 근거들은 성경을 믿는 것이 비합리적이지 않고\n오히려 합리적임을 보여줄 뿐,' : '이 근거들은 성경을 믿는 것이\n비합리적이지 않고 오히려 합리적임을 보여줄 뿐,', W / 2, ty, { ...st, size: V ? 40 : 46, alpha: win(t, 44.2, 48.6, 1, .6) });

Pilot.run({ W, H, dur: DUR, audio: 'evidence.m4a', fonts: ["400 40px 'Noto Serif KR'", "600 40px 'Noto Serif KR'", "300 20px 'Noto Sans KR'", "400 20px 'Noto Sans KR'", "400 30px FreeSerif"],

      x.globalCompositeOperation = 'multiply'; x.globalAlpha = .08; x.drawImage(MOTT, 0, 0, 512, 512, 0, 0, w, h); x.globalAlpha = .07; x.drawImage(MOTT, 100, 60, 120, 160, 0, 0, w, h);
