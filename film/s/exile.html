<script>
/* 08 분열 왕국 · 포로 — a woodcut novel in four plates. Black is the wood, white is what the knife removed;
   pictures appear by being carved. 1) the crown cracks and the kingdom splits (1 Ki 12:19) 2) Jerusalem goes dark
   3) a line of captives walks away toward the horizon 4) by the rivers of Babylon, harps hang on the willows (Ps 137:1–2).

const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, speckle, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 36;

const PW = PL.w, PH = PL.h;
const CUTS = [0, 8.6, 14.4, 20.6, DUR];
let paper, inkTex, edge, M, mx, cache = {};

// ---------- the knife ----------
// a cut: blunt entry, swelling a little, tapered exit; white on the mask
function cutP(x0, y0, x1, y1, w) {

}
function curveP(pts, w0, w1) {          // a curved cut along a polyline, width w0 → w1
  const a = [], b = [];
  for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(i - 1, 0)], dx = q[0] - o[0], dy = q[1] - o[1], L = Math.hypot(dx, dy) || 1, w = lerp(w0, w1, i / (pts.length - 1)) / 2;

}
// stroke list: {p: Path2D (full), seg: [x0,y0,x1,y1,w] for growing straight cuts, t0, dur}
function drawStrokes(m, list, t) {

}
const seg = (x0, y0, x1, y1, w, t0, dur = .15) => ({ p: cutP(x0, y0, x1, y1, w), seg: [x0, y0, x1, y1, w], t0, dur });
// hatching: parallel cuts across a region; width follows tone (bright = wide), entry/exit jittered so no machine line
function hatch(list, inside, o) {
  const r = rng(o.seed || 1), ang = o.ang || 0, ca = Math.cos(ang), sa = Math.sin(ang), [bx0, by0, bx1, by1] = o.box, sp = o.sp || 9;

    while (u < R) { const len = lerp(o.len[0], o.len[1], r()), gap = (o.gap || 6) * (.5 + r());

        const a2 = ang + (r() - .5) * .06, ex = ux + Math.cos(a2) * len, ey = uy + Math.sin(a2) * len;

}
function halo(m, p, w = 7) { m.save(); m.lineJoin = 'round'; m.lineCap = 'round'; m.strokeStyle = '#fff'; m.lineWidth = w; m.stroke(p); m.restore(); }
function blk(m, p) { m.fillStyle = '#000'; m.fill(p); }
function poly(pts) { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p; }
let hit; const inP = (p) => (x, y) => hit.isPointInPath(p, x, y);

// ---------- plate 1: the crown ----------
const C1 = { cx: PW / 2, cy: V ? PH * .5 : PH * .56, s: V ? 1.0 : .92 };
const crack = (() => { const r = rng(4), pts = []; for (let i = 0; i <= 12; i++) pts.push([.18 * 300 + (r() - .5) * 34 + (i % 2 ? 14 : -14), -250 + i * 40]); return pts; })();   // in crown space, right of centre (10 ≠ 2)
function crownShape() {                // crown space: band 600 × 130, five points
  const p = new Path2D(); p.moveTo(-300, 80); p.lineTo(-300, -50); p.lineTo(-330, -200); p.lineTo(-210, -90); p.lineTo(-140, -230); p.lineTo(-60, -95); p.lineTo(0, -260);

  [[-330, -200], [-140, -230], [0, -260], [140, -230], [330, -200]].forEach(([bx, by]) => { const p = new Path2D(); p.arc(bx, by - 18, 18, 0, 6.28); halo(m, p, 6); blk(m, p); m.fillStyle = '#fff'; m.beginPath(); m.arc(bx - 5, by - 23, 5, 0, 6.28); m.fill(); });

function plate1(lt) {

      for (let k = 0; k < 3; k++) { const a0 = r0 + (r1 - r0) * k / 3, a1 = r0 + (r1 - r0) * (k + .8) / 3;
        list.push(seg(cx + Math.cos(a) * a0, cy + Math.sin(a) * a0 * .9, cx + Math.cos(a) * a1, cy + Math.sin(a) * a1 * .9, w * (1 - k * .25), .4 + a0 / 900 + r() * .2, .3)); } }

    mx.save(); mx.translate(-d, sp * 26); mx.rotate(-sp * .10); crownMask(mx, -1, lt); mx.restore();

      mx.save(); mx.font = `900 ${z}px 'Noto Serif KR'`; mx.letterSpacing = (z * .08) + 'px'; const wa = mx.measureText(Pilot.tr('북이스라엘')).width, wb = mx.measureText(Pilot.tr('남유다')).width; mx.restore();

      mx.font = `${wt} ${z}px 'Noto Serif KR'`; mx.letterSpacing = (z * .08) + 'px'; bw = Math.max(bw, Math.min(mw, mx.measureText(Pilot.tr(s)).width) + 40); }); mx.restore(); bw = Math.max(bw, V ? 640 : 700); }

function panel(x, y, size, s) { s = Pilot.tr(s); mx.save(); mx.font = `900 ${size}px 'Noto Serif KR'`; mx.letterSpacing = (size * .08) + 'px'; const w = mx.measureText(s).width; mx.fillStyle = '#000'; mx.fillRect(x - w / 2 - 30, y - size * 1.25, w + 60, size * 1.75); mx.restore(); }

// ---------- plate 2: Jerusalem goes dark ----------
const J = V ? { hx: PW * .5, top: PH * .58, wl: PW * .08, wr: PW * .92 } : { hx: PW * .5, top: PH * .6, wl: PW * .26, wr: PW * .74 };

  const dark = ss(1.8, 5.2, lt);

function city(m, lt, dark) {
