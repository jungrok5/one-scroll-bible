<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 출애굽</title>
<link rel="stylesheet" href="fonts.css">

<script src="lib.js"></script>
<script>
/* 04 출애굽 — a 1960s hand-painted epic poster come to life (gouache with oil highlights, after Howard Terpning's
   Lawrence of Arabia poster and Freddie Young's 70 mm desert light). Every plate is painted in init with an opaque
   mid-tone base, directional strokes that follow each form, three values per form and warm-cream highlights on the lit
   edges; the camera pushes and pans across the painted layers, which slide against each other (parallax).
   A  Egypt at the low sun: an empty desert, the pyramids in the haze, two tiny travellers walking into the light
   B  before Pharaoh's colossal throne: Moses, staff raised, under the stone giants — “내 백성을 보내라” (출 5:1)
   C  the plagues as a darkening painted sky: the river turns, hail and fire, the locust cloud, then darkness
   D  Passover night: one door, a lamp; the blood on the lintel and posts, the only red in the film (출 12:13)
   E  the sea: walls of water towering left and right, the people crossing on dry ground toward us, lit from behind
      by the pillar of fire; the camera tilts up the pillar into the night sky (출 14:22) */
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas, speckle, hex, mix } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 44;
const SHOT = [0, 5.4, 12.8, 19.4, 28.6, DUR];
const RTL = () => Pilot.dir === 'rtl';
const C = {};
Object.entries({ cob: '#1F4D97', pale: '#A9C3D6', cream: '#F4E2BC', hot: '#FFF4DC', sand: '#EEC27A', amber: '#D79248', ochre: '#B56A33',
  sien: '#7A3F26', umber: '#3B2219', vio: '#6C6394', dvio: '#3A3660', night: '#1A2B5C', deep: '#0C1530', teal: '#2C6A83',
  blood: '#A31F15', gold: '#E0A43A', white: '#EDE5D6', stone: '#D6A86A', fire: '#FF9E3D' }).forEach(([k, v]) => C[k] = hex(v));
const mixc = (a, b, k) => mix(a, b, clamp(k));
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ================= the painting kit =================
const hitX = canvas(4, 4).getContext('2d'), inP = (p, x, y) => hitX.isPointInPath(p, x, y);
// a plate larger than the frame, painted in screen coordinates (top: share of the extra height that lies above the frame)
function layer(ovx, ovy = ovx, k = 1, top = .5) {
  const sw = Math.ceil(W * ovx), sh = Math.ceil(H * ovy), c = canvas(Math.ceil(sw / k), Math.ceil(sh / k)), x = c.getContext('2d');
  c.ox = -(sw - W) / 2; c.oy = -(sh - H) * top; c.sw = sw; c.sh = sh; x.setTransform(1 / k, 0, 0, 1 / k, -c.ox / k, -c.oy / k);
  return { c, x, box: [c.ox, c.oy, c.ox + sw, c.oy + sh] };
}
function sprite(x0, y0, x1, y1, k = 1) {   // a small plate for one figure, also painted in screen coordinates
  const c = canvas(Math.ceil((x1 - x0) * k), Math.ceil((y1 - y0) * k)), x = c.getContext('2d');
  c.ox = x0; c.oy = y0; c.sw = x1 - x0; c.sh = y1 - y0; x.setTransform(k, 0, 0, k, -x0 * k, -y0 * k); return { c, x };
}
const view = (ctx, s, fx, fy, dx = 0, dy = 0) => ctx.setTransform(s, 0, 0, s, fx - fx * s + dx, fy - fy * s + dy);
function put(ctx, c, a = 1) { if (a <= .002) return; ctx.globalAlpha = a; ctx.drawImage(c, c.ox, c.oy, c.sw, c.sh); ctx.globalAlpha = 1; }
// one brush stroke: a loaded round start, a body that thins, a dry tail; slightly bent

  const T = (u, v) => { v += bend * w * 2 * (u * u) / (h * h); return [px + u * ca - v * sa, py + u * sa + v * ca]; };

  p = T(h - w * 1.1, w * .8); x.lineTo(p[0], p[1]); p = T(-h + w * .5, w); x.lineTo(p[0], p[1]);
  q = T(-h - w * .7, 0); p = T(-h + w * .5, -w); x.quadraticCurveTo(q[0], q[1], p[0], p[1]); x.fill();
  if (wid > 9 && a > .5) { const v0 = (bend > 0 ? -1 : 1) * w * .45, a0 = T(-h * .5, v0), a1 = T(h * .8, v0 * .6);   // a dry bristle line

}
const shade = (c, k) => c.map(v => v * k);
// paint a region: under-paint (opaque, unjittered), then strokes that follow ang(), coloured by col() with small value/hue jitter
function paint(x, o) {

    const c = o.col(px, py, r), j = 1 + (r() - .5) * jit * 2, k = lk(px, py);
    dab(x, px, py, o.ang(px, py, r) + (r() - .5) * aj, len * (.55 + r() * .9) * k, wid * (.6 + r() * .6) * k,
      css([c[0] * j * (1 + (r() - .5) * jit), c[1] * j, c[2] * j * (1 + (r() - .5) * jit)]), lerp(A[0], A[1], r()), (r() - .5) * .9); }

}
// the opaque under-painting: the colour field sampled coarsely and laid smoothly (so gaps between strokes never show a wrong tone)

  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const v = col(lerp(x0, x1, (i + .5) / nx), lerp(y0, y1, (j + .5) / ny), r), k = (j * nx + i) * 4; d.data[k] = v[0]; d.data[k + 1] = v[1]; d.data[k + 2] = v[2]; d.data[k + 3] = 255; }

}
// three values on a rounded form lit from L (unit vector): shadow / mid / light, soft transitions
const form = (cx, cy, rx, ry, L, D, M, Lt, bias = 0) => (px, py) => {
  const d = (px - cx) / rx * L[0] + (py - cy) / ry * L[1] + bias; return d > .2 ? mixc(M, Lt, ss(.2, .55, d)) : mixc(D, M, ss(-.45, -.1, d)); };
// warm-cream highlight laid last on the edge of P that faces the light
let tmpC, tmpX;

  if (X1 <= X0 || Y1 <= Y0) return;

  tmpX.setTransform(T); tmpX.fillStyle = css(col); tmpX.fill(P);
  tmpX.globalCompositeOperation = 'destination-out'; tmpX.translate(-L[0] * d, -L[1] * d); tmpX.fill(P); tmpX.translate(L[0] * d, L[1] * d);
  if (fade) { tmpX.globalCompositeOperation = 'destination-in'; fade(tmpX); } tmpX.globalCompositeOperation = 'source-over';
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = a; x.filter = `blur(${blur}px)`; x.drawImage(tmpC, X0, Y0, X1 - X0, Y1 - Y0, X0, Y0, X1 - X0, Y1 - Y0); x.restore();
}
// smooth closed (or open) curve through points
function spline(pts, closed = true) {
  const p = new Path2D(), n = pts.length, P = i => pts[closed ? (i + n) % n : clamp(i, 0, n - 1)];
  p.moveTo(pts[0][0], pts[0][1]);

    p.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }

}
const tf = (ox, oy, s, pts, fx = 1) => pts.map(([a, b]) => [ox + a * s * fx, oy + b * s]);

// a soft radial light, added
function bloom(ctx, x, y, r, col, a, op = 'lighter') {

// ---------- robed figures (unit: 100 tall, feet at 0,0) ----------
// o: dir (1 right / -1 left, for the lean), staff, bundle, veil, child, jar, front (face visible)

  const robe = U([[-11, -78], [-4, -82], [4, -82], [11, -78], [14, -62], [13, -40], [16, -14], [18, 0], [6, 1], [-6, 1], [-18, 0], [-16, -14], [-14, -40], [-15, -62]]);
  const hood = U(o.veil ? [[-9, -86], [-7, -97], [0, -101], [7, -97], [9, -88], [11, -76], [13, -60], [-13, -60], [-12, -76]] : [[-8, -90], [-6, -98], [0, -100], [6, -98], [8, -90], [9, -80], [-9, -80]]);

    paint(x, { path: p, box: bx, col: form((bx[0] + bx[2]) / 2, (bx[1] + bx[3]) / 2, (bx[2] - bx[0]) / 2, (bx[3] - bx[1]) / 2, L, shade(col, .75), col, mixc(col, lit, .35)), ang: () => Math.PI / 2, len: Math.max(3, 9 * s), wid: Math.max(1.5, 3.5 * s), cov: 2.2, seed: (ox * 7 + oy) | 0 });

// ================= A · Egypt at the low sun =================
const HZ1 = V ? H * .56 : H * .6, SUN = V ? [W * .5, H * .56 - 70, 104] : [W * .57, H * .6 - 56, 96];
const HUMPS = Array.from({ length: 5 }, (_, i) => { const r = rng(90 + i), n = 7 - i, out = [];
  for (let k = 0; k < n + 2; k++) out.push([lerp(-W * .3, W * 1.3, (k + r() * .8) / (n + 1)), W * (.06 + r() * .09) * (1 + i * .35), .3 + r() * .7]); return out; });
const crest1 = (i, px) => { const b = HZ1 + [12, 52, 130, 260, 470][i] * (V ? 1.45 : 1), a = [14, 34, 70, 120, 190][i] * (V ? 1.2 : 1);
  let m = 0; for (const [c, w, h] of HUMPS[i]) m = Math.max(m, h * Math.exp(-(((px - c) / w) ** 2))); return b - a * m - 3 * Math.sin(px * .02 + i); };
const A = {};
function buildA() {
  const [sx, sy, sr] = SUN;
  // sky
  { const L = layer(1.18), x = L.x, [bx0, by0, bx1] = L.box;
    const col = (px, py) => { const t = clamp((py - by0) / (HZ1 - by0)); let c = mixc(C.cob, C.pale, Math.pow(t, 1.5)); const d = Math.hypot(px - sx, (py - sy) * 1.7) / W;

      ang: (px, py) => { const d = Math.hypot(px - sx, py - sy) / W; return lerp(Math.atan2(py - sy, px - sx) + Math.PI / 2, -.05 + .07 * Math.sin(px * .002 + py * .004), ss(.05, .2, d)); },
      len: 76, wid: 25, cov: 2.6, seed: 11, jit: .03 });

    const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.2); sg.addColorStop(0, css(C.hot)); sg.addColorStop(.42, css(C.hot)); sg.addColorStop(.5, css(mixc(C.hot, C.cream, .5), .9)); sg.addColorStop(1, css(C.cream, 0));

    const mesa = (xa, xb, top, seed) => { const rr = rng(seed), pts = [[xa, HZ1 + 6]]; let y = top; for (let px = xa; px <= xb; px += 26) { y = clamp(y + (rr() - .5) * 10, top - 12, top + 14); pts.push([px, px - xa < 60 ? lerp(HZ1, y, (px - xa) / 60) : xb - px < 60 ? lerp(HZ1, y, (xb - px) / 60) : y]); } pts.push([xb, HZ1 + 6]); return pts; };

      paint(x, { path: p, box: b, col: (px, py, r) => haze(mixc(C.vio, C.ochre, .28 + .2 * fbm(px * .01, py * .03)), px, py), ang: (px, py) => Math.PI / 2 + Math.sin(px * .05) * .2, len: 26, wid: 9, cov: 2.4, seed: 30 + i });

      const lf = polyline([top, l, m]), rf = polyline([top, m, rr]), lit = cx < sx ? rf : lf, dk = cx < sx ? lf : rf;
      paint(x, { path: dk, box: bbox([top, l, rr]), col: (px, py) => haze(C.vio, px, py), ang: () => (cx < sx ? -1 : 1) * 1.0, len: 18, wid: 6, seed: 40 + i });
      paint(x, { path: lit, box: bbox([top, l, rr]), col: (px, py) => haze(mixc(C.amber, C.cream, .3), px, py), ang: () => (cx < sx ? 1 : -1) * 1.0, len: 18, wid: 6, seed: 50 + i });
      rim(x, polyline([top, l, rr]), [cx < sx ? 1 : -1, -.6], 1.6, C.hot, .8, bbox([top, l, rr])); };
    (V ? [[W * .24, 104, 150], [W * .38, 54, 74], [W * .7, 40, 52]] : [[W * .25, 150, 190], [W * .355, 76, 98], [W * .8, 52, 64]]).forEach(([cx, hw, h], i) => pyr(cx, hw, h, i));
    A.far = L.c; }
  // the dunes, backlit: rim of hot cream on each crest, faces in amber shade, violet in the hollows, haze with distance
  { const L = layer(1.24, 1.24, 1, .3), x = L.x, [bx0, , bx1, by1] = L.box;
    for (let i = 0; i < 5; i++) { const pts = []; for (let px = bx0 - 20; px <= bx1 + 20; px += 16) pts.push([px, crest1(i, px)]); pts.push([bx1 + 20, by1 + 10], [bx0 - 20, by1 + 10]);
      const p = polyline(pts), dep = i / 4, top = Math.min(...pts.map(q => q[1])), deep = 30 + 240 * dep;
      paint(x, { path: p, box: [bx0, top - 4, bx1, Math.min(by1, (i < 4 ? crest1(i + 1, 0) + 160 : by1))], seed: 60 + i,
        col: (px, py) => { const d = py - crest1(i, px), near = Math.exp(-Math.abs(px - sx) / (W * .4)), sl = (crest1(i, px + 30) - crest1(i, px - 30)) / 60 * Math.sign(sx - px);

  list.push({ mo: 1, x: V ? -.008 : -.02, z: (V ? .2 : .17) - u * .002, ph: 0 }); list.sort((a, b) => b.z - a.z);
  for (const p of list) { const [X, Y] = P3(p.x, 0, p.z), hpx = .06 / p.z * FE, bob = Math.abs(Math.sin(u * 3.2 + p.ph)) * hpx * .02, rot = Math.sin(u * 3.2 + p.ph) * .025;
    const fade = ss(.23, .3, p.z) * clamp(1.4 - p.z / 7);
    ctx.save(); view(ctx, s, vx, vy, 0, up); ctx.translate(X, Y - bob); ctx.rotate(rot); ctx.globalAlpha = p.mo ? 1 : fade;
    if (p.mo) { const sc = hpx * 1.08 / (100 * PE.ms); ctx.scale(sc, sc); put(ctx, PE.moses); }
    else { const sc = hpx / 260 * p.sc; ctx.scale(sc * p.fl, sc); put(ctx, PE.folk[p.k]); }
    ctx.restore();
    // the long shadow each one throws toward us
    if (p.z < 4) { ctx.save(); view(ctx, s, vx, vy, 0, up); ctx.globalAlpha = .35 * (p.mo ? 1 : fade); ctx.fillStyle = css(C.deep); ctx.beginPath(); ctx.ellipse(X, Y + hpx * .35, hpx * .14, hpx * .4, 0, 0, 6.29); ctx.fill(); ctx.restore(); } }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ================= words =================
function verse(ctx, keys, cite, a) {
  if (a <= .003) return;
  const ls = keys.flatMap(k => String(Pilot.tr(k)).split('\n')), cs = cite ? Pilot.tr(cite) : '';
  let size = V ? 52 : 50; const csz = V ? 26 : 24, maxW = W - (V ? 110 : 280);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); if (RTL()) ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${size}px 'Noto Serif KR'`; const wd = Math.max(...ls.map(l => ctx.measureText(l).width)); if (wd > maxW) { size *= maxW / wd; ctx.font = `600 ${size}px 'Noto Serif KR'`; }
  const lh = size * 1.42, yEnd = V ? H - 250 : H - 78, y0 = yEnd - (cs ? csz * 2.1 : 0) - (ls.length - 1) * lh;
  // a feathered dusk at the bottom of the frame so the words always read
  const g = ctx.createLinearGradient(0, y0 - size * 3, 0, H); g.addColorStop(0, 'rgba(14,8,6,0)'); g.addColorStop(.55, `rgba(14,8,6,${.42 * a})`); g.addColorStop(1, `rgba(14,8,6,${.55 * a})`);
  ctx.fillStyle = g; ctx.fillRect(0, y0 - size * 3, W, H - y0 + size * 3);
  ctx.globalAlpha = a; ctx.shadowColor = 'rgba(10,5,2,.85)'; ctx.shadowBlur = 16; ctx.fillStyle = '#FBEFD8';
  ls.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lh));
  if (cs) { ctx.font = `400 ${csz}px 'Noto Sans KR',sans-serif`; ctx.letterSpacing = '2px'; ctx.fillStyle = '#E9CFA0'; ctx.shadowBlur = 10; ctx.fillText(cs, W / 2, yEnd); }
  ctx.restore();
}

// ================= frame =================
let grains = [];
function draw(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = '#120a06'; ctx.fillRect(0, 0, W, H);
  if (t < SHOT[1]) drawA(ctx, t); else if (t < SHOT[2]) drawB(ctx, t); else if (t < SHOT[3]) drawC(ctx, t); else if (t < SHOT[4]) drawD(ctx, t); else drawE(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // warm vignette and board grain
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .45, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(40,16,4,0)'); vg.addColorStop(1, 'rgba(40,16,4,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .14; ctx.drawImage(grains[Math.floor(t * 12) % grains.length], 0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // words
  const lx = V ? 80 : 110, ly = V ? 250 : 112;
  Pilot.text(ctx, '04  ·  출애굽', lx, ly, { align: 'left', size: V ? 32 : 30, weight: 600, color: '#FBEFD8', alpha: win(t, .7, 5.3, 1, .8), ls: 4, shadow: 'rgba(20,8,2,.8)' });
  Pilot.text(ctx, '약 BC 1446  ·  출애굽기', lx, ly + 44, { align: 'left', size: V ? 23 : 22, font: "'Noto Sans KR',sans-serif", color: '#F1DDB6', alpha: win(t, 1.2, 5.3, 1, .8) * .9, ls: 2, shadow: 'rgba(20,8,2,.8)' });
  verse(ctx, ['“내 백성을 보내라”'], '출애굽기 5:1 (개역개정)', win(t, 6.0, 12.4, .8, .6));
  verse(ctx, ['열 가지 재앙'], '', win(t, 13.6, 18.6, .8, .8));
  verse(ctx, ['“내가 피를 볼 때에 너희를 넘어가리니”'], '출애굽기 12:13 (개역개정)', win(t, 20.8, 27.8, .9, .8));
  verse(ctx, V ? ['“이스라엘 자손이 바다 가운데를', '육지로 걸어가고”'] : ['“이스라엘 자손이 바다 가운데를 육지로 걸어가고”'], '출애굽기 14:22 (개역개정)', win(t, 29.8, 35.4, .9, .6));
  verse(ctx, ['“물은 그들의 좌우에 벽이 되니”'], '출애굽기 14:22 (개역개정)', win(t, 35.6, 41.6, .6, 1));
  const f = 1 - ss(0, 1.3, t) + ss(DUR - 1.4, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, audio: 'exodus.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { if (/[?&]prof=1/.test(location.search)) console.log('init start', Math.round(performance.now()));
    tmpC = canvas(Math.ceil(W * 1.3), Math.ceil(H * 2.1)); tmpX = tmpC.getContext('2d');
    for (let i = 0; i < 4; i++) grains.push(speckle(W / 2, H / 2, 26, 300 + i, .6));
    const prof = /[?&]prof=1/.test(location.search), flush = o => { for (const k in o) { const c = o[k]; if (c && c.getContext) c.getContext('2d').getImageData(0, 0, 1, 1); } };
    for (const [f, o] of [[buildA, A], [buildB, B], [buildC, PC], [buildD, PD], [buildE, PE]]) { const t0 = performance.now(); f(); if (prof) { flush(o); console.log(f.name, Math.round(performance.now() - t0)); } }
  },
  draw });
</script>
