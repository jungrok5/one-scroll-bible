<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 복음의 핵심 7가지</title>
<link rel="stylesheet" href="fonts.css">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 17 복음의 핵심 7가지 — Swiss typography on a strict grid (International Typographic Style in motion).
   Paper, black, two greys and ONE signal red. Our words are set in one grotesk (Noto Sans KR); Scripture is set in
   serif, so the two voices never blur. Each statement is a spread: the programme on the left (numeral + title),
   the artifact on the right, where the words and blocks act it out — snapping on the beat, nothing bounces:
     01 every bar falls short of the line of glory · 02 a ladder is built, cut, and becomes a mirror
     03 a stack of works is cut away; a gift is set down · 04 my grey 의 is covered by His
     05 66 pointers turn, one by one, toward the one red square · 06 the cells fill: 때가 찼고
     07 “행하라” is cut, “이루어졌다” stands — then the red square leaves the grid, linear and unsnapped,
        becomes a cross, and the grid breaks around it: “다 이루었다”. */
const { clamp, lerp, ss, rng, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
const B = 4.75 / 8, T0 = 4 * B, ITEM = 8 * B, T7 = T0 + 6 * ITEM, DUR = 40;
const PAGE = '#ECEAE4', INK = '#121212', G1 = '#D9D6CE', G2 = '#B9B6AE', G3 = '#8E8B84', RED = '#E1251B';
const SANS = "'Noto Sans KR',sans-serif", SERIF = "'Noto Serif KR',serif";

// ---------- the grid ----------
const L = V ? (() => { const M = 72, cw = 136, cx = c => M + c * 160;
  return { M, cols: 6, cw, cx, label: 170, rule: 196, cap: 228, capCols: [0, 2, 4], num: [500, 240], title: [592, 54, 64], Z: [72, 750, 1008, 1290], brule: 1360, verse: [1432, 40, 60], vw: 936,
    cross: { X: 880, Y: 470, w: 72, arm: 160 }, fin: { x: 72, y: 1300, size: 124, cite: 1356, r: [1470, 38, 58], rc: 1588 } }; })()
  : (() => { const M = 96, cw = 122, cx = c => M + c * 146;
  return { M, cols: 12, cw, cx, label: 100, rule: 128, cap: 160, capCols: [0, 4, 8], num: [470, 300], title: [566, 56, 68], Z: [972, 210, 1824, 690], brule: 752, verse: [822, 40, 60], vw: 1728,
    cross: { X: 498, Y: 350, w: 72, arm: 250 }, fin: { x: 972, y: 520, size: 150, cite: 588, r: [736, 38, 58], rc: 852 } }; })();
const Z = { x0: L.Z[0], y0: L.Z[1], x1: L.Z[2], y1: L.Z[3] }; Z.w = Z.x1 - Z.x0; Z.h = Z.y1 - Z.y0;

// ---------- the statements (index.html CORE: title + vref + vtext; vtext checked against 개역개정 with gae.py) ----------
const CORE = [
  { t: ['원죄 —', '누구도 의롭지 않다'], ref: '로마서 3:10, 23 (개역개정)', cap: '롬 3:10-12, 23', v: '“의인은 없나니 하나도 없으며 … 모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니”' },
  { t: ['율법은 나를', '구원하지 못한다'], ref: '로마서 3:20 · 갈라디아서 3:24 (개역개정)', cap: '롬 3:20 · 갈 3:24', v: '“율법으로는 죄를 깨달음이니라 … 율법이 우리를 그리스도께로 인도하는 초등교사가 되어”' },
  { t: ['은혜로, 노력이 아니라', '선물로'], ref: '에베소서 2:8-9 (개역개정)', cap: '엡 2:8-9', v: '“너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 … 행위에서 난 것이 아니니”' },
  { t: ['믿음으로 의롭다 하심', '(이신칭의)'], ref: '로마서 5:1 · 갈라디아서 2:16 (개역개정)', cap: '롬 5:1 · 갈 2:16', v: '“우리가 믿음으로 의롭다 하심을 받았으니 … 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로”' },
  { t: ['성경은', '예수님을 가리킨다'], ref: '요한복음 5:39 · 누가복음 24:27 (개역개정)', cap: '요 5:39 · 눅 24:27', v: '“이 성경이 곧 내게 대하여 증언하는 것이니라 … 모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라”' },
  { t: ['하나님 나라 —', '예수님의 중심 메시지'], ref: '마가복음 1:15 (개역개정)', cap: '막 1:15', v: '“때가 찼고 하나님의 나라가 가까이 왔으니 회개하고 복음을 믿으라”' },
  { t: ['복음 —', '그분이 다 이루셨다'], ref: '', cap: '요 19:30 · 롬 5:8', v: '' },
];

// ---------- motion: one precise ease, linear for the exception ----------
const bez = (() => { const x1 = .7, y1 = 0, x2 = .2, y2 = 1, cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = u => ((ax * u + bx) * u + cx) * u, Y = u => ((ay * u + by) * u + cy) * u, dX = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => { x = clamp(x); let u = x; for (let i = 0; i < 6; i++) { const d = dX(u); if (Math.abs(d) < 1e-6) break; u -= (X(u) - x) / d; u = clamp(u); } return Y(u); }; })();
const snap = (t, t0, d = B * .5) => bez((t - t0) / d);
const font = (w, s, f = SANS) => `${w} ${s}px ${f}`;

// words rise out of a clip rect from below their baseline, and leave upward
function rise(ctx, t, tin, tout, x, y, size, fn, clipW = W) {
  const e = snap(t, tin), q = tout == null ? 0 : snap(t, tout); if (e <= 0 || q >= 1) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - size * 1.08, clipW, size * 1.42); ctx.clip();
  ctx.translate(0, (1 - e) * size * 1.4 - q * size * 1.4); fn(); ctx.restore();
}
function word(ctx, s, x, y, o) { ctx.font = o.font; ctx.fillStyle = o.color || INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = (o.ls || 0) + 'px';
  let dx = 0; if (o.optical) { const m = ctx.measureText(s); dx = -m.actualBoundingBoxLeft; }   // optically flush left
  ctx.fillText(s, x - dx, y); ctx.letterSpacing = '0px'; }
function wrap(ctx, s, maxW, f) { ctx.font = f; const out = []; let cur = '';
  for (const w of s.split(' ')) { const n = cur ? cur + ' ' + w : w; if (ctx.measureText(n).width > maxW && cur) { out.push(cur); cur = w; } else cur = n; } if (cur) out.push(cur); return out; }
// an artifact layer: clipped to the zone, rises in / leaves upward like the words
function stage(ctx, t, tin, tout, fn) { const e = tin == null ? 1 : snap(t, tin), q = tout == null ? 0 : snap(t, tout, B * .6); if (e <= 0 || q >= 1) return;
  ctx.save(); ctx.beginPath(); ctx.rect(Z.x0 - 4, Z.y0 - 44, Z.w + 8, Z.h + 104); ctx.clip(); ctx.translate(0, -q * (Z.h + 140)); fn(); ctx.restore(); }
// knife cut: a thin line crosses, then the element collapses to its midline
function knife(ctx, t, t0, x0, y0, x1, y1) { const k = clamp((t - t0) / (B * .4)), f = 1 - clamp((t - t0 - B * .9) / (B * .3)); if (k <= 0 || f <= 0) return;
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.globalAlpha = f; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke(); ctx.globalAlpha = 1; }
const collapse = (t, t0) => 1 - snap(t, t0, B * .5);            // scaleY of the cut element
function scaleY(ctx, k, my, fn) { if (k <= 0) return; ctx.save(); ctx.translate(0, my); ctx.scale(1, k); ctx.translate(0, -my); fn(); ctx.restore(); }

// ---------- the seven artifacts (lt = beats since the statement began) ----------
const R = rng(17), heights = Array.from({ length: 12 }, () => .28 + R() * .56);
const ART = [
  // 01 — every bar falls short of the line of glory
  (ctx, b) => { const top = Z.y0 + 46, base = Z.y1, n = V ? 9 : 12, g = 14, bw = (Z.w - (n - 1) * g) / n, k = clamp((b - .5) / 1);
    ctx.fillStyle = INK; ctx.fillRect(Z.x0, top - 1, Z.w * k, 2);
    rise(ctx, b * B, 1 * B, null, Z.x0, top - 16, 20, () => word(ctx, '하나님의 영광', Z.x0, top - 16, { font: font(400, 20) }));
    ctx.fillRect(Z.x0, base - 2, Z.w, 2);
    for (let i = 0; i < n; i++) { const e = snap(b * B, (1.5 + i * .3) * B), h = heights[i] * (base - top - 20), x = Z.x0 + i * (bw + g);
      const gh = snap(b * B, (2.1 + i * .3) * B); if (gh > 0) { ctx.fillStyle = G1; ctx.fillRect(x, top + 2, bw, (base - h - top - 2) * gh); }
      ctx.fillStyle = INK; ctx.fillRect(x, base - h * e, bw, h * e + 1); } },
  // 02 — a ladder is built, cut away; in its place a mirror shows 죄
  (ctx, b) => { const lw = V ? 300 : 280, x = Z.x0 + 20, top = Z.y0 + 10, base = Z.y1, mid = (top + base) / 2, k = collapse(b * B, 3.8 * B);
    scaleY(ctx, k, mid, () => { const rk = clamp((b - .4) / 1.1); ctx.fillStyle = INK; ctx.fillRect(x, base - (base - top) * rk, 20, (base - top) * rk); ctx.fillRect(x + lw - 20, base - (base - top) * rk, 20, (base - top) * rk);
      for (let i = 0; i < 7; i++) { const e = snap(b * B, (1.2 + i * .3) * B), y = base - 40 - i * (base - top - 70) / 6; if (e > 0) ctx.fillRect(x + 20, y - 8, (lw - 40) * e, 16); } });
    knife(ctx, b * B, 3.3 * B, x - 60, base + 20, x + lw + 60, top - 20);
    const m = snap(b * B, 4.1 * B); if (m > 0) { ctx.fillStyle = G1; ctx.fillRect(x - 10, top, lw + 120, (base - top) * m);
      rise(ctx, b * B, 4.5 * B, null, x + 40, base - 60, 280, () => word(ctx, '죄', x + 40, base - 60, { font: font(700, 280), optical: true })); }
    rise(ctx, b * B, 4.8 * B, null, x + lw + 160, base - 6, 22, () => word(ctx, '사다리가 아니라 거울', x + lw + 160, base - 6, { font: font(400, 22) })); },
  // 03 — a stack of works, cut away; a gift is set down
  (ctx, b) => { const bw = V ? 420 : 380, bh = 62, g = 8, x = Z.x0, base = Z.y1, n = 6, k = collapse(b * B, 3.3 * B), mid = base - n * (bh + g) / 2;
    scaleY(ctx, k, mid, () => { for (let i = 0; i < n; i++) { const e = snap(b * B, (.7 + i * .35) * B), y = base - (i + 1) * (bh + g) + g; if (e <= 0) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, bw * e, bh); ctx.clip(); ctx.fillStyle = INK; ctx.fillRect(x, y, bw, bh); word(ctx, '행위', x + 22, y + bh * .68, { font: font(700, 28), color: PAGE }); ctx.restore(); } });
    knife(ctx, b * B, 2.8 * B, x + bw * .62, base - n * (bh + g) - 30, x + bw * .38, base + 24);
    const s = V ? 300 : 280, e = snap(b * B, 3.9 * B, B * .6), y = lerp(Z.y0 - s - 80, base - s, e), gx = x;
    if (e > 0) { ctx.fillStyle = INK; ctx.fillRect(gx, y, s, s); ctx.fillStyle = G2; ctx.fillRect(gx + s / 2 - 14, y, 28, s); ctx.fillRect(gx, y + s * .32 - 14, s, 28);
      word(ctx, '선물', gx + 30, y + s - 34, { font: font(700, 56), color: PAGE }); }
    rise(ctx, b * B, 4.5 * B, null, x + s + 40, base - 6, 22, () => word(ctx, '거저 주시는 하나님의 선물', x + s + 40, base - 6, { font: font(400, 22) }), 420); },
  // 04 — my grey 의, covered by His
  (ctx, b) => { const s = V ? 400 : 420, x = Z.x0, base = Z.y1 - 30, gw = s * 1.02, top = base - s * .98;
    rise(ctx, b * B, .5 * B, null, x, base, s, () => word(ctx, '의', x, base, { font: font(700, s), color: G2, optical: true }));
    const c = snap(b * B, 2.8 * B, B * .7); if (c > 0) { ctx.fillStyle = INK; ctx.fillRect(x - 10, top - 20, gw + 40, (s + 50) * c);
      ctx.save(); ctx.beginPath(); ctx.rect(x - 10, top - 20, gw + 40, (s + 50) * c); ctx.clip(); word(ctx, '의', x, base, { font: font(700, s), color: PAGE, optical: true }); ctx.restore(); }
    const cx2 = x + gw + 70;
    rise(ctx, b * B, 1.2 * B, null, cx2, top + 40, 30, () => word(ctx, '내 의가 아니라', cx2, top + 40, { font: font(400, 30), color: G3 }));
    rise(ctx, b * B, 3.5 * B, null, cx2, top + 96, 30, () => word(ctx, '그분의 의를 입는 것', cx2, top + 96, { font: font(700, 30) })); },
  // 05 — 66 pointers turn toward the one red square
  (ctx, b) => { const cols = 8, rows = 9, cw = Z.w / cols, ch = Z.h / rows, cx = Z.x0 + Z.w / 2, cy = Z.y0 + Z.h / 2; let n = 0;
    const cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { if ((c === 3 || c === 4) && r >= 3 && r <= 5) continue; cells.push([Z.x0 + (c + .5) * cw, Z.y0 + (r + .5) * ch, r]); }
    const dmax = Math.max(...cells.map(q => Math.hypot(q[0] - cx, q[1] - cy)));
    for (const [x, y, r] of cells) { const e = snap(b * B, (.5 + r * .16) * B); if (e <= 0) { n++; continue; }
      const d = Math.hypot(x - cx, y - cy), a = Math.atan2(cy - y, cx - x), turn = snap(b * B, (2.7 + 1.8 * (d / dmax)) * B, B * .75), len = Math.min(cw, ch) * .62;
      let a0 = 0, aa = a; if (aa - a0 > Math.PI) aa -= 2 * Math.PI; if (aa - a0 < -Math.PI) aa += 2 * Math.PI;
      ctx.save(); ctx.translate(x, y); ctx.rotate(lerp(a0, aa, turn)); ctx.scale(e, 1); ctx.fillStyle = n < 39 ? G3 : INK;
      ctx.fillRect(-len / 2, -3, len, 6); ctx.fillRect(len / 2 - 4, -7, 10, 14); ctx.restore(); n++; }
    const rs = Math.min(2 * cw, 3 * ch) * .62, re = snap(b * B, 2.1 * B); if (re > 0) { ctx.fillStyle = RED; ctx.fillRect(cx - rs / 2, cy - rs / 2, rs, rs * re); }
    rise(ctx, b * B, 1.2 * B, null, Z.x0, Z.y1 + 34, 20, () => word(ctx, '구약 39  ·  신약 27  =  66', Z.x0, Z.y1 + 34, { font: font(400, 20), color: G3 })); },
  // 06 — the cells fill: 때가 찼고
  (ctx, b) => { const cols = V ? 8 : 12, rows = 4, g = 6, cw = (Z.w - (cols - 1) * g) / cols, rh = Math.min(cw, (Z.h - 90) / rows), gh = rows * rh + (rows - 1) * g, y0 = Z.y1 - gh, n = cols * rows;
    let filled = 0;
    for (let i = 0; i < n; i++) { const c = i % cols, r = Math.floor(i / cols), x = Z.x0 + c * (cw + g), y = y0 + r * (rh + g), tf = (.7 + 3.4 * Math.pow(i / n, .75)) * B, e = snap(b * B, tf, B * .2);
      ctx.fillStyle = G1; ctx.fillRect(x, y, cw, rh); if (e > 0) { ctx.fillStyle = INK; ctx.fillRect(x, y, cw * e + .5, rh); if (e > .5) filled++; } }
    const full = snap(b * B, 4.3 * B, B * .3); if (full > 0) { ctx.fillStyle = INK; ctx.fillRect(Z.x0, y0, Z.w, gh * full);
      rise(ctx, b * B, 4.5 * B, null, Z.x0 + 40, y0 + gh / 2 + (V ? 54 : 50), V ? 150 : 140, () => word(ctx, '때가 찼고', Z.x0 + 40, y0 + gh / 2 + (V ? 54 : 50), { font: font(900, V ? 150 : 140, SERIF), color: PAGE, optical: true }), Z.w - 40); }
    word(ctx, String(filled).padStart(2, '0') + ' / ' + n, Z.x1 - 120, y0 - 22, { font: font(400, 20), color: G3 }); },
  // 07 — “행하라” is cut; “이루어졌다” stands
  (ctx, b) => { const s = 160, x = Z.x0, y = Z.y0 + (Z.h + s * .8) / 2, k = collapse(b * B, 2.3 * B);
    scaleY(ctx, k, y - s * .38, () => rise(ctx, b * B, .4 * B, null, x, y, s, () => word(ctx, '행하라', x, y, { font: font(700, s), optical: true })));
    knife(ctx, b * B, 1.7 * B, x - 40, y - s * .38, x + 560, y - s * .38);
    rise(ctx, b * B, 2.9 * B, null, x, y, s, () => word(ctx, '이루어졌다', x, y, { font: font(700, s), optical: true }));
    rise(ctx, b * B, 3.3 * B, null, x, Z.y1 - 4, 22, () => word(ctx, '“행하라”가 아니라 “이루어졌다”', x, Z.y1 - 4, { font: font(400, 22), color: G3 })); },
];

// ---------- frame ----------
const COLX = []; for (let c = 0; c < L.cols; c++) { COLX.push(L.cx(c)); COLX.push(L.cx(c) + L.cw); }
const verseLines = [];
function grid(ctx, t) {   // column guides grow down in the intro; in the finale they are cut by the red and fall away
  const brk = t - T7, cr = L.cross;
  ctx.lineWidth = 1;
  COLX.forEach((x, i) => { const g = clamp((t - .25 - i * .025) / .7); if (g <= 0) return;
    let dy = 0, a = 1, rot = 0; if (brk > 4.2) { const d = Math.abs(x - cr.X) / W, p = clamp((brk - 4.2 - d * 1.1) / 1.0); dy = p * p * H * .9; a = 1 - p; rot = p * .05 * (x < cr.X ? -1 : 1); }
    if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, dy); ctx.rotate(rot); ctx.strokeStyle = G1; ctx.beginPath(); ctx.moveTo(.5, 0); ctx.lineTo(.5, H * g); ctx.stroke(); ctx.restore(); });
  [L.rule, L.brule].forEach((y, i) => { const g = clamp((t - .5 - i * .2) / .8); if (g <= 0) return; let dy = 0, a = 1; if (brk > 4.2) { const p = clamp((brk - 4.4 - i * .2) / 1.0); dy = p * p * H * .7; a = 1 - p; }
    if (a <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = INK; ctx.fillRect(L.M, y + dy, (W - 2 * L.M) * g, 1.5); ctx.globalAlpha = 1; });
}
function draw(ctx, t) {
  ctx.fillStyle = PAGE; ctx.fillRect(0, 0, W, H);
  grid(ctx, t);
  // chapter label + caption row
  rise(ctx, t, .4, 5.0, L.M, L.label, 26, () => word(ctx, '17  ·  복음의 핵심', L.M, L.label, { font: font(700, 26), ls: 2 }));
  const capOut = T7 + 2.8, cx = L.capCols.map(c => L.cx(c));
  rise(ctx, t, .9, capOut, cx[0], L.cap, 20, () => word(ctx, '복음의 핵심 7가지', cx[0], L.cap, { font: font(400, 20) }));
  // intro: the system announces itself — a giant 7 beside a small line
  rise(ctx, t, .7, T0 - .45, L.M, L.num[0] + (V ? 0 : 60), V ? 96 : 104, () => word(ctx, '복음의 핵심', L.M, L.num[0] + (V ? 0 : 60), { font: font(700, V ? 96 : 104), optical: true }));
  rise(ctx, t, .95, T0 - .4, L.M, L.num[0] + (V ? 110 : 170), V ? 96 : 104, () => word(ctx, '7가지', L.M, L.num[0] + (V ? 110 : 170), { font: font(700, V ? 96 : 104), color: G3, optical: true }));
  const big = V ? 560 : 640, by = V ? Z.y1 : Z.y1 + 40;
  rise(ctx, t, .55, T0 - .5, Z.x0 + (V ? 300 : 300), by, big, () => word(ctx, '7', Z.x0 + (V ? 300 : 300), by, { font: font(700, big), optical: true }));

  // the statements
  for (let i = 0; i < 7; i++) {
    const s = T0 + i * ITEM, e = i < 6 ? s + 7.25 * B : T7 + 2.8; if (t < s - .1 || t > e + 1) continue;
    const c = CORE[i], lt = t - s, b = lt / B;
    rise(ctx, t, s + .05 * B, e, cx[1], L.cap, 20, () => word(ctx, `${String(i + 1).padStart(2, '0')} / 07`, cx[1], L.cap, { font: font(700, 20) }));
    rise(ctx, t, s + .1 * B, e, cx[2], L.cap, 20, () => word(ctx, c.cap, cx[2], L.cap, { font: font(400, 20) }));
    rise(ctx, t, s, e, L.M, L.num[0], L.num[1], () => word(ctx, String(i + 1).padStart(2, '0'), L.M, L.num[0], { font: font(700, L.num[1]), optical: true, ls: -L.num[1] * .03 }), V ? 520 : 820);
    c.t.forEach((ln, j) => rise(ctx, t, s + (.15 + j * .12) * B, e + j * .05, L.M, L.title[0] + j * L.title[2], L.title[1], () => word(ctx, ln, L.M, L.title[0] + j * L.title[2], { font: font(700, L.title[1]) }), V ? W : 860));
    if (c.v) { const vl = verseLines[i]; vl.forEach((ln, j) => rise(ctx, t, s + (.5 + j * .15) * B, e + .05 + j * .04, L.M, L.verse[0] + j * L.verse[2], L.verse[1], () => word(ctx, ln, L.M, L.verse[0] + j * L.verse[2], { font: font(600, L.verse[1], SERIF) })));
      const cy = L.verse[0] + vl.length * L.verse[2] - 8; rise(ctx, t, s + .9 * B, e + .12, L.M, cy, 22, () => word(ctx, c.ref, L.M, cy, { font: font(400, 22), color: '#55534e', ls: 1 })); }
    stage(ctx, t, s, e, () => ART[i](ctx, b));
  }

  // ---------- finale: the exception ----------
  const f = t - T7, cr = L.cross;
  if (f > 2.9) {
    // the red square leaves the grid: linear, unsnapped — falls from above to the place of the cross
    const sq = cr.w, fall = clamp((f - 2.9) / .6), y = lerp(-sq, cr.Y - sq / 2, fall), vk = clamp((f - 3.55) / .55), hk = clamp((f - 3.95) / .5);
    ctx.fillStyle = RED; ctx.fillRect(cr.X - sq / 2, y, sq, sq);
    if (vk > 0) { const up = (cr.Y + 10) * vk, dn = (H - cr.Y + 10) * vk; ctx.fillRect(cr.X - sq / 2, cr.Y - up, sq, up + dn); }
    if (hk > 0) { const a = cr.arm * hk; ctx.fillRect(cr.X - sq / 2 - a, cr.Y - sq / 2, sq + 2 * a, sq); }
    // “다 이루었다” — Scripture, in serif, the only words left on the page
    const F = L.fin, outA = 1;
    rise(ctx, t, T7 + 4.5, null, F.x, F.y, F.size, () => word(ctx, '다 이루었다', F.x, F.y, { font: font(900, F.size, SERIF), optical: true, ls: -F.size * .01 }), W);
    rise(ctx, t, T7 + 4.9, null, F.x, F.cite, 22, () => word(ctx, '요한복음 19:30 (개역개정)', F.x, F.cite, { font: font(400, 22), color: '#55534e', ls: 1 }));
    ['우리가 아직 죄인 되었을 때에', '그리스도께서 우리를 위하여 죽으심으로'].forEach((ln, j) =>
      rise(ctx, t, T7 + 5.2 + j * .12, null, F.x, F.r[0] + j * F.r[2], F.r[1], () => word(ctx, ln, F.x, F.r[0] + j * F.r[2], { font: font(600, F.r[1], SERIF) }), W));
    rise(ctx, t, T7 + 5.6, null, F.x, F.rc, 22, () => word(ctx, '로마서 5:8 (개역개정)', F.x, F.rc, { font: font(400, 22), color: '#55534e', ls: 1 }));
  }
  // in from black, out to black
  const k = 1 - ss(0, .9, t) + ss(DUR - .8, DUR, t); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(k)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, fonts: ["700 40px 'Noto Sans KR'", "400 20px 'Noto Sans KR'", "600 40px 'Noto Serif KR'", "900 40px 'Noto Serif KR'"],
  init: async () => { const c = Pilot.canvas(4, 4).getContext('2d'); CORE.forEach((q, i) => { verseLines[i] = q.v ? wrap(c, q.v, L.vw, font(600, L.verse[1], SERIF)) : []; }); },
  draw });
</script>
