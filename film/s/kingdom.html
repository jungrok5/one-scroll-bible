<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 통일 왕국</title>
<link rel="stylesheet" href="fonts.css">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 07 통일 왕국 — an illuminated manuscript page: vellum, lapis, vermilion, burnished gold leaf on raised gesso,
   punched rosettes; a candle glint sweeps the gold only. The miniature comes alive in three windows:
   the shepherd boy under the stars (Ps 23:1 on the page) → the anointing (1 Sam 16:7 on a banderole) →
   the crowned king with his harp, and the page now carries the promise 2 Sam 7:16 under a gilded initial. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, hex, mix, rgb, speckle, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 39;
const S1 = 10, S2 = 18;                   // shot cuts: page/shepherd → anointing → king/page
const INK = '#2A1A10', VEL = '#ECDCB4', LAP = '#27469A', LAPD = '#1a3072', VERM = '#C43A20', GRN = '#4e7a3c', GRND = '#33562b',
  FLESH = '#f0d6ba', WOOL = '#f3ecd8', ROSE = '#c4776c', HAIR = '#8e4020', WHT = '#fbf6e6';
let vellum, grain, goldPat, goldPatC, goldTex, glintT = 0;

// ---------- layout per orientation ----------
const L = V ? {
  bar: { x: 44, y: 150, w: 38 }, mb: { x: 150, y: 250, w: 800, h: 960 },
  col: { x: 150, w: 820, rub: 1330, top: 1380, size: 56, cite: 22 },
  big: { x: 50, y: 170, w: 980, h: 1600 }
} : {
  bar: { x: 64, y: 58, w: 40 }, mb: { x: 230, y: 150, w: 620, h: 800 },
  col: { x: 980, w: 800, rub: 400, top: 452, size: 52, cite: 22 },
  big: { x: 110, y: 80, w: 1700, h: 920 }
};

const RTL = () => Pilot.dir === 'rtl';   // right-to-left scripts (known once the language file has loaded)
// ---------- small helpers ----------
const P2 = d => new Path2D(d);
function fillInk(x, p, c, lw = 3, ink = INK) { x.fillStyle = c; x.fill(p); if (lw) { x.lineWidth = lw; x.strokeStyle = ink; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(p); } }
function line(x, d, lw = 2, c = INK, a = 1) { x.save(); x.globalAlpha *= a; x.strokeStyle = c; x.lineWidth = lw; x.lineCap = 'round'; x.lineJoin = 'round'; x.stroke(P2(d)); x.restore(); }
function ell(cx, cy, rx, ry, r = 0) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, r, 0, 6.2832); return p; }
function rectP(x0, y0, w, h) { const p = new Path2D(); p.rect(x0, y0, w, h); return p; }
// pointed (gothic) arch window: rectangle with a two-centred arch on top
function archP(x0, y0, w, h, ins = 0) {
  const p = new Path2D(), a = x0 + ins, b = x0 + w - ins, half = (b - a) / 2, r = (b - a) * .9, al = Math.acos((r - half) / r), base = y0 + ins + r * Math.sin(al);
  p.moveTo(a, y0 + h - ins); p.lineTo(a, base);
  p.arc(a + r, base, r, Math.PI, Math.PI + al, false);
  p.arc(b - r, base, r, -al, 0, false);
  p.lineTo(b, y0 + h - ins); p.closePath(); return p;
}

// ---------- gold leaf ----------
// glint: a bright band (screen space) that sweeps the gold only, from the candle at the upper left
const GL = [[1.6, 5.2], [14.6, 17.2], [S2 + .4, S2 + 3.4], [33.6, 37.6]];
function glint(t) { for (const [a, b] of GL) if (t > a - .1 && t < b + .1) return { k: (t - a) / (b - a), a: Math.sin(Math.PI * clamp((t - a) / (b - a))) }; return null; }
function gold(x, p, o = {}) {
  x.save(); x.clip(p);
  x.fillStyle = goldPat; x.fill(p);
  const m = x.getTransform(); x.setTransform(1, 0, 0, 1, 0, 0);
  // candle sheen: warmer, lighter toward the upper left, browner away from it
  const cg = x.createRadialGradient(W * .05, -H * .1, 0, W * .05, -H * .1, Math.hypot(W, H) * 1.05);
  cg.addColorStop(0, 'rgba(255,236,170,.30)'); cg.addColorStop(.55, 'rgba(255,220,140,0)'); cg.addColorStop(1, 'rgba(60,30,8,.28)');
  x.fillStyle = cg; x.fillRect(0, 0, W, H);
  const g = glint(glintT);
  if (g && g.a > 0) {
    const ux = .78, uy = .62, D = (W + H) * 1.25, pos = -D * .25 + g.k * D * 1.0, cx = pos * ux, cy = pos * uy, w = 260;
    const lg = x.createLinearGradient(cx - ux * w, cy - uy * w, cx + ux * w, cy + uy * w);
    lg.addColorStop(0, 'rgba(255,230,150,0)'); lg.addColorStop(.38, `rgba(255,226,140,${.35 * g.a})`); lg.addColorStop(.5, `rgba(255,252,226,${.95 * g.a})`);
    lg.addColorStop(.62, `rgba(255,226,140,${.35 * g.a})`); lg.addColorStop(1, 'rgba(255,230,150,0)');
    x.globalCompositeOperation = 'screen'; x.fillStyle = lg; x.fillRect(0, 0, W, H);
  }
  x.setTransform(m);
  if (o.punch) punch(x, o.punch);
  x.restore();
  // raised gesso: a dark lip below-right, a light lip above-left, then the ink keep-line
  if (o.lw !== 0) { x.save(); x.lineJoin = 'round'; x.strokeStyle = INK; x.lineWidth = o.lw || 2.2; x.stroke(p); x.restore(); }
}
function punch(x, b) {            // punched dot rosettes on a gold ground (bounds b = [x0,y0,x1,y1], spacing)
  const [x0, y0, x1, y1, sp = 46] = b;
  for (let y = y0 + sp / 2, j = 0; y < y1; y += sp * .87, j++) for (let px = x0 + sp / 2 + (j % 2) * sp / 2; px < x1; px += sp) {
    x.fillStyle = 'rgba(90,58,14,.55)'; x.beginPath(); x.arc(px, y, 2.4, 0, 6.28); x.fill();
    for (let k = 0; k < 6; k++) { const a = k * 1.047; x.beginPath(); x.arc(px + Math.cos(a) * 7, y + Math.sin(a) * 7, 1.5, 0, 6.28); x.fill(); }
    x.fillStyle = 'rgba(255,240,190,.35)'; x.beginPath(); x.arc(px - .8, y - .8, 1, 0, 6.28); x.fill();
  }
}

// ---------- the page ----------
function ivy(x, r, x0, y0, x1, y1, n, side) {   // an ink stem with trefoil ivy leaves in lapis / vermilion / gold
  const pts = []; for (let i = 0; i <= 60; i++) { const k = i / 60; pts.push([lerp(x0, x1, k) + Math.sin(k * 9 + side) * 16 * side, lerp(y0, y1, k) + Math.cos(k * 7) * 6]); }
  x.strokeStyle = INK; x.lineWidth = 2; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke();
  for (let i = 0; i < n; i++) {
    const k = (i + .5) / n, p = pts[Math.round(k * 60)], s = i % 2 ? 1 : -1, a = Math.atan2(y1 - y0, x1 - x0) + s * 1.1;
    const lx = p[0] + Math.cos(a) * 26, ly = p[1] + Math.sin(a) * 26;
    x.strokeStyle = INK; x.lineWidth = 1.5; x.beginPath(); x.moveTo(p[0], p[1]); x.quadraticCurveTo(p[0] + Math.cos(a) * 14 + 6, p[1] + Math.sin(a) * 14, lx, ly); x.stroke();
    const leaf = new Path2D(), sz = 13 + r() * 4; x.save(); x.translate(lx, ly); x.rotate(a + 1.57);
    leaf.moveTo(0, sz * .9); leaf.bezierCurveTo(-sz * 1.2, sz * .2, -sz * 1.1, -sz * .7, -sz * .3, -sz * .5); leaf.quadraticCurveTo(0, -sz * 1.4, sz * .3, -sz * .5);
    leaf.bezierCurveTo(sz * 1.1, -sz * .7, sz * 1.2, sz * .2, 0, sz * .9); leaf.closePath();
    const c = i % 3; if (c === 2) gold(x, leaf, { lw: 1.4 }); else fillInk(x, leaf, c ? VERM : LAP, 1.4);
    if (c !== 2) { x.strokeStyle = 'rgba(255,250,235,.7)'; x.lineWidth = 1; x.beginPath(); x.moveTo(0, sz * .5); x.lineTo(0, -sz * .6); x.stroke(); }
    x.restore();
  }
  for (let i = 0; i < n * 1.4; i++) { const p = pts[(r() * 60) | 0]; x.fillStyle = r() < .5 ? VERM : LAP; x.beginPath(); x.arc(p[0] + (r() - .5) * 60, p[1] + (r() - .5) * 60, 2.2, 0, 6.28); x.fill(); }
}
function barBorder(x) {            // the bar border: lapis | gold | vermilion with white tracery, along the left and the top
  const { x: bx, y: by, w } = L.bar, r = rng(4);
  const segs = [[bx, by, w, H - by + 40], [bx, by, W - bx + 40, w]];
  for (const [x0, y0, ww, hh] of segs) {
    fillInk(x, rectP(x0, y0, ww, hh), LAP, 2);
    const vert = hh > ww, g = vert ? rectP(x0 + w * .32, y0 + w * .32, w * .36, hh) : rectP(x0 + w * .32, y0 + w * .32, ww, w * .36);
    gold(x, g, { lw: 1.6 });
    x.fillStyle = 'rgba(250,246,232,.85)';
    for (let s = 0; s < (vert ? hh : ww); s += 22) { const px = vert ? x0 + w * .16 : x0 + s, py = vert ? y0 + s : y0 + w * .16; x.beginPath(); x.arc(px, py, 2, 0, 6.28); x.fill();
      const qx = vert ? x0 + w * .84 : x0 + s + 11, qy = vert ? y0 + s + 11 : y0 + w * .84; x.beginPath(); x.arc(qx, qy, 2, 0, 6.28); x.fill(); }
  }
  // corner boss
  const cb = new Path2D(); cb.arc(bx + w / 2, by + w / 2, w * .95, 0, 6.28); fillInk(x, cb, VERM, 2);
  const cg = new Path2D(); cg.arc(bx + w / 2, by + w / 2, w * .55, 0, 6.28); gold(x, cg, { lw: 1.5 });
  // ivy sprays out of the bar
  if (V) { ivy(x, r, bx + w, 560, bx + 70, 900, 5, 1); ivy(x, r, bx + w, 1360, bx + 80, 1720, 6, -1); ivy(x, r, 520, by + w, 900, by + w + 50, 6, 1); ivy(x, r, 560, 1740, 1040, 1700, 7, -1); }
  else { ivy(x, r, bx + w, 360, bx + 120, 700, 6, 1); ivy(x, r, bx + w, 760, bx + 110, 1060, 5, -1); ivy(x, r, 980, by + w, 1500, by + w + 60, 8, 1); ivy(x, r, 1560, by + w, 1900, by + w + 40, 5, -1);
    // the initial's bar extension down the inner margin, sprouting ivy under the text
    const ex = L.col.x - 46; fillInk(x, rectP(ex - 7, 380, 14, 600), LAP, 1.6); gold(x, rectP(ex - 3, 380, 6, 600), { lw: 1 });
    ivy(x, r, ex + 7, 900, 1720, 950, 10, 1); ivy(x, r, ex + 7, 380, ex + 140, 300, 3, -1); }
}
function frame(x, b, inner, rect) {      // the miniature window: gold band, vermilion fillet, lapis spandrels; content drawn by inner()
  const { x: x0, y: y0, w, h } = b, f = 20;
  // spandrels (between the arch and the box) in lapis with little gold stars
  fillInk(x, rectP(x0 - f, y0 - f, w + 2 * f, h + 2 * f), LAP, 2.5);
  gold(x, (() => { const p = rectP(x0 - f, y0 - f, w + 2 * f, h + 2 * f); p.rect(x0 - f + 10, y0 - f + 10, w + 2 * f - 20, h + 2 * f - 20); return p; })(), { lw: 2 });
  const ap = rect ? rectP(x0, y0, w, h) : archP(x0, y0, w, h);
  x.save(); x.fillStyle = 'rgba(255,240,200,.85)'; for (let i = 0; i < 18; i++) { const px = x0 + (i % 2 ? 26 : w - 26) + (i % 2 ? 1 : -1) * ((i / 2 | 0) % 3) * 22, py = y0 + 22 + ((i / 2 | 0) % 3) * 24 + (i > 9 ? 40 : 0); x.beginPath(); x.arc(px, py, 2.4, 0, 6.28); x.fill(); } x.restore();
  x.save(); x.clip(ap); inner(x); x.restore();
  x.save(); x.lineWidth = 10; x.strokeStyle = VERM; x.stroke(ap); x.lineWidth = 2; x.strokeStyle = INK; x.stroke(ap);
  x.setLineDash([1, 9]); x.lineCap = 'round'; x.lineWidth = 3; x.strokeStyle = WHT; x.stroke(ap); x.restore();
}

// ---------- figures (local coordinates; scaled by the caller) ----------
function face(x, cx, cy, s, dir = 1, up = 0) {    // a gothic face: pale oval, few ink lines, rosy cheek; no glints on faces
  x.save(); x.translate(cx, cy); x.rotate(up * dir); x.scale(dir, 1);
  fillInk(x, ell(0, 0, 21 * s, 27 * s), FLESH, 1.8 * s);
  line(x, `M${4 * s} ${-6 * s} q${5 * s} ${-3 * s} ${10 * s} 0`, 1.6 * s);                 // brow
  line(x, `M${5 * s} ${-1 * s} q${4 * s} ${2 * s} ${8 * s} 0`, 1.8 * s);                   // eye
  x.fillStyle = INK; x.beginPath(); x.arc(10 * s, 0, 1.6 * s, 0, 6.28); x.fill();
  line(x, `M${16 * s} ${-2 * s} q${4 * s} ${8 * s} ${1 * s} ${10 * s}`, 1.5 * s);           // nose
  line(x, `M${8 * s} ${15 * s} q${4 * s} ${2 * s} ${8 * s} ${-1 * s}`, 1.5 * s, '#8a2a18');   // mouth
  x.fillStyle = 'rgba(205,90,70,.35)'; x.beginPath(); x.arc(6 * s, 8 * s, 5 * s, 0, 6.28); x.fill();
  x.restore();
}
function curls(x, cx, cy, s, dir, beard) {          // ruddy curly hair (and a short beard)
  const hp = new Path2D(); hp.moveTo(cx - 24 * s * dir, cy + 14 * s);
  for (let i = 0; i <= 8; i++) { const a = Math.PI * (1.05 + i * .11), r0 = 27 * s; hp.quadraticCurveTo(cx + Math.cos(a - .06) * (r0 + 9 * s) * dir, cy + Math.sin(a - .06) * (r0 + 9 * s) - 2 * s, cx + Math.cos(a) * r0 * dir, cy + Math.sin(a) * r0 - 2 * s); }
  hp.lineTo(cx + 6 * s * dir, cy - 18 * s); hp.quadraticCurveTo(cx - 8 * s * dir, cy - 8 * s, cx - 10 * s * dir, cy + 4 * s); hp.lineTo(cx - 14 * s * dir, cy + 20 * s); hp.closePath();
  fillInk(x, hp, HAIR, 1.6 * s);
  for (let i = 0; i < 6; i++) { const a = Math.PI * (1.1 + i * .16); line(x, `M${cx + Math.cos(a) * 20 * s * dir} ${cy + Math.sin(a) * 20 * s} a${4 * s} ${4 * s} 0 1 1 ${4 * s * dir} ${3 * s}`, 1.3 * s, '#4a1e0c'); }
  if (beard) { const bp = new Path2D(); bp.moveTo(cx - 8 * s * dir, cy + 4 * s); bp.quadraticCurveTo(cx - 6 * s * dir, cy + 30 * s, cx + 10 * s * dir, cy + 32 * s); bp.quadraticCurveTo(cx + 20 * s * dir, cy + 26 * s, cx + 18 * s * dir, cy + 16 * s); bp.quadraticCurveTo(cx + 8 * s * dir, cy + 20 * s, cx + 2 * s * dir, cy + 8 * s); bp.closePath(); fillInk(x, bp, HAIR, 1.4 * s); }
}
function sheep(x, px, py, s, dir, graze, t, seed) {
  x.save(); x.translate(px, py); x.scale(s * dir, s);
  const r = rng(seed), body = new Path2D(), N = 14;
  for (let i = 0; i <= N; i++) { const a = i / N * 6.2832, rx = 62, ry = 36, x1 = Math.cos(a) * rx, y1 = Math.sin(a) * ry, a2 = (i + .5) / N * 6.2832, x2 = Math.cos(a2) * (rx + 9), y2 = Math.sin(a2) * (ry + 9), a3 = (i + 1) / N * 6.2832;
    if (!i) body.moveTo(x1, y1); body.quadraticCurveTo(x2, y2, Math.cos(a3) * rx, Math.sin(a3) * ry); }
  x.fillStyle = INK; [[-38, 0], [-22, 4], [24, 2], [40, -2]].forEach(([lx, k]) => x.fillRect(lx - 3.5, 26, 7, 36 + k));
  fillInk(x, body, WOOL, 2.2);
  for (let i = 0; i < 12; i++) { const cx = (r() - .5) * 90, cy = (r() - .5) * 46; line(x, `M${cx} ${cy} a5 5 0 1 1 6 4`, 1.3, INK, .55); }
  const hb = graze * (1 + .15 * Math.sin(t * 2.2 + seed)), hx = lerp(70, 62, hb), hy = lerp(-14, 34, hb), ha = lerp(-.25, 1.0, hb);
  x.save(); x.translate(hx, hy); x.rotate(ha);
  fillInk(x, ell(6, 0, 22, 14), '#4a3a30', 2); fillInk(x, ell(-6, -11, 10, 5, -.6), '#5a483a', 1.6);
  x.fillStyle = WHT; x.beginPath(); x.arc(10, -3, 2.2, 0, 6.28); x.fill();
  x.restore(); x.restore();
}
function harp(x, px, py, s, t, a0 = 0) {   // a small gold harp: soundbox, neck, pillar, with strings that shimmer when plucked
  x.save(); x.translate(px, py); x.rotate(a0); x.scale(s, s);
  const fr = new Path2D(); fr.moveTo(-6, 0); fr.lineTo(-30, -150); fr.quadraticCurveTo(-26, -176, -4, -168); fr.quadraticCurveTo(30, -150, 52, -150); fr.quadraticCurveTo(64, -150, 62, -138);
  fr.quadraticCurveTo(42, -70, 12, 4); fr.closePath();
  fr.moveTo(-14, -30); fr.lineTo(-24, -134); fr.quadraticCurveTo(10, -132, 46, -136); fr.quadraticCurveTo(28, -80, 2, -26); fr.closePath();
  x.save(); x.fillStyle = 'rgba(42,26,16,.0)'; x.restore();
  gold(x, fr, { lw: 2 });
  for (let i = 0; i < 7; i++) { const k = i / 6, xa = lerp(-20, 38, k), ya = lerp(-134, -134, k), xb = lerp(-12, 6, k), yb = lerp(-34, -30, k);   // every string runs the full span, top bar → soundbox
    const vib = Math.sin(t * 40 + i * 2) * 1.6 * (.5 + .5 * Math.sin(t * 3 + i));
    x.strokeStyle = 'rgba(252,246,226,.95)'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(xa, ya); x.quadraticCurveTo((xa + xb) / 2 + vib, (ya + yb) / 2, xb, yb); x.stroke(); }
  x.restore();
}

// shepherd David, seated on a rock, playing the harp, face lifted to the stars
function shepherd(x, px, py, s, t) {
  x.save(); x.translate(px, py); x.scale(s, s);
  line(x, 'M-150 92 L -118 -170 q 4 -26 -16 -30 q -18 -2 -20 16', 5, '#5a3a20');
  fillInk(x, P2('M-120 0 C-130 -40 -90 -66 -40 -60 C 10 -76 70 -60 96 -30 C 120 -10 120 70 100 96 L-130 96 C-150 70 -140 30 -120 0 Z'), '#9a8f78', 2.4);
  line(x, 'M-90 -30 q30 10 50 50 M30 -50 q20 30 10 70 M-120 50 q40 -10 70 10 M60 30 q30 -6 40 20', 1.6, INK, .6);
  // legs
  fillInk(x, P2('M58 -24 C72 10 84 50 92 92 L114 92 C 106 50 96 4 84 -26 Z'), '#7a5a3a', 2);
  fillInk(x, P2('M86 88 L128 90 Q138 98 126 102 L84 100 Z'), '#4a3424', 2);
  // tunic (vermilion), belted
  const tun = P2('M-40 -214 C-58 -160 -66 -80 -70 -34 C-74 -10 -60 2 -40 0 L 88 -6 C 100 -20 98 -44 80 -54 C 40 -62 10 -74 -6 -96 C 8 -140 30 -176 40 -210 Q 0 -232 -40 -214 Z');
  fillInk(x, tun, VERM, 2.6);
  line(x, 'M-30 -150 q-14 50 -20 120 M10 -40 q30 8 60 -6 M-10 -70 q30 0 50 8', 2, '#7a1c0c', .8);
  fillInk(x, P2('M-50 -112 L 18 -104 L 16 -92 L-54 -98 Z'), '#5a3216', 1.6);
  // far arm reaching to the harp's top, harp on the knee, near arm plucking
  fillInk(x, P2('M 30 -200 C 46 -196 50 -180 48 -160 L 38 -158 C 38 -174 34 -184 22 -188 Z'), '#a32e18', 1.8);
  harp(x, 64, -40, 1.08, t, -.12);
  const pl = Math.sin(t * 5.2) * 6;
  fillInk(x, P2(`M -6 -196 C -20 -150 -16 -110 6 -92 C 30 -86 ${54 + pl} -96 ${74 + pl} -98 L ${76 + pl} -86 C 50 -80 20 -72 -2 -80 C -30 -96 -36 -150 -24 -196 Z`), VERM, 2.2);
  fillInk(x, ell(80 + pl, -92, 10, 8), FLESH, 1.6);
  fillInk(x, ell(42, -158, 9, 8), FLESH, 1.6);
  // neck, head lifted
  fillInk(x, P2('M -8 -232 L 12 -232 L 14 -210 L -10 -210 Z'), FLESH, 1.6);
  const up = -.28 - .04 * Math.sin(t * .8);
  x.save(); x.translate(2, -262); x.rotate(up); face(x, 0, 0, 1.15, 1, 0); curls(x, 0, 0, 1.15, 1, false); x.restore();
  // shepherd's crook lying across the rock
  x.restore();
}

// Samuel pouring the horn of oil; David kneeling with joined hands
function samuel(x, px, py, s, t, pour) {
  x.save(); x.translate(px, py); x.scale(s, s);
  // robe (lapis) and mantle (rose) — long, swaying gothic folds
  fillInk(x, P2('M -70 -560 C -110 -400 -130 -180 -150 0 L 130 0 C 110 -160 100 -360 60 -560 Q 0 -590 -70 -560 Z'), LAP, 3);
  line(x, 'M -40 -400 Q -70 -200 -90 -6 M 10 -380 Q 0 -200 10 -4 M 50 -360 Q 70 -180 90 -6', 2.4, '#10224f', .9);
  fillInk(x, P2('M -76 -566 C -110 -460 -122 -320 -134 -150 C -100 -128 -50 -140 -16 -176 C 14 -220 34 -300 42 -380 C 50 -440 46 -520 30 -566 Q -20 -590 -76 -566 Z'), ROSE, 3);
  line(x, 'M -60 -480 q -20 160 -40 316 M -20 -470 q -6 150 -10 280 M 20 -440 q 0 120 -14 230', 2.2, '#7a3a34', .9);
  // feet
  fillInk(x, P2('M -60 0 l 0 -14 l 50 0 q 20 6 20 14 Z'), '#3a2a20', 2); fillInk(x, P2('M 30 0 l 0 -14 l 54 0 q 20 6 18 14 Z'), '#3a2a20', 2);

// a block of verse: gilded initial spanning two lines + the rest of the two lines, written in; cite under.
// b.v = the two Korean lines; each is translated whole, and the initial is the first grapheme of the translated first line.
function verseBlock(x, t, b) {
  if (RTL()) return verseBlockRTL(x, t, b);
  const { x: cx, w } = L.col, size = b.size, lh = size * 1.42, isz = lh * 1.72, y1 = b.y + size, a = b.alpha;
  if (a <= 0) return; x.save(); x.globalAlpha = a;
  const head = s => { const c = Pilot.chars(s), r = c.slice(1); while (r.length && /^\s$/.test(r[0])) r.shift(); return [c[0], r]; };   // initial + the rest (no space after it)
  // a line that opens with kana (Japanese) gets no gilded initial — an illuminated あ reads oddly; write it whole
  const noInit = /^[\u3040-\u30ff]/.test(Pilot.tr(b.v[0]));
  const [init, l1] = noInit ? ['', Pilot.chars(Pilot.tr(b.v[0]))] : head(Pilot.tr(b.v[0])), l2 = Pilot.chars(Pilot.tr(b.v[1]));
  const kn = head(b.v[0])[1].length + Pilot.chars(b.v[1]).length, rate = b.rate * Math.max(1, (l1.length + l2.length) / kn);   // same writing time as the Korean

  x.restore();

// right-to-left scripts: no gilded initial (joined letters can't be split off) — the two translated lines are written
// whole from the right edge of the column, word by word (each word fades in, so the joins stay intact), in the Korean's writing time
function verseBlockRTL(x, t, b) {
  const { x: cx, w } = L.col, size = b.size, lh = size * 1.42, y1 = b.y + size, a = b.alpha, xr = cx + w;
  if (a <= 0) return; x.save(); x.globalAlpha = a;
  const ls = [Pilot.tr(b.v[0]), Pilot.tr(b.v[1])], kn = Pilot.chars(b.v[0]).length + Pilot.chars(b.v[1]).length;
  x.font = `900 ${size}px 'Noto Serif KR'`; x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'alphabetic';
  let fs = size; const mw = Math.max(...ls.map(l => x.measureText(l).width)); if (mw > w - 12) { fs = size * (w - 12) / mw; x.font = `900 ${fs}px 'Noto Serif KR'`; }
  const words = ls.map(l => l.split(' ')), n = words[0].length + words[1].length, dt = kn / b.rate / n; let k = 0; const ends = [];
  words.forEach((ws, j) => { const y = y1 + j * lh; let pre = '';
    ws.forEach(wd => { const st = b.t0 + .4 + k * dt + (j ? .2 : 0), al = clamp((t - st) / Math.max(.22, dt * 1.2)); k++;

  x.restore();
}
