/* 16 거울 — 이스라엘의 악순환은 나의 모습. A luxury-product film turned inside out: one piece of polished gold

   a thumbs-up, a person — and finally an oval mirror that faces the viewer, with "me" inside the glass.

// ---------- signed distance fields (Felzenszwalb EDT) ----------

// ---------- the room ----------
const F2S = (fx, fy) => [OX + fx * K, OY + fy * K];
function room(ctx, t) {

  const bg = ctx.createRadialGradient(cx, BASEY - 300 * K, 0, cx, BASEY - 300 * K, H * .9); bg.addColorStop(0, `rgba(48,36,22,${.55 * L.I})`); bg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

}
function glass(ctx, t) {      // the mirror's glass: dark silver, the light above, and a silhouette facing us — the viewer
  const g = ss(24.6, 26.2, t); if (g <= 0) return;
  const [cx, cy] = F2S(320, 360), rx = 176 * K, ry = 246 * K, L = light(t);
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.283); ctx.clip(); ctx.globalAlpha = g;
  const bg = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry); bg.addColorStop(0, '#2a2620'); bg.addColorStop(.5, '#121110'); bg.addColorStop(1, '#070706'); ctx.fillStyle = bg; ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);

  const bz = 1 + .006 * Math.sin(t * 1.3), s = K * bz, hx = cx, hy = cy + 20 * K, emerge = ss(25.6, 28.4, t);
  const person = () => { ctx.beginPath(); ctx.ellipse(hx, hy - 60 * s, 58 * s, 68 * s, 0, 0, 6.283);
    ctx.moveTo(hx - 34 * s, hy); ctx.lineTo(hx + 34 * s, hy); ctx.quadraticCurveTo(hx + 40 * s, hy + 20 * s, hx + 60 * s, hy + 30 * s); ctx.quadraticCurveTo(hx + 170 * s, hy + 46 * s, hx + 190 * s, hy + 140 * s);
    ctx.lineTo(hx + 210 * s, hy + 260 * s); ctx.lineTo(hx - 210 * s, hy + 260 * s); ctx.lineTo(hx - 190 * s, hy + 140 * s); ctx.quadraticCurveTo(hx - 170 * s, hy + 46 * s, hx - 60 * s, hy + 30 * s);
    ctx.quadraticCurveTo(hx - 40 * s, hy + 20 * s, hx - 34 * s, hy); ctx.closePath(); };
  ctx.globalAlpha = g * emerge; ctx.filter = `blur(${3 * K}px)`; ctx.fillStyle = `rgba(232,180,100,${.55 * L.I})`; ctx.save(); ctx.translate(0, -3 * K); person(); ctx.fill(); ctx.restore(); ctx.filter = 'none';
  ctx.fillStyle = '#0b0907'; ctx.save(); ctx.translate(0, 3 * K); person(); ctx.fill(); ctx.restore();
  // a sheen sweeps across as the glass is laid
  const sw = clamp((t - 24.9) / 1.6); if (sw > 0 && sw < 1) { ctx.globalAlpha = g * Math.sin(Math.PI * sw) * .55; ctx.globalCompositeOperation = 'screen';
    const sx = lerp(cx - rx * 1.6, cx + rx * 1.6, sw), sg = ctx.createLinearGradient(sx - 90 * K, 0, sx + 90 * K, 0); sg.addColorStop(0, 'rgba(255,250,235,0)'); sg.addColorStop(.5, 'rgba(255,250,235,.9)'); sg.addColorStop(1, 'rgba(255,250,235,0)');
    ctx.save(); ctx.translate(sx, cy); ctx.rotate(.35); ctx.translate(-sx, -cy); ctx.fillStyle = sg; ctx.fillRect(sx - 90 * K, cy - ry * 1.5, 180 * K, ry * 3); ctx.restore(); }
  // a faint permanent highlight on the glass
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = g * .16; const hl = ctx.createLinearGradient(cx - rx, cy - ry, cx, cy); hl.addColorStop(0, 'rgba(255,255,255,.8)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);

function thread(ctx, t) {      // the end: the one golden thread of light comes down to the mirror
  const k = ss(36.6, 38.6, t); if (k <= 0) return; const [cx, cy] = F2S(320, 48), y = lerp(-20, cy, eo(k));
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(0, -20, 0, y); g.addColorStop(0, 'rgba(255,214,140,0)'); g.addColorStop(.4, 'rgba(255,214,140,.5)'); g.addColorStop(1, 'rgba(255,236,190,1)');
  ctx.strokeStyle = g; ctx.lineWidth = 2.2 * Math.max(1, K); ctx.shadowColor = 'rgba(255,200,120,.9)'; ctx.shadowBlur = 16; ctx.beginPath(); ctx.moveTo(cx, -20); ctx.lineTo(cx, y); ctx.stroke();
  const p = ctx.createRadialGradient(cx, y, 0, cx, y, 40 * K); p.addColorStop(0, `rgba(255,240,200,${.8 * k})`); p.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = p; ctx.fillRect(cx - 40 * K, y - 40 * K, 80 * K, 80 * K);

}

// ---------- words ----------
const CYC = ['우상을 섬김', '→', '고난', '→', '부르짖음', '→', '하나님의 구원', '→', '다시 우상…'], CT = [1.9, 2.6, 3.1, 3.8, 4.3, 5.0, 5.6, 6.4, 6.9];
function cycle(ctx, t) {
  const a = win(t, 1.6, 9.2, .8, 1); if (a <= 0) return;
  const size = V ? 42 : 40, rows = V ? [[0, 5], [5, 9]] : [[0, 9]], y0 = V ? H - 262 : H - 96, lh = size * 1.8;
  ctx.save(); ctx.font = `600 ${size}px ${SERIF}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 16;
  rows.forEach(([i0, i1], ri) => { const gap = size * .45, ws = []; for (let i = i0; i < i1; i++) ws.push(ctx.measureText(CYC[i]).width);
    let x = W / 2 - (ws.reduce((p, q) => p + q, 0) + gap * (ws.length - 1)) / 2;
    for (let i = i0; i < i1; i++) { const on = ss(CT[i], CT[i] + .45, t), cur = i + 2 < CT.length ? 1 - ss(CT[i + 2], CT[i + 2] + .5, t) : 1, arrow = CYC[i] === '→';
      const c = arrow ? [190, 150, 90] : mix([150, 128, 98], i === 6 ? [250, 248, 240] : [255, 214, 140], cur);
      ctx.globalAlpha = a * on; ctx.fillStyle = rgb(c); ctx.fillText(CYC[i], x, y0 + ri * lh); x += ws[i - i0] + gap; } });
  ctx.restore();
}
function draw(ctx, t) {
  const z = lerp(1, 1.07, eio(t / DUR)), pz = [W / 2, BASEY - 320 * K];
  ctx.save(); ctx.translate(pz[0], pz[1]); ctx.scale(z, z); ctx.translate(-pz[0], -pz[1]);
  room(ctx, t); const st = shadeField(t); plate(ctx, t, st);
  glass(ctx, t);
  // soft contact glow under the gold, then the gold itself
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(fcv, OX, OY, FW * K, FH * K);
  thread(ctx, t);
  ctx.restore();
  // grade: vignette and a faint warm grain-free bloom
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  const tw = { weight: 600, color: '#f6ead2', shadow: 'rgba(0,0,0,.95)', shadowBlur: 20 }, TS = V ? 50 : 50, TY = V ? 330 : 128;
  text(ctx, '16  ·  거울', V ? 80 : 110, V ? 200 : 120, { align: 'left', size: 30, weight: 600, color: '#e8dcc4', alpha: win(t, .6, 5, 1, 1), ls: 4 });
  cycle(ctx, t);
  text(ctx, '우상이란 나무 조각상만이 아닙니다.', W / 2, TY, { ...tw, size: TS, alpha: win(t, 9.6, 13.4, 1, .7) });
  text(ctx, V ? '하나님보다 더 사랑하고\n의지하는 모든 것' : '하나님보다 더 사랑하고 의지하는 모든 것', W / 2, V ? TY - 40 : TY, { ...tw, size: TS, alpha: win(t, 13.7, 23.4, 1, .9) });
  text(ctx, '이것은 거울입니다.', W / 2, TY, { ...tw, size: V ? 62 : 58, alpha: win(t, 26.0, 29.6, 1.1, .7) });
  text(ctx, V ? '이스라엘의 악순환은\n사실 ‘나’의 모습' : '이스라엘의 악순환은 사실 ‘나’의 모습', W / 2, V ? TY - 40 : TY, { ...tw, size: TS, alpha: win(t, 29.6, 33.4, 1, .8) });
  const pa = win(t, 33.6, 39.3, 1.2, 1), py = V ? H - 290 : H - 176;
  if (pa > 0) { const sc = ctx.createLinearGradient(0, py - 120, 0, H); sc.addColorStop(0, 'rgba(0,0,0,0)'); sc.addColorStop(.3, `rgba(0,0,0,${.72 * pa})`); sc.addColorStop(1, `rgba(0,0,0,${.85 * pa})`); ctx.fillStyle = sc; ctx.fillRect(0, py - 120, W, H - py + 120); }

  text(ctx, '“하나님 자리에 앉은 나 자신”입니다.', W / 2, py + (V ? 92 : 84), { ...tw, size: V ? 58 : 58, color: '#ffe6b8', alpha: win(t, 34.6, 39.3, 1.2, 1), shadowBlur: 26 });
  const f = 1 - ss(0, 1.3, t) + ss(DUR - 1.3, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }

Pilot.run({ W, H, dur: DUR, audio: 'mirror.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'", "700 40px 'Noto Sans KR'"],
