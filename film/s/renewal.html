<script>
/* 15 회복 — a watercolour handscroll that paints itself, one unbroken walk.
   The dry world paints in first and stops at a river; beyond it is bare paper. A traveller walks through the desert,
   kneels at the water; we lean in: a face, a tear, and the tear is wiped away (Rev 21:4).
   Then the far bank paints itself in as he walks — grass, trees heavy with fruit, flowers, birds — and at the end of the

const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas, hex, mix, rgb, ramp, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 36;
const K = V ? 1.12 : 1, HZ = V ? H * .53 : H * .6;              // world→screen scale, horizon on screen
const Y0 = -HZ / K - 30, Y1 = (H - HZ) / K + 30;                 // world rows a layer must cover
const RIVER = 2150, BANK = 2420, CITY = 4720, PATHY = 170;
const INK = '#3b2c22', PAPER = '#f2e8d5';
let paper, grain, layers = {}, objs = [], fig = {}, faceStrokes = [], faceFix = [];

// ---------- watercolour stroke engine ----------
let R = rng(1);
const prof = { brush: u => Math.pow(Math.sin(Math.PI * clamp(u * .92 + .04)), .5), tip: u => Math.pow(1 - u, .7) * Math.min(1, u * 8 + .3), leaf: u => Math.sin(Math.PI * u), even: u => Math.min(1, u * 10 + .2, (1 - u) * 10 + .2), trunk: u => 1 - .65 * u };
function mk(pts, w, col, o = {}) {           // a brush stroke: ribbon + bristle tracks, resampled along its length

    return [p[0], p[1], -dy / m, dx / m, w * pf(u) * (1 + .44 * (noise(u * 5 + s, s) - .5))]; });

function drawS(ctx, S, prog = 1) {

  for (let i = n - 1; i >= 0; i--) ctx.lineTo(P[i][0] - P[i][2] * P[i][4] / 2, P[i][1] - P[i][3] * P[i][4] / 2);

function wash(pts, col, a, o = {}) {          // a flat wash painted in three jittered passes (edges pool darker)

  const passes = [0, 1, 2].map(k => pts.map(([x, y], i) => [x + (noise(i * .7 + s + k * 9, k) - .5) * 2 * j, y + (noise(i * .7 + s + k * 9, k + 5) - .5) * 2 * j]));

function drawW(ctx, Wv, prog = 1) {

// ---------- the world (x along the walk, y from the horizon, down positive) ----------
const SKY = [[0, '#ecd6ad'], [1500, '#efdcb8'], [2300, '#e3e6dc'], [3200, '#e7efe2'], [4200, '#fbefcf'], [5600, '#fff3d2']];

const FAR = [[0, '#d7a98f'], [1600, '#d4ab95'], [2400, '#a9b6b8'], [3400, '#9db5ad'], [4300, '#e4caa0'], [5600, '#ecd3a6']];

function band(list, x0, x1, y, h, keys, p, a, rr, dark = 1) {   // a row of overlapping soft washes, colour by place
  let x = x0 - rr() * 300; while (x < x1) { const len = 420 + rr() * 700, c = colAt(keys, (x + len / 2) / p).map(v => v * dark), top = y + (rr() - .5) * h * .3, bot = y + h + (rr() - .5) * h * .3, n = 7, pts = [];
    for (let i = 0; i <= n; i++) pts.push([x + len * i / n, top + (rr() - .5) * h * .25]); for (let i = n; i >= 0; i--) pts.push([x + len * i / n, bot + (rr() - .5) * h * .25]);

  for (let y = Y0; y < 30; y += 120) band(sky, -300, 5800 * .15 + W, y, 170, SKY, .15, .22, rr);
  for (let i = 0; i < 22; i++) { const x = rr() * (5800 * .15 + W), y = -460 + rr() * 330; sky.push(mk([[x, y], [x + 140 + rr() * 160, y - 6 + rr() * 12], [x + 300 + rr() * 200, y + rr() * 8]], 10 + rr() * 16, colAt(SKY, x / .15).map(v => v * .9), { a: .2, bristles: 5 })); }
  // far hills: mesas in the desert, soft hills beyond the river, a golden hill at the end
  for (let x = -300; x < 5800 * .35 + W; x += 120 + rr() * 80) { const wx = x / .35, desert = wx < 2100, w = 110 + rr() * 120, h = desert ? (fbm(x * .004, 2) > .55 ? 150 : 60 + 60 * fbm(x * .01, 3)) : 70 + 90 * fbm(x * .006, 5);
    const top = -h - (wx > 4300 ? 40 * ss(4300, 4700, wx) : 0), c = colAt(FAR, desert ? Math.min(wx, 1600) : wx), round = !desert;   // a mesa keeps the desert's warm rock colour

    far.push(wash(pts, c, .34, { j: 7 })); }
  band(far, -300, 5800 * .35 + W, -4, 34, [[0, PAPER], [9999, PAPER]], 1, .5, rr);                        // mist band
  // mid: dunes → green hills
  for (let x = -300; x < 5800 * .65 + W; x += 160 + rr() * 100) { const wx = x / .65, w = 160 + rr() * 140, h = 26 + 40 * fbm(x * .006, 7), c = colAt(MID, wx);
    mid.push(wash(Array.from({ length: 9 }, (_, i) => [x - w + i / 8 * 2 * w, 60 - (h + 30) * Math.sin(i / 8 * Math.PI)]), c, .4, { j: 8 })); }

  for (let i = 0; i < 520; i++) { const x = -200 + rr() * 6100, y = 40 + Math.pow(rr(), .9) * (Y1 - 40), l = 50 + rr() * 150 * (1 + y / 500);
    gnd.push(mk([[x, y], [x + l / 2, y + (rr() - .5) * 4], [x + l, y + (rr() - .5) * 6]], 4 + rr() * 8 * (1 + y / 600), colAt(GROUND, x).map(v => v * (.86 + rr() * .1)), { a: .3, bristles: 4 })); }
  // the path

function chunked(list, p) {                  // bake a layer into canvas chunks (layer-space x)
  const CW = 1024, maxX = Math.max(...list.map(s => s.bb[2])), chunks = [];

// ---------- props: painted stroke by stroke as they appear, then cached ----------
function addObj(x, y, p, list, o = {}) { objs.push({ x, y, p, list, o, spr: null }); }
function branchy(x0, y0, len, ang, w, depth, col, out, leafFn) {

function deadTree(s) { const out = []; branchy(0, 0, 70 * s, -Math.PI / 2 + .1, 13 * s, 3, '#6e5440', out); return out; }
function thorn(s) { const out = []; for (let i = 0; i < 14; i++) { const a = -Math.PI / 2 + (R() - .5) * 2.4, l = (20 + R() * 30) * s; out.push(mk([[0, 0], [Math.cos(a) * l * .5, Math.sin(a) * l * .5 - 4], [Math.cos(a) * l, Math.sin(a) * l]], 2.4 * s, '#7a6550', { prof: 'tip', a: .7, bristles: 1 })); } return out; }
function rock(s, c = '#b39a80') { const pts = []; for (let i = 0; i <= 8; i++) { const a = Math.PI + i / 8 * Math.PI, r = (24 + R() * 10) * s; pts.push([Math.cos(a) * r * 1.4, Math.sin(a) * r * .9]); }
  return [wash(pts, c, .6, { j: 3 }), mk([[-30 * s, 0], [0, 3 * s], [32 * s, 0]], 5 * s, '#7d6650', { a: .5, bristles: 2 })]; }

function fruitTree(s, seed) {             // the tree of life: trunk, branches, heavy leaves, fruit

function cityList() {                      // the city of light: pale gold like clear glass, gates of pearl, light from within

  const r = x.createRadialGradient(0, -170, 380, 0, -170, 760); r.addColorStop(0, 'rgba(240,196,96,0)'); r.addColorStop(.5, `rgba(240,196,96,${.26 * k})`); r.addColorStop(1, 'rgba(240,196,96,0)'); x.fillStyle = r; x.fillRect(-1000, -1100, 2000, 1500);

  for (let i = 0; i < 13; i++) { const a = -Math.PI / 2 + (i - 6) * .2 + Math.sin(t * .2 + i) * .02, l = 900; x.fillStyle = `rgba(255,232,170,${.10 * k})`; x.beginPath(); x.moveTo(0, -150); x.lineTo(Math.cos(a - .04) * l, -150 + Math.sin(a - .04) * l); x.lineTo(Math.cos(a + .04) * l, -150 + Math.sin(a + .04) * l); x.fill(); }

let layersCanvas;

function draw(ctx, t) {
  ctx.drawImage(paper, 0, 0);
  // camera: lean in on the kneeling traveller as the mist rises; pull back out after
  const fxs = (fxAt(t) - camAt(t)) * K, fys = HZ + (PATHY - 50) * K, zin = 1 + .7 * eio(clamp((t - 9.6) / 2.0)) * (1 - ss(16.8, 18.6, t)) + .0 * t;
  walkScene(ctx, t, zin > 1.001 ? [fxs, fys, zin] : null);
  // mist: paper rises over the scene, the face is painted on the clean sheet, then the mist falls away
  const mist = ss(10.6, 11.6, t) * (1 - ss(17.2, 18.4, t));

  const a0 = win(t, 3.6, 8.8, 1.2, .8);

  else text(ctx, '예수님이 다시 오셔서 모든 것을 새롭게 하신다.', cx0, ty, { ...st, size: 46, alpha: a0 });

  if (V) { text(ctx, '“애통하는 것이나 곡하는 것이나', cx0, ty, { ...st, size: 46, alpha: a3 }); text(ctx, '아픈 것이 다시 있지 아니하리니”', cx0, ty + 74, { ...st, size: 46, alpha: a3 }); }
  else text(ctx, '“애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니”', cx0, ty, { ...st, size: 46, alpha: a3 });
  const cite = { size: 23 * sc, font: "'Noto Sans KR',sans-serif", color: '#6a5646', ls: 2, shadow: 'rgba(250,244,230,.9)' };
  text(ctx, '요한계시록 21:4 (개역개정)', cx0, y1 + 56 * sc, { ...cite, alpha: a1 * .9 });
  text(ctx, '요한계시록 21:4 (개역개정)', cx0, ty + (V ? (a3 > 0 ? 140 : 62) : 56), { ...cite, alpha: Math.max(a2, a3) * .9 });
  text(ctx, '“보라 내가 만물을 새롭게 하노라”', cx0, ty + (V ? 0 : 0), { ...st, size: 58 * sc, alpha: a4 });
  text(ctx, '요한계시록 21:5 (개역개정)', cx0, ty + 64 * sc, { ...cite, alpha: a4 * .9 });
  const f = 1 - ss(0, 1.2, t) + ss(DUR - 1.4, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, audio: 'renewal.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    // paper: warm base, soft clouds of tone, fibres
    paper = canvas(W, H); { const x = paper.getContext('2d'), d = x.createImageData(W, H), r = rng(2);
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const v = (fbm(i * .004, j * .004, 3) - .5) * 14 + (r() - .5) * 6, k = (j * W + i) * 4; d.data[k] = 242 + v; d.data[k + 1] = 233 + v; d.data[k + 2] = 214 + v * .9; d.data[k + 3] = 255; }

      x.globalCompositeOperation = 'screen'; x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'source-over';
      const g = x.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.1); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(200,180,150,.5)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
    buildLayers(); buildObjs(); faceStrokes = buildFace();
    R = rng(91); faceFix = [
      mk([[EYE[0] - 18, EYE[1]], [EYE[0] - 2, EYE[1] + 8], [EYE[0] + 16, EYE[1] + 4]], 4, '#4a3428', { a: .8, prof: 'brush', bristles: 1 }),                 // closed lid

      mk(smooth([[159, -2], [167, 4], [178, 1]], false, 4), 2.4, '#8a4a40', { a: .6, prof: 'even', bristles: 0 }),
