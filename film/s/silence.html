<script>
/* 10 400년 침묵 — Hopper-style realism (after the 1975 "One Flew Over the Cuckoo's Nest" sequence): a still one-point interior.

   and looks out of it, waiting. The low sun throws a hard-edged parallelogram of warm light across the floor.
   A  stillness: only the light, his breathing, the dust.
   B  time passes: the light swings across the floor day after day, the almond branch outside turns through the seasons,
      the room ages (cracks, fallen plaster, a stain), and the one who waits changes — generation after generation —
      while the years count to 400 (말라기 이후).
   C  dusk, then night: the room goes blue and still. Then, in under a second, a new star breaks into the window and its light

    for (const m of MOTES) { const wx = m.x + Math.sin(t * .17 + m.p) * .3, wy = m.y + Math.sin(t * .11 + m.p * 2) * .2, wz = m.z, l = (ZB - wz) / -d[2], qx = wx - d[0] * l, qy = wy - d[1] * l;
      if (!(qx > WIN.x0 && qx < WIN.x1 && qy > WIN.y0 && qy < WIN.y1)) continue; const p = P(wx, wy, wz); ctx.fillStyle = `rgba(255,240,206,${.5 * m.a * dk})`; ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(.8, .006 * p[2]), 0, 6.283); ctx.fill(); } ctx.restore(); }
  // the star's breaking in: an exposure bloom from the window, falling off (no flat flash)
  const burst = ss(T_STAR, T_STAR + .25, t) * (1 - ss(T_STAR + .3, T_STAR + 2.4, t)); if (burst > 0) { const wp = P(lerp(WIN.x0, WIN.x1, .3), lerp(WIN.y1, WIN.y0, .22), ZB + WIN.d), R = Math.max(W, H) * .8;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(wp[0], wp[1], 0, wp[0], wp[1], R); g.addColorStop(0, `rgba(255,240,210,${.7 * burst})`); g.addColorStop(.12, `rgba(255,214,160,${.3 * burst})`); g.addColorStop(1, 'rgba(255,200,140,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // the canvas: weave and grain; a soft vignette
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .22; ctx.drawImage(WEAVE, 0, 0); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .45, W / 2, H / 2, Math.hypot(W, H) * .6); vg.addColorStop(0, 'rgba(10,10,14,0)'); vg.addColorStop(1, `rgba(10,10,14,${.28 + .25 * S.night})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  words(ctx, t, S);
  const f = 1 - ss(0, 1.3, t) + ss(DUR - 1.4, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}
function words(ctx, t, S) {
  const dayInk = S.night < .5, ink = dayInk ? '#2f2e2a' : '#f3ead6', sh = dayInk ? 'rgba(250,244,228,.6)' : 'rgba(0,0,10,.85)';
  const lx = RTL() ? W - (V ? 80 : 110) : (V ? 80 : 110);
  text(ctx, '10  ·  400년 침묵', lx, V ? 190 : 120, { align: RTL() ? 'right' : 'left', size: 30, weight: 600, color: '#f6efe0', alpha: win(t, .6, 5.4, 1, 1), ls: 4, shadow: 'rgba(0,0,10,.75)', maxW: W * .7 });
  // narration, low in the frame like subtitles, on a soft dark band
  const st = { size: V ? 52 : 48, weight: 400, color: '#fbf3e2', shadow: 'rgba(0,0,0,.85)', shadowBlur: 16 }, ty = V ? H - 360 : H - 128;
  const band = (a, y, n) => { if (a <= 0) return; const g = ctx.createLinearGradient(0, y - 110, 0, y + 70 + (n - 1) * 80); g.addColorStop(0, 'rgba(8,8,12,0)'); g.addColorStop(.5, `rgba(8,8,12,${.38 * a})`); g.addColorStop(1, 'rgba(8,8,12,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - 110, W, 180 + (n - 1) * 80); };
  const a1 = win(t, 3.6, 9.2, 1.2, 1), a2 = win(t, 11.0, 16.6, 1.2, 1.1);
  band(Math.max(a1, a2), ty, 1);
  text(ctx, '선지자의 음성이 멈춘 400년', W / 2, ty, { ...st, alpha: a1 });
  text(ctx, '그러나 무대는 조용히 준비되었다.', W / 2, ty, { ...st, alpha: a2 });
  // the years: quiet, high in the frame, like a caption painted on the wall
  const ac = win(t, 7.6, 29.2, .9, 1.4), n = years(t), cy = P(0, 2.82, ZB)[1] + (V ? 20 : 14);
  if (ac > 0) { const nk = clamp((S.night - .3) / .5), col = rgb(mix([52, 50, 44], [244, 236, 216], nk)), shd = nk > .5 ? 'rgba(0,0,10,.8)' : 'rgba(255,250,236,.55)';
    text(ctx, '말라기 이후', W / 2, cy - (V ? 66 : 54), { size: V ? 24 : 22, font: "'Noto Sans KR',sans-serif", color: col, alpha: ac * .85, ls: 6, shadow: shd, shadowBlur: 8 });
    text(ctx, Pilot.trn('{n}년', n), W / 2, cy, { size: V ? 58 : 50, weight: 600, color: col, alpha: ac, ls: 4, shadow: shd, shadowBlur: 10 }); }
  const lh = V ? 78 : 74, a3 = win(t, 29.4, DUR - 1.0, 1.4, 1.2), y3 = V ? H - 400 : H - 196;
  band(a3, y3 + 30, 2);
  text(ctx, '“때가 차매 하나님이 그 아들을 보내사\n여자에게서 나게 하시고”', W / 2, y3, { ...st, weight: 600, size: V ? 52 : 50, alpha: a3, lh: lh / (V ? 52 : 50) });
  text(ctx, '갈라디아서 4:4 (개역개정)', W / 2, y3 + lh + 54, { size: V ? 25 : 23, font: "'Noto Sans KR',sans-serif", color: '#e6dcc6', alpha: a3 * .9, ls: 2, shadow: 'rgba(0,0,0,.85)' });
}

Pilot.run({ W, H, dur: DUR, audio: 'silence.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { buildRoom(); PC = canvas(W, H); pcx = PC.getContext('2d'); RC = canvas(W, H); RCX = RC.getContext('2d');
    // slight colour variation inside the planes: soft warm and cool patches
    TINT = canvas(W / 4, H / 4); { const x = TINT.getContext('2d'), w = W / 4, h = H / 4, d = x.createImageData(w, h);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const a = fbm(i * .02, j * .02, 3), b = fbm(i * .03 + 7, j * .03 + 3, 3), o = (j * w + i) * 4; d.data[o] = 128 + (a - .5) * 70; d.data[o + 1] = 128 + (a + b - 1) * 25; d.data[o + 2] = 128 + (b - .5) * 70; d.data[o + 3] = 255; } x.putImageData(d, 0, 0); }
    // brushwork: long dragged strokes with bristle streaks, mostly horizontal, 1/80 of the frame wide
    BRUSH = canvas(W / 2, H / 2); { const x = BRUSH.getContext('2d'), r = rng(29), bw = W / 80 / 2; x.fillStyle = '#808080'; x.fillRect(0, 0, W / 2, H / 2);
      for (let i = 0; i < 900; i++) { const px = r() * W / 2, py = r() * H / 2, l = 30 + r() * 140, a = (r() - .5) * .16, v = r() < .5 ? 160 : 96, wd = bw * (.5 + r());
        x.save(); x.translate(px, py); x.rotate(a); for (let k = 0; k < 6; k++) { x.fillStyle = `rgba(${v},${v},${v},${.05 + r() * .06})`; x.fillRect(r() * 8, (k / 6 - .5) * wd, l * (.6 + .4 * r()), wd / 6 * (.6 + r())); } x.restore(); } }
  },
  draw });
</script>
