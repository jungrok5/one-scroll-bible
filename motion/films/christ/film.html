<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그리스도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;700&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="../lib-link.js"></script>
<script src="kit-oilpaint.js"></script>
<script src="kit-world3d.js"></script>
<script src="kit-goldoil.js"></script>
<script src="kit-lamplit.js"></script>
<script src="oil-room.js"></script>
<script src="jordan3d.js"></script>
<script src="goldoil-title.js"></script>
<script src="lamp-scrolls.js"></script>
<script src="bw-cross.js"></script>
<script>
/* 그리스도 — '그리스도'는 성이 아니라 '기름 부음 받은 자', 그리고 고난받는 그리스도는 처음부터 성경이 가리킨 길이었다 (~2:56).
   Made like the first film (motion/films/README 7절): a camera moving through space, light as the main character, small people,
   restraint. Portrait (Shorts) first. One motif runs through every part: gold oil-light — a drop (1), poured on three heads (2),
   the last light of the sun on the rock (3), the lamp on the scroll and the one shaft over the cross (4), the Spirit on the river
   and the three lights meeting in one (5), the lamp of the village at Emmaus (6). Line ids = script.json.
   Scene modules (one look each): oil-room.js (Rembrandt room) · jordan3d.js (world3d river) · goldoil-title.js + kit-goldoil.js
   (new look: gold oil macro) · lamp-scrolls.js (lamplit scrolls) · bw-cross.js (black-and-white film).
   Text: derived from script.json at load (each line from its `at` to the next voiced line), so a retime (script-retime.mjs)
   moves the words with it; the voice (sound/place.json) will replace these times at the sound stage. */
const { clamp, lerp, ss, eo, eio, win, rng, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
const hasF = n => typeof window[n] === 'function';
const dark = (c, a) => { c.fillStyle = `rgba(6,5,8,${a})`; c.fillRect(0, 0, W, H); };
function textBand(ctx) { const y0 = Film.SAFE() - (V ? 150 : 70), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.45, 'rgba(10,8,10,.42)'); g.addColorStop(1, 'rgba(10,8,10,.55)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
// a scene not drawn yet (pilot: parts 1 and 4 first): a slow warm dark with a drifting light, never a frozen black frame
function todo(ctx, t) { const g = ctx.createRadialGradient(W * (.5 + .1 * Math.sin(t * .3)), H * .35, 0, W * .5, H * .35, Math.max(W, H) * .8);
  g.addColorStop(0, 'rgb(70,52,34)'); g.addColorStop(1, 'rgb(10,8,8)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
const sc = (fn, t0, ...a) => (c, t) => { if (hasF(fn)) window[fn](c, t - t0, ...a); else todo(c, t); textBand(c); };
// the timeline (film seconds = script.json `at`); scenes dissolve over their overlap (0.8 s, longer where the music turns)
const SCENES = [
  [0, 8.6, (c, t) => { sc('roomOil', 0, 'open')(c, t); textBand(c); }],   // N01 N02 — the candle, the old man from behind, the open Bible (the bright pages sit under the words: a double band)
  [7.6, 15.0, sc('jordanScene', 7.6)],             // P1 Q1 — the Jordan, late afternoon: Andrew to his brother
  [14.1, 24.0, sc('goldTitle', 14.1)],             // N03 T1 — one drop of gold oil, the title
  [23.2, 79.9, todo],                              // parts 2–3 (next round)
  [79.1, 88.4, sc('scrollScene', 79.8, 'isaiah')], // P4 Q4 — 700 years before: the lamp, the scroll
  [87.4, 98.3, sc('bwCross', 87.6)],               // N11 Q5 — the cry from the cross (black-and-white film)
  [96.9, 114.8, sc('scrollScene', 96.9, 'psalm')], // N12 P5 Q6 Q7 — the ember crosses to the psalm of David (in before the cross has sunk to one point: no black dip)
  [113.8, 120.9, sc('bwSoldiers', 114.0)],         // L4 N14 — at the foot of the cross, the lots
  [120.1, 177, todo],                              // parts 5–6 (next round)
];
// text: every line from its `at` to the next voiced line (quotes hold until then; a caption label rides with its quote)
let TEXT = [];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01), endAt = Math.max(...L.map(l => l.at));
  for (const l of L) {
    if (l.id === 'B1') continue;
    if (l.id === 'E1') { TEXT.push(['end', 'E1', l.at, Film.script.dur]); continue; }
    if (l.id === 'T1') { TEXT.push(['title', 'T1', l.at, (next(l)?.at ?? l.at + 3) - .2]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? endAt) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = (n?.at ?? endAt) - (l.kind === 'quote' ? .1 : .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]);
  }
}
const QB = () => ({ bottom: Film.subBottom() + 40 });
function title(ctx, id, t, a, b) { const ta = win(t, a, b, .9, .6); if (ta <= 0) return; const sz = V ? 104 : 112, ty = V ? H * .33 : H * .3;   /* above the spreading oil (gold on gold at .45) */
  { const g = ctx.createRadialGradient(W / 2, ty - sz * .3, 0, W / 2, ty - sz * .3, sz * 3); g.addColorStop(0, `rgba(12,8,4,${.45 * ta})`); g.addColorStop(1, 'rgba(12,8,4,0)'); ctx.fillStyle = g; ctx.fillRect(0, ty - sz * 3.3, W, sz * 6); }
  Pilot.text(ctx, Film.text(id), W / 2, ty, { size: sz, weight: 600, color: '#e9c77a', alpha: ta, shadow: 'rgba(233,185,73,.35)', shadowBlur: 40, ls: 10 });
  const lw = (V ? 380 : 480) * eo(clamp((t - a - .3) / 1.6)); ctx.fillStyle = `rgba(233,199,122,${ta * .8})`; ctx.fillRect(W / 2 - lw / 2, ty + (V ? 52 : 56), lw, 2); }
function endCard(ctx, t, a, b) {   /* one place to read: a small gold 뒷이야기, then the chapter, large (as 「메시아」) */
  const k = win(t, a, b, 1, .8); if (k <= 0) return; const [kick, where] = Film.text('E1').split(/\s*·\s*/), size = V ? 50 : 44, y0 = H * .3;
  dark(ctx, .55 * k);
  Pilot.text(ctx, kick, W / 2, y0, { size: size * .8, weight: 600, font: "'Noto Serif KR',serif", color: '#e9c77a', alpha: k, shadow: 'rgba(0,0,0,.9)', shadowBlur: 18, ls: 8 });
  Pilot.text(ctx, where || '', W / 2, y0 + size * 2.0, { size: size * 1.7, weight: 600, font: "'Noto Serif KR',serif", color: '#f6ead0', alpha: k * ss(a + .5, a + 1.3, t), shadow: 'rgba(233,185,73,.35)', shadowBlur: 36 });
  const lw = (V ? 360 : 440) * eo(clamp((t - a - 1.0) / 1.4)); ctx.fillStyle = `rgba(233,199,122,${k * .8})`; ctx.fillRect(W / 2 - lw / 2, y0 + size * 3.3, lw, 2);
  Pilot.text(ctx, Film.text('B1'), W / 2, y0 + size * 4.4, { size: size * .66, font: "'Noto Sans KR',sans-serif", color: '#e2d2a8', shadow: 'rgba(0,0,0,.9)', shadowBlur: 14, alpha: k * ss(a + 1.8, a + 2.6, t), ls: 2 }); }
const FILM_DUR = 176;
const QA_HOLD = [[170.7, 176.0, 'the end card (뒷이야기 · 누가복음 24장)']];
const QA_PLANNED = [[87.4, 88.4, 'black-and-white film starts: gate flicker'], [97.6, 98.2, 'the ember lights the lamp on the psalm scroll']];
let XL = null;
function draw(ctx, t) {
  const act = SCENES.filter(([a, b]) => t >= a && t < b);
  act.forEach(([a, b, f], j) => {
    if (j === 0) { ctx.save(); f(ctx, t); ctx.restore(); return; }
    if (!XL) { XL = canvas(W, H); XL.g = XL.getContext('2d'); }
    const L = XL.g; L.setTransform(1, 0, 0, 1, 0, 0); L.globalAlpha = 1; L.globalCompositeOperation = 'source-over'; L.fillStyle = '#000'; L.fillRect(0, 0, W, H); L.save(); f(L, t); L.restore();   /* opaque: jordan3d.js reflects what is already on its canvas */
    const pb = act[j - 1][1]; ctx.save(); ctx.globalAlpha = eio(clamp((t - a) / Math.max(.2, pb - a))); ctx.drawImage(XL, 0, 0); ctx.restore(); });
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'title') title(ctx, id, t, a, b);
    else if (kind === 'end') endCard(ctx, t, a, b);
    else if (kind === 'quote') Film.quote(ctx, id, t, a, b, { ...QB(), hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: FILM_DUR, fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    for (const b of ['buildRoomOil', 'buildJordan', 'buildGoldoil', 'buildScrolls', 'buildBW']) if (hasF(b)) await window[b](); }, draw });
</script>
</body>
</html>
