<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>십자가 그림자 · 무덤 안 새벽 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="kit-oilpaint.js"></script>
<script src="dawn-impasto.js"></script>
<script>
/* 시안: 「그리스도」 5부 — 땅에 드리운 십자가 그림자 하나(tree 5.1초, 영상 135.0–140.1, Q11) → 무덤 안에서 밖을 봄, 새벽빛이 쏟아져
   세마포를 비춤(tomb 9.4초, 영상 139.5–148.9, Q12 + N15). film.html의 글자 띠(textBand)도 흉내 냄.
   node motion/render.mjs v --page films/christ/sample-dawn.html --stills 0.5,2.5,4.8,5.6,6.5,8,10,13.5 */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
function textBand(ctx) { const y0 = (V ? H * .64 : H - 270) - (V ? 150 : 70), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.45, 'rgba(10,8,10,.42)'); g.addColorStop(1, 'rgba(10,8,10,.55)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
function draw(ctx, t) { if (t < 5.1) dawnOil(ctx, t, 'tree'); else dawnOil(ctx, t - 5.1, 'tomb'); textBand(ctx); }
Pilot.run({ W, H, dur: 14.5, fonts: ["600 40px 'Noto Serif KR'"], init: async () => { await buildDawn(); }, draw });
</script>
</body>
</html>
