<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>새벽 임파스토 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="kit-oilpaint.js"></script>
<script src="dawn-impasto.js"></script>
<script>
/* 시안: 「그리스도」 5부 — 흑백이 새벽빛으로 다시 칠해짐(tomb 5.2초, 영상 120.1–125.3) → 바위 아래 다시 선 베드로(peter 4.2초, 125.3–129.5)
   → 나무 그림자가 물러나고 빈 무덤에 새벽빛(tree 6.7초, 136.0–142.7).
   node motion/render.mjs v --page films/christ/sample-dawn.html --stills 0.3,2.5,5,7.5,9.2,10.5,13,15.8 */
const W = Pilot.W, H = Pilot.H;
function draw(ctx, t) { if (t < 5.2) dawnOil(ctx, t, 'tomb'); else if (t < 9.4) dawnOil(ctx, t - 5.2, 'peter'); else dawnOil(ctx, t - 9.4, 'tree'); }
Pilot.run({ W, H, dur: 16.1, fonts: ["600 40px 'Noto Serif KR'"], init: async () => { await buildDawn(); }, draw });
</script>
</body>
</html>
