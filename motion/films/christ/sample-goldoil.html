/* 시안: 「그리스도」 새 화풍 goldoil — 제목 장면 9.5초(N03 → T1) + 2부 맛보기 3초(뿔병 → 역광 실루엣).
   node motion/render.mjs v --page films/christ/sample-goldoil.html --stills 1,3,4,5.5,8,9.4,11 */
const W = Pilot.W, H = Pilot.H;
function draw(ctx, t) { if (t < 9.5) goldTitle(ctx, t); else goldTease(ctx, t - 9.5); }
Pilot.run({ W, H, dur: 12.5, fonts: ["600 40px 'Noto Serif KR'"], draw });
