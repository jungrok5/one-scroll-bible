<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빛의 골짜기 유화 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script>
/* 「kingdom」 2부 시안 A2 (2026-11-19): 시안 A(concept-valley3d.html)를 관리자의 oil-paint-world 스킬로 다시 그림 — valley-oil.js (kit-oilpaint-world/, 스킬 lib 복사본).
   잎·풀·구름·돌·옷자락이 모두 세상에 꽂힌 붓 터치, 세 가지 섞은 물감, 붓 자국 요철·캔버스 결·바니시. 햇빛 = 왕의 다스림. 마을 S1(heal-village.js)로 넘기는 건 A와 같음.
   필름 시간 110.0(C2a) → 237.6(C2) = 시안 u 0 → 127.6. 1블록 110–142.3(구름 위의 빛 → 구름을 뚫고 금빛 골짜기 → 빛 속의 사람이 돌아서 걸어 나감 →
   구름이 덮이고 땅이 잿빛, 잎이 지고 무덤, 비 → 지평선에 햇살 한 줄기 → 흰빛 → 3D 마을 S1), 2블록 215.7–237.6(구름이 갈라지고 빛이 땅을 쓸며
   초록이 돌아옴 → 사람이 빛으로 돌아섬 → 카메라가 물러나며 오름). 152–215.7은 비움(검정). 자막은 sample-part2.html과 같은 규칙.
   node motion/render.mjs v --page films/kingdom/concept-valley2.html --stills 2,10,18,30,120
   node motion/render.mjs v --page films/kingdom/concept-valley2.html --from 16 --to 33.5  (낙원 상실 + 마을)   · --from 105.7 --to 127.6 (회복) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 110.0, T1 = 237.6;
let VL = null, VIL = null, B = null, TEXT = [], aux = null, auxx = null;
const SCENES = [
  [110.0, 142.8, 'valley'],    // C2a–N43: above the cloud → the gold valley → the man turns away → grey, rain → one shaft on the horizon → white
  [142.3, 152.0, 'village'],   // N43: heal-village.js S1 (in from white)
  [215.7, 237.6, 'valley'],    // L43–N47: the cloud parts, the light sweeps the land, green returns; he turns back; crane up
];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['C2a', 'N40', 'L40', 'Q40', 'N41', 'N42', 'N43', 'N44', 'L41', 'Q41', 'N45', 'L42', 'Q42', 'N45b', 'N46', 'L42b', 'Q43', 'N46b', 'N46c', 'L43', 'Q44', 'N47', 'C2'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C2a') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function label(ctx, id, t, a, b) { const txt = Film.text(id); ctx.save(); ctx.font = `600 ${V ? 38 : 34}px 'Noto Serif KR'`; ctx.letterSpacing = '4px'; const w = ctx.measureText(txt).width; ctx.restore();
  return Film.label(ctx, id, t, a, b);   // lib-film draws, shrinks to fit and keeps it legible (2026-11-20)
  const k = win(t, a, b, .8, .8); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, txt, W / 2, V ? 226 : 66, { size: (V ? 38 : 34) * W * .88 / w, weight: 600, color: '#e9c77a', alpha: k * .95, ls: 3, shadow: 'rgba(0,0,0,.9)', shadowBlur: 14 }); }
function scene(ctx, t, name) {
  if (name === 'valley') { if (VL) return VL.draw(ctx, t, B); ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'village') { if (VIL) return VIL.draw(ctx, t, B); ctx.fillStyle = '#fff4de'; ctx.fillRect(0, 0, W, H); return; }
}
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b);
  if (!on.length) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  ctx.save(); scene(ctx, t, on[0][2]); ctx.restore();
  if (on.length > 1) {   // a dissolve over the overlap of the two scenes
    const [a, , name] = on[1], k = ss(a, on[0][1], t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  band(ctx, .85);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d');
    VL = await (await import('./valley-oil.js')).build(W, H); window.__VL = VL;
    try { VIL = await (await import('./heal-village.js')).build(W, H); window.__VIL = VIL; } catch (e) { console.warn('village not built', e); } }, draw });
</script>
</body>
</html>
