<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>왕이 돌아오셨다 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-oilpaint.js"></script>
<script src="ink-garden.js"></script>
<script>
/* 시안 2차: 「kingdom」 2부 「왕이 돌아오셨다」 — 화선지 동산(수묵·공필, 짧게: N43에서 금빛 점이 마을의 해로) → 3D 갈릴리 마을
   (N43부터 왕이 길을 걸음 · 치유가 숨 쉬게 3.5 s씩, 부드러운 디졸브) → 3D 카라바조 방(지붕 틈 · 세리의 식탁: 단단한 빛줄기 하나, 유화 패스)
   → 다시 화선지(Q44에서 같은 먹이 거꾸로 물러남). 관리자 1차 피드백(2026-11-19) 반영. 필름 시간 110.0(C2a) → 237.6(C2 「사람들이 기다린 나라」) = 시안 u 0 → 127.6.
   그림의 모든 시각은 script.json의 at에서 나온다(각 모듈의 beats()). 자막은 본 영상이 얹는 자리를 보려고 시안에서만 얹음
   (sample-veil.html과 같은 규칙).
   node motion/render.mjs v --page films/kingdom/sample-part2.html                 (→ motion/out/sample-part2-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part2.html --stills 2,8,14   (u seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 110.0, T1 = 237.6;
let INKG = null, VIL = null, ROOM = null, B = null, TEXT = [], aux = null, auxx = null;
// the scene table (film seconds): [a, b, name] — overlaps are dissolves; a cut is where one ends and the next begins
const SCENES = [
  [110.0, 142.8, 'ink'],       // C2a–N43: the garden paints itself, turns, floods; the gold point grows into the sun (white 141–142.5)
  [142.3, 170.2, 'village'],   // N43–Q41: the King walks the road; the healings; the light from above (white match cut at N45)
  [169.9, 216.5, 'room'],      // N45–N46c: the roof opened, the stretcher; the tax collector's table; the push (dissolve 215.7–216.5)
  [215.7, 237.6, 'ink'],       // Q44–N47: back on the paper — the same ink recedes; the grain of light again (hard cut at C2)
];
// the dark band under the words (sample-veil.html); on the paper it is lighter (k) — the painting's own foreground ink is dark there
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['C2a', 'N40', 'L40', 'Q40', 'N41', 'N42', 'N43', 'N44', 'L41', 'Q41', 'N45', 'L42', 'Q42', 'N45b', 'N46', 'L42b', 'Q43', 'N46b', 'N46c', 'L43', 'Q44', 'N47', 'C2'];
// text: every line from its `at` to the next voiced line (as sample-veil.html); a label rides with its quote. C2a is the chapter title.
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C2a') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
// the chapter title: small serif, light on the toned sky above the ranges (as the narration: light words, dark shadow)
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
// a section label (Film.label), shrunk to fit when its text is wider than the frame (L43 is long: 「마태복음 12장 · 귀신 들려 …」)
function label(ctx, id, t, a, b) { const txt = Film.text(id); ctx.save(); ctx.font = `600 ${V ? 38 : 34}px 'Noto Serif KR'`; ctx.letterSpacing = '4px'; const w = ctx.measureText(txt).width; ctx.restore();
  if (w <= W * .88) return Film.label(ctx, id, t, a, b);
  const k = win(t, a, b, .8, .8); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, txt, W / 2, V ? 226 : 66, { size: (V ? 38 : 34) * W * .88 / w, weight: 600, color: '#e9c77a', alpha: k * .95, ls: 3, shadow: 'rgba(0,0,0,.9)', shadowBlur: 14 }); }
function scene(ctx, t, name) {
  if (name === 'ink') return INKG.draw(ctx, t, B);
  if (name === 'village') { if (VIL) return VIL.draw(ctx, t, B); ctx.fillStyle = '#b89a70'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'room') { if (ROOM) return ROOM.draw(ctx, t, B); ctx.fillStyle = '#2a1a10'; ctx.fillRect(0, 0, W, H); return; }
}
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b);
  ctx.save(); scene(ctx, t, on[0][2]); ctx.restore();
  if (on.length > 1) {   // a dissolve: the later scene over the earlier one, through an offscreen frame
    const [a, b, name] = on[1], k = ss(a, b, t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  const BK = { ink: .85, village: 1, room: .72 }, last = on[on.length - 1], bk = on.length > 1 ? Pilot.lerp(BK[on[0][2]], BK[last[2]], ss(last[0], last[1], t)) : BK[on[0][2]];
  band(ctx, bk);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d');
    INKG = InkGarden.build(W, H);
    try { VIL = await (await import('./heal-village.js')).build(W, H); window.__VIL = VIL; } catch (e) { console.warn('village not built', e); }
    try { ROOM = await (await import('./roof-table-3d.js')).build(W, H); window.__ROOM = ROOM; } catch (e) { console.warn('room not built', e); } }, draw });
</script>
</body>
</html>
