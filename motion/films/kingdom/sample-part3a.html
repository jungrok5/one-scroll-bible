<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사람들이 기다린 나라 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script>
/* 시안 1차 (2026-11-19): 「kingdom」 3부 「사람들이 기다린 나라」 첫 블록 — 필름 237.6(C2) → 288.3(N14, 빌라도의 관정 앞에서 끝).
   한 세계 · 한 엔진(crowd-evening3d.js: 2부 마을과 같은 lib3d cine.js + people3d.js), 세 샷 · 샷 사이는 분명히 다른 구도의 컷:
     column  C2–N11   망원 tracking — 아지랑이 속 로마 창 행렬, 큰 낮은 해 → 줌아웃 + pedestal up으로 언덕 위 무리(뒷모습)가 드러남
                      → N11 무리가 길 위 병사들을 내려다봄(고개가 차례로 따라감 · 손가락질의 물결 · 지팡이 · 아이를 끌어당기는 어머니)
     field    N12–Q4b FPV 저공으로 무리 위(바구니가 손에서 손으로, 두 손이 테두리에) → N12c 일어남의 물결 · 15° 오빗 · handheld 0.5
                      → L4/Q4 무리가 그에게 몰려듦, 그는 등을 보인 채 무리에게서 걸어 나감
     mountain Q4b–end 걷는 속도로 그를 뒤따라 언덕 끝을 오름(지평선에 눌린 해, 긴 그림자가 카메라 쪽으로) → N13 dolly out, 밤 · 별 ·
                      아래 들판의 불빛 → 도레 판화 선이 새겨짐(mountain-dore.js)
   시안 2차 (2026-11-19, 관리자 "네 말대로 진행해" — 세 가지만 고치고 나머지는 그대로):
     column   C2–N10 망원 2.7°(「아라비아의 로렌스」 장초점 압축 · 아지랑이): 행렬이 화면의 띠를 채움 — 볏 달린 투구, 직사각 방패(쇠테가 역광에
              빛남), 저마다의 박자로 반짝이는 창끝, 독수리 · 원반 · 깃발 군기, 발에서 이는 먼지, 발 맞춘 행진 → 같은 카메라의 줌아웃으로
              언덕 위 무리가 드러남(초점거리 로그 등속 · sine 가속, 조준은 화면이 넓어진 뒤에야 행렬을 떠남 — 점프 없음)
     baskets  N12 앞 4.6초(새 샷): 앉은 무리의 호(arc) — 바구니가 손에서 손으로(두 손이 테두리에, 받는 손이 먼저 쥐고 주는 손이 놓음,
              넘기는 순간마다 감속), 뒤로 다섯 무리가 저마다 바구니를 돌림(규모) → 넘김이 끝나는 순간 FPV로 컷
     mountain 그를 17 m 뒤에서 따름(화면 높이 ≈ 12 %) · 멈추는 순간부터 47 m까지 dolly out · 불빛 30개
   그림의 모든 시각은 script.json의 at에서 나온다(crowd-evening3d.js beats()). Q4b = 인용 둘째 조각("다시 혼자 산으로…")이 화면에 오는 시각.
   node motion/render.mjs v --page films/kingdom/sample-part3a.html                       (→ motion/out/sample-part3a-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part3a.html --stills 2,8,14         (u seconds = film − 237.6) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 237.6, T1 = 288.3;
let CE = null, ENG = null, B = null, TEXT = [];
// the scene table (film seconds): [a, b, name] — one 3D world; the joins are hard cuts between clearly different framings
const SCENES = [
  [237.6, 256.0, 'column'],    // C2–N11: the legion through a long lens (heat shimmer, dust) → zoom out to the crowd on the hill looking down at it
  [256.0, 260.6, 'baskets'],   // N12: seated groups passing baskets hand to hand (round 2)
  [260.6, 277.7, 'field'],     // N12–Q4b: FPV to him; they rise and press in toward him (Q4b from the quote's pieces)
  [277.7, 288.3, 'mountain'],  // Q4b–N14: alone up the hill; night, stars, the fires below; the Doré engraving
];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['C2', 'N10', 'N11', 'N12', 'N12c', 'L4', 'Q4', 'N13', 'N14'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C2') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function label(ctx, id, t, a, b) { const txt = Film.text(id); ctx.save(); ctx.font = `600 ${V ? 38 : 34}px 'Noto Serif KR'`; ctx.letterSpacing = '4px'; const w = ctx.measureText(txt).width; ctx.restore();
  if (w <= W * .88) return Film.label(ctx, id, t, a, b);
  const k = win(t, a, b, .8, .8); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, txt, W / 2, V ? 226 : 66, { size: (V ? 38 : 34) * W * .88 / w, weight: 600, color: '#e9c77a', alpha: k * .95, ls: 3, shadow: 'rgba(0,0,0,.9)', shadowBlur: 14 }); }
function draw(ctx, u) {
  const t = T0 + u;
  ctx.save(); if (CE) CE.draw(ctx, t); else { ctx.fillStyle = '#b08a60'; ctx.fillRect(0, 0, W, H); } ctx.restore();
  let ek = 0;
  if (CE && ENG) { const Tb = CE.beats(); ek = ss(Tb.etch[0] - .05, Tb.etch[0] + .05, t); if (ek > 0) { const m = CE.marks(); ENG.draw(ctx, 1, { t, t0: Tb.etch[0], xs: m.xs, hy: m.hy }); } }
  band(ctx, 1 - .35 * ek);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at])); B.END = B.N14;
    const q = TEXT.find(r => r[1] === 'Q4'), pcs = Film.pieces(Film.text('Q4'), q[2], q[3]); B.Q4b = pcs[1] ? pcs[1][1] : q[2] + (q[3] - q[2]) * .6;
    window.__B = B;
    CE = await (await import('./crowd-evening3d.js')).build(W, H, B); window.__CE = CE;
    ENG = (await import('./mountain-dore.js')).makeEngraver(W, H); }, draw });
</script>
</body>
</html>
