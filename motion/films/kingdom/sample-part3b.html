<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빌라도 앞에서 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-oilpaint.js"></script>
<script>
/* 시안 2차 (2026-11-20, 조정자 피드백: 끝의 하늘 tilt 삭제 · 벽의 푸른 얼룩 · 병사를 어둠 속으로 · 밝기 ≥ 78) ← 1차 (2026-11-20): 「kingdom」 3부 block 4b-1 — 필름 288.3(N14) → 317.1(C3, 다음 블록 sample-part4a.html의 성벽) = 시안 u 0 → 28.8.
   렘브란트 키 유화(rembrandt-praetorium.js): 높은 창의 새벽빛 + 화로 하나, 고정 카메라에 벽의 큰 그림자가 움직임.
     N14      동트기 전 푸른 빛줄기, 화로가 높은 자리(재판석 · 의자 · 총독)의 그림자를 벽 위로 크게 — 그 앞에 묶인 손의 작은 사람(뒷모습).
              둘째 조각에서 총독이 몸을 앞으로 기울이고 손을 듦 → 그림자가 그 사람 위로 덮쳐 오름
     L5       rack focus 1초: 벽의 높은 자리 그림자 → 묶인 손
     Q5       해가 산을 넘음: 빛줄기가 푸름 → 금빛으로 밝아지며 묶인 사람에게로 내려옴, 총독이 물러앉아 그림자가 작아짐
     N14b     화로가 사그라듦(높은 자리 그림자가 흐려짐) → 「칼과 군대로」에서 병사 곁 횃불이 꺼지며 창 그림자가 흐려져 사라짐
              → (2차) 하늘로 올리지 않음: 새벽빛이 묶인 사람 위에 내려앉고 방은 따뜻한 어둠으로 → 고요한 박자에 317.1 컷, 4a의 아침 성벽
   그림의 모든 시각은 script.json의 at(과 '/' 조각이 화면에 오는 시각)에서 나온다(rembrandt-praetorium.js beats()). 자막은 sample-part2.html과 같은 규칙.
   node motion/render.mjs v --page films/kingdom/sample-part3b.html                 (→ motion/out/sample-part3b-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part3b.html --stills 2,8,14   (u seconds = film − 288.3) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 288.3, T1 = 317.1;
let PR = null, B = null, TEXT = [];
// the scene table (film seconds): [a, b, name] — one locked-off shot (the light and the shadow move), then the tilt to the sky
const SCENES = [
  [288.3, 317.1, 'praetorium'],   // N14–N14b: the hall at dawn; rack focus at L5; the dawn swings onto him at Q5; it settles on him at the end
];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['N14', 'L5', 'Q5', 'N14b'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
// the times each '/' piece of a line comes on screen (the split Film.sub / Film.quote use) — the pictures' beats follow them
function pieceTimes() { const pc = {}; for (const [kind, id, a, b] of TEXT) if (kind === 'sub' || kind === 'quote') pc[id] = Film.pieces(Film.text(id), a, b).map(p => p[1]); return pc; }
function draw(ctx, u) {
  const t = T0 + u;
  ctx.save(); if (PR) PR.draw(ctx, t, B); else { ctx.fillStyle = '#2a1a10'; ctx.fillRect(0, 0, W, H); } ctx.restore();
  band(ctx, .42);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at])); B.END = T1; B.pc = pieceTimes(); window.__B = B;
    PR = await (await import('./rembrandt-praetorium.js')).build(W, H); window.__PR = PR; }, draw });
</script>
</body>
</html>
