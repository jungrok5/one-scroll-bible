<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>겨자씨와 보화 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-puppet.js"></script>
<script>
/* 시안 1차 (2026-11-20): 「kingdom」 4부 「겨자씨와 보화」 앞 — 필름 317.1(C3) → 390.7(N20 「그러면 그 나라에는 누가 들어갈까요?」, 다음 블록) = 시안 u 0 → 73.6.
   새 화풍: 등잔 뒤 천막의 그림자 인형극(motion-skills canvas-film kits/puppet + shadowstage 인형 관절) → 3D 나무로 현상(cinematic-3d).
     C3 · N16   성벽(3D 헤롯 돌, 아침 그늘) — 장 제목, 시선이 돌 켜를 따라 올라가 흉벽을 넘어 구름 사이 빛으로 (dawn-wall3d.js)
     N17        빛과 빛을 맞춘 0.8초 디졸브 → 천막의 등잔불, 아이리스 0.5초(막이 열림) → 장난감 극장(금빛 테, 앞의 등잔들) → 빈 밭
     Q7 · Q8    관절 가죽 손이 씨 하나를 집어 심음 — 씨만 빛남 → 씨로 밀기 → 싹 → 나무가 천막을 채움(같은 3D 나무를 가죽으로) → 새들이 와서 앉음
     N18        천막 뒤 빛이 차오르고 그림자가 줄기에서부터 3D 나무로 현상 → 하나의 카메라가 tilt up + crane up 6초, 가지 사이로
     N18b       가지마다 작은 등잔불이 하나씩 — 먼저 몇 개(갈릴리 어부 몇 사람), 그다음 온 나무로; 해가 지고 (tree3d-mustard.js)
     Q9 · N19   빛과 빛 디졸브 → 다시 천막: 소와 쟁기, 상자에 걸리는 쟁기, 금빛, 덮고, 기뻐 달려 집으로, 짐을 내주고, 밭 앞에 섬
                N19 가죽 구멍으로 새는 금빛에 push-in → 등잔이 따뜻해지며 극장으로 물러남 (puppet-tent.js)
   그림의 모든 시각은 script.json의 at에서 나온다(각 모듈의 beats()). 자막은 sample-part2.html과 같은 규칙.
   node motion/render.mjs v --page films/kingdom/sample-part4a.html                 (→ motion/out/sample-part4a-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part4a.html --stills 2,8,14   (u seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 317.1, T1 = 390.7;
let WALL = null, TR = null, PT = null, B = null, TEXT = [], aux = null, auxx = null;
// the scene table (film seconds): [a, b, name] — overlaps are dissolves; a cut is where one ends and the next begins
const SCENES = [
  [317.1, 327.3, 'wall'],      // C3–N16: the chapter title on the wall; the eye rises past the parapet to the light in the clouds
  [326.5, 352.2, 'tent'],      // N17–Q8: light to light (0.8 s dissolve) → the iris (0.5 s) → the toy theatre → the hand, the seed, the tree, the birds
  [352.2, 353.7, 'develop'],   // N18: the shadow develops into the 3D tree from the trunk outward (the camera already moving)
  [353.7, 365.9, 'tree'],      // N18–N18b: tilt up + crane up through the branches; the lamps light one by one
  [365.9, 390.7, 'tent'],      // Q9–N19: light to light (0.8 s dissolve inside the module) → the plough, the treasure, the joy
];
// the dark band under the words (sample-veil.html)
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['C3', 'N16', 'N17', 'Q7', 'Q8', 'N18', 'N18b', 'Q9', 'N19', 'N20'];
// text: every line from its `at` to the next voiced line (as sample-part2.html); C3 is the chapter title
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C3') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
// the times each '/' piece of a line comes on screen (the same split Film.sub / Film.quote use) — the pictures' beats follow them
function pieceTimes() { const pc = {}; for (const [kind, id, a, b] of TEXT) if (kind === 'sub' || kind === 'quote') pc[id] = Film.pieces(Film.text(id), a, b).map(p => p[1]); return pc; }
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function scene(ctx, t, name) {
  if (name === 'wall') { if (WALL) return WALL.draw(ctx, t, B); ctx.fillStyle = '#8a8070'; ctx.fillRect(0, 0, W, H); return; }
  if (PT) return PT.draw(ctx, t, B); ctx.fillStyle = '#3a2412'; ctx.fillRect(0, 0, W, H);
}
const BK = { wall: .85, tent: 1, develop: .9, tree: .8 };
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b);
  if (!on.length) on.push(SCENES[SCENES.length - 1]);
  ctx.save(); scene(ctx, t, on[0][2]); ctx.restore();
  if (on.length > 1 && on[0][2] === 'wall') {   // the one page-level dissolve: wall → tent (the module carries its own joins)
    const [a, , name] = on[1], k = ss(a, on[0][1], t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  const last = on[on.length - 1], bk = on.length > 1 ? Pilot.lerp(BK[on[0][2]], BK[last[2]], ss(last[0], on[0][1], t)) : BK[on[0][2]];
  band(ctx, bk);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at])); B.pc = pieceTimes(); window.__B = B;
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d');
    WALL = await (await import('./dawn-wall3d.js')).build(W, H); window.__WALL = WALL;
    TR = await (await import('./tree3d-mustard.js')).build(W, H); window.__TR = TR;
    PT = await (await import('./puppet-tent.js')).build(W, H, TR); window.__PT = PT; }, draw });
</script>
</body>
</html>
