<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빈손과 목판 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-woodcut-road.js"></script>
<script>
/* 시안 1차 (2026-11-20): 「kingdom」 4부 끝 ~ 5부 앞, block 4b-2 — 필름 390.7(N20) → 482.8(N23c, 다음 블록 sample-part5c.html의 목탄 언덕) = 시안 u 0 → 92.1.
   (a) 소프트 파스텔 · 노을(pastel-children.js, 3D + 파스텔 패스) 390.7–434.7
     road    N20       아이 눈높이 tracking: 부모 손을 잡고 노을 쪽으로 걷는 가족들(제각각의 보폭, 손잡은 손은 한 점에) → 「제자들이 꾸짖었습니다」
                       네 사람이 길로 들어서 팔을 벌려 막음(엇갈려) → 가족들이 하나씩 천천히 멈춤
     gather  N20b–Q10  망원으로 지는 해 쪽: 길 위의 한 사람이 그들 쪽으로 돌아섬, 곁의 해가 번짐(멀리, 작게, 역광 — 얼굴 없음) → Q10 막던 팔이
                       차례로 내려가며 비켜서고, 아이들이 그 곁으로 달려가 모임(그는 무릎 꿇어 아이 높이로)
     hands   N21–N21b  그가 있던 자리에서 본 여자아이(역광 실루엣): 내민 빈 두 손에 push-in 3초 → 손바닥에 빛이 고이고 차오름, 카메라는 천천히 곁으로 돎
   (b) 목판화(woodcut-road.js, canvas-film kits/woodcut) 434.7–482.8 — 손금의 결이 칼자국으로(match cut)
     carve   C4–N22    검은 판에 칼끝이 하늘을 파내며 언덕이 드러남(장 제목) → crane down, 칼끝이 지나간 자리로 빛이 드러나는 세로 길
     ask     N22c–Q10a 목판에 새겨진 두 사람(두건)이 걸어가는 한 사람 곁으로 다가가 몸을 낮춤 → 「우편에」 한 사람이, 「좌편에」 다른 사람이 손으로 가리킴
     climb   N22d–N22e crane up, 칼끝이 언덕으로 오르는 길을 새김 → Q11 dolly out 5초: 언덕을 오르는 작은 한 사람, 그 뒤로 많은 사람들의 그림자가
                       한 줄로 이어짐 → 482.8 다음 블록의 목탄 언덕과 같은 능선 · 같은 자리(match cut, 재질만 바뀜)
   그림의 모든 시각은 script.json의 at(과 '/' 조각이 화면에 오는 시각)에서 나온다(각 모듈의 beats()). 자막은 sample-part2.html과 같은 규칙.
   node motion/render.mjs v --page films/kingdom/sample-part5a.html                 (→ motion/out/sample-part5a-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part5a.html --stills 2,8,14   (u seconds = film − 390.7) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 390.7, T1 = 482.8;
let PC = null, WD = null, B = null, TEXT = [];
// the scene table (film seconds): [a, b, name] — a cut is where one ends and the next begins (each module carries its own shots)
const SCENES = [
  [390.7, 400.0, 'pastel'],    // N20: tracking with the families at a child's eye height; the men step in and block (S1 road)
  [400.0, 418.3, 'pastel'],    // N20b–Q10: down the long lens into the low sun — He turns to them; the arms come down, the children run to Him (S2 gather)
  [418.3, 434.7, 'pastel'],    // N21–N21b: push-in on the open hands; the light fills them (S3 hands)
  [434.7, 482.8, 'woodcut'],   // C4–N22e: the knife carves the road (crane down), the two who ask, the hill and the many (dolly out)
];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['N20', 'N20b', 'L6', 'Q10', 'N21', 'N21b', 'C4', 'N22', 'N22c', 'L7a', 'Q10a', 'N22d', 'Q11', 'N22e'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C4') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function pieceTimes() { const pc = {}; for (const [kind, id, a, b] of TEXT) if (kind === 'sub' || kind === 'quote') pc[id] = Film.pieces(Film.text(id), a, b).map(p => p[1]); return pc; }
// the chapter title (as sample-part2.html): small serif, light, over the uncarved wood at the top of the block
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function label(ctx, id, t, a, b) { const txt = Film.text(id); ctx.save(); ctx.font = `600 ${V ? 38 : 34}px 'Noto Serif KR'`; ctx.letterSpacing = '4px'; const w = ctx.measureText(txt).width; ctx.restore();
  return Film.label(ctx, id, t, a, b);   // lib-film draws, shrinks to fit and keeps it legible (2026-11-20)
  const k = win(t, a, b, .8, .8); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, txt, W / 2, V ? 226 : 66, { size: (V ? 38 : 34) * W * .88 / w, weight: 600, color: '#e9c77a', alpha: k * .95, ls: 3, shadow: 'rgba(0,0,0,.9)', shadowBlur: 14 }); }
const BK = { pastel: .9, woodcut: .55 };
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b), name = (on[0] || SCENES[SCENES.length - 1])[2];
  ctx.save();
  if (name === 'pastel') { if (PC) PC.draw(ctx, t, B); else { ctx.fillStyle = '#b08a80'; ctx.fillRect(0, 0, W, H); } }
  else { if (WD) WD.draw(ctx, t, B); else { ctx.fillStyle = '#16120e'; ctx.fillRect(0, 0, W, H); } }
  ctx.restore();
  band(ctx, BK[name]);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at])); B.END = T1; B.pc = pieceTimes(); window.__B = B;
    PC = await (await import('./pastel-children.js')).build(W, H); window.__PC = PC;
    try { WD = await (await import('./woodcut-road.js')).build(W, H); window.__WD = WD; } catch (e) { console.warn('woodcut not built', e); } }, draw });
</script>
</body>
</html>
