<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빈 무덤과 사십 일 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-fresco.js"></script>
<script>
/* 시안 1차 (2026-11-20): 「kingdom」 6부 「땅 끝까지」 첫 블록 — 빈 무덤의 새벽 → 돌집 마당의 사십 일 (C5 · N27 · N27b · L9 · Q15 · N28).
   impasto-tomb.js: 성전 휘장 장면 끝의 문 모양 빛이 무덤 입구로 모이며(같은 자리, match cut) 잿빛 팔레트 나이프 그림이 어둠에서 떠오름 →
   N27 첫 햇빛이 바위를 가로질러 열린 입구에 닿고 안으로 들어감(돌 침상 위 개켜진 세마포, 따로 놓인 머리 수건 — 사람 없음), 카메라가 빛을
   따라 입구로 3.4초 다가감, 색이 입구에서 바깥으로 다시 칠해짐(첫 영상 「부활」). → 1초 디졸브(빛에서 빛으로: 무덤 안의 빛 → 마당 문의 빛,
   사십 일의 시간) → fresco-forty.js: 석회벽 돌집 마당, 낮은 해가 문 너머(오른쪽)에 — 문간에 선 한 사람(역광 실루엣, 얼굴 없음, 다른 이들과
   같은 옷), 그 앞에 불규칙하게 앉은 사람들(대부분 뒷모습), 긴 그림자; Q15 빛줄기 속 먼지, 사람들이 차례로 몸을 기울이고 그림자도 기울어짐;
   N28 마당의 빛이 넓게 번짐 → 655.4 감람산(sample-part6a.html)으로 hard cut.
   필름 시간 620.5(C5) → 655.4(N15c) = 시안 u 0 → 34.9. 그림의 모든 시각은 script.json의 at에서 나온다(각 모듈의 beats()).
   자막은 본 영상이 얹는 자리를 보려고 시안에서만 얹음(sample-part2.html과 같은 규칙).
   node motion/render.mjs v --page films/kingdom/sample-part5d.html                    (→ motion/out/sample-part5d-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part5d.html --stills 1,5,9    (u seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 620.5, T1 = 655.4;
let TOMB = null, FORTY = null, B = null, TT = null, TF = null, TEXT = [], aux = null, auxx = null;
// the scene table (film seconds): [a, b, name] — overlaps are dissolves; a cut is where one ends and the next begins
const SCENES = [
  [620.5, 632.4, 'tomb'],     // C5–N27: in from the veil's door of light; the grey dawn; the sun goes into the open tomb; the colour from the doorway
  [631.4, 655.4, 'court'],    // N27b–N28: light to light (the tomb's lit doorway → the gate's glare, 1.0 s dissolve); the forty days; hard cut at N15c
];
// the dark band under the words (sample-veil.html)
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['C5', 'N27', 'N27b', 'L9', 'Q15', 'N28', 'N15c'];
// text: every line from its `at` to the next voiced line (as sample-part2.html); a label rides with its quote. C5 is the chapter title.
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'C5') { TEXT.push(['chapter', l.id, l.at, (next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
// the chapter title (as sample-part2.html): small serif, light, dark shadow — over the grey dawn sky
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#f3ece0', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function scene(ctx, t, name) {
  if (name === 'tomb') { if (TOMB) return TOMB.draw(ctx, t, TT); ctx.fillStyle = '#2a2420'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'court') { if (FORTY) return FORTY.draw(ctx, t, TF); ctx.fillStyle = '#b8a080'; ctx.fillRect(0, 0, W, H); return; }
}
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b);
  ctx.save(); scene(ctx, t, on[0][2]); ctx.restore();
  if (on.length > 1) {   // a dissolve: the later scene over the earlier one, through an offscreen frame
    const [a, , name] = on[1], k = ss(a, on[0][1], t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  band(ctx, 1);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d');
    const MT = await import('./impasto-tomb.js'); TT = MT.beats(B); TOMB = await MT.build(W, H); window.__TOMB = TOMB;
    const MF = await import('./fresco-forty.js'); TF = MF.beats(B); FORTY = await MF.build(W, H); window.__FORTY = FORTY; window.__TF = TF; window.__TT = TT; }, draw });
</script>
</body>
</html>
