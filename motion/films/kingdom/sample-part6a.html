<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>땅 끝까지 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script>
/* 시안 2차 (2026-11-19): 성가대 줄 → 불규칙한 무리(바위에 앉은 셋, 섞인 머리쓰개, 각자의 숨), 해를 마주 보는 역광 · 짙은 금빛 대기 · 먼 성,
   빛은 지형 위의 길을 따라(지도 선이 아니라), 꼭대기의 지구는 밝게(푸른 시간의 테두리 · 구름 · 새벽 경계선).
   시안 1차 (2026-11-19): 「kingdom」 6부 「땅 끝까지」 앞 블록 — 감람산에서 땅 끝까지 (N15c · Q6 · N15d · N28c · Q6a · N28b).
   한 대의 카메라, 컷 없음(olivet3d.js): 늦은 오후 감람산 꼭대기 — 몇 사람이 한 사람을 둘러섬, 한 사람이 기드론 건너 성전 옆 안토니아의
   붉은 로마 깃발을 가리킴, 긴 그림자가 성벽 쪽으로(해가 내려가며 길어짐) → 렌즈가 깃발 쪽으로 좁혀짐(초점이 성으로) → 가리키던 손이
   내려가고 한 사람이 성벽에서 먼 지평선으로 돌아섬, 카메라가 그와 함께 돎(4 s) → Q6a 10초 크레인 업(느리게 시작, 느리게 끝): 발밑에서
   사방의 길로 빛이 달려 나가고 몇 사람이 그 길로 걸어 나감, 해가 지고 예루살렘·온 유대·사마리아의 마을마다 등불 → 공기 위로, 밤의 지구
   (earth-night.js) 위로 빛이 길을 따라 땅 끝까지 → N28b 길 끝마다 등불이 켜지며 지금도 자라는 빛(다음 블록 필사본의 금박으로 이어짐).
   필름 시간 655.4(N15c) → 700.3(N29) = 시안 u 0 → 44.9. 그림의 모든 시각은 script.json의 at에서 나온다(olivet3d.js beats()).
   자막은 본 영상이 얹는 자리를 보려고 시안에서만 얹음(sample-part2.html과 같은 규칙).
   node motion/render.mjs v --page films/kingdom/sample-part6a.html                    (→ motion/out/sample-part6a-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part6a.html --stills 1,6,12    (u seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 655.4, T1 = 700.3;
let OL = null, B = null, TEXT = [];
// the scene table (film seconds): [a, b, name] — one scene: the camera never cuts (655.4 hard cut in from the courtyard; 700.3 match cut out on the gold lights)
const SCENES = [
  [655.4, 700.3, 'olivet'],   // N15c–N28b: the Mount of Olives → crane up (Q6a) → the night earth
];
// the dark band under the words (sample-veil.html)
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['N15c', 'Q6', 'N15d', 'N28c', 'Q6a', 'N28b', 'N29'];
// text: every line from its `at` to the next voiced line (as sample-part2.html)
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function draw(ctx, u) {
  const t = T0 + u;
  ctx.save(); if (OL) OL.draw(ctx, t, B); else { ctx.fillStyle = '#1a1410'; ctx.fillRect(0, 0, W, H); } ctx.restore();
  band(ctx, 1);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    { const q = TEXT.find(x => x[1] === 'Q6a'); B.cuts = Film.pieces(Film.text('Q6a'), q[2], q[3]).slice(1).map(p => p[1]); }   // when "예루살렘과 …" and "내 증인이 되리라" come on
    OL = await (await import('./olivet3d.js')).build(W, H, B); window.__OL = OL; }, draw });
</script>
</body>
</html>
