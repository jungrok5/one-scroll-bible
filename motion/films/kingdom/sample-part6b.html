<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그 나라가 임하시오며 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-oilpaint.js"></script>
<script src="kit-illuminated.js"></script>
<script src="kit-lamplit.js"></script>
<script src="lamp-scroll-end.js"></script>
<script>
/* 시안 1차 (2026-11-20): 「kingdom」 6부 끝 블록 — 다시 오시는 날부터 끝 화면까지 (N29 · L10 · Q16 · N29c · N29d · N30 · L11 · Q17 · E1).
   밤 지구의 금빛 불빛(6a 끝) → 채색 필사본 한 면(illum-world.js: 촛불 아래 양피지, 청금석 테두리, 금박 하늘의 작은 세상, 금박이
   테두리를 따라 입혀짐, 천천히 밀어 들어감) → Q16 모든 금박에 빛이 한 번 스치고 그 작은 세상이 자기가 그려진 3D 세상으로 현상
   (gold-world3d.js: 같은 카메라·같은 지형이라 어긋나지 않음), 틀이 화면 밖으로 열리며 땅이 솟고 크레인 업, 금빛이 지평선까지 →
   N29c (4차: 1부 마을 겹침은 뺌 — 관리자 "다른 마을 씬으로 갔다가 돌아오는 이유는?") 같은 금빛 세상에서 마을마다 차례로 창에 등불이 켜짐(왕의 다스림이 집집마다 닿음) → N29d 해가 지며 등불 마을로, 카메라가 한 집의 창으로
   한 번에 내려가 다가감 → 그 창의 빛에서 빛으로 처음의 기도 방(prayer-room.js, 1부와 같은 구도) → N30 창빛이 바닥을 건너 무릎 꿇은
   사람에게 닿음 → Q17 고개를 숙이고 4초 돌리 인 → E1 창빛이 등잔 하나로 줄고(같은 방, 저녁) → 등잔 아래 펼친 두루마리
   (lamp-scroll-end.js), 끝 화면 글자(E1)는 그 위 어둠에 — 그대로 머묾(L-cut 음악 꼬리 자리).
   필름 시간 700.3(N29) → 765.0(dur) = 시안 u 0 → 64.7. 그림의 모든 시각은 script.json의 at에서 나온다. 자막은 시안에서만 얹음.
   node motion/render.mjs v --page films/kingdom/sample-part6b.html                   (→ motion/out/sample-part6b-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part6b.html --stills 1,6,12    (u seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp, eo, lerp } = Pilot;
const T0 = 700.3;
let T1 = 765.0;
let IW = null, GW = null, ROOM = null, RT = null, B = null, TEXT = [], aux = null, auxx = null, aux2 = null, aux2x = null;
// the scene table (film seconds): [a, b, name] — overlaps are dissolves
const SCENES = [
  [700.3, 717.7, 'illum'],   // N29–Q16: the page in candlelight, the gold laid round the frame, the glint; the develop into the world (the 3D shows through the arch)
  [717.7, 737.95, 'world'],  // Q16–N29d: crane up, gold to the horizon; village after village lights (N29c); the glide down to one lit window
  [737.2, 760.6, 'room'],    // N30–Q17–E1: light to light into the prayer room (same composition as part 1); the light reaches him; he bows; dolly in; evening, the lamp
  [759.6, 765.0, 'end'],     // E1: the lamp and the open scroll under it — the end card's words above
];
function band(ctx, k = 1) { if (k <= 0) return; const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['N29', 'L10', 'Q16', 'N29c', 'N29d', 'N30', 'L11', 'Q17', 'E1'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.id === 'E1') { TEXT.push(['end', l.id, l.at, T1 + 2]); continue; }   // the end card never fades out
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? Film.lines.E1.at) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? Film.lines.E1.at) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
// the end card (as 「그리스도」 film.html endCard, round 2): in the film's caption style (Film.sub: Noto Serif KR 600, cream, the deep
// caption shadow) over a soft dark oval like Film.label's, so it reads over the lamp, the wall and the scroll alike; the kick line in
// the label's gold, the chapters one per line, a short gold rule
function endCard(ctx, t, a, b) {
  const k = win(t, a + .3, b, 1.1, .8); if (k <= 0 || Film.clean) return; const [kick, ...refs] = Film.text('E1').split(/\s*·\s*/), size = V ? 54 : 44, lh = size * 1.48, y0 = V ? H * .16 : H * .18;
  const yb = y0 + size * 1.5 + refs.length * lh, cy = (y0 - size * .8 + yb) / 2, rh = (yb - y0 + size * 2.6) / 2;
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale((V ? W * .44 : W * .26) / rh, 1); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rh);
  g.addColorStop(0, `rgba(12,8,4,${.66 * k})`); g.addColorStop(.6, `rgba(12,8,4,${.46 * k})`); g.addColorStop(1, 'rgba(12,8,4,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rh, 0, 6.2832); ctx.fill(); ctx.restore();
  const o = { weight: 600, font: "'Noto Serif KR',serif" };
  Pilot.text(ctx, kick, W / 2, y0, { ...o, size: V ? 40 : 34, color: '#f4d993', alpha: k, shadow: 'rgba(0,0,0,.95)', shadowBlur: 6, ls: 6 });
  Pilot.text(ctx, kick, W / 2, y0, { ...o, size: V ? 40 : 34, color: '#f4d993', alpha: k * .97, shadow: 'rgba(0,0,0,.85)', shadowBlur: 16, ls: 6 });
  refs.forEach((r, i) => Pilot.text(ctx, r, W / 2, y0 + size * 1.5 + i * lh, { ...o, size, color: '#f3ece0', alpha: k * ss(a + .6 + i * .3, a + 1.3 + i * .3, t), shadow: 'rgba(0,0,0,.85)', shadowBlur: 22 }));
  const yl = yb - size * .35, lw = (V ? 360 : 440) * eo(clamp((t - a - 2.4) / 1.0)); ctx.fillStyle = `rgba(244,217,147,${k * .85})`; ctx.fillRect(W / 2 - lw / 2, yl, lw, 2); }
function world(ctx, t) {
  GW.draw(ctx, t);
  // N29c (round 4): no other place laid over it — the one gold world, its villages lighting one after another (gold-world3d.js)
  // the target window's light swells into the cut (light to light) — kept tight round the window so its shape carries into the room's
  const gk = ss(GW.T.glow[0], GW.T.e + .4, t); if (gk > 0) { const [x, y] = GW.windowScreen(t); ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.translate(x, y); ctx.scale(.4, 1); const R = lerp(140, 520, gk), g = ctx.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, `rgba(255,236,196,${.85 * gk})`); g.addColorStop(.4, `rgba(255,214,150,${.4 * gk})`); g.addColorStop(1, 'rgba(255,200,130,0)'); ctx.fillStyle = g; ctx.fillRect(-R, -R, 2 * R, 2 * R); ctx.restore(); }
}
function scene(ctx, t, name) {
  if (name === 'illum') { if (IW) return IW.draw(ctx, t, c => GW.draw(c, t)); ctx.fillStyle = '#100a06'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'world') { if (GW) return world(ctx, t); ctx.fillStyle = '#c89a5a'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'room') { if (ROOM) return ROOM.draw(ctx, t, RT); ctx.fillStyle = '#5a4430'; ctx.fillRect(0, 0, W, H); return; }
  if (name === 'end') { return scrollEnd(ctx, t - 759.6); }
}
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b);
  if (!on.length) on.push(SCENES[SCENES.length - 1]);
  ctx.save(); scene(ctx, t, on[0][2]); ctx.restore();
  if (on.length > 1) {
    const [a, , name] = on[1], k = ss(a, on[0][1], t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  // a soft warm lift over the prayer room (the page's grade only — the module draws as in part 1), eased in and out with its dissolves
  { const rw = ss(737.2, 737.95, t) * (1 - ss(759.6, 760.6, t)); if (rw > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = `rgba(255,234,204,${.08 * rw})`; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
  const BK = { illum: .9, world: 1, room: .75, end: 0 }, last = on[on.length - 1], bk0 = on.length > 1 ? lerp(BK[on[0][2]], BK[last[2]], ss(last[0], on[0][1], t)) : BK[on[0][2]];
  band(ctx, bk0 * (1 - ss(B.E1, B.E1 + 1.5, t)));
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'end') endCard(ctx, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); T1 = Film.script.dur; buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d'); aux2 = Pilot.canvas(W, H); aux2x = aux2.getContext('2d');
    GW = await (await import('./gold-world3d.js')).build(W, H, B); window.__GW = GW;
    IW = (await import('./illum-world.js')).buildIllum(W, H, GW.paint, B); window.__IW = IW;
    try { const R = await import('./prayer-room.js'); ROOM = await R.build(W, H, { people: 1, lamp: true });
      RT = { start: B.N30, end: T1, cross: [B.N30 - 1.6, B.N30 + 8.6], reach: [B.Q17 - 2.8, B.Q17 + .6], widen: [B.Q17 + 3.0, B.Q17 + 16.0], pieces: [], join: [0, 0],
        bow: [B.Q17 + .2, B.Q17 + 2.4], lift: [1e9, 1e9 + 1], dolly: [1e9, 1e9 + 1], dollyIn: [B.Q17 + .1, B.Q17 + 4.1], zIn: 1.12, clouds: [B.N30 - 2.0, B.E1 + .5], dusk: [B.E1, B.E1 + 1.5], lampOn: B.E1 + .25 };
      window.__ROOM = ROOM; } catch (e) { console.warn('room not built', e); }
    buildScrollEnd(); }, draw });
</script>
</body>
</html>
