<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>삭개오의 집 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script>
/* 시안 1차 (2026-11-22): 「kingdom」 7부 「왕을 모신 사람들」 block 7-2 — 삭개오의 집, 문간과 등불. 밤 과슈(gouache-house.js, 3D + 과슈 패스).
   필름 767.8(N33) → 805.8(Q19b, 7-3이 길에서 본 집으로 cut) = 시안 u 0 → 38.0.
     B1 street  N33      길에서 dolly in: 앞쪽 낮은 담 곁에 머리를 맞대고 수군거리는 그림자들(한 사람은 손으로 입을 가리고, 한 사람은 문 쪽을 돌아봄),
                         그 너머 열린 문 — 손님(뒷모습)이 문으로 걸어가고 문간의 작은 사람(녹슨 붉은 두건)이 손짓해 부름 → 「삭개오는 기뻐하며…」
                         그가 문 쪽으로 팔을 펴 모셔 들이고 뒤따라 들어감, 집 안 등불이 밝아지며 길로 번짐
     B2 rise    N33b     (0.6초 디졸브, 등불에서 등불로) 집 안, 앉은 손님의 등 뒤에서: 등불 곁의 작은 사람이 무릎을 펴고 일어섬, 그 뒤 열린 문의 푸른 밤 — pedestal up
     B3 table   Q19      식탁 끝에서 본 클로즈(push-in): 그의 두 손(2D로 칠한 손)이 들어와 쌓인 돈주머니들을 손님 쪽으로 밀어냄, 누운 주머니에서 동전이 미끄러져
                         나옴 → 「네 갑절이나 갚겠나이다」 두 손이 장부 판과 큰 주머니를 뒤따라 밀어냄, 큰 주머니가 넘어지며 동전이 더 흘러나옴; 등불의 빛이 번져 감
     B4 look    N33c     손님의 어깨 너머(어둡고 흐린 형체, 왼쪽 아래): 그가 고개를 들어 등불 빛 속에 선 작은 사람을 바라봄 — push-in
   그림의 모든 시각은 script.json의 at(과 '/' 조각이 화면에 오는 시각)에서 나온다(모듈의 beats()). 자막은 sample-part2.html과 같은 규칙.
   node motion/render.mjs v --page films/kingdom/sample-part7b.html                  (→ motion/out/sample-part7b-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-part7b.html --stills 2,8,14   (u seconds = film − 767.8) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win, clamp } = Pilot;
const T0 = 767.8, T1 = 805.8;
let GH = null, B = null, TEXT = [], aux = null, auxx = null, SCENES = null;
// the scene table (film seconds): [a, b, name] — overlaps are dissolves; a cut is where one ends and the next begins. Built from the
// line times in init (all cuts — round 2: the B1 → B2 dissolve laid the kneeling man over the door like a ghost).
function scenes() { return [
  [T0, B.N33b, 'b1'],                // N33: dolly in past the murmurers to the door; the two go in, the light comes up
  [B.N33b, B.Q19, 'b2'],            // N33b: inside — he rises from the table, the lamp beside him (a cut: round 2, the dissolve left a ghost)
  [B.Q19, B.N33c, 'b3'],            // Q19: close on the table — the purses pushed across, coins; the board and the big purse after them
  [B.N33c, T1, 'b4'],               // N33c: over the guest's shoulder — he raises his head to the standing man; cut to 7-3 at Q19b
]; }
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.35, `rgba(10,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(10,8,10,${.62 * k})`); g.addColorStop(1, `rgba(10,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
const IDS = ['N33', 'N33b', 'Q19', 'N33c', 'Q19b'];
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function pieceTimes() { const pc = {}; for (const [kind, id, a, b] of TEXT) if (kind === 'sub' || kind === 'quote') pc[id] = Film.pieces(Film.text(id), a, b).map(p => p[1]); return pc; }
function scene(ctx, t, name) { if (GH) return GH.draw(ctx, t, B, name); ctx.fillStyle = '#2c4152'; ctx.fillRect(0, 0, W, H); }
function shotAt(t) { const on = SCENES.filter(([a, b]) => t >= a && t < b); return (on[on.length - 1] || SCENES[SCENES.length - 1])[2]; }
function draw(ctx, u) {
  const t = T0 + u, on = SCENES.filter(([a, b]) => t >= a && t < b), first = on[0] || SCENES[SCENES.length - 1];
  ctx.save(); scene(ctx, t, first[2]); ctx.restore();
  if (on.length > 1) {   // a dissolve: the later scene over the earlier one, through an offscreen frame
    const [a, , name] = on[1], k = ss(a, on[0][1], t);
    auxx.setTransform(1, 0, 0, 1, 0, 0); auxx.globalAlpha = 1; auxx.globalCompositeOperation = 'source-over';
    auxx.save(); scene(auxx, t, name); auxx.restore();
    ctx.save(); ctx.globalAlpha = k; ctx.drawImage(aux, 0, 0); ctx.restore();
  }
  band(ctx, 1);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at])); B.pc = pieceTimes(); window.__B = B; SCENES = scenes();
    aux = Pilot.canvas(W, H); auxx = aux.getContext('2d');
    GH = await (await import('./gouache-house.js')).build(W, H); window.__GH = GH;
    window.__measure = () => GH.measure(B, T0, T1, shotAt); }, draw });
</script>
</body>
</html>
