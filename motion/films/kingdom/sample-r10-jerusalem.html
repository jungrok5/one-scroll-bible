<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>예루살렘을 보시고 우심 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-charcoal.js"></script>
<script>
/* 「kingdom」 10-3 A — 4부 「예루살렘을 보시고 우심」 감독 1안 「그분이 보신 성」 (jerusalem-weep3d.js, rounds/r10-pilot/director3-plan.md §A2): film 494.7 (N133) → 551.0 (C13), 56.3 s (Q108b 눅 19:44 포함). Every visual time comes from
   script.json `at` through beats(); only T0/T1 are literal. Captions are laid on here only to see where the film's words sit (sample-part5d.html rule).
   node motion/render.mjs v --page films/kingdom/sample-r10-jerusalem.html            (→ motion/out/sample-r10-jerusalem-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-r10-jerusalem.html --stills 2,8,12   (block seconds) */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win } = Pilot;
const T0 = 494.7, T1 = 551.0, IDS = ['N133', 'N134', 'L102', 'Q108', 'Q108b', 'N135b', 'N136', 'N137', 'C13'];
let JW = null, TB = null, TEXT = [];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(12,8,10,0)'); g.addColorStop(.35, `rgba(12,8,10,${.5 * k})`); g.addColorStop(.7, `rgba(12,8,10,${.62 * k})`); g.addColorStop(1, `rgba(12,8,10,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function draw(ctx, u) {
  const t = Math.min(T0 + u, T1 - .001);
  if (JW) JW.draw(ctx, t, TB); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  band(ctx, 1);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    const B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    const nextAt = { N133: B.N134, Q108: B.Q108b, Q108b: B.N135b, N135b: B.N136, N136: B.N137, N137: B.C13 };
    B.pc = {}; for (const id of Object.keys(nextAt)) B.pc[id] = Film.pieces(Film.text(id), B[id], nextAt[id] - (id.startsWith('Q') ? .1 : .25)).map(q => q[1]);
    const M = await import('./jerusalem-weep3d.js'); TB = M.beats(B); JW = await M.build(W, H); window.__JW = JW; window.__TB = TB; window.__T0 = T0; }, draw });
</script>
</body>
</html>
