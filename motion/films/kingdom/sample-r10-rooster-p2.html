<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>닭이 울 때 감독안 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script type="module">
/* 「kingdom」 10차 5부 「닭이 울 때」 감독안 2 「등 뒤의 카메라」 — 베드로의 오른어깨 뒤에 붙은 한 테이크. 그림: bw-rooster-p2.js (B안 bw-rooster-b.js에서 출발, B는 그대로).
   관리자 2026-11-24: 2안은 비용이 커서 '심장부'만 견본으로 — 닭 울음(N149 608.8)부터 그분이 멈추고 돌아서 보심, 베드로의 반응(색이 죽음)까지, 홀드 넣은 필름 608.8 → 630.0 (u 0 → 21.2).
   홀드는 감독안 시간표 그대로: Q114 +11.3 s (4.7 → 16.0), Q115 +11.4 s (8.6 → 20.0). script.json은 그대로, 이 페이지의 sloc()만 늘린다. 견본 밖(앞뒤)은 그리지 않는다.
   node motion/render.mjs v --page films/kingdom/sample-r10-rooster-p2.html                 (→ motion/out/sample-r10-rooster-p2-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-r10-rooster-p2.html --stills 3,9,12 (u seconds) */
import * as MOD from './bw-rooster-p2.js';

const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win } = Pilot;
// 감독안 시간표: Q114 4.7→16초(+11.3), Q115 8.6→20초(+11.4). script.json은 그대로 두고 이 페이지 안에서만 시간을 늘린다(값은 bw-rooster-p2.js HOLDS).
const { Q114: H1, Q115: H2 } = MOD.HOLDS, loc = at => at <= 614.01 ? at : at <= 618.71 ? at + H1 : at + H1 + H2;
// script.json now carries the chosen holds itself (`hold` on Q114/Q115, 관리자 2026-11-24 1안), so a script time is first taken back to the un-held time, then this page applies its own holds.
// Q108b (눅 19:44, 관리자 2026-11-26 "그래") went in before this block: its added length (N135b's move from 515.2) is taken back out too.
const unhold = at => at - Film.script.lines.filter(l => l.hold && l.at < at - .01).reduce((s, l) => s + l.hold, 0) - (at > 515.3 ? Film.script.lines.find(l => l.id === 'N135b').at - 515.2 : 0), sloc = at => loc(unhold(at));
const T0 = 608.8, T1 = loc(618.7);   // the sample: N149 (the crow) → Q115's held start 630.0 (the colour has died, his head has dropped)
const IDS = ['C13', 'N140', 'L103', 'Q109', 'N141', 'N142', 'N143', 'N144', 'N145', 'N146', 'N147', 'N148', 'N149', 'L105', 'Q114', 'Q115', 'C14'];
let SC = null, TB = null, TEXT = [];
function band(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 190 : 80), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(6,6,6,0)'); g.addColorStop(.35, `rgba(6,6,6,${.5 * k})`); g.addColorStop(.7, `rgba(6,6,6,${.62 * k})`); g.addColorStop(1, `rgba(6,6,6,${.66 * k})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { const at = sloc(l.at); if (at < T0 - .01 || at >= T1) continue;
    if (l.id === 'C13') { TEXT.push(['chapter', l.id, at, sloc(next(l)?.at ?? l.at + 3) - .3]); continue; }
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, at, l.id === 'L105' ? TB.caption114end : (qn ? sloc(qn.at) : T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n ? sloc(n.at) : T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.id === 'Q114' ? TB.caption114 : at, l.id === 'Q114' ? TB.caption114end : b]); }   // Q114's words come with his finished gaze and are gone before Peter's profile returns
}
function chapter(ctx, id, t, a, b) { const k = win(t, a, b, .7, .7); if (k <= 0 || Film.clean) return;
  Pilot.text(ctx, Film.text(id), W / 2, V ? H * .205 : H * .2, { size: V ? 54 : 50, weight: 600, color: '#efefef', alpha: k, ls: 8, shadow: 'rgba(0,0,0,.85)', shadowBlur: 18 }); }
function draw(ctx, u) {
  const t = Math.min(T0 + u, T1 - .001);
  if (SC) SC.draw(ctx, t, TB); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  band(ctx, 1);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'chapter') chapter(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load();
    const B = Object.fromEntries(IDS.map(id => [id, sloc(Film.lines[id].at)])), nextAt = { N143: B.N144, N145: B.N146, N147: B.N148, N149: B.L105 };
    B.pc = {}; for (const id of ['N143', 'N145', 'N147', 'N149']) B.pc[id] = Film.pieces(Film.text(id), B[id], nextAt[id] - .25).map(q => q[1]);
    TB = MOD.beats(B); buildText(); SC = await MOD.build(W, H); window.__SC = SC; window.__TB = TB; }, draw });
</script>
</body>
</html>
