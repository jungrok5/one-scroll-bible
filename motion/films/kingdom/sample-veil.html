<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성전 휘장 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "three": "../lib3d/three.module.min.js" } }</script>
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-charcoal.js"></script>
<script src="charcoal-cross.js"></script>
<script>
/* 시안: 「kingdom」 5부 절정 — 세 십자가(목탄)의 끝 → 종이가 넘어가며 성전 도면 → 3D 성전으로 일어섬 → 휘장 앞 →
   위로부터 아래까지 찢어짐(속도 램프) → 지성소의 빛 → 바깥 뜰 사람들에게 흘러나감 → 열린 문 모양의 빛 → 문 너머 화선지 동산.
   필름 시간 566.8(N25c) → 620.5(C5 「땅 끝까지」) = 시안 u 0 → 53.7. 그림의 모든 시각은 script.json의 at에서 나온다
   (veil-temple.js beats()). 자막은 본 영상이 얹는 자리를 보려고 시안에서만 얹음(그리스도 film.html과 같은 규칙).
   node motion/render.mjs v --page films/kingdom/sample-veil.html                     (→ motion/out/sample-veil-v.mp4)
   node motion/render.mjs v --page films/kingdom/sample-veil.html --stills 2,6,9,12,15,19,24,31,38,45,52 */
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', { ss, win } = Pilot;
const T0 = 566.8, T1 = 620.5;
let VT = null, B = null, TEXT = [];
function band(ctx) { const y0 = Film.SAFE() - (V ? 150 : 70), g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(10,8,10,0)'); g.addColorStop(.45, 'rgba(10,8,10,.42)'); g.addColorStop(1, 'rgba(10,8,10,.55)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); }
// the line times this scene runs on (the voice will retime them in script.json; the picture follows)
const IDS = ['Q14', 'N25c', 'N25e', 'L8d', 'Q14a', 'N25f', 'N25g', 'N26', 'N26b', 'C5'];
// text: every line from its `at` to the next voiced line (as 「그리스도」 film.html buildText); a caption label rides with its quote
function buildText() {
  const L = Film.script.lines, spoken = l => (l.kind === 'narr' || l.kind === 'quote') && l.voice !== null;
  const V2 = L.filter(spoken).sort((a, b) => a.at - b.at), next = l => V2.find(x => x.at > l.at + .01);
  for (const l of L) { if (l.at < T0 - .01 || l.at >= T1) continue;
    if (l.kind === 'label') { const q = V2.find(x => x.at >= l.at - .01), qn = q && next(q); TEXT.push(['label', l.id, l.at, (qn?.at ?? T1) - .2]); continue; }
    if (!spoken(l)) continue;
    const n = next(l), b = Math.min((n?.at ?? T1) - (l.kind === 'quote' ? .1 : .25), T1 - .25);
    TEXT.push([l.kind === 'quote' ? 'quote' : 'sub', l.id, l.at, b]); }
}
function draw(ctx, u) {
  const t = T0 + u;
  VT.draw(ctx, t, B, { prev: (c, tt) => charcoalCross(c, tt, B) });
  band(ctx);
  for (const [kind, id, a, b] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b); else if (kind === 'label') Film.label(ctx, id, t, a, b);
    else Film.quote(ctx, id, t, a, b, { bottom: Film.subBottom() + 40, hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.6, t) }); }
}
Pilot.run({ W, H, dur: +(T1 - T0).toFixed(2), fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildText();
    B = Object.fromEntries(IDS.map(id => [id, Film.lines[id].at]));
    buildCharcoalCross();
    VT = await (await import('./veil-temple.js')).build(W, H); }, draw });
</script>
</body>
</html>
