/* 메시아 예언과 성탄 — one continuous ~2:59 film, made like the first film (motion/films/README 7절): a camera that moves
   through real space, light as the main character, small people in a large land, restraint. Portrait (Shorts) first.
   One world: the hills of Judea and the small town of Bethlehem on its hill (kit-world3d.js, after the first film's
   「포로 귀환」), seen at night from above (1), at dusk at the end of the road (3) and at night again (5). One motif: a
   thread of gold light — the promise — runs through every part. Line ids = script.json. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';

// shared: the land as rows of shaded quads (rows are laid out from the camera outward, so any camera position is fine),
// silhouettes, painted layers, a thread of gold light (the promise) that runs through every part
// The grid is locked to the world (cells of 2^k m, larger with distance), so the land does not swim as the camera moves;

    const half = 24 + spread * Math.max(0, dd) + (o.wide || 0), xc = c.x + dirx * Math.max(0, dd), j0 = Math.floor((xc - half) / sz), j1 = Math.ceil((xc + half) / sz);

// a gold thread on the land: world points, revealed up to k (0..1), a bright head while it travels
function threadWorld(ctx, c, pts, k, a = 1) { if (k <= 0) return; const sp = pts.map(p => W3.P(c, ...p)).filter(Boolean); if (sp.length < 2) return; const n = Math.max(2, Math.round(sp.length * clamp(k)));

  if (k < 1) { const [hx, hy] = sp[n - 1]; W3.bloom(ctx, hx, hy, [255, 214, 140], .7 * a, { r: 60, streak: .12 }); } ctx.restore(); }

  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, al] of [[10, .16], [4, .5], [1.6, .95]]) { ctx.strokeStyle = `rgba(255,214,140,${al * a})`; ctx.lineWidth = w; ctx.beginPath(); pts.slice(0, n).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }

  for (let i = 0; i < 60; i++) { const x = (r() - .5) * len, y = (r() - .5) * wid * (1 - Math.abs(x) / len), R = 30 + r() * 90, g = ctx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, `rgba(200,206,236,${.06 * a})`); g.addColorStop(1, 'rgba(200,206,236,0)'); ctx.fillStyle = g; ctx.fillRect(x - R, y - R, 2 * R, 2 * R); }
  ctx.fillStyle = '#fff'; for (let i = 0; i < 700; i++) { const x = (r() - .5) * len, y = (r() - .5) * wid * .7 * (1 - Math.abs(x) / len); ctx.globalAlpha = a * .6 * r(); ctx.fillRect(x, y, 1.1, 1.1); } ctx.restore(); }

  standing: (p, h = 1.75, staff = true, hood = true) => { p.ellipse(0, -h + .13, .11, .13, 0, 0, 6.283); if (hood) { p.moveTo(-.16, -h + .2); p.quadraticCurveTo(-.14, -h - .06, .02, -h - .04); p.quadraticCurveTo(.16, -h + .02, .14, -h + .22); p.closePath(); }
    p.moveTo(-.18, -h + .3); p.quadraticCurveTo(-.27, -h * .5, -.25, -.02); p.lineTo(.25, -.02); p.quadraticCurveTo(.26, -h * .5, .18, -h + .3); p.closePath(); if (staff) { p.rect(.3, -h - .25, .04, h + .25); p.moveTo(.16, -h + .55); p.lineTo(.32, -h + .45); p.lineTo(.33, -h + .52); p.lineTo(.18, -h + .62); p.closePath(); } },

  tent: p => { p.moveTo(-1.8, 0); p.lineTo(-1.2, -1.5); p.lineTo(1.0, -1.7); p.lineTo(1.9, 0); p.closePath(); p.rect(-.05, -2.0, .06, .5); },

// =====================================================================================================================
// 1 · 0:00–0:21  over the hills of Judea at night, down toward one small town with lamps in its windows (the same world the
// journey of part 3 crosses). At "베들레헴" the town warms; the title; "왜 하필 이 작은 마을이었을까요?"

function buildFly() {
