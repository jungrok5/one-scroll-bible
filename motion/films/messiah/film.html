<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메시아 예언과 성탄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;700&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../lib-film.js"></script>
<script src="kit-woodcut.js"></script>
<script src="kit-silk.js"></script>
<script src="kit-inkmap.js"></script>
<script src="kit-cavesil.js"></script>
<script>
/* 메시아 예언과 성탄 — one continuous ~2:59 film in five looks, each chosen for what its medium does
   (review.json parts): 1 woodcut (a promise carved in advance) · 2 scratchboard long take (the promise narrowing,
   years counting down) · 3 Roman floor mosaic (the emperor's decree spreads tile by tile) · 4 night oil painting (the
   only light comes from the child) · 5 woodcut again (the block carved in part 1 is printed). One motif: gold — the
   promise — shows only where something has been cut, scratched or laid for it. Line ids = script.json. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
const GOLD = [233, 185, 92];

// =====================================================================================================================
// 1 · 0:00–0:21  a small town carved on a block under the night sky; Micah 5:2; the brayer inks it over
let BETH = null;
function hillTop(x) {   // the village hill's crest (frame units)
  const c = V ? W * .5 : W * .52, r = V ? W * .62 : W * .36, top = V ? H * .37 : H * .46;
  const d = (x - c) / r; return top + (V ? 210 : 190) * d * d + 14 * Math.sin(x * .013);
}
function farRidge(x) { return (V ? H * .40 : H * .52) - 60 * Math.sin(x * .0042 + 1.3) - 34 * Math.sin(x * .011); }
function buildBethlehem() {
  BETH = Woodcut.plate(41, pl => {
    const moon = V ? [W * .74, H * .17] : [W * .8, H * .17], mr = V ? 40 : 46;
    const ground = V ? H * .6 : H * .65;     // below this the block stays black (the words are read there)
    const houses = [];
    { const r = rng(5), c = V ? W * .5 : W * .52, n = V ? 15 : 19, spread = V ? W * .34 : W * .2;
      for (let i = 0; i < n; i++) { const u = (i / (n - 1)) * 2 - 1, x = c + u * spread + (r() - .5) * 30, w = (V ? 70 : 64) + r() * 46, h = (V ? 52 : 46) + r() * 40 - Math.abs(u) * 18;
        const base = hillTop(x) + 26 + Math.abs(u) * 24 + r() * 16; houses.push({ x, y: base, w, h, d: 14 + r() * 10, win: r() < .7, k: r() }); }
      houses.sort((a, b) => a.y - b.y); }
    // regions, back to front: 1 sky · 2 far ridge · 3 village hill · 4 dark ground · 10.. houses
    pl.region(1, g => g.rect(0, 0, W, H));
    pl.region(2, g => { g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, farRidge(x)); g.lineTo(W, H); });
    pl.region(3, g => { g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, hillTop(x)); g.lineTo(W, H); });
    pl.region(4, g => g.rect(0, ground, W, H - ground));
    houses.forEach((h, i) => pl.region(10 + i, g => { g.rect(h.x - h.w / 2, h.y - h.h, h.w, h.h); g.moveTo(h.x + h.w / 2, h.y - h.h); g.lineTo(h.x + h.w / 2 + h.d, h.y - h.h - h.d * .6); g.lineTo(h.x + h.w / 2 + h.d, h.y - h.d * .6); g.lineTo(h.x + h.w / 2, h.y); }));
    const mdist = (x, y) => Math.hypot(x - moon[0], y - moon[1]);
    // sky: long horizontal gouges, wide near the moon and the horizon glow, none high up
    { const lines = []; for (let y = 6; y < H * .75; y += V ? 11 : 10) { const L = []; for (let x = -20; x <= W + 20; x += 24) L.push([x, y + 5 * Math.sin(x * .003 + y * .05) + 10 * (Pilot.fbm(x * .002, y * .004) - .5)]); lines.push(L); }
      pl.hatch(lines, { keep: (x, y) => pl.reg(x, y) === 1 && mdist(x, y) > mr + 10, kind: 'v', len: [70, 260], gap: [6, 40], thr: .1, wmin: 1, wmax: 7, gamma: 1.2,
        tone: (x, y) => { const m = Math.exp(-(mdist(x, y) - mr) / (V ? 210 : 250)), hz = Math.exp(-Math.max(0, farRidge(x) - y) / (V ? 150 : 130)) * .8, cl = .45 + .9 * Pilot.fbm(x * .0022 + 3, y * .007);
          return clamp((.04 + .8 * m + hz) * cl - .12 * (1 - y / farRidge(x))); } }); }
    // the moon: carved white, rays of the U-gouge around it
    { const pts = []; for (let a = 0; a < 6.3; a += .05) pts.push([moon[0] + Math.cos(a) * mr * (1 + .02 * Math.sin(a * 7)), moon[1] + Math.sin(a) * mr]);
      for (let k = 0; k < mr * 2; k += 5) { const y = moon[1] - mr + k + 2, hw = Math.sqrt(Math.max(0, mr * mr - (y - moon[1]) ** 2)); if (hw > 3) pl.cut([[moon[0] - hw, y], [moon[0] + hw, y]], 7.5, { kind: 'u', chip: .05 }); }
      for (const [rr, w] of [[mr + 16, 3.2], [mr + 30, 2.2], [mr + 42, 1.4]]) for (let a0 = 0; a0 < 6.28; a0 += .5 + (rr % 3) * .1) { const pts = []; for (let a = a0; a < a0 + .38; a += .04) pts.push([moon[0] + Math.cos(a) * rr, moon[1] + Math.sin(a) * rr]); pl.cut(pts, w, { kind: 'v' }); } }
    // stars: stab cuts, some appear in the first seconds (the block is still being finished as we arrive)
    { const r = rng(17), list = []; for (let i = 0; i < (V ? 120 : 150); i++) { const x = r() * W, y = r() * (V ? H * .34 : H * .5); if (pl.reg(x, y) === 1 && mdist(x, y) > mr * 3) list.push([x, y, 1.2 + r() * r() * 3.2]); }
      pl.stabs(list, { t0: (x, y, r) => r() < .35 ? .2 + r() * 3.5 : undefined }); }
    // far ridge: contour cuts following the ridge, catching the moonlight on its crest only
    { const lines = []; for (let k = 6; k < 300; k += 9) { const L = []; for (let x = -20; x <= W + 20; x += 20) L.push([x, farRidge(x) + k + 4 * Math.sin(x * .01 + k)]); lines.push(L); }
      pl.hatch(lines, { keep: (x, y) => pl.reg(x, y) === 2, len: [50, 180], gap: [8, 40], thr: .1, wmin: .8, wmax: 4.5, tone: (x, y) => clamp(.62 - (y - farRidge(x)) / 110 + .25 * (x / W - .5)) }); }
    // village hill: terraces — contour cuts parallel to the crest, lit toward the moon (right), dark toward the bottom
    { const lines = []; for (let k = 10; k < 520; k += 11) { const L = []; for (let x = -20; x <= W + 20; x += 16) L.push([x, hillTop(x) + k + 5 * Math.sin(x * .006 + k * .3)]); lines.push(L); }
      pl.hatch(lines, { keep: (x, y) => pl.reg(x, y) === 3 && y < ground - 10, len: [40, 150], gap: [6, 30], thr: .12, wmin: .9, wmax: 5.5,
        tone: (x, y) => clamp(.75 - (y - hillTop(x)) / (V ? 300 : 240) + .3 * (x / W - .45)) }); }
    // olive trees on the slope: black crowns with a knife halo and a few lit cuts on the moon side
    { const r = rng(23); for (let i = 0; i < (V ? 9 : 12); i++) { const x = r() * W, y = hillTop(x) + 90 + r() * (V ? 220 : 150); if (y > ground - 30 || pl.reg(x, y) !== 3) continue; const rr = 16 + r() * 12;
      const R = a => rr * (1 + .22 * Math.sin(a * 3 + i) + .12 * Math.sin(a * 7 + i * 2));
      pl.region(40, g => { for (let a = 0; a <= 6.3; a += .1) g.lineTo(x + Math.cos(a) * R(a) * 1.35, y + Math.sin(a) * R(a)); g.closePath(); g.rect(x - 3, y + rr * .5, 6, rr * 1.1); });
      const ring = []; for (let a = -2.8; a <= .6; a += .08) ring.push([x + Math.cos(a) * (R(a) * 1.35 + 5), y + Math.sin(a) * (R(a) + 5)]); pl.halo(ring, { w: 2 });
      const fl = []; for (let j = 0; j < 22; j++) { const a = -2.2 + r() * 2.6, d = .35 + r() * .55; fl.push([x + Math.cos(a) * R(a) * 1.3 * d, y + Math.sin(a) * R(a) * d, .9 + r() * 1.2]); } pl.stabs(fl); } }
    // houses: the moon side carved in vertical cuts, the front in a few fine horizontals, a bright roof edge, lamplit windows
    houses.forEach((h, i) => { const id = 10 + i, x0 = h.x - h.w / 2, x1 = h.x + h.w / 2, top = h.y - h.h;
      const side = []; for (let k = 3; k < h.d; k += 4.2) side.push([[x1 + k, top - k * .6 + 3], [x1 + k, h.y - k * .6 - 2]]);
      pl.hatch(side, { keep: (x, y) => pl.reg(x, y) === id, tone: () => .8, thr: .1, len: [400, 400], wmin: 1.6, wmax: 3.2 });
      const front = []; for (let y = top + 7; y < h.y - 4; y += 7) front.push([[x0 + 3, y], [x1 - 3, y]]);
      pl.hatch(front, { keep: (x, y) => pl.reg(x, y) === id, tone: (x, y) => clamp(.16 + .3 * (x - x0) / h.w - (y - top) / h.h * .3), thr: .2, len: [10, 30], gap: [10, 34], wmin: .6, wmax: 1.6 });
      pl.cut([[x0 - 2, top], [x1 + 1, top], [x1 + h.d, top - h.d * .6]], 3.4, { kind: 'k', chip: .1 });          // roof edge in moonlight
      if (h.win) { const wx = x0 + h.w * (.25 + .4 * h.k), wy = top + h.h * .35, ww = 9, wh = 13;
        for (let k = 0; k < 4; k++) pl.cut([[wx + k * 2.4, wy], [wx + k * 2.4, wy + wh]], 3.4, { kind: 'u', chip: .05, t0: 1.0 + h.k * 4 + k * .05, dur: .2 });
        h.wx = wx + 4; h.wy = wy + wh / 2; }
      pl.cut([[x0 + 2, top + 4], [x1 - 2, top + 4]], 1.4); });
    // the town wall at the foot of the houses: a long lit coping line and stone joints
    { const c = V ? W * .5 : W * .52, half = V ? W * .4 : W * .25, pts = []; for (let x = c - half; x <= c + half; x += 12) pts.push([x, hillTop(x) + (V ? 110 : 96) + 12 * Math.abs((x - c) / half)]);
      pl.cut(pts, 4.2, { kind: 'k', chip: .12 });
      for (let x = c - half + 10; x < c + half; x += 26) { const y = hillTop(x) + (V ? 110 : 96) + 12 * Math.abs((x - c) / half); pl.cut([[x, y + 8], [x + 14, y + 8]], 1.6); pl.cut([[x + 13, y + 20], [x + 27, y + 20]], 1.4); } }
    // gold plate (shows only through the cuts): lamplight in the windows; at "베들레헴" the whole town warms
    pl.gold((g, t) => { const warm = ss(9.2, 11.6, t);
      for (const h of houses) if (h.wx) { const a = ss(1.0 + h.k * 4, 1.6 + h.k * 4, t); if (a <= 0) continue; const gr = g.createRadialGradient(h.wx, h.wy, 0, h.wx, h.wy, 22 + 30 * warm); gr.addColorStop(0, `rgba(${GOLD},${a})`); gr.addColorStop(1, `rgba(${GOLD},0)`); g.fillStyle = gr; g.fillRect(h.wx - 60, h.wy - 60, 120, 120); }
      if (warm > 0) { g.save(); g.beginPath(); for (const h of houses) g.rect(h.x - h.w / 2 - 6, h.y - h.h - h.d - 6, h.w + h.d + 12, h.h + h.d + 12); g.clip(); const c = V ? W * .5 : W * .52, cy = hillTop(c) - (V ? 10 : 20), R = V ? W * .5 : W * .3, gr = g.createRadialGradient(c, cy, 0, c, cy, R); gr.addColorStop(0, `rgba(${GOLD},${.95 * warm})`); gr.addColorStop(.6, `rgba(${GOLD},${.45 * warm})`); gr.addColorStop(1, `rgba(${GOLD},0)`); g.fillStyle = gr; g.fillRect(c - R, cy - R, 2 * R, 2 * R); g.restore(); } });
  });
}
function partBethlehem(ctx, t) {
  ctx.fillStyle = Woodcut.INK; ctx.fillRect(0, 0, W, H);
  const c = V ? W * .5 : W * .52, push = eio(clamp(t / 16));
  BETH.render(ctx, t, { x: lerp(W / 2, c, push * .6), y: lerp(H / 2, V ? H * .44 : H * .5, push), z: lerp(1, V ? 1.1 : 1.12, push) });
  Woodcut.brayer(ctx, eio(clamp((t - 15.4) / 1.6)));
}


// =====================================================================================================================
// 3 · 1:01–1:35  the emperor's decree — silkscreen travel posters, printed one ink at a time (made to read on a phone):
//   A 「나사렛」: a village in the Galilee hills at dusk, its name printed into the sky
//   B the empire: from Rome the decree goes out — red routes stamped segment by segment, to Judea last
//   C the journey: Nazareth → Bethlehem along the Jordan valley, Joseph and Mary on the road, a km counter; at Bethlehem
//     the name turns gold and Micah 5:2 is read — then silence.
const SILK = { sky: ['#F6CD98', '#F1B489', '#EE9A73', '#C98478'], far: '#9A7FA8', mid: '#3E7079', near: '#1E3B3F', gold: '#F2B134', red: '#E04F37',
  sea: '#7FB3C8', navy: '#173247', night: '#1F2A3C', land: '#2E4A5A', ridge: '#3D6072', glint: '#BFD3DE', cream: '#F3E8CF' };
let PAPER = null;
const silkLayout = () => V ? { hz: H * .47, sun: [W * .7, H * .47 - 40], sr: 110, title: [W / 2, H * .2], ts: 200, lab: H * .2 + 96 }
                            : { hz: H * .56, sun: [W * .74, H * .56 - 40], sr: 92, title: [W / 2, H * .27], ts: 170, lab: H * .27 + 84 };
const ridgePath = (y0, amp, f, ph, toY) => { const p = new Path2D(); p.moveTo(0, toY); for (let x = 0; x <= W; x += 12) p.lineTo(x, y0 - amp * (.55 + .45 * Math.sin(x * f + ph)) - amp * .3 * Math.sin(x * f * 2.7 + ph * 2)); p.lineTo(W, toY); p.closePath(); return p; };
function infoBand(ctx, k = 1) { const y0 = Film.SAFE() - (V ? 70 : 30), p = new Path2D(); p.rect(0, y0, W, H - y0); Silk.ink(ctx, p, SILK.near, { k, dir: 'up', reg: [1, 0] }); }
function posterNazareth(ctx, t) {
  const L = silkLayout(), pull = (a, d = .5) => clamp((t - a) / d);
  ctx.drawImage(PAPER, 0, 0);
  Silk.bands(ctx, 0, 0, W, L.hz + 30, SILK.sky, { k: pull(61.0, .6) });
  { const p = new Path2D(); p.arc(L.sun[0], L.sun[1], L.sr, 0, 6.283); Silk.ink(ctx, p, SILK.gold, { k: pull(61.4, .4), reg: [2, -1] });
    const rings = new Path2D(); for (const r of [L.sr + 26, L.sr + 52]) { rings.arc(L.sun[0], L.sun[1], r + 7, 0, 6.283); rings.arc(L.sun[0], L.sun[1], r, 0, 6.283, true); } Silk.ink(ctx, rings, '#F8DDA8', { k: pull(61.5, .4), rim: false }); }
  Silk.ink(ctx, ridgePath(L.hz - (V ? 60 : 40), V ? 120 : 90, .0042, 1.2, H), SILK.far, { k: pull(61.7, .45), reg: [-2, 1] });
  Silk.ink(ctx, ridgePath(L.hz + (V ? 70 : 60), V ? 90 : 70, .0063, 2.6, H), SILK.mid, { k: pull(62.0, .45), reg: [1, 2] });
  // Nazareth: a small town of flat roofs on the middle hill; its windows are left as bare paper (lamplight)
  { const k = pull(62.3, .35), cx = V ? W * .4 : W * .42, cy = L.hz + (V ? 30 : 30), houses = new Path2D(), wins = new Path2D(), r = rng(9);
    for (let i = 0; i < 11; i++) { const x = cx + (i - 5) * (V ? 40 : 34) + (r() - .5) * 12, w = (V ? 48 : 40) + r() * 20, h = (V ? 40 : 34) + r() * 26, y = cy + Math.abs(i - 5) * 6 + r() * 10;
      houses.rect(x - w / 2, y - h, w, h + 40); if (r() < .6) wins.rect(x - 4, y - h * .6, 9, 12); }
    Silk.ink(ctx, houses, SILK.near, { k, reg: [1, 1] }); Silk.ink(ctx, wins, SILK.gold, { k: pull(62.6, .3), rim: false }); }
  Silk.ink(ctx, ridgePath(L.hz + (V ? 230 : 190), V ? 60 : 50, .0031, .4, H), SILK.near, { k: pull(62.5, .45), reg: [0, 1] });
  Silk.title(ctx, Film.text('M1'), L.title[0], L.title[1], L.ts, SILK.near, { k: pull(62.9, .5) });
  Silk.title(ctx, Film.text('M4'), L.title[0], L.lab, V ? 56 : 48, SILK.mid, { k: pull(63.4, .4), weight: 700, ls: 14 });
  infoBand(ctx, pull(61.2, .5));
}
// ---- the empire map ----
const EMPROUTES = [   // [places, delay s] — the decree goes out from Rome by road and sea; Judea last
  [[[12.5, 41.9], [11.3, 43.8], [8.9, 44.4], [5.4, 43.3], [3.0, 43.2], [1.2, 41.1], [-3.7, 40.4]], 0],
  [[[12.5, 41.9], [11.3, 43.8], [9.2, 45.5], [6.5, 46.8], [3.5, 48.3]], .3],
  [[[12.5, 41.9], [12.3, 41.75], [11.5, 39.0], [10.3, 36.9]], .2],
  [[[12.5, 41.9], [14.2, 41.1], [17.9, 40.6], [19.4, 41.3], [22.9, 40.6], [26.0, 40.6], [29.0, 41.0], [32.9, 39.9]], .5],
  [[[12.3, 41.75], [15.6, 38.2], [20.0, 35.5], [25.0, 33.5], [29.9, 31.2]], .7],
  [[[17.9, 40.6], [20.5, 37.8], [24.5, 34.6], [29.5, 33.6], [33.0, 32.9], [34.9, 32.5], [35.2, 31.8]], 1.1],
];
const empP = () => { const C = Math.cos(38 * Math.PI / 180), K = V ? W * .98 / (44 * C) : W * .86 / (44 * C), cx = W / 2, cy = V ? H * .38 : H * .4;
  return ([lon, lat]) => [cx + (lon - 15.5) * K * C, cy - (lat - 38.5) * K]; };
function posterEmpire(ctx, t) {
  const pull = (a, d = .5) => clamp((t - a) / d), P2 = empP(), D = InkMap.MED;
  ctx.drawImage(PAPER, 0, 0);
  const sea = new Path2D(); [...D.seas].forEach(sp => { sp.forEach((p, i) => { const [x, y] = P2(p); i ? sea.lineTo(x, y) : sea.moveTo(x, y); }); sea.closePath(); });
  const isl = new Path2D(); D.islands.forEach(sp => { sp.forEach((p, i) => { const [x, y] = P2(p); i ? isl.lineTo(x, y) : isl.moveTo(x, y); }); isl.closePath(); });
  Silk.ink(ctx, sea, SILK.sea, { k: pull(68.4, .5), reg: [2, 1] });
  ctx.save(); ctx.clip(sea); ctx.drawImage(PAPER, 0, 0); ctx.restore();   // islands knocked out of the sea ink (paper again)
  ctx.save(); const sea2 = new Path2D(); sea2.addPath(isl); ctx.clip(isl); ctx.drawImage(PAPER, 0, 0); ctx.restore();
  Silk.ink(ctx, sea, SILK.sea, { k: pull(68.4, .5), reg: [2, 1], rim: false }); { ctx.save(); ctx.clip(isl); ctx.drawImage(PAPER, 0, 0); ctx.restore(); }
  // the decree: red routes stamped from Rome, one segment at a time; the last one reaches Judea
  const t0 = 70.6, sp = V ? 300 : 420;
  let judea = 0; for (const [pts, delay] of EMPROUTES) { const q = pts.map(P2); let L = 0; for (let i = 1; i < q.length; i++) L += Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]);
    const k = clamp((t - t0 - delay) * sp / L); Silk.dashes(ctx, q, k, { color: SILK.red, w: V ? 7 : 8, step: V ? 18 : 22, dash: V ? 11 : 14 }); if (delay > 1) judea = k; }
  const [rx, ry] = P2([12.5, 41.9]), [jx, jy] = P2([35.2, 31.8]);
  { const p = new Path2D(); p.arc(rx, ry, V ? 15 : 17, 0, 6.283); Silk.ink(ctx, p, SILK.red, { k: pull(70.0, .3) }); const q = new Path2D(); q.arc(rx, ry, V ? 6 : 7, 0, 6.283); Silk.ink(ctx, q, SILK.cream, { k: pull(70.1, .3), rim: false }); }
  Silk.title(ctx, Film.text('M6'), rx, ry - (V ? 30 : 34), V ? 52 : 50, SILK.navy, { k: pull(70.2, .4), ls: 4 });
  if (judea > .98) { const p = new Path2D(); p.arc(jx, jy, V ? 13 : 15, 0, 6.283); Silk.ink(ctx, p, SILK.gold, { k: 1, sheen: 1 - ss(75.2, 76, t) }); Silk.title(ctx, Film.text('M5'), jx - (V ? 6 : 0), jy - (V ? 26 : 28), V ? 44 : 44, SILK.navy, { k: pull(75.0, .4), ls: 4, align: V ? 'right' : 'center' }); }
  // a navy header band: the emperor's name, printed last at the top
  { const hb = V ? 300 : 150, p = new Path2D(); p.rect(0, 0, W, hb); Silk.ink(ctx, p, SILK.navy, { k: pull(68.9, .4), dir: 'down' });
    Silk.title(ctx, Film.text('A1'), W / 2, hb * (V ? .62 : .66), V ? 60 : 58, SILK.cream, { k: pull(69.3, .5), weight: 800, ls: 6 }); }
  infoBand(ctx, 1);
}
// ---- the journey poster ----
const HLROUTE = [[35.30, 32.70], [35.38, 32.64], [35.50, 32.50], [35.555, 32.28], [35.55, 32.05], [35.47, 31.90], [35.44, 31.86], [35.36, 31.82], [35.27, 31.79], [35.23, 31.78], [35.21, 31.745], [35.20, 31.705]];
const jrP = () => { const K = V ? 760 : 590, C = Math.cos(32 * Math.PI / 180), y0 = V ? 300 : 110, cx = V ? W * .5 : W * .5;
  return ([lon, lat]) => [cx + (lon - 35.35) * K * C, y0 + (32.70 - lat) * K]; };
const polyPath = (pts, close = true) => { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); if (close) p.closePath(); return p; };

function traveller(ctx, x, y, s, step) {   // a pictogram: Mary on a donkey, Joseph walking ahead with a staff (flat cream ink)

  const sw = Math.sin(step * 6.283) * 5;

  ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(30, -26); ctx.lineTo(40, -22); ctx.lineTo(24, 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(38, -24, 9, 6, -.4, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30, -30); ctx.lineTo(27, -44); ctx.lineTo(33, -31); ctx.fill();
  ctx.lineWidth = 5; for (const [lx, ph] of [[-32, 0], [-22, .5], [0, .5], [10, 0]]) { const d = Math.sin((step + ph) * 6.283) * 5; ctx.beginPath(); ctx.moveTo(lx, 8); ctx.lineTo(lx + d, 34); ctx.stroke(); }
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-41, -4); ctx.quadraticCurveTo(-50, 6, -46, 16); ctx.stroke();
  // Mary, veiled, sitting
  ctx.beginPath(); ctx.moveTo(-26, -8); ctx.quadraticCurveTo(-24, -36, -14, -46); ctx.quadraticCurveTo(-4, -52, 2, -44); ctx.quadraticCurveTo(4, -26, 0, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = SILK.gold; ctx.beginPath(); ctx.arc(-6, -46, 7, 0, 6.283); ctx.fill(); ctx.fillStyle = SILK.cream;

  ctx.beginPath(); ctx.moveTo(56, -40); ctx.lineTo(72, -40); ctx.lineTo(76, 10); ctx.lineTo(52, 10); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(58, 10); ctx.lineTo(56 - sw, 34); ctx.moveTo(70, 10); ctx.lineTo(72 + sw, 34); ctx.stroke();
  ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(84, -60); ctx.lineTo(86, 34); ctx.stroke(); ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(70, -34); ctx.lineTo(84, -22); ctx.stroke();
  ctx.restore();
}
function townIcon(ctx, x, y, s, col, win) { const p = new Path2D(), w = new Path2D(); for (const [dx, h, bw] of [[-22, 26, 22], [-2, 36, 24], [20, 22, 20]]) { p.rect(x + (dx - bw / 2) * s, y - h * s, bw * s, h * s); w.rect(x + (dx - 2) * s, y - h * .6 * s, 5 * s, 6 * s); }
  Silk.ink(ctx, p, col, { reg: [1, 1] }); if (win) Silk.ink(ctx, w, win, { rim: false }); }
function posterJourney(ctx, t) {
  const pull = (a, d = .5) => clamp((t - a) / d), P2 = jrP();
  ctx.drawImage(PAPER, 0, 0);
  { const p = new Path2D(); p.rect(0, 0, W, H); Silk.ink(ctx, p, SILK.night, { k: pull(76.6, .5), rim: false }); }
  const coast = [[35.10, 33.60], [35.20, 33.27], [35.08, 32.93], [34.97, 32.83], [34.92, 32.62], [34.89, 32.48], [34.80, 32.20], [34.75, 32.05], [34.66, 31.85], [34.55, 31.67], [34.45, 31.50], [34.30, 31.30], [34.20, 31.05], [34.0, 30.5]].map(P2);
  const land = polyPath([...coast, [W + 50, P2([34, 30.5])[1]], [W + 50, -50], [coast[0][0], -50]]);
  Silk.ink(ctx, land, SILK.land, { k: pull(76.9, .5), reg: [2, 1] });
  // the central hill country: stepped ridges (lighter ink), so the road is seen to go down to the valley and back up
  { const r = rng(3), p = new Path2D(); for (let i = 0; i < 26; i++) { const lat = 31.6 + r() * 1.1, lon = 35.05 + r() * .28, [x, y] = P2([lon, lat]), w = (V ? 46 : 40) + r() * 30, h = (V ? 20 : 16) + r() * 12; p.moveTo(x - w / 2, y); p.lineTo(x - w * .1, y - h); p.lineTo(x + w * .1, y - h * .8); p.lineTo(x + w / 2, y); p.closePath(); }
    Silk.ink(ctx, p, SILK.ridge, { k: pull(77.1, .4), rim: false }); }
  // water left as pale ink: the Sea of Galilee, the Jordan, the Dead Sea
  { const lake = polyPath([[35.53, 32.82], [35.57, 32.89], [35.62, 32.88], [35.65, 32.82], [35.64, 32.74], [35.60, 32.70], [35.56, 32.72], [35.53, 32.77]].map(P2));
    const dead = polyPath([[35.47, 31.78], [35.56, 31.75], [35.58, 31.55], [35.55, 31.30], [35.48, 31.10], [35.40, 31.05], [35.38, 31.25], [35.42, 31.50], [35.43, 31.70]].map(P2));
    const jor = chaikin([[35.59, 32.70], [35.57, 32.60], [35.58, 32.48], [35.55, 32.35], [35.56, 32.20], [35.54, 32.05], [35.55, 31.92], [35.53, 31.80], [35.52, 31.77]].map(P2));
    const k = pull(77.3, .4); Silk.ink(ctx, lake, SILK.glint, { k, rim: false }); Silk.ink(ctx, dead, SILK.glint, { k, rim: false });
    if (k > 0) { ctx.save(); ctx.strokeStyle = SILK.glint; ctx.lineWidth = V ? 6 : 5; ctx.lineJoin = 'round'; ctx.stroke(polyPath(jor, false)); ctx.restore(); }
    const sea = polyPath([[-50, -50], [coast[0][0], -50], ...coast, [-50, H + 50]]); Silk.ink(ctx, sea, SILK.navy, { k, rim: false }); }
  // the road and the travellers; a km counter
  const route = chaikin(HLROUTE.map(P2), 2), r0 = 77.8, r1 = 89.4, k = clamp((t - r0) / (r1 - r0)), kk = k < 1 ? k * k * (3 - 2 * k) * .15 + k * .85 : 1;
  const { head } = Silk.dashes(ctx, route, kk, { color: SILK.gold, w: V ? 9 : 8, step: V ? 24 : 20, dash: V ? 14 : 12 });

  townIcon(ctx, ...P2(HLPLACE.nazareth), V ? 1.5 : 1.25, SILK.cream, SILK.gold);
  { const [jx, jy] = P2(HLPLACE.jerusalem); townIcon(ctx, jx + (V ? 30 : 26), jy - 2, V ? 1.0 : .85, '#9fb3c0', null); }
  townIcon(ctx, ...P2(HLPLACE.bethlehem), V ? 1.5 : 1.25, arrive > 0 ? SILK.gold : SILK.cream, arrive > 0 ? SILK.cream : null);
  const lab = (id, ll, dx, dy, col, size) => { const [x, y] = P2(ll); Silk.title(ctx, Film.text(id), x + dx, y + dy, size, col, { k: pull(77.4, .4), weight: 800, ls: 3, align: dx < 0 ? 'right' : dx > 0 ? 'left' : 'center' }); };
  lab('M1', HLPLACE.nazareth, V ? -50 : -44, V ? -10 : -8, SILK.cream, V ? 54 : 44);
  lab('M3', HLPLACE.jerusalem, V ? 70 : 60, V ? -2 : -2, '#c9d6de', V ? 40 : 34);
  lab('M2', HLPLACE.bethlehem, V ? -46 : -40, V ? 54 : 46, arrive > 0 ? SILK.gold : SILK.cream, V ? 58 : 48);
  if (k > 0 && k < 1.02) { const [hx, hy] = head; traveller(ctx, hx + (V ? 46 : 40), hy - (V ? 6 : 4), V ? .95 : .8, t * .9); }
  // arrival: the town answers with rings of light (bare paper)
  if (arrive > 0) { const [bx, by] = P2(HLPLACE.bethlehem); ctx.save(); ctx.globalAlpha = 1 - ss(r1 + 1.6, r1 + 3.2, t); ctx.strokeStyle = SILK.gold; for (let i = 0; i < 3; i++) { const rr = (30 + i * 26 + 40 * clamp((t - r1) / 1.6)) * (V ? 1.2 : 1); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by - 20, rr, 0, 6.283); ctx.stroke(); } ctx.restore(); }
  // the counter: "나사렛에서 {n} km", top right, gold numbers
  { const n = Math.round(150 * kk), a = pull(77.6, .3); if (a > 0) Silk.title(ctx, Film.text('K1').replace('{n}', n), V ? 60 : 90, V ? 190 : 110, V ? 52 : 46, SILK.gold, { k: a, weight: 800, ls: 2, align: 'left' }); }

}
const HLPLACE = { nazareth: [35.30, 32.70], jerusalem: [35.23, 31.78], bethlehem: [35.20, 31.705] };
function partDecree(ctx, t) {
  if (t < 68.4) posterNazareth(ctx, t); else if (t < 76.6) posterEmpire(ctx, t); else posterJourney(ctx, t);
}
function buildSilk() { PAPER = Silk.paper(W, H, 5); }

// =====================================================================================================================
// 4 · 1:35–2:08  that night — a cave (the tradition since the early church: the birth in a cave at Bethlehem), in the
// cavesil kit's look (word-log): everything cool blue and black, ONE warm thing — the child in the manger. Mary kneels by
// it; Joseph stands, then kneels; two shepherds come in from the cave mouth and kneel. Rims warm as they near the child.
const CK = () => Cavesil;
const MX = 600;                                   // the manger (world x)
function nightCam(t) { const K = CK(), { FY } = K.Y, z0 = V ? 1.75 : 1.35, z1 = V ? 1.32 : 1.0, zz = lerp(z0, z1, eio(clamp((t - 96) / 9)));
  const yOn = (sy, z) => FY - (sy - H / 2) / z;     // world y whose screen y is sy
  const k2 = eio(clamp((t - 104) / 4)), x = lerp(MX + 10, MX + 150, k2);
  return { x, y: yOn(V ? H * .56 : H * .6, zz), z: zz, sx: 0, sy: 0 }; }
function manger(ctx, t, glowK) {
  const K = CK(), { FY } = K.Y, C = K.C, x = MX, y = FY;
  K.glow(ctx, x, y - 60, 520, .5 * glowK); K.glow(ctx, x, y - 50, 260, .75 * glowK); K.glow(ctx, x, y - 40, 110, .9 * glowK);
  // the trough: rough boards in the warm wood, lit from the child inside
  ctx.save(); ctx.fillStyle = C.woodD || '#a9682e';
  ctx.beginPath(); ctx.moveTo(x - 74, y - 58); ctx.lineTo(x + 74, y - 58); ctx.lineTo(x + 58, y - 14); ctx.lineTo(x - 58, y - 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e9b46a'; ctx.fillRect(x - 76, y - 62, 152, 7);
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 2; for (const yy of [y - 42, y - 28]) { ctx.beginPath(); ctx.moveTo(x - 66, yy); ctx.lineTo(x + 66, yy); ctx.stroke(); }
  ctx.strokeStyle = '#a9682e'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 52, y - 16); ctx.lineTo(x - 30, y + 2); ctx.moveTo(x + 52, y - 16); ctx.lineTo(x + 30, y + 2); ctx.stroke();
  // straw over the edge
  const r = rng(77); ctx.strokeStyle = '#ffe4ac'; ctx.lineWidth = 1.6; for (let i = 0; i < 40; i++) { const sx = x - 70 + r() * 140, sy = y - 60 + r() * 4; ctx.globalAlpha = .6 + .4 * r(); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + (r() - .5) * 18, sy - 6 - r() * 8); ctx.stroke(); }
  ctx.globalAlpha = 1;

  const g = ctx.createRadialGradient(x - 6, y - 70, 2, x, y - 66, 60); g.addColorStop(0, '#fff8e6'); g.addColorStop(.6, '#ffe8bd'); g.addColorStop(1, '#f6c98a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x + 8, y - 68, 44, 15, -.05, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(200,150,90,.55)'; ctx.lineWidth = 2; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + 8 + k * 15 - 5, y - 80); ctx.lineTo(x + 8 + k * 15 + 5, y - 56); ctx.stroke(); }
  ctx.fillStyle = '#ffeccc'; ctx.beginPath(); ctx.arc(x - 40, y - 72, 13, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(150,100,60,.8)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x - 44, y - 74); ctx.quadraticCurveTo(x - 41, y - 72, x - 38, y - 74); ctx.stroke();
  ctx.restore();
}
function nightPoses(t) {
  const K = CK(), { FY, BY } = K.Y, tp = K.t12(t), child = [MX - 30, FY - 70], out = [];
  // Mary: kneeling at the left, bent toward the child
  { const F = K.kneel(MX - 150, FY, 1.0, 1, .62 + .04 * Math.sin(t * 1.2)); F.col = K.C.me; F.me = true; out.push(K.lookAt(F, child, .8)); }
  // Joseph: standing at the right, then kneels beside the manger
  { const ST = K.stand(MX + 150, BY, 1.06, -1, .06), KN = K.kneel(MX + 140, BY, 1.06, -1, .4); const F = K.mix(ST, KN, eio((tp - 99.6) / .5)); F.col = '#13293f'; out.push(K.lookAt(F, child, .7)); }
  // two shepherds come in from the cave mouth (right) and kneel
  [[1180, MX + 300, 104.0, FY], [1300, MX + 420, 104.6, BY]].forEach(([x0, xk, t0, gy], i) => {
    const v = 150, xA = x0 - v * Math.max(0, tp - t0), arr = t0 + (x0 - xk) / v;
    let F; if (tp < arr) F = K.walkFree(Math.max(xk, xA), gy, 1.02 - i * .04, -1, xA / 150, 150, .1, 22);
    else { const W1 = K.stand(xk, gy, 1.02 - i * .04, -1, .05), KN = K.kneel(xk, gy, 1.02 - i * .04, -1, .5 + i * .1); F = K.mix(W1, KN, eio((tp - arr - .3) / .55)); }
    F.col = '#17324f'; out.push(K.lookAt(F, child, .7)); });

}
function partNight(ctx, t) {
  const K = CK(), cm = nightCam(t), lk = 1, glowK = .8 + .2 * Math.sin(t * 1.3) * Math.sin(t * .7 + 1);

  K.layer(ctx, cm, 1, () => { K.ground(ctx, t, cm, lk);

    manger(ctx, t, glowK); K.figure(ctx, F[0]); K.figure(ctx, F[2]);

function buildNight() { const K = CK(); K.init(); K.buildCave({ x0: -1200, x1: 2400, shafts: [[-200, 260, 300, 140], [1500, 300, 320, 150]], spikesOK: x => Math.abs(x - MX) > 520 }); }

// =====================================================================================================================
// the timeline (pilot: parts 1, 3, 4)
const SCENES = [[0, 21, partBethlehem], [61, 95, partDecree], [95, 113, partNight]];
const QB = () => ({ bottom: Film.subBottom() + 40 });
const TEXT = [
  ['sub', '01', 0.4, 6.6], ['label', 'P0', 4.0, 15.2], ['quote', '02', 7.0, 15.4, { ...QB(), hlk: 1, hlAt: 9.4 }],
  ['title', 'T1', 16.6, 19.0], ['sub', 'Q1', 19.0, 21.0],
  ['sub', '13', 61.4, 67.6], ['quote', '14', 68.4, 75.6, QB()], ['quote', '15', 76.8, 84.6, { ...QB(), hlAt: 81.5 }], ['sub', '16', 85.0, 89.6],
  ['micah', '02', 89.8, 94.2],
  ['quote', '17', 95.6, 104.0, QB()],

function title(ctx, id, t, a, b) { const ta = win(t, a, b, .9, .6); if (ta <= 0) return; const sz = V ? 100 : 108, ty = V ? H * .45 : H * .48;
  Pilot.text(ctx, Film.text(id), W / 2, ty, { size: sz, weight: 600, color: '#e9c77a', alpha: ta, shadow: 'rgba(233,185,73,.35)', shadowBlur: 40, ls: 6 });
  const lw = (V ? 420 : 520) * eo(clamp((t - a - .3) / 1.6)); ctx.fillStyle = `rgba(233,199,122,${ta * .8})`; ctx.fillRect(W / 2 - lw / 2, ty + (V ? 50 : 54), lw, 2); }
const FILM_DUR = 113;
function draw(ctx, t) {
  for (const [a, b, f] of SCENES) if (t >= a && t < b) { ctx.save(); f(ctx, t); ctx.restore(); }
  for (const [kind, id, a, b, o] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b, o); else if (kind === 'label') Film.label(ctx, id, t, a, b); else if (kind === 'title') title(ctx, id, t, a, b);
    else if (kind === 'micah') { const seg = Film.text(id).split(/\s*\/\s*/)[0]; Film.quote(ctx, id, t, a, b, { text: seg, ...QB(), hl: Film.lines[id].hl, hlk: ss(a + .4, a + 1.4, t), color: '#fff3d6', shadow: 'rgba(255,190,90,.45)' }); }
    else if (kind === 'quote') Film.quote(ctx, id, t, a, b, { ...o, hl: Film.lines[id].hl, hlk: o.hlAt ? ss(o.hlAt, o.hlAt + 1.2, t) : 0 }); }
}
Pilot.run({ W, H, dur: FILM_DUR, fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => { await Film.load(); buildBethlehem(); buildSilk(); buildNight(); }, draw });
</script>
