<script>
/* 침묵의 400년 — one continuous ~2:50 film. Look: night, lamplight and gold on parchment; one scroll is the main
   character (it goes dark at the start and lights again at the end). Line ids = script.json. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, hex, mix, rgb } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
let parch, grain, motes = [];

function init() {
  // parchment texture: low-res fbm stretched (soft fibres + blotches), warm
  const pw = 480, ph = 270, c = canvas(pw, ph), x = c.getContext('2d'), d = x.createImageData(pw, ph);
  for (let j = 0; j < ph; j++) for (let i = 0; i < pw; i++) {
    const n = fbm(i / 60, j / 60, 5), f = fbm(i / 6, j / 90, 2), v = .78 + (n - .5) * .35 + (f - .5) * .08, o = (j * pw + i) * 4;
    d.data[o] = 222 * v; d.data[o + 1] = 196 * v; d.data[o + 2] = 150 * v; d.data[o + 3] = 255; }
  x.putImageData(d, 0, 0); parch = c;
  grain = Pilot.speckle(512, 512, 22, 7, .4);
  const r = rng(11); for (let i = 0; i < 70; i++) motes.push([r(), r(), .3 + r() * .9, r() * 6.28, .2 + r() * .8]);
}

// ---------- shared furniture ----------
function vignette(ctx, k = .85) { const g = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${k})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function filmGrain(ctx, t, a = .06) { ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  const ox = (Math.floor(t * 24) * 137) % 512, oy = (Math.floor(t * 24) * 251) % 512;
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) ctx.drawImage(grain, x, y); ctx.restore(); }
function dust(ctx, t, light, a = 1) {   // motes drifting in the lamplight
  ctx.save(); for (const [mx, my, s, ph, b] of motes) {
    const x = ((mx * W + t * 9 * s + Math.sin(t * .3 + ph) * 30) % W + W) % W, y = ((my * H - t * 6 * s) % H + H) % H;
    const d = Math.hypot(x - light[0], y - light[1]) / (Math.max(W, H) * .5), k = clamp(1 - d) * b * a; if (k < .02) continue;
    ctx.fillStyle = `rgba(255,220,160,${k * .5})`; ctx.beginPath(); ctx.arc(x, y, 1.2 + s * 1.6, 0, 6.283); ctx.fill(); }
  ctx.restore(); }

// the scroll: open width 0..1, light 0..1 (lamplight on it), centred at (cx, cy) with size (w, h)
function scroll(ctx, cx, cy, w, h, open, light) {
  const ow = w * open, x0 = cx - ow / 2, y0 = cy - h / 2;
  ctx.save();
  // shadow under
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.filter = 'blur(24px)'; ctx.fillRect(x0 + 10, y0 + 30, ow, h); ctx.filter = 'none';
  // sheet
  ctx.beginPath(); ctx.rect(x0, y0, ow, h); ctx.clip();
  ctx.drawImage(parch, cx - w / 2, y0, w, h);
  const g = ctx.createRadialGradient(cx, cy - h * .3, 0, cx, cy, Math.max(w, h) * .75);   // lamplight from above
  g.addColorStop(0, `rgba(255,214,150,${.18 * light})`); g.addColorStop(1, `rgba(20,10,0,${.55 + (1 - light) * .45})`);
  ctx.fillStyle = g; ctx.fillRect(x0, y0, ow, h);
  ctx.fillStyle = `rgba(0,0,0,${(1 - light) * .55})`; ctx.fillRect(x0, y0, ow, h);
  // edge burn
  const e = ctx.createLinearGradient(0, y0, 0, y0 + h); e.addColorStop(0, 'rgba(60,30,5,.45)'); e.addColorStop(.08, 'rgba(60,30,5,0)'); e.addColorStop(.92, 'rgba(60,30,5,0)'); e.addColorStop(1, 'rgba(60,30,5,.45)');
  ctx.fillStyle = e; ctx.fillRect(x0, y0, ow, h);
  ctx.restore();
  // rollers at both ends (wood, lit from above)
  for (const sx of [x0, x0 + ow]) { const rw = V ? 34 : 40, rh = h + (V ? 60 : 70);
    const rg = ctx.createLinearGradient(sx - rw / 2, 0, sx + rw / 2, 0);
    const base = mix([92, 58, 30], [160, 110, 60], light * .8);
    rg.addColorStop(0, rgb(mix(base, [0, 0, 0], .6))); rg.addColorStop(.45, rgb(mix(base, [255, 220, 170], .25))); rg.addColorStop(1, rgb(mix(base, [0, 0, 0], .7)));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(sx - rw / 2, cy - rh / 2, rw, rh, rw / 2); ctx.fill();
    ctx.fillStyle = rgb(mix(base, [0, 0, 0], .35)); for (const yy of [cy - rh / 2 - 26, cy + rh / 2 + 2]) { ctx.beginPath(); ctx.roundRect(sx - rw * .32, yy, rw * .64, 24, 8); ctx.fill(); } }
}

// ---------- 0:00–0:20  the last line goes out ----------
// one scroll, unrolled: parchment from x0 to x1 (mirrored tiles, so no seams), rollers at both ends, lamp-lit around 'lx'
function longScroll(ctx, x0, x1, cy, h, light, lx) {
  const seg = V ? 900 : 1340, y0 = cy - h / 2; ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.filter = 'blur(24px)'; ctx.fillRect(x0 + 10, y0 + 30, x1 - x0, h); ctx.filter = 'none';
  ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, h); ctx.clip();
  for (let x = x0, i = 0; x < x1; x += seg, i++) { ctx.save(); if (i % 2) { ctx.translate(x + seg, 0); ctx.scale(-1, 1); ctx.drawImage(parch, 0, y0, seg + 1, h); } else ctx.drawImage(parch, x, y0, seg + 1, h); ctx.restore(); }
  const g = ctx.createRadialGradient(lx, cy - h * .3, 0, lx, cy, seg * 1.1); g.addColorStop(0, `rgba(255,214,150,${.18 * light})`); g.addColorStop(1, `rgba(20,10,0,${.6 + (1 - light) * .4})`); ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, h);
  const e = ctx.createLinearGradient(0, y0, 0, y0 + h); e.addColorStop(0, 'rgba(60,30,5,.45)'); e.addColorStop(.08, 'rgba(60,30,5,0)'); e.addColorStop(.92, 'rgba(60,30,5,0)'); e.addColorStop(1, 'rgba(60,30,5,.45)'); ctx.fillStyle = e; ctx.fillRect(x0, y0, x1 - x0, h);
  ctx.restore();
  for (const sx of [x0, x1]) { const rw = V ? 34 : 40, rh = h + (V ? 60 : 70), rg = ctx.createLinearGradient(sx - rw / 2, 0, sx + rw / 2, 0), base = mix([92, 58, 30], [160, 110, 60], light * .8);
    rg.addColorStop(0, rgb(mix(base, [0, 0, 0], .6))); rg.addColorStop(.45, rgb(mix(base, [255, 220, 170], .25))); rg.addColorStop(1, rgb(mix(base, [0, 0, 0], .7)));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(sx - rw / 2, cy - rh / 2, rw, rh, rw / 2); ctx.fill();
    ctx.fillStyle = rgb(mix(base, [0, 0, 0], .35)); for (const yy of [cy - rh / 2 - 26, cy + rh / 2 + 2]) { ctx.beginPath(); ctx.roundRect(sx - rw * .32, yy, rw * .64, 24, 8); ctx.fill(); } } }
// text written on the scroll in ink; 'lit' 0..1 turns it to burnished gold with a glow; reveal(i,n) → 0..1 per character
function scrollText(ctx, id, cx, y, size, maxW, o = {}) {
  ctx.save(); ctx.font = Film.font(size, 600); const lines = o.lines || Film.wrapEven(ctx, Film.text(id), maxW); ctx.restore();
  const lit = o.lit || 0, a = o.alpha == null ? 1 : o.alpha;
  if (lit > 0) Film.block(ctx, lines, cx, y, { size, weight: 600, lh: 1.7, color: 'rgba(255,214,130,1)', alpha: lit * .75 * a, shadow: 'rgba(255,200,90,1)', shadowBlur: 40, charAlpha: o.reveal, lineAlpha: o.lineAlpha });   // the halo
  Film.block(ctx, lines, cx, y, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: a, charAlpha: o.reveal, charGlow: o.glow, lineAlpha: o.lineAlpha });                                                   // the ink
  return lines; }
function hlUnder(ctx, lines, cx, y, size, hl, k) {   // a gold underline and a soft light under the words two verses share
  if (!hl || k <= 0) return; ctx.save(); ctx.font = Film.font(size, 600); const lh = size * 1.7;
  lines.forEach((l, i) => { const j = l.indexOf(hl); if (j < 0) return; const lw = ctx.measureText(l).width, x = cx - lw / 2 + ctx.measureText(l.slice(0, j)).width, w = ctx.measureText(hl).width, yy = y + i * lh;
    glow(ctx, x + w / 2, yy - size * .3, w * .9, [255, 214, 130], .45 * k);
    ctx.strokeStyle = `rgba(196,140,40,${k})`; ctx.shadowColor = 'rgba(255,200,90,.9)'; ctx.shadowBlur = 12; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, yy + 12); ctx.lineTo(x + w * Math.min(1, k * 1.4), yy + 12); ctx.stroke(); });
  ctx.restore(); }

function scrollReturn(ctx, t) {   // 1:36–2:00 — the opening's scroll: silence; the promise relights where it went out; the scroll unrolls through
  // four hundred blank years; a pen of light writes Luke 1:17; the words both verses share light together; pull back — one scroll.
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .43, sh = V ? 780 : 560, sw0 = V ? 900 : 1340, Mx = W / 2, Lx = W / 2 + (V ? 1300 : 2000), x0 = Mx - sw0 / 2;
  const un = t < 104.2 ? .5 * eio(clamp((t - 102.0) / 2.2)) : .5 + .5 * eio(clamp((t - 105.4) / 1.4)), x1 = lerp(Mx + sw0 / 2, Lx + sw0 / 2, un), span = (Lx - Mx) + sw0 + 160, zf = W * .94 / span, pull = eio(clamp((t - 111.6) / 3.6));
  let cx = lerp(Mx, Lx, un), z = lerp(1.07, 1, un); cx = lerp(cx, (Mx + Lx) / 2, pull); z = Math.exp(lerp(Math.log(z), Math.log(zf), pull));
  const light = ss(96.6, 97.8, t) * (1 + .04 * Math.sin(t * 7.3) * Math.sin(t * 2.9));
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  glow(ctx, cx, cy - sh * .2, Math.max(W, H) * .7 / z, [120, 80, 40], .3 * light);
  longScroll(ctx, x0, x1, cy, sh, light, cx);
  const hlk = ss(110.2, 111.0, t);
  { const size = V ? 44 : 46, maxW = sw0 - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600); const all = Film.wrapEven(ctx, Film.text('01'), maxW), np = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (all.length - 1) * lh / 2 + size * .32, lines = all.slice(0, np), n = lines.reduce((s, l) => s + Pilot.chars(l).length, 0), r0 = 97.6, r1 = 100.2;
    Film.block(ctx, all.slice(np), Mx, y0 + np * lh, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: .14 * light });
    { const e1 = Film.wrapEven((() => { const c = canvas(2, 2).getContext('2d'); c.font = Film.font(size, 600); return c; })(), Film.text('19a'), maxW);   // Mal 4:5 above it
      scrollText(ctx, '19a', Mx, y0 - lh * e1.length, size, maxW, { lines: e1, lit: ss(97.4, 98.6, t) * (1 - .5 * ss(102.4, 104, t)) + .5 * hlk, reveal: k => ss(96.8 + k * .05, 97.2 + k * .05, t) }); hlUnder(ctx, e1, Mx, y0 - lh * e1.length, size, '엘리야', hlk);
      Pilot.text(ctx, Film.text('P3'), Mx, cy - sh / 2 + (V ? 66 : 60), { size: V ? 36 : 34, weight: 600, color: '#6a4a26', alpha: ss(97, 98, t) * light, ls: 3 }); }
    scrollText(ctx, '01', Mx, y0, size, maxW, { lines, lit: ss(r1, r1 + 1, t) * (1 - .5 * ss(102.4, 104, t)) + .5 * hlk, reveal: k => ss(r0 + (r1 - r0) * k / n, r0 + (r1 - r0) * k / n + .3, t), glow: k => { const at = r0 + (r1 - r0) * k / n; return ss(at, at + .15, t) * (1 - ss(at + .2, at + .7, t)); } });
    hlUnder(ctx, lines, Mx, y0, size, Film.lines['19'].hl, hlk);
    Pilot.text(ctx, citeRange('19a', '19'), Mx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 30 : 28, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(99, 100, t) * light }); }
  { const a = Mx + sw0 / 2 + 60, b = Lx - sw0 / 2 - 60, yb = cy + sh / 2 - 46; ctx.save(); ctx.strokeStyle = 'rgba(70,44,20,.55)'; ctx.lineWidth = 2;
    for (let i = 0; i <= 40; i++) { const x = lerp(a, b, i / 40); if (x > x1 - 30) break; const l = i % 10 === 0 ? 22 : i % 5 === 0 ? 14 : 8; ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, yb - l); ctx.stroke(); }
    ctx.restore(); Pilot.text(ctx, Film.text('C2'), (a + b) / 2, cy + 22, { size: V ? 84 : 92, weight: 700, color: '#4a2f16', alpha: .8, ls: 10 }); }
  { const size = V ? 50 : 48, w0 = 106.4, w1 = 110.0; ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text('20'), sw0 - 200), n = ls.reduce((s, l) => s + Pilot.chars(l).length, 0), lw = Math.max(...ls.map(l => ctx.measureText(l).width)); ctx.restore();
    const ly = cy - (ls.length - 1) * size * 1.7 / 2 + size * .32;
    if (t > w0 - .2) { scrollText(ctx, '20', Lx, ly, size, sw0 - 200, { lines: ls, lit: .5 * hlk, reveal: k => ss(w0 + (w1 - w0) * k / n, w0 + (w1 - w0) * k / n + .12, t) });
      hlUnder(ctx, ls, Lx, ly, size, Film.lines['20'].hl, hlk); hlUnder(ctx, ls, Lx, ly, size, '엘리야', hlk);
      Pilot.text(ctx, Film.text('P4'), Lx, cy - sh / 2 + (V ? 66 : 60), { size: V ? 36 : 34, weight: 600, color: '#6a4a26', alpha: ss(w0 - .6, w0 + .4, t), ls: 3 });
      const k = clamp((t - w0) / (w1 - w0)); if (k > 0 && k < 1) { const nx = Lx - lw / 2 + lw * k, ny = ly - size * .3; glow(ctx, nx, ny, 70, [255, 236, 180], 1); glow(ctx, nx, ny, 14, [255, 255, 240], 1); }
      Pilot.text(ctx, Film.cite('20'), Lx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 30 : 28, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(w1, w1 + .6, t) }); } }
  if (t > 114.6 && t < 119.4) { const k = clamp((t - 114.8) / 3.0), e = eio(k), x0r = Mx - sw0 * .2, x1r = Lx - sw0 * .1, sx = lerp(x0r, x1r, e), on = ss(114.6, 115.0, t) * (1 - ss(118.8, 119.4, t));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const tr = ctx.createLinearGradient(x0r, 0, sx, 0); tr.addColorStop(0, 'rgba(255,214,130,0)'); tr.addColorStop(1, `rgba(255,220,140,${.55 * on})`);
    ctx.fillStyle = tr; ctx.fillRect(x0r, cy - sh * .07, Math.max(0, sx - x0r), sh * .14); ctx.restore();
    glow(ctx, sx, cy, sh * .9, [255, 222, 150], .75 * on); glow(ctx, sx, cy, sh * .18, [255, 250, 230], .95 * on);
    glow(ctx, Mx, cy - sh * .05, sw0 * .5, [255, 214, 130], .5 * on * Math.exp(-k * 6)); glow(ctx, Lx, cy, sw0 * .5, [255, 214, 130], .7 * on * ss(.85, 1, k)); }
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }

function citeRange(a, b) {   // "말라기 4:5" + "말라기 4:6" → "말라기 4:5–6 (개역개정)"; falls back to b's cite when the two are not in one chapter
  const A = (Film.lines[a] || {}).cite || '', B = (Film.lines[b] || {}).cite || '', ma = A.match(/^(.*\D)(\d+)$/), mb = B.match(/^(.*\D)(\d+)$/);
  return ma && mb && ma[1] === mb[1] ? Film.cite(a).replace(A, A + '–' + mb[2]) : Film.cite(b); }
function nazarethPull(ctx, t) {   // 2:21–2:37 — Nazareth: the pen of light underlines Luke 4:18 at reading pace; silence; "오늘" — the words burn,
  // the light runs out along the scroll to the other promises, the camera pulls back and holds: one scroll
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .42, sh = V ? 640 : 470, sw = V ? 940 : 1320, Dd = V ? 1050 : 1450, segs = [['13', -2], ['05', -1], ['25a', 0], ['19a', 1], ['19', 2]];
  const x0 = W / 2 - 2 * Dd - sw / 2, x1 = W / 2 + 2 * Dd + sw / 2, fire = ss(150.2, 150.7, t), pull = eio(clamp((t - 150.4) / 4.0)), zf = W * .95 / (2 * Dd + sw + 120);
  const z = Math.exp(lerp(Math.log(1), Math.log(zf), pull)), light = ss(140.8, 141.8, t) * (1 - .35 * ss(148.5, 149.6, t) + .35 * fire);
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-W / 2, -cy);
  longScroll(ctx, x0, x1, cy, sh, light, W / 2);

  if (fire > 0) { glow(ctx, W / 2, cy, sh * .9 + Dd * 2.6 * clamp((t - 150.3) / 2), [255, 226, 160], .55 * fire); const fl = Math.exp(-(t - 150.2) * 2.2); glow(ctx, W / 2, cy, sw * .7, [255, 248, 225], .7 * fire * fl); }
  segs.forEach(([id, k]) => { const cx = W / 2 + k * Dd, size = id === '25a' ? (V ? 40 : 38) : (V ? 44 : 44); ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text(id), sw - 200); ctx.restore();
    const y = cy - (ls.length - 1) * size * 1.7 / 2 + size * .32, wave = ss(150.4 + Math.abs(k) * .5, 151 + Math.abs(k) * .5, t);
    scrollText(ctx, id, cx, y, size, sw - 200, { lines: ls, lit: k === 0 ? fire : wave, alpha: k === 0 ? 1 : .92 });
    Pilot.text(ctx, Film.cite(id), cx, cy + sh / 2 - 38, { size: V ? 28 : 26, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: .9 });
    if (k === 0) {   // the pen of light underlines the words at reading pace; the line stays once drawn
      ctx.save(); ctx.font = Film.font(size, 600); const lh = size * 1.7, total = ls.reduce((s, l) => s + ctx.measureText(l).width, 0); let acc = 0; const rd = clamp((t - 142.2) / 7.0) * total;
      ls.forEach((l, i) => { const w = ctx.measureText(l).width, d = clamp((rd - acc) / w); acc += w; if (d <= 0) return; const lx0 = cx - w / 2, ly = y + i * lh + 12;
        ctx.save(); ctx.strokeStyle = 'rgba(196,140,40,.95)'; ctx.shadowColor = 'rgba(255,200,90,.9)'; ctx.shadowBlur = 12; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(lx0, ly); ctx.lineTo(lx0 + w * d, ly); ctx.stroke(); ctx.restore();
        if (d < 1 && t < 148.6) { glow(ctx, lx0 + w * d, ly, 46, [255, 232, 170], 1); glow(ctx, lx0 + w * d, ly, 9, [255, 255, 240], 1); } }); ctx.restore(); } });
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }

function partOpening(ctx, t) {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = V ? H * .4 : H * .43, sw = V ? 900 : 1340, sh = V ? 780 : 560;
  const open = eio(clamp((t - .6) / 2.4)), dark = ss(9.6, 12.2, t);
  const flick = 1 + .05 * Math.sin(t * 7.3) * Math.sin(t * 2.9 + 1) + .03 * Math.sin(t * 17.1), light = ss(.3, 2.2, t) * (1 - dark) * flick;
  // the camera creeps toward the scroll (it never cuts; the push makes the stillness feel held)
  const push = 1 + .07 * eio(clamp(t / 12)); ctx.save(); ctx.translate(W / 2, H * .45); ctx.scale(push, push); ctx.translate(-W / 2, -H * .45);
  // warm pool of lamplight on the table
  const lp = ctx.createRadialGradient(cx, cy - sh * .2, 0, cx, cy, Math.max(W, H) * .7);
  lp.addColorStop(0, `rgba(120,80,40,${.35 * light})`); lp.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = lp; ctx.fillRect(0, 0, W, H);
  const sa = 1 - ss(10.8, 12.4, t);
  if (sa > 0) { ctx.save(); ctx.globalAlpha = sa;
    scroll(ctx, cx, cy, sw, sh, open, light);
    // Mal 4:6 on the scroll — the promise half faint, the warning half in ink; then the letters go out one by one
    const size = V ? 44 : 46, maxW = sw - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600);
    const lines = Film.wrapEven(ctx, Film.text('01'), maxW), promise = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (lines.length - 1) * lh / 2 + size * .32;   // the letters' bodies (not their baselines) centred on the scroll
    const tin = ss(2.4, 4.2, t), out0 = 8.8, out1 = 10.6;
