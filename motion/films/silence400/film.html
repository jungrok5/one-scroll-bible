<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>침묵의 400년</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;700&display=swap">
</head>
<body>
<script src="../../pilot/lib.js"></script>
<script src="../../pilot/goldline.js"></script>
<script src="../lib-film.js"></script>
<script src="map.js"></script>
<script src="illum.js"></script>
<script src="papercut.js"></script>
<script src="shipsprite.js"></script>
<script src="advent.js"></script>
<script>
/* 침묵의 400년 — one continuous ~2:50 film. Look: night, lamplight and gold on parchment; one scroll is the main
   character (it goes dark at the start and lights again at the end). Line ids = script.json. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, hex, mix, rgb } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 170;
let parch, grain, motes = [];

function init() {
  // parchment texture: low-res fbm stretched (soft fibres + blotches), warm
  const pw = 480, ph = 270, c = canvas(pw, ph), x = c.getContext('2d'), d = x.createImageData(pw, ph);
  for (let j = 0; j < ph; j++) for (let i = 0; i < pw; i++) {
    const n = fbm(i / 60, j / 60, 5), f = fbm(i / 6, j / 90, 2), v = .78 + (n - .5) * .35 + (f - .5) * .08, o = (j * pw + i) * 4;
    d.data[o] = 222 * v; d.data[o + 1] = 196 * v; d.data[o + 2] = 150 * v; d.data[o + 3] = 255; }
  x.putImageData(d, 0, 0); parch = c;
  grain = Pilot.speckle(512, 512, 22, 7, .4);
  const r = rng(11); for (let i = 0; i < 70; i++) motes.push([r(), r(), .3 + r() * .9, r() * 6.28, .2 + r() * .8]);
}

// ---------- shared furniture ----------
function vignette(ctx, k = .85) { const g = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${k})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function filmGrain(ctx, t, a = .06) { ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  const ox = (Math.floor(t * 24) * 137) % 512, oy = (Math.floor(t * 24) * 251) % 512;
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) ctx.drawImage(grain, x, y); ctx.restore(); }
function dust(ctx, t, light, a = 1) {   // motes drifting in the lamplight
  ctx.save(); for (const [mx, my, s, ph, b] of motes) {
    const x = ((mx * W + t * 9 * s + Math.sin(t * .3 + ph) * 30) % W + W) % W, y = ((my * H - t * 6 * s) % H + H) % H;
    const d = Math.hypot(x - light[0], y - light[1]) / (Math.max(W, H) * .5), k = clamp(1 - d) * b * a; if (k < .02) continue;
    ctx.fillStyle = `rgba(255,220,160,${k * .5})`; ctx.beginPath(); ctx.arc(x, y, 1.2 + s * 1.6, 0, 6.283); ctx.fill(); }
  ctx.restore(); }

// the scroll: open width 0..1, light 0..1 (lamplight on it), centred at (cx, cy) with size (w, h)
function scroll(ctx, cx, cy, w, h, open, light) {
  const ow = w * open, x0 = cx - ow / 2, y0 = cy - h / 2;
  ctx.save();
  // shadow under
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.filter = 'blur(24px)'; ctx.fillRect(x0 + 10, y0 + 30, ow, h); ctx.filter = 'none';
  // sheet
  ctx.beginPath(); ctx.rect(x0, y0, ow, h); ctx.clip();
  ctx.drawImage(parch, cx - w / 2, y0, w, h);
  const g = ctx.createRadialGradient(cx, cy - h * .3, 0, cx, cy, Math.max(w, h) * .75);   // lamplight from above
  g.addColorStop(0, `rgba(255,214,150,${.18 * light})`); g.addColorStop(1, `rgba(20,10,0,${.55 + (1 - light) * .45})`);
  ctx.fillStyle = g; ctx.fillRect(x0, y0, ow, h);
  ctx.fillStyle = `rgba(0,0,0,${(1 - light) * .55})`; ctx.fillRect(x0, y0, ow, h);
  // edge burn
  const e = ctx.createLinearGradient(0, y0, 0, y0 + h); e.addColorStop(0, 'rgba(60,30,5,.45)'); e.addColorStop(.08, 'rgba(60,30,5,0)'); e.addColorStop(.92, 'rgba(60,30,5,0)'); e.addColorStop(1, 'rgba(60,30,5,.45)');
  ctx.fillStyle = e; ctx.fillRect(x0, y0, ow, h);
  ctx.restore();
  // rollers at both ends (wood, lit from above)
  for (const sx of [x0, x0 + ow]) { const rw = V ? 34 : 40, rh = h + (V ? 60 : 70);
    const rg = ctx.createLinearGradient(sx - rw / 2, 0, sx + rw / 2, 0);
    const base = mix([92, 58, 30], [160, 110, 60], light * .8);
    rg.addColorStop(0, rgb(mix(base, [0, 0, 0], .6))); rg.addColorStop(.45, rgb(mix(base, [255, 220, 170], .25))); rg.addColorStop(1, rgb(mix(base, [0, 0, 0], .7)));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(sx - rw / 2, cy - rh / 2, rw, rh, rw / 2); ctx.fill();
    ctx.fillStyle = rgb(mix(base, [0, 0, 0], .35)); for (const yy of [cy - rh / 2 - 26, cy + rh / 2 + 2]) { ctx.beginPath(); ctx.roundRect(sx - rw * .32, yy, rw * .64, 24, 8); ctx.fill(); } }
}

// ---------- 0:00–0:20  the last line goes out ----------
// one scroll, unrolled: parchment from x0 to x1 (mirrored tiles, so no seams), rollers at both ends, lamp-lit around 'lx'
function longScroll(ctx, x0, x1, cy, h, light, lx) {
  const seg = V ? 900 : 1340, y0 = cy - h / 2; ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.filter = 'blur(24px)'; ctx.fillRect(x0 + 10, y0 + 30, x1 - x0, h); ctx.filter = 'none';
  ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, h); ctx.clip();
  for (let x = x0, i = 0; x < x1; x += seg, i++) { ctx.save(); if (i % 2) { ctx.translate(x + seg, 0); ctx.scale(-1, 1); ctx.drawImage(parch, 0, y0, seg + 1, h); } else ctx.drawImage(parch, x, y0, seg + 1, h); ctx.restore(); }
  const g = ctx.createRadialGradient(lx, cy - h * .3, 0, lx, cy, seg * 1.1); g.addColorStop(0, `rgba(255,214,150,${.18 * light})`); g.addColorStop(1, `rgba(20,10,0,${.6 + (1 - light) * .4})`); ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, h);
  const e = ctx.createLinearGradient(0, y0, 0, y0 + h); e.addColorStop(0, 'rgba(60,30,5,.45)'); e.addColorStop(.08, 'rgba(60,30,5,0)'); e.addColorStop(.92, 'rgba(60,30,5,0)'); e.addColorStop(1, 'rgba(60,30,5,.45)'); ctx.fillStyle = e; ctx.fillRect(x0, y0, x1 - x0, h);
  ctx.restore();
  for (const sx of [x0, x1]) { const rw = V ? 34 : 40, rh = h + (V ? 60 : 70), rg = ctx.createLinearGradient(sx - rw / 2, 0, sx + rw / 2, 0), base = mix([92, 58, 30], [160, 110, 60], light * .8);
    rg.addColorStop(0, rgb(mix(base, [0, 0, 0], .6))); rg.addColorStop(.45, rgb(mix(base, [255, 220, 170], .25))); rg.addColorStop(1, rgb(mix(base, [0, 0, 0], .7)));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(sx - rw / 2, cy - rh / 2, rw, rh, rw / 2); ctx.fill();
    ctx.fillStyle = rgb(mix(base, [0, 0, 0], .35)); for (const yy of [cy - rh / 2 - 26, cy + rh / 2 + 2]) { ctx.beginPath(); ctx.roundRect(sx - rw * .32, yy, rw * .64, 24, 8); ctx.fill(); } } }
// text written on the scroll in ink; 'lit' 0..1 turns it to burnished gold with a glow; reveal(i,n) → 0..1 per character
function scrollText(ctx, id, cx, y, size, maxW, o = {}) {
  ctx.save(); ctx.font = Film.font(size, 600); const lines = o.lines || Film.wrapEven(ctx, Film.text(id), maxW); ctx.restore();
  const lit = o.lit || 0, ink = rgb(mix([43, 26, 11], [150, 96, 20], lit));
  Film.block(ctx, lines, cx, y, { size, weight: 600, lh: 1.7, color: ink, alpha: o.alpha == null ? 1 : o.alpha, charAlpha: o.reveal, charGlow: o.glow, lineAlpha: o.lineAlpha });
  if (lit > 0) Film.block(ctx, lines, cx, y, { size, weight: 600, lh: 1.7, color: '#b8841f', alpha: lit * .9 * (o.alpha == null ? 1 : o.alpha), shadow: 'rgba(255,214,120,.9)', shadowBlur: 18, charAlpha: o.reveal, lineAlpha: o.lineAlpha });
  return lines; }

function scrollReturn(ctx, t) {   // 1:58–2:12 — the same scroll as the opening. The promise words that went out at 0:10 relight where they were;
  // the scroll unrolls on through four hundred blank years, and a pen of light writes Luke 1:17 on the same scroll. Pull back: one scroll.
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .43, sh = V ? 780 : 560, sw0 = V ? 900 : 1340, Mx = W / 2, Lx = W / 2 + (V ? 1300 : 2000), x0 = Mx - sw0 / 2;
  const x1 = lerp(Mx + sw0 / 2, Lx + sw0 / 2, eio(clamp((t - 120.4) / 3.0))), span = (Lx - Mx) + sw0 + 160, zf = W * .94 / span, pull = eio(clamp((t - 126.2) / 3.6));
  let cx = lerp(Mx, Lx, eio(clamp((t - 120.4) / 3.0))), z = lerp(1.07, 1, eio(clamp((t - 120.4) / 3)));
  cx = lerp(cx, (Mx + Lx) / 2, pull); z = Math.exp(lerp(Math.log(z), Math.log(zf), pull));
  const light = ss(118.1, 119.6, t) * (1 + .04 * Math.sin(t * 7.3) * Math.sin(t * 2.9));
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  glow(ctx, cx, cy - sh * .2, Math.max(W, H) * .7 / z, [120, 80, 40], .3 * light);
  longScroll(ctx, x0, x1, cy, sh, light, cx);
  // Malachi 4:6 where it stood at the opening: the promise relights letter by letter; the warning stays scorched
  { const size = V ? 44 : 46, maxW = sw0 - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600); const all = Film.wrapEven(ctx, Film.text('01'), maxW), np = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (all.length - 1) * lh / 2 - (V ? 30 : 24), n = all.slice(0, np).reduce((s, l) => s + Pilot.chars(l).length, 0), r0 = 118.6, r1 = 120.4;
    Film.block(ctx, all.slice(np), Mx, y0 + np * lh, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: .14 * light });   // the scorched words
    scrollText(ctx, '01', Mx, y0, size, maxW, { lines: all.slice(0, np), lit: ss(r1, r1 + 1.2, t), reveal: k => ss(r0 + (r1 - r0) * k / n, r0 + (r1 - r0) * k / n + .3, t), glow: k => { const at = r0 + (r1 - r0) * k / n; return ss(at, at + .15, t) * (1 - ss(at + .2, at + .7, t)); } });
    Pilot.text(ctx, Film.cite('19'), Mx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 26 : 24, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(120, 121, t) * light }); }
  // the four hundred years: the blank parchment, a tick for each decade along its foot, '400년' in faint ink
  { const a = Mx + sw0 / 2 + 60, b = Lx - sw0 / 2 - 60, yb = cy + sh / 2 - 46; ctx.save(); ctx.strokeStyle = 'rgba(70,44,20,.55)'; ctx.lineWidth = 2;
    for (let i = 0; i <= 40; i++) { const x = lerp(a, b, i / 40); if (x > x1 - 30) break; const l = i % 10 === 0 ? 22 : i % 5 === 0 ? 14 : 8; ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, yb - l); ctx.stroke(); }
    ctx.restore(); Pilot.text(ctx, Film.text('C2'), (a + b) / 2, cy + 10, { size: V ? 60 : 64, weight: 600, color: '#6a4a26', alpha: .55 * ss(121.6, 122.6, t) * (x1 > (a + b) / 2 ? 1 : 0), ls: 8 }); }
  // the pen of light writes Luke 1:17 on the same scroll
  { const size = V ? 48 : 50, w0 = 123.6, w1 = 125.6; ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text('20'), sw0 - 200), n = ls.reduce((s, l) => s + Pilot.chars(l).length, 0), lw = Math.max(...ls.map(l => ctx.measureText(l).width)); ctx.restore();
    const ly = cy - (ls.length - 1) * size * 1.7 / 2 - 10;
    if (t > w0 - .2) { scrollText(ctx, '20', Lx, ly, size, sw0 - 200, { lines: ls, lit: .55 + .45 * ss(w1, w1 + .8, t), reveal: k => ss(w0 + (w1 - w0) * k / n, w0 + (w1 - w0) * k / n + .12, t) });
      const k = clamp((t - w0) / (w1 - w0)); if (k > 0 && k < 1) { const nx = Lx - lw / 2 + lw * k, ny = ly - size * .3; glow(ctx, nx, ny, 70, [255, 236, 180], 1); glow(ctx, nx, ny, 14, [255, 255, 240], 1); }
      Pilot.text(ctx, Film.cite('20'), Lx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 26 : 24, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(w1, w1 + .6, t) }); } }
  // pulled back: a quiet light runs the length of the one scroll, from the promise to its answer
  if (t > 128.2) { const k = clamp((t - 128.2) / 2.2), sx = lerp(Mx, Lx, eio(k)); glow(ctx, sx, cy, sh * 1.2, [255, 220, 150], .35 * Math.sin(Math.PI * k)); }
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }

function nazarethPull(ctx, t) {   // 2:27–2:33 — Nazareth: Luke 4:18 on the scroll, underlined by the pen of light as it is read; then "오늘":
  // the words burn gold, the light runs out along the scroll, and the camera pulls back — every promise in this film was on one scroll
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .42, sh = V ? 640 : 470, sw = V ? 940 : 1320, Dd = V ? 1050 : 1450, segs = [['13', -2], ['05', -1], ['25a', 0], ['19', 1], ['22', 2]];
  const x0 = W / 2 - 2 * Dd - sw / 2, x1 = W / 2 + 2 * Dd + sw / 2, fire = ss(150.2, 150.6, t), pull = eio(clamp((t - 150.4) / 2.4)), zf = W * .95 / (2 * Dd + sw + 120);   // three of the promises fill the frame; the scroll runs on past both edges
  const z = Math.exp(lerp(Math.log(1), Math.log(zf), pull)), light = ss(147, 147.8, t) * (1 - .3 * ss(149.4, 150.1, t) + .3 * fire);
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-W / 2, -cy);
  longScroll(ctx, x0, x1, cy, sh, light, W / 2);
  segs.forEach(([id, k]) => { const cx = W / 2 + k * Dd, size = id === '25a' ? (V ? 38 : 36) : (V ? 44 : 44); ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text(id), sw - 200); ctx.restore();
    const y = cy - (ls.length - 1) * size * 1.7 / 2 - 14, wave = ss(150.3 + Math.abs(k) * .45, 150.8 + Math.abs(k) * .45, t);
    scrollText(ctx, id, cx, y, size, sw - 200, { lines: ls, lit: k === 0 ? fire : wave, alpha: k === 0 ? 1 : .9 });
    Pilot.text(ctx, Film.cite(id), cx, cy + sh / 2 - 36, { size: V ? 24 : 22, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: .9 });
    if (k === 0 && t < 150.4) {   // the pen of light underlines the words as they are read
      ctx.save(); ctx.font = Film.font(size, 600); const lh = size * 1.7, total = ls.reduce((s, l) => s + ctx.measureText(l).width, 0); let acc = 0, rd = clamp((t - 147.8) / 2.0) * total;
      ls.forEach((l, i) => { const w = ctx.measureText(l).width, d = clamp((rd - acc) / w); acc += w; if (d <= 0) return; const lx0 = cx - w / 2, ly = y + i * lh + 12;
        ctx.save(); ctx.strokeStyle = 'rgba(255,214,120,.95)'; ctx.shadowColor = 'rgba(255,200,90,.9)'; ctx.shadowBlur = 14; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(lx0, ly); ctx.lineTo(lx0 + w * d, ly); ctx.stroke(); ctx.restore();
        if (d < 1) { glow(ctx, lx0 + w * d, ly, 46, [255, 232, 170], 1); glow(ctx, lx0 + w * d, ly, 9, [255, 255, 240], 1); } }); ctx.restore(); } });
  if (fire > 0) { const k = clamp((t - 150.3) / 1.6); glow(ctx, W / 2 + lerp(-2, 2, .5) * Dd * 0, cy, (sh + Dd * 2.6 * k), [255, 226, 160], .35 * fire); }
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }
function partOpening(ctx, t) {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = V ? H * .4 : H * .43, sw = V ? 900 : 1340, sh = V ? 780 : 560;
  const open = eio(clamp((t - .6) / 2.4)), dark = ss(9.6, 12.2, t);
  const flick = 1 + .05 * Math.sin(t * 7.3) * Math.sin(t * 2.9 + 1) + .03 * Math.sin(t * 17.1), light = ss(.3, 2.2, t) * (1 - dark) * flick;
  // the camera creeps toward the scroll (it never cuts; the push makes the stillness feel held)
  const push = 1 + .07 * eio(clamp(t / 12)); ctx.save(); ctx.translate(W / 2, H * .45); ctx.scale(push, push); ctx.translate(-W / 2, -H * .45);
  // warm pool of lamplight on the table
  const lp = ctx.createRadialGradient(cx, cy - sh * .2, 0, cx, cy, Math.max(W, H) * .7);
  lp.addColorStop(0, `rgba(120,80,40,${.35 * light})`); lp.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = lp; ctx.fillRect(0, 0, W, H);
  if (t < 13) {
    scroll(ctx, cx, cy, sw, sh, open, light);
    // Mal 4:6 on the scroll — the promise half faint, the warning half in ink; then the letters go out one by one
    const size = V ? 44 : 46, maxW = sw - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600);
    const lines = Film.wrapEven(ctx, Film.text('01'), maxW), promise = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (lines.length - 1) * lh / 2 - (V ? 30 : 24);
    const tin = ss(2.4, 4.2, t), out0 = 8.8, out1 = 10.6;
    Film.block(ctx, lines, cx, y0, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: tin,
      lineAlpha: i => i < promise ? .38 : 1,
      charAlpha: (k, n) => { const at = out0 + (out1 - out0) * k / n; return 1 - ss(at, at + .35, t); },
      charGlow: (k, n) => { const at = out0 + (out1 - out0) * k / n; return ss(at - .25, at, t) * (1 - ss(at, at + .3, t)); } });
    const ca = tin * (1 - ss(out1 - .2, out1 + .6, t));
    if (ca > 0) Pilot.text(ctx, Film.cite('01'), cx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 26 : 24, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ca });
  }
  dust(ctx, t, [cx, cy - sh * .3], light);
  ctx.restore();
  Film.sub(ctx, '02', t, 6.4, 10.4);
  // 03 in total silence on black
  Film.sub(ctx, '03', t, 11.2, 15.4, { y: V ? H * .47 : H * .5, size: V ? 58 : 54 });
  // title
  const ta = win(t, 15.9, 20.4, 1.2, 1.1);
  if (ta > 0) { const sz = V ? 104 : 116, ty = V ? H * .47 : H * .5;
    Pilot.text(ctx, Film.text('T1'), W / 2, ty, { size: sz, weight: 600, color: '#e9c77a', alpha: ta, shadow: 'rgba(233,185,73,.35)', shadowBlur: 40, ls: 6 });
    const lw = (V ? 420 : 520) * eo(clamp((t - 16.3) / 2.2)); ctx.fillStyle = `rgba(233,199,122,${ta * .8})`; ctx.fillRect(W / 2 - lw / 2, ty + (V ? 54 : 58), lw, 2); }
}

// =====================================================================================================================
// small props
const GOLD = [233, 199, 122], INK = '#2b1a0b';
function glow(ctx, x, y, r, col, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgb(col, a)); g.addColorStop(.35, rgb(col, a * .35)); g.addColorStop(1, rgb(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function lamp(ctx, x, y, s, t, a = 1) {   // a clay oil lamp with a living flame
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const f = 1 + .08 * Math.sin(t * 9.1) + .05 * Math.sin(t * 23.7);
  glow(ctx, x + s * .55, y - s * .55, s * 7 * f, [255, 170, 80], .32);
  ctx.fillStyle = '#3a2412'; ctx.beginPath(); ctx.ellipse(x, y, s, s * .38, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + s * .6, y - s * .12); ctx.quadraticCurveTo(x + s * 1.1, y - s * .2, x + s * 1.25, y - s * .05); ctx.quadraticCurveTo(x + s * .9, y + s * .2, x + s * .5, y + s * .18); ctx.fill();
  ctx.fillStyle = 'rgba(255,190,120,.25)'; ctx.beginPath(); ctx.ellipse(x - s * .2, y - s * .18, s * .5, s * .1, 0, 0, 6.283); ctx.fill();

    x.save(); x.fillStyle = '#8a7a5e'; x.beginPath(); x.moveTo(ax + aw * .62, ay + ah * .9); x.quadraticCurveTo(ax + aw * .8, ay + ah * .38, ax + aw * 1.02, ay + ah * .3); x.lineTo(ax + aw, ay + ah); x.lineTo(ax + aw * .62, ay + ah); x.closePath(); x.fill();
    x.strokeStyle = Illum.INK; x.lineWidth = 3; x.stroke(); x.lineWidth = 1.4; for (let i = 0; i < 14; i++) { const k = i / 14, hx = ax + aw * (.7 + k * .3), hy = ay + ah * (.6 - k * .22 + .1); x.beginPath(); x.moveTo(hx, hy); x.lineTo(hx + 20, hy + 26); x.stroke(); } x.restore();
    if (t < hitT + 2) { const cx = lerp(sx0, sx1, fly), cy = lerp(sy0, sy1, fly) - Math.sin(fly * Math.PI) * b.hs * .1; stone(x, cx, cy, s0, fly * -5, ss(132.3, 133.0, t)); }
    if (t > 135.4) { const gk = eio(clamp((t - 135.5) / 1.8)), g = new Path2D(); g.arc(sx1, sy1 - b.hs * .05, Math.max(1, gk * ah * 1.3), 0, 6.283); Illum.gold(x, g, { lw: 0 }); glow(x, sx1, sy1 - b.hs * .05, 60 + gk * 200, [255, 240, 200], .7 * (1 - gk * .5)); }
    if (gone < 1) Illum.statue(x, b.cx, b.top, b.hs, { gold: 1 - gone, silver: 1 - gone, bronze: 1 - gone, iron: 1 - gone, clay: 1 - gone }, {}, t);
    const cp = ss(hitT, hitT + 1.0, t); if (cp > 0 && gone < 1) { x.save(); x.translate(b.cx, b.top); x.scale(b.hs, b.hs); x.strokeStyle = `rgba(42,26,16,${1 - gone})`; x.lineWidth = 3 / b.hs; for (const c of icracks) partial(x, c, cp); x.restore(); }
    if (false) { const g = grow, cx = lerp(sx1, b.cx, g), base = ay + ah * .93, mh = lerp(s0 * 1.6, ah * .62, g), mw = lerp(s0 * 2, aw * 1.1, g);
      x.save(); x.beginPath(); x.moveTo(cx - mw / 2, base); x.quadraticCurveTo(cx - mw * .2, base - mh * 1.05, cx, base - mh); x.quadraticCurveTo(cx + mw * .2, base - mh * 1.05, cx + mw / 2, base); x.closePath();
      x.fillStyle = '#b9b0a0'; x.fill(); x.save(); x.clip(); const lg = x.createLinearGradient(0, base - mh, 0, base); lg.addColorStop(0, 'rgba(255,236,190,.55)'); lg.addColorStop(1, 'rgba(90,70,50,.3)'); x.fillStyle = lg; x.fillRect(cx - mw, base - mh * 1.1, mw * 2, mh * 1.2); x.restore();
      x.strokeStyle = Illum.INK; x.lineWidth = 3; x.stroke(); x.restore();
      const ml = ss(138, 140.2, t); glow(x, cx, base - mh - 6, 60 + 80 * ml, [255, 236, 190], .85 * ml); }
  }, { glint: clamp((t - 132.2) / 2.2) });
  if (t > hitT) glow(ctx, b.cx + b.hs * .12, b.top + b.hs * .93, b.hs * .45, [255, 245, 225], .9 * Math.exp(-(t - hitT) * 2.6));
  // chaff blown off the page (the wind carries it out of the picture)
  if (t > 134.9) { const u0 = t - 135.0; for (const [x, y, z, r1, r2, r3] of ishards) { const u = u0 - (1 - y) * .25 - r3 * .2; const bx = b.cx + x * b.hs, by = b.top + y * b.hs;
      if (u <= 0) { if (gone > .4) { ctx.fillStyle = rgb(Illum.METAL[z], .9); ctx.fillRect(bx, by, 3, 3); } continue; }
      const px = bx - Math.pow(u, 1.5) * (W * .34) * (.5 + r1), py = by - u * 60 * r2 + Math.sin(u * 2 + r3 * 9) * 20, a = 1 - ss(.9, 1.7, u); if (a <= 0) continue;
      ctx.fillStyle = rgb(Illum.METAL[z], a); ctx.fillRect(px, py, 2.4 + r2 * 2.6, 2.4 + r1 * 2.2); } }
  ctx.restore();
  // (the scene ends on the gold; it fades to black, and the glass wakes)
}

function temple(ctx, t) {   // 1:53–1:58 Zechariah at the altar of incense; the angel stands at its right side (Luke 1:11)
  desk(ctx, t); ctx.save(); camPush(ctx, t, 113, .04); const [ax, ay, aw, ah] = Illum.L.arch, s = ah / 900;
  Illum.page(ctx, t, x => { const gy = ay + ah * .88;
    Illum.altar(x, ax + aw * .5, gy, s * .9, t);
    Illum.priest(x, ax + aw * .22, gy, s * .7, t);
    glow(x, ax + aw * .8, gy - ah * .45, ah * .5, [255, 240, 200], .5 * ss(113.2, 114.6, t));
    Illum.angel(x, ax + aw * .78, gy, s * .7, t, ss(113.3, 114.8, t)); }, { ground: 'floor', glint: clamp((t - 113.4) / 2.6) });
  ctx.restore(); }
function figure(ctx, t) {   // 2:21–2:27 the good shepherd carries the lost one home (Luke 19:10) — seen from behind, walking into the light
  desk(ctx, t); ctx.save(); camPush(ctx, t, 141, .05); const [ax, ay, aw, ah] = Illum.L.arch, s = ah / 900;
  Illum.page(ctx, t, x => { const gy = ay + ah * .9;
    const sun = new Path2D(); sun.arc(ax + aw * .62, ay + ah * .3, ah * .11, 0, 6.283); Illum.gold(x, sun, { lw: 2.4 });
    x.save(); x.strokeStyle = 'rgba(233,199,122,.55)'; x.lineWidth = 3; for (let i = 0; i < 24; i++) { const an = i / 24 * 6.283 + t * .04; x.beginPath(); x.moveTo(ax + aw * .62 + Math.cos(an) * ah * .14, ay + ah * .3 + Math.sin(an) * ah * .14); x.lineTo(ax + aw * .62 + Math.cos(an) * ah * .5, ay + ah * .3 + Math.sin(an) * ah * .5); x.stroke(); } x.restore();
    const walk = (t - 141) * 6; Illum.shepherdBack(x, ax + aw * .4 + walk, gy, s * .8, t); }, { glint: clamp((t - 141.4) / 2.6) });
  ctx.restore(); }


function endCard(ctx, t) { ctx.fillStyle = '#030305'; ctx.fillRect(0, 0, W, H); glow(ctx, W / 2, H / 2, Math.max(W, H) * .5, [233, 185, 73], .12 * ss(167, 168, t));
  const k = ss(167.2, 168.2, t), s = Film.text('E1').split(/\s*→\s*/);
  Pilot.text(ctx, s[0], W / 2, H * (V ? .45 : .44), { size: V ? 62 : 60, weight: 600, color: '#f3ece0', alpha: k, shadow: 'rgba(0,0,0,.9)' });
  if (s[1]) Pilot.text(ctx, s[1], W / 2, H * (V ? .45 : .44) + (V ? 110 : 100), { size: V ? 52 : 50, weight: 600, color: '#e9c77a', alpha: k, font: "'Noto Sans KR',sans-serif", ls: 2 });
  Pilot.text(ctx, '한눈에 보는 성경 이야기', W / 2, H * (V ? .45 : .44) + (V ? 200 : 180), { size: V ? 30 : 28, font: "'Noto Sans KR',sans-serif", color: '#9aa3b2', alpha: k * .9 }); }

// the timeline
const SCENES = [
  [0, 20.6, partOpening, 0, .6], [20.4, 31.2, waitingSky], [31, 45.3, statueRise],
  [45, 52.2, mapDiaspora, .5, .01], [52.2, 61.6, mapAlexander, .01, .5], [61.4, 69.2, translation],
  [69, 75.2, fire], [75, 87.2, copying], [87, 113.2, mapRome],
  [113, 118.2, temple], [118, 132.2, scrollReturn], [132, 137.6, strike], [137.4, 147.2, (c, t) => { Advent.draw(c, lerp(13.8, 27.4, clamp((t - 137.4) / 9.8))); bottomBand(c, 'rgba(0,0,0,'); }, .6, .5], [147, 153.4, nazarethPull], [153.2, 159.2, mapGospel],
  [159, 167.2, (c, t) => { Papercut.draw(c, lerp(23.6, 31.5, clamp((t - 159) / 8.2))); bottomBand(c, 'rgba(2,4,16,'); }], [167, 170, endCard],
];
const TEXT = [
  ['sub', '04', 20.6, 24.7], ['quote', '05', 25, 30.7, { y: H * (V ? .3 : .3) }], ['sub', '06', 31.2, 34.4], ['quote', '06a', 34.6, 40.6, { bottom: Film.subBottom() + 40, size: V ? 42 : 40, join: !V, maxW: V ? W - 150 : W * .84 }], ['sub', '07', 40.9, 45.0],
  ['label', 'L1', 45, 52], ['sub', '08', 45.4, 51.8], ['label', 'L2', 52, 69], ['sub', '09', 55.2, 60.8], ['sub', '10', 61.5, 68.7], ['sub', '11', 69.3, 74.8], ['sub', '12', 75.2, 78.9],
  ['label', 'L3', 87, 99.6], ['sub', '14', 90.2, 94.8], ['sub', '15', 95.2, 99.8], ['quote', '16', 100.2, 107.8, { y: H * (V ? .19 : .16) }], ['sub', '17', 108.2, 112.8],
  ['quote', '18', 113.6, 117.9, { bottom: Film.subBottom() + 40, size: V ? 50 : 46 }], ['sub', '21', 126.6, 131.9],
  ['quote', '22', 132.4, 136.9, { bottom: Film.subBottom() + 40, size: V ? 50 : 46 }], ['sub', '23', 138.4, 141.8],
  ['quote', '24', 142.2, 146.9, { bottom: Film.subBottom() + 40, size: V ? 48 : 44 }], ['quote', '25', 150.5, 153.3, { bottom: Film.subBottom() + 40, size: V ? 54 : 52, color: '#fff3d6', shadow: 'rgba(255,190,90,.55)' }], ['sub', '26', 153.6, 158.8], ['sub', '27', 159.4, 166.8],
];
function counter(ctx, t) { const k = win(t, 20.8, 30.4, 1, 1); if (k <= 0) return; const n = Math.round(430 - 300 * ss(21.2, 30.4, t));
  Pilot.text(ctx, Pilot.trn ? String(Film.text('C1')).replace('{n}', n) : n, W / 2, V ? 240 : 96, { size: V ? 34 : 30, font: "'Noto Sans KR',sans-serif", color: '#c9b48a', alpha: k * .9, ls: 3, shadow: 'rgba(0,0,0,.9)' }); }

function draw(ctx, t) {
  mapT = t; for (const [a, b, f, fi = .5, fo = .5] of SCENES) { if (t < a || t >= b) continue;
    ctx.save(); f(ctx, t); ctx.restore();
    const k = ss(a, a + fi, t) * (1 - ss(b - fo, b, t)); if (a === 0) continue;
    if (k < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, H); } }
  vignette(ctx, .75); filmGrain(ctx, t);
  counter(ctx, t);
  for (const [kind, id, a, b, o] of TEXT) { if (t < a - .1 || t > b + .1) continue;
    if (kind === 'sub') Film.sub(ctx, id, t, a, b, o); else if (kind === 'quote') Film.quote(ctx, id, t, a, b, o); else if (kind === 'label') Film.label(ctx, id, t, a, b); }
  ctx.fillStyle = `rgba(0,0,0,${1 - ss(0, 1.2, t)})`; ctx.fillRect(0, 0, W, H);   // fade in from black
}
