<script>
/* 침묵의 400년 — one continuous ~2:50 film. Look: night, lamplight and gold on parchment; one scroll is the main
   character (it goes dark at the start and lights again at the end). Line ids = script.json. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, hex, mix, rgb } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';

function init() { Lamplit.init(); }

// ---------- shared furniture: the "lamplit" kit (night, lamplight and gold on parchment; one scroll) ----------
const { vignette, filmGrain, dust, scroll, longScroll, glow, lamp, ink, hebInk, quill, person } = Lamplit;

// ---------- 0:00–0:20  the last line goes out ----------
// text written on the scroll in ink; 'lit' 0..1 turns it to burnished gold with a glow; reveal(i,n) → 0..1 per character
function scrollText(ctx, id, cx, y, size, maxW, o = {}) {
  ctx.save(); ctx.font = Film.font(size, 600); const lines = o.lines || Film.wrapEven(ctx, Film.text(id), maxW); ctx.restore();
  return Lamplit.inkText(ctx, lines, cx, y, size, o); }
const hlUnder = Lamplit.underline;   // a gold underline and a soft light under the words two verses share

function scrollReturn(ctx, t) {   // 1:36–2:00 — the opening's scroll: silence; the promise relights where it went out; the scroll unrolls through
  // four hundred blank years; a pen of light writes Luke 1:17; the words both verses share light together; pull back — one scroll.
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .43, sh = V ? 780 : 560, sw0 = V ? 900 : 1340, Mx = W / 2, Lx = W / 2 + (V ? 1300 : 2000), x0 = Mx - sw0 / 2;
  const un = t < 104.2 ? .5 * eio(clamp((t - 102.0) / 2.2)) : .5 + .5 * eio(clamp((t - 105.4) / 1.4)), x1 = lerp(Mx + sw0 / 2, Lx + sw0 / 2, un), span = (Lx - Mx) + sw0 + 160, zf = W * .94 / span, pull = eio(clamp((t - 111.6) / 3.6));
  let cx = lerp(Mx, Lx, un), z = lerp(1.07, 1, un); cx = lerp(cx, (Mx + Lx) / 2, pull); z = Math.exp(lerp(Math.log(z), Math.log(zf), pull));
  const light = ss(96.6, 97.8, t) * (1 + .04 * Math.sin(t * 7.3) * Math.sin(t * 2.9));
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  glow(ctx, cx, cy - sh * .2, Math.max(W, H) * .7 / z, [120, 80, 40], .3 * light);
  longScroll(ctx, x0, x1, cy, sh, light, cx);
  const hlk = ss(110.2, 111.0, t);
  { const size = V ? 44 : 46, maxW = sw0 - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600); const all = Film.wrapEven(ctx, Film.text('01'), maxW), np = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (all.length - 1) * lh / 2 + size * .32, lines = all.slice(0, np), n = lines.reduce((s, l) => s + Pilot.chars(l).length, 0), r0 = 97.6, r1 = 100.2;
    Film.block(ctx, all.slice(np), Mx, y0 + np * lh, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: .14 * light });
    { const e1 = Film.wrapEven((() => { const c = canvas(2, 2).getContext('2d'); c.font = Film.font(size, 600); return c; })(), Film.text('19a'), maxW);   // Mal 4:5 above it
      scrollText(ctx, '19a', Mx, y0 - lh * e1.length, size, maxW, { lines: e1, lit: ss(97.4, 98.6, t) * (1 - .5 * ss(102.4, 104, t)) + .5 * hlk, reveal: k => ss(96.8 + k * .05, 97.2 + k * .05, t) }); hlUnder(ctx, e1, Mx, y0 - lh * e1.length, size, Film.text('K1'), hlk);
      Pilot.text(ctx, Film.text('P3'), Mx, cy - sh / 2 + (V ? 66 : 60), { size: V ? 36 : 34, weight: 600, color: '#6a4a26', alpha: ss(97, 98, t) * light, ls: 3 }); }
    scrollText(ctx, '01', Mx, y0, size, maxW, { lines, lit: ss(r1, r1 + 1, t) * (1 - .5 * ss(102.4, 104, t)) + .5 * hlk, reveal: k => ss(r0 + (r1 - r0) * k / n, r0 + (r1 - r0) * k / n + .3, t), glow: k => { const at = r0 + (r1 - r0) * k / n; return ss(at, at + .15, t) * (1 - ss(at + .2, at + .7, t)); } });
    hlUnder(ctx, lines, Mx, y0, size, Film.lines['19'].hl, hlk);
    Pilot.text(ctx, citeRange('19a', '19'), Mx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 30 : 28, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(99, 100, t) * light }); }
  { const a = Mx + sw0 / 2 + 60, b = Lx - sw0 / 2 - 60, yb = cy + sh / 2 - 46; Lamplit.ruler(ctx, a, b, yb, x1);
    Pilot.text(ctx, Film.text('C2'), (a + b) / 2, cy + 22, { size: V ? 84 : 92, weight: 700, color: '#4a2f16', alpha: .8, ls: 10 }); }
  { const size = V ? 50 : 48, w0 = 106.4, w1 = 110.0; ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text('20'), sw0 - 200), n = ls.reduce((s, l) => s + Pilot.chars(l).length, 0), lw = Math.max(...ls.map(l => ctx.measureText(l).width)); ctx.restore();
    const ly = cy - (ls.length - 1) * size * 1.7 / 2 + size * .32;
    if (t > w0 - .2) { scrollText(ctx, '20', Lx, ly, size, sw0 - 200, { lines: ls, lit: .5 * hlk, reveal: k => ss(w0 + (w1 - w0) * k / n, w0 + (w1 - w0) * k / n + .12, t) });
      hlUnder(ctx, ls, Lx, ly, size, Film.lines['20'].hl, hlk); hlUnder(ctx, ls, Lx, ly, size, Film.text('K1'), hlk);
      Pilot.text(ctx, Film.text('P4'), Lx, cy - sh / 2 + (V ? 66 : 60), { size: V ? 36 : 34, weight: 600, color: '#6a4a26', alpha: ss(w0 - .6, w0 + .4, t), ls: 3 });
      const k = clamp((t - w0) / (w1 - w0)); if (k > 0 && k < 1) { const nx = Lx - lw / 2 + lw * k, ny = ly - size * .3; glow(ctx, nx, ny, 70, [255, 236, 180], 1); glow(ctx, nx, ny, 14, [255, 255, 240], 1); }
      Pilot.text(ctx, Film.cite('20'), Lx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 30 : 28, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ss(w1, w1 + .6, t) }); } }
  if (t > 114.6 && t < 119.4) { const k = clamp((t - 114.8) / 3.0), x0r = Mx - sw0 * .2, x1r = Lx - sw0 * .1, on = ss(114.6, 115.0, t) * (1 - ss(118.8, 119.4, t));
    Lamplit.sweep(ctx, x0r, x1r, cy, sh, k, on);
    glow(ctx, Mx, cy - sh * .05, sw0 * .5, [255, 214, 130], .5 * on * Math.exp(-k * 6)); glow(ctx, Lx, cy, sw0 * .5, [255, 214, 130], .7 * on * ss(.85, 1, k)); }
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }

function citeRange(a, b) {   // "말라기 4:5" + "말라기 4:6" → "말라기 4:5–6 (개역개정)"; falls back to b's cite when the two are not in one chapter
  const A = (Film.lines[a] || {}).cite || '', B = (Film.lines[b] || {}).cite || '', ma = A.match(/^(.*\D)(\d+)$/), mb = B.match(/^(.*\D)(\d+)$/);
  return ma && mb && ma[1] === mb[1] ? Film.cite(a).replace(A, A + '–' + mb[2]) : Film.cite(b); }
function nazarethPull(ctx, t) {   // 2:21–2:37 — Nazareth: the pen of light underlines Luke 4:18 at reading pace; silence; "오늘" — the words burn,
  // the light runs out along the scroll to the other promises, the camera pulls back and holds: one scroll
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cy = V ? H * .4 : H * .42, sh = V ? 640 : 470, sw = V ? 940 : 1320, Dd = V ? 1050 : 1450, segs = [['13', -2], ['05', -1], ['25a', 0], ['19a', 1], ['19', 2]];
  const x0 = W / 2 - 2 * Dd - sw / 2, x1 = W / 2 + 2 * Dd + sw / 2, fire = ss(150.2, 150.7, t), pull = eio(clamp((t - 150.4) / 4.0)), zf = W * .95 / (2 * Dd + sw + 120);
  const z = Math.exp(lerp(Math.log(1), Math.log(zf), pull)), light = ss(140.8, 141.8, t) * (1 - .35 * ss(148.5, 149.6, t) + .35 * fire);
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(z, z); ctx.translate(-W / 2, -cy);
  longScroll(ctx, x0, x1, cy, sh, light, W / 2);
  // the burst sits behind the words (the ink stays dark and readable)
  if (fire > 0) { glow(ctx, W / 2, cy, sh * .9 + Dd * 2.6 * clamp((t - 150.3) / 2), [255, 226, 160], .55 * fire); const fl = Math.exp(-(t - 150.2) * 2.2); glow(ctx, W / 2, cy, sw * .7, [255, 248, 225], .7 * fire * fl); }
  segs.forEach(([id, k]) => { const cx = W / 2 + k * Dd, size = id === '25a' ? (V ? 40 : 38) : (V ? 44 : 44); ctx.save(); ctx.font = Film.font(size, 600); const ls = Film.wrapEven(ctx, Film.text(id), sw - 200); ctx.restore();
    const y = cy - (ls.length - 1) * size * 1.7 / 2 + size * .32, wave = ss(150.4 + Math.abs(k) * .5, 151 + Math.abs(k) * .5, t);
    scrollText(ctx, id, cx, y, size, sw - 200, { lines: ls, lit: k === 0 ? fire : wave, alpha: k === 0 ? 1 : .92 });
    Pilot.text(ctx, Film.cite(id), cx, cy + sh / 2 - 38, { size: V ? 28 : 26, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: .9 });
    if (k === 0) Lamplit.pen(ctx, ls, cx, y, size, clamp((t - 142.2) / 7.0), t < 148.6); });   // the pen of light underlines the words at reading pace; the line stays once drawn
  ctx.restore(); bottomBand(ctx, 'rgba(5,6,10,'); }

function partOpening(ctx, t) {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = V ? H * .4 : H * .43, sw = V ? 900 : 1340, sh = V ? 780 : 560;
  // the first frame is already a picture (a feed's first impression; no fade from black): lamp lit, scroll partly open, its label on
  const open = eio(clamp((t + 1.6) / 2.8)), dark = ss(9.6, 12.2, t);
  const flick = Lamplit.flicker(t), light = ss(-1.2, 1.0, t) * (1 - dark) * flick;
  // the camera creeps toward the scroll (it never cuts; the push makes the stillness feel held)
  const push = 1 + .07 * eio(clamp(t / 12)); ctx.save(); ctx.translate(W / 2, H * .45); ctx.scale(push, push); ctx.translate(-W / 2, -H * .45);
  // warm pool of lamplight on the table
  Lamplit.pool(ctx, cx, cy, sh, light);
  const sa = 1 - ss(10.8, 12.4, t);
  if (sa > 0) { ctx.save(); ctx.globalAlpha = sa;
    scroll(ctx, cx, cy, sw, sh, open, light);
    // Mal 4:6 on the scroll — the promise half faint, the warning half in ink; then the letters go out one by one
    const size = V ? 44 : 46, maxW = sw - (V ? 130 : 220); ctx.save(); ctx.font = Film.font(size, 600);
    const lines = Film.wrapEven(ctx, Film.text('01'), maxW), promise = Film.wrapEven(ctx, Film.text('01').split(/\s*\/\s*/)[0], maxW).length; ctx.restore();
    const lh = size * 1.7, y0 = cy - (lines.length - 1) * lh / 2 + size * .32;   // the letters' bodies (not their baselines) centred on the scroll
    const tin = ss(0.6, 2.2, t), out0 = 8.8, out1 = 10.6;
    Film.block(ctx, lines, cx, y0, { size, weight: 600, lh: 1.7, color: '#2b1a0b', alpha: tin,
      lineAlpha: i => i < promise ? .38 : 1,
      charAlpha: (k, n) => { const at = out0 + (out1 - out0) * k / n; return 1 - ss(at, at + .35, t); },
      charGlow: (k, n) => { const at = out0 + (out1 - out0) * k / n; return ss(at - .25, at, t) * (1 - ss(at, at + .3, t)); } });
    const ca = tin * (1 - ss(out1 - .2, out1 + .6, t));
    const pa = (1 - ss(out1 - .2, out1 + .6, t)) * ss(.45, .6, open); if (pa > 0) Pilot.text(ctx, Film.text('P0'), cx, cy - sh / 2 + (V ? 66 : 60), { size: V ? 36 : 34, weight: 600, color: '#6a4a26', alpha: pa * light, ls: 3 });   // where we are in the Bible
    if (ca > 0) Pilot.text(ctx, Film.cite('01'), cx, cy + sh / 2 - (V ? 50 : 44), { size: V ? 26 : 24, font: "'Noto Sans KR',sans-serif", color: '#5a3d1f', alpha: ca });
    ctx.restore(); }

  ctx.restore();

  { const k = win(t, 11.6, 17.0, .6, .6); if (k > 0) {   // its own breaks: portrait one piece a line, landscape the first two pieces together
    const sg = Film.text('03').split(/\s*\/\s*/), size = V ? 52 : 54, lines = V || sg.length < 3 ? sg : [sg[0] + ' ' + sg[1], ...sg.slice(2)], lh = size * 1.55;
    Film.block(ctx, lines, W / 2, (V ? H * .47 : H * .5) - (lines.length - 1) * lh / 2 + (1 - eo(clamp((t - 11.6) / 1.2))) * 10, { size, weight: 600, alpha: k, color: '#f3ece0', shadow: 'rgba(0,0,0,.85)', shadowBlur: 22, lh: 1.55 }); } }
  // title
  const ta = win(t, 17.2, 21.3, 1.0, 1.0);
  if (ta > 0) { const sz = V ? 104 : 116, ty = V ? H * .47 : H * .5;
    Pilot.text(ctx, Film.text('T1'), W / 2, ty, { size: sz, weight: 600, color: '#e9c77a', alpha: ta, shadow: 'rgba(233,185,73,.35)', shadowBlur: 40, ls: 6 });
    const lw = (V ? 420 : 520) * eo(clamp((t - 17.5) / 2.0)); ctx.fillStyle = `rgba(233,199,122,${ta * .8})`; ctx.fillRect(W / 2 - lw / 2, ty + (V ? 54 : 58), lw, 2); }
}

// =====================================================================================================================
// small props (glow, lamp, ink, hebInk: the lamplit kit)
const GOLD = [233, 199, 122], INK = '#2b1a0b';
// real Hebrew (Masoretic consonants, from Sefaria) for hebInk
const HEB_SHEMA = 'שמע ישראל יהוה אלהינו יהוה אחד ואהבת את יהוה אלהיך בכל לבבך ובכל נפשך ובכל מאדך והיו הדברים האלה אשר אנכי מצוך היום על לבבך ושננתם לבניך ודברת בם בשבתך בביתך ובלכתך בדרך ובשכבך ובקומך וקשרתם לאות על ידך והיו לטטפת בין עיניך וכתבתם על מזזות ביתך ובשעריך';
const HEB_ISA40 = 'קול אמר קרא ואמר מה אקרא כל הבשר חציר וכל חסדו כציץ השדה יבש חציר נבל ציץ כי רוח יהוה נשבה בו אכן חציר העם יבש חציר נבל ציץ ודבר אלהינו יקום לעולם';
// =====================================================================================================================
// Daniel's statue (Dan 2): gold head, silver chest and arms, bronze belly and thighs, iron legs, feet of iron and clay
const ZONES = ['gold', 'silver', 'bronze', 'iron', 'clay'];
const METAL = { gold: [222, 176, 80], silver: [196, 204, 218], bronze: [184, 114, 62], iron: [120, 126, 134], clay: [128, 96, 74] };
const mirror = pts => pts.map(([x, y]) => [-x, y]);
const ARM = [[-.142, .166], [-.172, .17], [-.19, .2], [-.197, .27], [-.191, .34], [-.188, .395], [-.178, .425], [-.16, .428], [-.152, .4], [-.153, .33], [-.148, .27], [-.135, .22]];
const LEG = [[-.122, .566], [-.015, .566], [-.02, .68], [-.03, .745], [-.026, .9], [-.088, .9], [-.097, .75], [-.112, .68]];
const FOOT = [[-.1, .9], [-.022, .9], [-.014, .95], [-.012, .976], [-.14, .976], [-.134, .95]];
const SP = {   // unit coordinates: height 1, centred on x = 0
  gold: [['e', 0, .08, .05, .064], ['p', [-.05, .045], [-.04, .008], [-.02, .03], [0, -.002], [.02, .03], [.04, .008], [.05, .045], [.045, .056], [-.045, .056]],
    ['p', [-.022, .135], [.022, .135], [.03, .16], [-.03, .16]]],
  silver: [['p', [-.142, .166], [-.11, .155], [-.05, .151], [0, .153], [.05, .151], [.11, .155], [.142, .166], [.134, .25], [.122, .362], [-.122, .362], [-.134, .25]], ['p', ...ARM], ['p', ...mirror(ARM)]],
  bronze: [['p', [-.122, .362], [.122, .362], [.135, .42], [.14, .47], [.13, .566], [-.13, .566], [-.14, .47], [-.135, .42]]],
  iron: [['p', ...LEG], ['p', ...mirror(LEG)]],
  clay: [['p', ...FOOT], ['p', ...mirror(FOOT)]],
};
const statuePath = {}; let shards = [], cracks = [], stoneShape = [];
function buildStatue() {
  for (const z of ZONES) { const p = new Path2D(); for (const s of SP[z]) { if (s[0] === 'e') p.ellipse(s[1] * 1000, s[2] * 1000, s[3] * 1000, s[4] * 1000, 0, 0, 6.283);
    else { const q = s.slice(1); p.moveTo(q[0][0] * 1000, q[0][1] * 1000); q.slice(1).forEach(v => p.lineTo(v[0] * 1000, v[1] * 1000)); p.closePath(); } } statuePath[z] = p; }
  const tc = canvas(4, 4).getContext('2d'), r = rng(5);
  while (shards.length < 2200) { const x = (r() - .5) * .44, y = r() * .98; const z = ZONES.find(z => tc.isPointInPath(statuePath[z], x * 1000, y * 1000)); if (z) shards.push([x, y, z, r(), r(), r()]); }
  const rc = rng(8); for (let i = 0; i < 12; i++) { let x = (rc() - .5) * .22, y = .97; const pts = [[x, y]]; for (let k = 0; k < 14; k++) { x += (rc() - .5) * .05; y -= .02 + rc() * .035; pts.push([x, y]); } cracks.push(pts); }

}
// lit: { zone: 0..1 }, base: unlit visibility
function statue(ctx, cx, top, hs, lit, base = .22, alpha = 1) {

    const dark = mix(m, [0, 0, 0], .9), mid = mix(mix(m, [0, 0, 0], .55), m, L), hi = mix(mix(m, [0, 0, 0], .3), mix(m, [255, 250, 235], .28), L);
    g.addColorStop(0, rgb(dark)); g.addColorStop(.32, rgb(mid)); g.addColorStop(.45, rgb(hi)); g.addColorStop(.62, rgb(mid)); g.addColorStop(1, rgb(dark));
    if ((lit[z] || 0) > .05) { ctx.shadowColor = rgb(m, .55 * lit[z]); ctx.shadowBlur = 80; }

    if (z === 'clay') { ctx.save(); ctx.clip(statuePath[z]); const r = rng(3); ctx.fillStyle = rgb(mix([150, 110, 80], [0, 0, 0], .7 - L * .4));
      for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.ellipse((r() - .5) * 280, 900 + r() * 80, 8 + r() * 18, 5 + r() * 9, r() * 3, 0, 6.283); ctx.fill(); } ctx.restore(); }
    ctx.strokeStyle = rgb(mix(m, [255, 240, 210], .5), .08 + .45 * (lit[z] || 0)); ctx.lineWidth = 2; ctx.stroke(statuePath[z]); }

  if (!statueAll) { statueAll = new Path2D(); for (const z of ZONES) statueAll.addPath(statuePath[z]); }
  ctx.save(); ctx.clip(statueAll);
  const vg = ctx.createLinearGradient(0, 0, 0, 1000); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(.35, 'rgba(0,0,0,.12)'); vg.addColorStop(1, 'rgba(0,0,0,.62)'); ctx.fillStyle = vg; ctx.fillRect(-300, -50, 600, 1100);
  ctx.globalCompositeOperation = 'lighter'; const sg = ctx.createLinearGradient(-90, 0, -10, 0); sg.addColorStop(0, 'rgba(255,250,235,0)'); sg.addColorStop(.5, 'rgba(255,250,235,.10)'); sg.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.fillStyle = sg; ctx.fillRect(-90, 0, 80, 1000); ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3; ctx.beginPath();
