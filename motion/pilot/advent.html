<title>시안 · 예수님의 오심</title>

<script src="lib.js"></script>
<script>
/* 11 예수님의 오심 — backlit Gothic stained glass in a dark stone church.
   Dawn crosses one tall window and wakes its panes one at a time: the five promises the site names
   (여자의 후손 · 아브라함의 복 · 유월절 어린 양 · 다윗의 영원한 왕 · 새 언약), then the central lancet — the nativity
   under the star. The camera pushes into the manger, then tilts down the shafts to the coloured light on the floor (John 1:14).
   Glass only glows where the sun is behind it; things appear by being lit, never faded in. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas, hex, mix, rgb, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 36;
const SS = 2;                                   // glass sprites: px per world unit
const FLOOR = 240;                              // wall meets floor (world y; window sill at 0, up is negative)
const COB = '#1b3f9e', COB2 = '#15328a', RUBY = '#b3121f', GOLD = '#e3a526', LEAD = '#16161a', WHITE = '#dfe9d6',
      FLESH = '#c08454', GREEN = '#1f6a34', DGREEN = '#1a4f26', MURREY = '#6a1c3e', BROWN = '#7a4a22', ULTRA = '#2f63d6', OCHRE = '#c98a2e';
let room, regions = [], tmpC, tmpX, dust = [], MOTTLE, MPAT;

// ---------- geometry ----------
function lancetPts(x0, x1, spring, r, base, n = 40) {      // pointed arch: two arcs, centres on the spring line
  const cl = x0 + r, cr = x1 - r, pts = [[x0, base]];
  // left arc: centre (cl, spring), from angle PI (point x0) up to apex
  const ax = (x0 + x1) / 2, aL = Math.atan2(-(Math.sqrt(r * r - (cl - ax) * (cl - ax))), ax - cl);
  for (let i = 0; i <= n; i++) { const a = lerp(Math.PI, Math.PI * 2 + aL, i / n); pts.push([cl + Math.cos(a) * r, spring + Math.sin(a) * r]); }
  const aR = Math.atan2(-(Math.sqrt(r * r - (cr - ax) * (cr - ax))), ax - cr);
  for (let i = 0; i <= n; i++) { const a = lerp(aR, 0, i / n); pts.push([cr + Math.cos(a) * r, spring + Math.sin(a) * r]); }
  pts.push([x1, base]); return pts;
}
const bbox = pts => { const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; };
const P2 = pts => { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); p.__b = bbox(pts); return p; };
const circ = (x, y, r) => { const p = new Path2D(); p.arc(x, y, r, 0, 6.2832); p.__b = [x - r, y - r, x + r, y + r]; return p; };
const ell = (x, y, rx, ry, a = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, a, 0, 6.2832); const m = Math.max(rx, ry); p.__b = [x - m, y - m, x + m, y + m]; return p; };
const rect = (x, y, w, h) => { const p = new Path2D(); p.rect(x, y, w, h); p.__b = [x, y, x + w, y + h]; return p; };
const star = (x, y, ro, ri, n = 8, a0 = -Math.PI / 2) => { const pts = []; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro, a = a0 + i * Math.PI / n; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } return P2(pts); };
const sv = s => { const p = new Path2D(s), n = s.match(/-?[\d.]+/g).map(Number), pts = []; for (let i = 0; i + 1 < n.length; i += 2) pts.push([n[i], n[i + 1]]); p.__b = bbox(pts); return p; };

const LAN = {                                   // the window: one tall central lancet, two side lancets, a rose above
  C: { x0: -165, x1: 165, spring: -520, r: 250 },
  L: { x0: -420, x1: -220, spring: -420, r: 150 },
  R: { x0: 220, x1: 420, spring: -420, r: 150 },
  rose: { x: 0, y: -862, r: 80 } };
const ARCH = { x0: -470, x1: 470, spring: -314, r: 700 };

// ---------- glass ----------
let R = rng(1);
function shadeHex(c, k) { const a = typeof c === 'string' ? hex(c) : c; return [a[0] * k, a[1] * k, a[2] * k]; }
function piece(x, path, col, o = {}) {
  const k = 1 + (R() - .5) * .18, base = shadeHex(col, k);
  x.fillStyle = rgb(base); x.fill(path);
  x.save(); x.clip(path);
  const b = o.b || path.__b || [-400, -900, 400, 100], ang = R() * 3.14, area = (b[2] - b[0]) * (b[3] - b[1]), n = o.streaks == null ? Math.min(40, 4 + area / 300) : o.streaks;   // streaks at a per-piece angle
  x.lineCap = 'round';
  for (let i = 0; i < n; i++) { const px = lerp(b[0], b[2], R()), py = lerp(b[1], b[3], R()), l = 20 + R() * 60;
    x.strokeStyle = R() < .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.10)'; x.lineWidth = .6 + R() * 1.6;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(ang) * l, py + Math.sin(ang) * l); x.stroke(); }
  for (let i = 0; i < (o.bubbles == null ? 6 : o.bubbles); i++) { x.fillStyle = 'rgba(255,255,255,.22)'; x.beginPath(); x.arc(lerp(b[0], b[2], R()), lerp(b[1], b[3], R()), .5 + R() * 1.2, 0, 6.28); x.fill(); }
  { const ox = R() * 500, oy = R() * 500; x.translate(ox, oy); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .5; x.fillStyle = MPAT; x.fillRect(b[0] - ox - 500, b[1] - oy - 500, b[2] - b[0] + 1000, b[3] - b[1] + 1000);   // thickness clouds
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.translate(-ox, -oy); }
  if (path.__b && o.shade !== 0) { const sa = .5 + R() * .9, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, rr = Math.max(b[2] - b[0], b[3] - b[1]) / 2;   // grisaille matting: a graded shade across the piece
    const g = x.createLinearGradient(cx - Math.cos(sa) * rr, cy - Math.sin(sa) * rr, cx + Math.cos(sa) * rr, cy + Math.sin(sa) * rr);
    g.addColorStop(0, 'rgba(255,250,235,.10)'); g.addColorStop(.45, 'rgba(40,20,10,0)'); g.addColorStop(1, `rgba(40,20,10,${o.shade || .34})`); x.fillStyle = g; x.fillRect(b[0] - 2, b[1] - 2, b[2] - b[0] + 4, b[3] - b[1] + 4); }
  x.strokeStyle = 'rgba(48,26,12,.22)'; x.lineWidth = (o.mat || 9) * 1.6; x.stroke(path);                    // aged edge by the lead (graded)
  x.strokeStyle = 'rgba(48,26,12,.28)'; x.lineWidth = o.mat || 9; x.stroke(path);
  x.strokeStyle = 'rgba(48,26,12,.30)'; x.lineWidth = (o.mat || 9) * .4; x.stroke(path);
  x.restore();
  const lw = (o.lw || 3.2) * 1.3;
  x.strokeStyle = LEAD; x.lineWidth = lw; x.lineJoin = 'round'; x.stroke(path);
  x.strokeStyle = 'rgba(110,108,112,.35)'; x.lineWidth = Math.max(.6, lw * .18); x.stroke(path);              // the came's flange
}
function gris(x, w, fn) { x.save(); x.strokeStyle = 'rgba(52,28,14,.85)'; x.fillStyle = 'rgba(52,28,14,.85)'; x.lineWidth = w; x.lineCap = 'round'; x.lineJoin = 'round'; fn(x); x.restore(); }
function line(x, pts) { x.beginPath(); pts.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); x.stroke(); }
function curve(x, s) { x.stroke(new Path2D(s)); }
function quarries(x, clip, col, cell, b, motif = true) {            // hand-cut lozenge quarries, each with a painted motif
  x.save(); x.clip(clip); const r = rng(b[0] * 7 + b[1] * 3 | 0), hw = cell * .5, hh = cell * .62;
  const jit = new Map(), J = (i, j) => { const k = i + ',' + j; if (!jit.has(k)) jit.set(k, [(r() - .5) * cell * .12, (r() - .5) * cell * .12]); return jit.get(k); };
  const v = (i, j) => { const q = J(i, j); return [b[0] + (i + (j & 1) * .5) * cell + q[0], b[1] + j * hh + q[1]]; };
  for (let j = -1; j < (b[3] - b[1]) / hh + 2; j++) for (let i = -1; i < (b[2] - b[0]) / cell + 2; i++) {
    const c = v(i, j), up = v(i, j - 2), lf = v(i - 1 + (j & 1), j - 1), rt = v(i + (j & 1), j - 1);
    const p = P2([lf, up, rt, c]); const k = .9 + r() * .2, cc = shadeHex(col, k);
    x.fillStyle = rgb(cc); x.fill(p);
    x.save(); x.clip(p); x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1; for (let s = 0; s < 4; s++) { const py = up[1] + r() * (c[1] - up[1]); line(x, [[lf[0], py], [rt[0], py + 6]]); }
    x.strokeStyle = 'rgba(40,22,12,.32)'; x.lineWidth = 6; x.stroke(p); x.restore();
    if (motif) { const mx = (lf[0] + rt[0]) / 2, my = (up[1] + c[1]) / 2; x.strokeStyle = 'rgba(40,22,12,.5)'; x.lineWidth = 1.4;
      x.beginPath(); x.arc(mx, my, cell * .1, 0, 6.28); x.stroke(); for (let a = 0; a < 4; a++) { x.beginPath(); x.arc(mx + Math.cos(a * 1.57) * cell * .17, my + Math.sin(a * 1.57) * cell * .17, cell * .055, 0, 6.28); x.stroke(); } }
    x.strokeStyle = LEAD; x.lineWidth = 2.2; x.lineJoin = 'round'; x.stroke(p);
  }
  x.restore();
}
function border(x, L, bw = 16) {                                    // ruby band with pearls, white fillet
  const out = lancetPts(L.x0, L.x1, L.spring, L.r, 40), mid = lancetPts(L.x0 + bw / 2, L.x1 - bw / 2, L.spring, L.r - bw / 2, 40),
    inn = lancetPts(L.x0 + bw, L.x1 - bw, L.spring, L.r - bw, 40), fil = lancetPts(L.x0 + bw + 5, L.x1 - bw - 5, L.spring, L.r - bw - 5, 40);
  const band = P2(out); const hole = P2(inn); const ring = new Path2D(); ring.addPath(band); ring.addPath(hole);
  x.save(); x.clip(ring, 'evenodd'); piece(x, band, RUBY, { streaks: 60, bubbles: 30, lw: 2 }); x.restore();
  const fr = new Path2D(); fr.addPath(hole); fr.addPath(P2(fil));
  x.save(); x.clip(fr, 'evenodd'); piece(x, hole, WHITE, { streaks: 10, mat: 3, lw: 1.6 }); x.restore();
  // pearls along the middle of the band
  let acc = 0; for (let i = 1; i < mid.length; i++) { const a = mid[i - 1], c = mid[i], d = Math.hypot(c[0] - a[0], c[1] - a[1]);
    for (let s = 0; s < d; s += 1) { acc += 1; if (acc > 19) { acc = 0; const k = s / d; piece(x, circ(lerp(a[0], c[0], k), lerp(a[1], c[1], k), 4.2), '#f1ead2', { streaks: 0, bubbles: 0, mat: 2, lw: 1.4 }); } } }
  x.strokeStyle = LEAD; x.lineWidth = 3; x.stroke(hole); x.lineWidth = 6; x.stroke(band);
  return P2(fil);
}
function medallion(x, cx, cy, r, ground, fn) {                      // a round panel: gold ring, ruby beads, a scene inside
  const ringO = circ(cx, cy, r), ringI = circ(cx, cy, r - 9), rr = new Path2D(); rr.addPath(ringO); rr.addPath(ringI);
  x.save(); x.clip(rr, 'evenodd'); piece(x, ringO, GOLD, { streaks: 20, lw: 2 }); x.restore();
  for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283; piece(x, circ(cx + Math.cos(a) * (r - 4.5), cy + Math.sin(a) * (r - 4.5), 2.6), '#f6e7b6', { streaks: 0, bubbles: 0, mat: 1, lw: 1.1 }); }
  x.save(); x.clip(ringI); piece(x, ringI, ground, { streaks: 30, lw: 2.4 }); x.translate(cx, cy); fn(x); x.restore();
  x.strokeStyle = LEAD; x.lineWidth = 3.4; x.stroke(ringI); x.lineWidth = 4.5; x.stroke(ringO);
}
function bars(x, L, ys) { x.save(); x.clip(P2(lancetPts(L.x0, L.x1, L.spring, L.r, 40)));
  for (const y of ys) { x.fillStyle = '#0d0d10'; x.fillRect(L.x0 - 5, y - 3.5, L.x1 - L.x0 + 10, 7); x.fillStyle = 'rgba(120,110,100,.35)'; x.fillRect(L.x0 - 5, y - 3.5, L.x1 - L.x0 + 10, 1.2); }
  x.restore(); }

// ---------- the five promises ----------
function mWoman(x) {           // 여자의 후손 (창 3:15): the tree in the garden, the serpent at its foot, and one small gold light
  piece(x, sv('M-80 30 C-40 18 30 22 80 30 L80 80 L-80 80 Z'), DGREEN, { lw: 2.4 });
  piece(x, sv('M-6 32 C-4 6 -8 -14 -4 -30 L6 -30 C4 -12 8 8 8 32 Z'), BROWN, { lw: 2.2 });
  piece(x, sv('M-44 -22 C-60 -40 -44 -66 -20 -60 C-12 -80 18 -80 26 -60 C50 -66 60 -38 42 -22 C30 -10 -30 -10 -44 -22 Z'), GREEN, { lw: 2.4 });
  [[-24, -40], [14, -50], [28, -30], [-8, -24]].forEach(([a, b]) => piece(x, circ(a, b, 5.5), RUBY, { streaks: 0, mat: 2, lw: 1.6 }));
  piece(x, sv('M-58 46 C-46 34 -20 34 -14 44 C-8 54 10 56 22 46 C30 40 44 38 52 44 L56 52 C44 48 34 50 26 56 C10 66 -12 62 -20 52 C-28 44 -46 46 -54 54 Z'), '#a6a83a', { lw: 2 });
  piece(x, ell(54, 48, 7, 5, .3), '#a6a83a', { streaks: 0, lw: 1.8 });
  gris(x, 1.6, g => { curve(g, 'M-40 46 C-36 44 -32 44 -28 46'); curve(g, 'M0 56 C4 56 8 55 12 52'); g.beginPath(); g.arc(56, 47, 1.2, 0, 6.28); g.fill();
    curve(g, 'M-30 -40 C-20 -48 -6 -48 4 -42'); curve(g, 'M10 -36 C18 -42 28 -42 34 -34'); curve(g, 'M-2 0 C0 10 0 20 2 28'); });
  piece(x, star(-34, 4, 10, 4.5, 8), '#ffd75a', { streaks: 0, bubbles: 0, mat: 2, lw: 1.6 });
}
function mAbraham(x) {        // 아브라함의 복: a tent, a man looking up, the stars
  for (let i = 0; i < 9; i++) { const a = [[-50, -48], [-20, -62], [12, -56], [40, -40], [56, -10], [-62, -14], [-34, -30], [24, -26], [-6, -36]][i];
    piece(x, star(a[0], a[1], i % 3 ? 5 : 8, i % 3 ? 2.2 : 3.4, 4 + (i % 2) * 4, i * .3), '#ffd75a', { streaks: 0, bubbles: 0, mat: 1, lw: 1.2 }); }
  piece(x, sv('M-80 34 C-30 26 30 26 80 34 L80 80 L-80 80 Z'), '#6b5a2a', { lw: 2.4 });
  piece(x, sv('M-6 38 L20 -6 L58 36 Z'), '#d8c08a', { lw: 2.4 });
  piece(x, sv('M14 38 L22 8 L32 38 Z'), '#3a2a18', { lw: 1.8 });
  piece(x, sv('M-44 40 C-44 16 -42 -2 -36 -12 L-24 -12 C-20 0 -18 18 -18 40 Z'), MURREY, { lw: 2.2 });
  piece(x, ell(-30, -20, 7.5, 8.5), FLESH, { streaks: 0, lw: 1.8 });
  piece(x, sv('M-37 -24 C-36 -32 -24 -32 -22 -24 C-26 -28 -33 -28 -37 -24 Z'), '#e8e0cc', { streaks: 0, lw: 1.4 });
  piece(x, sv('M-24 -6 L-14 -30 L-10 -28 L-19 -4 Z'), FLESH, { streaks: 0, lw: 1.6 });
  gris(x, 1.4, g => { curve(g, 'M-29 -22 C-27 -24 -25 -24 -24 -23'); curve(g, 'M-33 0 C-32 14 -32 26 -31 38'); curve(g, 'M-26 0 C-25 14 -24 26 -24 38'); });
}
function mLamb(x) {           // 유월절 어린 양: the lamb before a door marked with blood
  piece(x, sv('M-36 30 L-36 -50 L36 -50 L36 30 L24 30 L24 -38 L-24 -38 L-24 30 Z'), '#cdb88f', { lw: 2.4 });
  piece(x, rect(-36, -50, 72, 10), RUBY, { streaks: 0, lw: 2 }); piece(x, rect(-36, -40, 9, 70), RUBY, { streaks: 0, lw: 2 }); piece(x, rect(27, -40, 9, 70), RUBY, { streaks: 0, lw: 2 });
  piece(x, rect(-24, -38, 48, 68), '#2a1c14', { streaks: 4, lw: 2 });
  piece(x, sv('M-80 30 C-30 24 30 24 80 30 L80 80 L-80 80 Z'), DGREEN, { lw: 2.4 });
  [[-26, 30, 34], [6, 30, 36]].forEach(([a, b, h]) => { piece(x, rect(a, b, 5, 18), '#3a2a20', { streaks: 0, mat: 1, lw: 1.4 }); piece(x, rect(a + 16, b, 5, 18), '#3a2a20', { streaks: 0, mat: 1, lw: 1.4 }); });
  piece(x, sv('M-38 20 C-46 6 -36 -10 -20 -8 C-12 -18 6 -18 14 -8 C28 -10 36 4 30 18 C24 32 -30 34 -38 20 Z'), '#f2efe2', { lw: 2.4 });
  piece(x, sv('M22 -4 C24 -18 40 -22 46 -12 C52 -4 48 8 38 8 C30 8 24 4 22 -4 Z'), '#f2efe2', { lw: 2.2 });
  piece(x, ell(30, -16, 5, 3, -.6), '#e6dccb', { streaks: 0, lw: 1.4 });
  gris(x, 1.5, g => { g.beginPath(); g.arc(40, -10, 1.6, 0, 6.28); g.fill(); curve(g, 'M44 0 C45 2 46 2 47 1');
    [[-30, 4], [-18, -2], [-6, 6], [6, -2], [16, 8], [-22, 16], [-4, 18], [12, 20]].forEach(([a, b]) => { g.beginPath(); g.arc(a, b, 4, 3.6, 5.8); g.stroke(); }); });
}
function mDavid(x) {          // 다윗의 영원한 왕: the crown over the harp
  piece(x, sv('M-44 -8 L-50 -52 L-28 -30 L-12 -62 L0 -34 L12 -62 L28 -30 L50 -52 L44 -8 Z'), GOLD, { lw: 2.6 });
  piece(x, sv('M-46 -10 L46 -10 L44 8 L-44 8 Z'), '#d39a22', { lw: 2.4 });
  [[-26, -1, '#2f63d6'], [0, -1, '#2a8a4a'], [26, -1, '#2f63d6']].forEach(([a, b, c]) => piece(x, ell(a, b, 6, 5), c, { streaks: 0, mat: 2, lw: 1.6 }));
  [[-50, -54], [-12, -64], [12, -64], [50, -54]].forEach(([a, b]) => piece(x, circ(a, b, 4.5), '#f6e7b6', { streaks: 0, mat: 1, lw: 1.4 }));
  piece(x, sv('M-30 64 C-34 40 -30 26 -20 18 L-12 22 C-20 30 -22 44 -18 60 Z M-20 18 C0 12 24 16 34 28 L30 34 C20 24 0 22 -12 26 Z M30 30 L36 30 L22 66 L16 64 Z M-30 60 L22 60 L22 68 L-30 68 Z'), BROWN, { lw: 2.2 });
  gris(x, 1.1, g => { for (let i = 0; i < 6; i++) line(g, [[-18 + i * 7, 26 - i * .6], [-18 + i * 7.4, 60]]); curve(g, 'M-30 -14 C-10 -16 10 -16 30 -14'); });
}
function mCovenant(x) {       // 새 언약 (rose): the cup and the bread
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283 - Math.PI / 2, px = Math.cos(a) * 58, py = Math.sin(a) * 58;
    piece(x, ell(px, py, 20, 14, a), i % 2 ? COB : RUBY, { streaks: 8, lw: 2 }); }
  piece(x, circ(0, 0, 40), COB2, { lw: 2.4 });
  piece(x, sv('M-20 -28 L20 -28 C20 -6 12 4 0 6 C-12 4 -20 -6 -20 -28 Z'), GOLD, { lw: 2.2 });
  piece(x, sv('M-3 6 L3 6 L4 20 L-4 20 Z'), '#d39a22', { streaks: 0, lw: 1.6 });
  piece(x, sv('M-14 24 C-12 18 12 18 14 24 Z'), '#d39a22', { streaks: 0, lw: 1.6 });
  piece(x, sv('M-16 -28 L16 -28 L14 -20 L-14 -20 Z'), RUBY, { streaks: 0, lw: 1.6 });
  piece(x, ell(0, -34, 13, 7), '#d9b77c', { streaks: 0, lw: 1.8 });
  gris(x, 1.2, g => { curve(g, 'M-8 -36 L-4 -32 M0 -38 L4 -33 M6 -37 L9 -33'); curve(g, 'M-14 -16 C-10 -6 -4 0 0 2'); });
}

// ---------- the nativity (central lancet) ----------
function nativity(x, clip) {
  const stable = sv('M0 -446 L160 -340 L160 0 L-160 0 L-160 -340 Z');
  const sky = new Path2D(); sky.addPath(clip);
  quarries(x, clip, COB, 30, [-170, -780, 170, 0]);
  x.save(); x.clip(stable); quarries(x, stable, '#8a1420', 30, [-170, -460, 170, 0]); x.restore();
  // the star and its ray
  piece(x, sv('M-9 -598 L9 -598 L4 -452 L-4 -452 Z'), '#fff2c0', { streaks: 4, lw: 2 });
  piece(x, star(0, -640, 44, 17, 8), '#ffc93a', { streaks: 10, lw: 2.6 });
  piece(x, circ(0, -640, 10), '#fff7da', { streaks: 0, lw: 2 });
  [[-110, -690], [104, -560], [-120, -520], [118, -680], [-80, -600], [74, -720], [-40, -730]].forEach(([a, b], i) => piece(x, star(a, b, i % 2 ? 7 : 9, 3, 4 + (i % 2) * 4, i), '#ffd75a', { streaks: 0, bubbles: 0, mat: 1, lw: 1.4 }));

    ctx.globalCompositeOperation = 'source-over'; }

  const hg = ss(NAT + .8, NAT + 2.2, t); if (hg > 0) { ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(-36, -186, 0, -36, -186, 90); g.addColorStop(0, `rgba(255,226,140,${.26 * hg * (0.9 + .1 * Math.sin(t * 1.3))})`); g.addColorStop(1, 'rgba(255,220,130,0)'); ctx.fillStyle = g; ctx.fillRect(-140, -280, 200, 200); ctx.globalCompositeOperation = 'source-over'; }

  if (!V) LABELS.forEach((s, i) => { const a = ss(.3, 1, ls[i]) * (1 - ss(16.4, 17.6, t)); if (a <= 0) return; const rg = regions[i], L = i < 2, my = (rg.rb[1] + rg.rb[3]) / 2;

}

Pilot.run({ W, H, dur: DUR, audio: 'advent.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {

      for (let j = 0; j < 500; j++) for (let i = 0; i < 500; i++) { const v = 128 + (fbm(i * .03, j * .03, 4) - .5) * 210 + (noise(i * .4, j * .4) - .5) * 26, k = (j * 500 + i) * 4; d.data[k] = d.data[k + 1] = d.data[k + 2] = v; d.data[k + 3] = 255; }

    room = buildRoom();

      medallion(x, -320, -150, 78, '#2f7a8c', mWoman); medallion(x, -320, -380, 78, COB2, mAbraham); bars(x, LAN.L, [-56, -265, -470]); }));
