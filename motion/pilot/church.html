<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 교회의 시작</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 14 교회의 시작 — three shots, one light, in night cinematography.
   A  the upper room at night (Acts 2): a small lamp, people seated in silhouette; a rushing wind; fire comes down and
      rests on each of them, and the room fills with warm light. The camera pushes to the window and through it.
   B  outside: layered night hills under the moon. Jerusalem lights up; a stream of lanterns flows out along the ridges,
      villages light as it passes (온 유대 → 사마리아); the camera rises and pans to the coast, boats carry the light out
      over the moonlit sea (땅 끝까지).
   C  cut on the beat to the earth at night, seen from orbit: lights spread from Jerusalem continent to continent, and
      the first dawn touches the limb (Acts 1:8). */
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas, hex, mix, rgb, ramp, text, speckle } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 35, CUT = 20.0;
const WARM = '255,196,120', FIRE = '255,170,80';

// ================= A · the upper room =================
const WIN = V ? { x: W * .5, y: H * .345, w: 320, h: 420 } : { x: W * .5, y: H * .41, w: 280, h: 330 };
const FY = V ? H * .6 : H * .68, LAMP = [W * .5, FY + (V ? 140 : 96)];
const PEOPLE = V
  ? [[.17, FY + 70, 1.25, 0], [.39, FY + 60, 1.2, 1], [.61, FY + 60, 1.2, 0], [.83, FY + 70, 1.25, 1], [.28, FY + 400, 1.75, 1], [.72, FY + 400, 1.75, 0], [.06, H + 70, 2.4, 0], [.94, H + 70, 2.4, 1]]
  : [[.2, FY + 52, 1.32, 0], [.345, FY + 46, 1.26, 1], [.5, FY + 42, 1.22, 0], [.655, FY + 46, 1.26, 1], [.8, FY + 52, 1.32, 0], [.05, H + 70, 2.3, 1], [.2, H + 95, 2.4, 0], [.8, H + 95, 2.4, 1], [.95, H + 70, 2.3, 0]];
const fireAt = i => 3.75 + [3, 1, 0, 2, 4, 6, 5, 7, 8][i] * .16;                  // when the fire rests on person i
const fireK = t => ss(3.8, 5.8, t);
function winPath(x, s = 1) { const { x: cx, y, w, h } = WIN, ww = w * s, hh = h * s, r = ww / 2;
  x.moveTo(cx - ww / 2, y + hh / 2); x.lineTo(cx - ww / 2, y - hh / 2 + r); x.arc(cx, y - hh / 2 + r, r, Math.PI, 0); x.lineTo(cx + ww / 2, y + hh / 2); x.closePath(); }
function personPath(x, px, yb, s, veil) {
  x.beginPath(); const hy = yb - 118 * s;
  if (veil) { x.moveTo(px - 21 * s, hy + 26 * s); x.bezierCurveTo(px - 24 * s, hy - 10 * s, px - 14 * s, hy - 24 * s, px, hy - 24 * s); x.bezierCurveTo(px + 15 * s, hy - 24 * s, px + 24 * s, hy - 8 * s, px + 22 * s, hy + 26 * s); }
  else { x.moveTo(px - 10 * s, hy + 22 * s); x.bezierCurveTo(px - 18 * s, hy + 6 * s, px - 17 * s, hy - 19 * s, px, hy - 19 * s); x.bezierCurveTo(px + 17 * s, hy - 19 * s, px + 18 * s, hy + 6 * s, px + 10 * s, hy + 22 * s); }
  x.bezierCurveTo(px + 30 * s, hy + 26 * s, px + 46 * s, hy + 30 * s, px + 50 * s, hy + 52 * s); x.bezierCurveTo(px + 56 * s, yb - 40 * s, px + 64 * s, yb - 12 * s, px + 70 * s, yb);
  x.lineTo(px - 70 * s, yb); x.bezierCurveTo(px - 64 * s, yb - 12 * s, px - 56 * s, yb - 40 * s, px - 50 * s, hy + 52 * s); x.bezierCurveTo(px - 46 * s, hy + 30 * s, px - 30 * s, hy + 26 * s, px - 10 * s, hy + 22 * s); x.closePath();
}
function person(ctx, px, yb, s, veil, lit, t) {      // a dark figure; light from above (the fire) leaves a warm rim along the top edges
  ctx.save(); personPath(ctx, px, yb, s, veil); ctx.fillStyle = '#0a0705'; ctx.fill(); ctx.clip();
  const ly = yb - 170 * s, g = ctx.createRadialGradient(px, ly, 0, px, ly, 190 * s);
  g.addColorStop(0, `rgba(255,214,150,${.95 * lit})`); g.addColorStop(.45, `rgba(${FIRE},${.45 * lit})`); g.addColorStop(1, `rgba(${FIRE},0)`);
  const lg = ctx.createRadialGradient(LAMP[0], LAMP[1], 0, LAMP[0], LAMP[1], 420); lg.addColorStop(0, 'rgba(255,170,90,.32)'); lg.addColorStop(1, 'rgba(255,170,90,0)');
  ctx.fillStyle = g; ctx.fillRect(px - 120 * s, yb - 260 * s, 240 * s, 260 * s); ctx.fillStyle = lg; ctx.fillRect(px - 120 * s, yb - 260 * s, 240 * s, 260 * s);
  ctx.translate(0, 5 * s); personPath(ctx, px, yb, s, veil); ctx.fillStyle = 'rgba(10,7,5,.93)'; ctx.fill(); ctx.restore();
}
function flame(ctx, x, y, s, t, ph, a) {             // a tongue of fire: glow, body, white-hot core; it breathes and sways
  if (a <= .01) return; const sw = (noise(t * 2.2 + ph, ph) - .5) * 14 * s, fh = (46 + 8 * Math.sin(t * 9 + ph * 3)) * s * (.4 + .6 * a), fw = 12 * s;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y - fh * .35, 0, x, y - fh * .35, 90 * s); g.addColorStop(0, `rgba(${FIRE},${.5 * a})`); g.addColorStop(1, `rgba(${FIRE},0)`); ctx.fillStyle = g; ctx.fillRect(x - 90 * s, y - fh * .35 - 90 * s, 180 * s, 180 * s);
  const body = (k, c) => { ctx.beginPath(); ctx.moveTo(x - fw * k, y); ctx.bezierCurveTo(x - fw * k * 1.2, y - fh * .45 * k, x + sw * .6, y - fh * .7 * k, x + sw, y - fh * k);
    ctx.bezierCurveTo(x + sw * .5 + fw * .3 * k, y - fh * .6 * k, x + fw * k * 1.2, y - fh * .4 * k, x + fw * k, y); ctx.quadraticCurveTo(x, y + fw * .7 * k, x - fw * k, y); ctx.fillStyle = c; ctx.fill(); };
  body(1, `rgba(255,120,40,${.75 * a})`); body(.72, `rgba(255,190,90,${.85 * a})`); body(.42, `rgba(255,246,214,${.95 * a})`);
  ctx.restore();
}
let stoneTex, motesA = [], dustA = [];
function room(ctx, t, front) {        // back: the wall and the window (drawn with the window cut out); front: what stands in the room before it
  const F = fireK(t), wind = ss(2.4, 2.9, t) * (1 - ss(4.2, 5.4, t)), lampA = (1 - .55 * wind) * (.9 + .1 * noise(t * 7, 3));
  if (!front) {
  // wall
  const wg = ctx.createLinearGradient(0, 0, 0, FY); wg.addColorStop(0, '#0b0806'); wg.addColorStop(1, '#1d1510'); ctx.fillStyle = wg; ctx.fillRect(-W, -H, W * 3, FY + H);
  const fg = ctx.createLinearGradient(0, FY, 0, H); fg.addColorStop(0, '#17110c'); fg.addColorStop(1, '#070504'); ctx.fillStyle = fg; ctx.fillRect(-W, FY, W * 3, H * 2);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .5; ctx.drawImage(stoneTex, 0, 0, W, H); ctx.restore();
  // light on the walls: the lamp, then the fire
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const lp = ctx.createRadialGradient(LAMP[0], LAMP[1] - 40, 0, LAMP[0], LAMP[1] - 40, W * .38); lp.addColorStop(0, `rgba(255,160,80,${.2 * lampA})`); lp.addColorStop(1, 'rgba(255,160,80,0)'); ctx.fillStyle = lp; ctx.fillRect(-W, -H, W * 3, H * 3);
  if (F > 0) { const fl = ctx.createRadialGradient(W / 2, FY - 160, 0, W / 2, FY - 160, W * .75); fl.addColorStop(0, `rgba(255,186,110,${.36 * F})`); fl.addColorStop(.5, `rgba(255,140,60,${.12 * F})`); fl.addColorStop(1, 'rgba(255,140,60,0)'); ctx.fillStyle = fl; ctx.fillRect(-W, -H, W * 3, H * 3); }
  // moonlight through the window onto the floor
  const mw = WIN.w, top = WIN.y + WIN.h / 2, mg = ctx.createLinearGradient(0, top, 0, H); mg.addColorStop(0, 'rgba(120,150,220,.045)'); mg.addColorStop(1, 'rgba(120,150,220,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.moveTo(WIN.x - mw / 2, top); ctx.lineTo(WIN.x + mw / 2, top); ctx.lineTo(WIN.x + mw * 1.3, H); ctx.lineTo(WIN.x - mw * .2, H); ctx.fill();
  ctx.restore();
  // the window: a deep stone reveal, the sill
  ctx.save(); ctx.lineJoin = 'round';
  ctx.beginPath(); winPath(ctx, 1.12); ctx.fillStyle = '#120d0a'; ctx.fill();
  ctx.beginPath(); winPath(ctx, 1.12); ctx.strokeStyle = `rgba(255,190,120,${.1 + .25 * F})`; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = `rgba(${mix([40, 30, 24], [120, 84, 52], F).join(',')},1)`; ctx.fillRect(WIN.x - WIN.w * .62, WIN.y + WIN.h / 2, WIN.w * 1.24, 16);
  ctx.restore();
  return; }
  // the curtains, one each side, billowing in the wind (the right one mirrored, a little out of step)
  for (const sd of [-1, 1]) { const cx = WIN.x - WIN.w * .56, ty = WIN.y - WIN.h / 2 - 20, by = WIN.y + WIN.h / 2 + 8, bil = 10 + 34 * wind, ph = t * (2 + 6 * wind) + (sd > 0 ? 1.9 : 0);
    ctx.save(); ctx.globalAlpha *= 1 - ss(8.7, 9.4, t); if (sd > 0) { ctx.translate(2 * WIN.x, 0); ctx.scale(-1, 1); }   // gone before the camera passes through
    ctx.beginPath(); ctx.moveTo(cx - 40, ty);
    for (let i = 0; i <= 16; i++) { const k = i / 16, y = lerp(ty, by, k); ctx.lineTo(cx + 34 + Math.sin(ph + k * 4) * bil * k + bil * .8 * k, y); }
    for (let i = 16; i >= 0; i--) { const k = i / 16, y = lerp(ty, by, k); ctx.lineTo(cx - 40 + Math.sin(ph + k * 4 + 1) * bil * .4 * k, y); }
    const cg = ctx.createLinearGradient(cx - 40, 0, cx + 60, 0); cg.addColorStop(0, `rgb(${mix([40, 14, 12], [120, 44, 30], F)})`); cg.addColorStop(1, `rgb(${mix([20, 8, 8], [70, 26, 20], F)})`); ctx.fillStyle = cg; ctx.fill(); ctx.restore(); }
  // the lamp
  { const [x, y] = LAMP; ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.ellipse(x, y + 6, 26, 9, 0, 0, 6.283); ctx.fill();
    const fp = ctx.createRadialGradient(x, y + 8, 0, x, y + 8, 240); fp.addColorStop(0, `rgba(255,170,90,${.32 * lampA})`); fp.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y + 8); ctx.scale(1, .3); ctx.translate(-x, -y - 8); ctx.fillStyle = fp; ctx.fillRect(x - 240, y - 232, 480, 480); ctx.restore();
    ctx.save(); ctx.translate(x + 20, y - 2); ctx.rotate(wind * .9 * Math.sin(t * 13) * .5 + wind * .7); flame(ctx, 0, 0, .55, t, 7, lampA); ctx.restore(); }
  // the people, back to front; the fire rests on each
  PEOPLE.forEach(([fx, yb, s, veil], i) => { const px = W * fx, fa = ss(fireAt(i) + .45, fireAt(i) + .8, t);
    person(ctx, px, yb, s, veil, .12 + .88 * fa, t); flame(ctx, px, yb - 150 * s, s * .9, t, i * 1.7, fa); });
  // dust in the wind
  if (wind > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (const d of dustA) { const u = ((t - 2.4) * d.v + d.o) % 1, x = lerp(-80, W + 80, u), y = d.y + Math.sin(u * 9 + d.o * 6) * 30;
    ctx.strokeStyle = `rgba(255,220,180,${.25 * wind * d.a})`; ctx.lineWidth = d.w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 30 - 60 * wind, y + 3); ctx.stroke(); } ctx.restore(); }
}
function fireComing(ctx, t) {                    // fire comes down and parts, one tongue to each
  if (t < 3.3 || t > 6) return; ctx.save(); ctx.globalCompositeOperation = 'lighter';
  PEOPLE.forEach(([fx, yb, s], i) => { const t1 = fireAt(i) + .5, u = clamp((t - (t1 - .9)) / .9); if (u <= 0 || u >= 1.05) return;
    const x0 = W * .5, y0 = -60, x1 = W * fx, y1 = yb - 150 * s, e = eio(u), x = lerp(x0, x1, e), y = lerp(y0, y1, e * e), a = (1 - ss(.85, 1, u));
    for (let k = 0; k < 8; k++) { const e2 = Math.max(0, e - k * .025), xx = lerp(x0, x1, e2), yy = lerp(y0, y1, e2 * e2); ctx.fillStyle = `rgba(${FIRE},${.22 * a * (1 - k / 8)})`; ctx.beginPath(); ctx.arc(xx, yy, 7 * s * (1 - k / 10), 0, 6.283); ctx.fill(); }
    const g = ctx.createRadialGradient(x, y, 0, x, y, 40 * s); g.addColorStop(0, `rgba(255,240,200,${.9 * a})`); g.addColorStop(1, `rgba(${FIRE},0)`); ctx.fillStyle = g; ctx.fillRect(x - 40 * s, y - 40 * s, 80 * s, 80 * s); });
  ctx.restore();
}
function motesOut(ctx, t, sc) {                  // the light leaves through the window
  const a0 = ss(6.6, 7.6, t) * (1 - ss(9.8, 10.4, t)); if (a0 <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of motesA) { const u = clamp((t - m.t0) / m.d); if (u <= 0 || u >= 1) continue; const [px, py] = m.from, e = eio(u);
    const x = lerp(px, WIN.x + m.dx, e) + Math.sin(u * 6 + m.ph) * 20 * (1 - u), y = lerp(py, WIN.y + m.dy, e) - Math.sin(u * 3.1) * 60;
    const r = m.r * (1 - u * .5), g = ctx.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, `rgba(255,236,190,${a0 * .9 * (1 - u * .3)})`); g.addColorStop(1, `rgba(${FIRE},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8); }
  ctx.restore();
}

// ================= B · night hills, the light carried out =================
const HZ = V ? H * .5 : H * .56, CAMEND = V ? 2600 : 3000, COAST = 1e6;   // (no coast: the light runs on over ridge after ridge to the horizon)
const camB = t => CAMEND * eio(clamp((t - 9.4) / 10.4));
const riseB = t => eio(clamp((t - 11.4) / 8.6));
const zoomB = t => lerp(V ? 1.1 : 1.08, V ? .82 : .8, eio(clamp((t - 9.4) / 10.6)));
const LAYERS = [
  { p: .1, base: HZ + 2, amp: 90, f: .003, seed: 3, col: [46, 58, 98] },
  { p: .22, base: HZ + 50, amp: 140, f: .0027, seed: 7, col: [31, 41, 74], road: 1, vil: [[300, 4, .5], [620, 6, .5], [980, 5, .45], [1340, 4, .45]] },
  { p: .42, base: HZ + 130, amp: 170, f: .0023, seed: 11, col: [19, 26, 50], vil: [[260, 5, .7], [700, 7, .75], [1080, 5, .7], [1420, 6, .7]], road: 1 },
  { p: .68, base: HZ + 250, amp: 190, f: .0019, seed: 17, col: [11, 15, 30], vil: [[520, 6, 1], [1180, 5, .95]], road: 1 },
  { p: 1, base: HZ + (V ? 440 : 330), amp: 140, f: .0015, seed: 23, col: [4, 5, 11], city: 1 },
];
const RISE = V ? 820 : 600;
function ridge(L, X, t) { const dy = riseB(t) * L.p * RISE;
  let y = L.base + dy - L.amp * (.62 * fbm(X * L.f + L.seed, L.seed * 1.7, 4) + .38 * fbm(X * L.f * 2.9, L.seed, 3));
  if (L.city) y -= 70 * Math.exp(-(((X - 0) / 260) ** 2));                    // Jerusalem's hill
  const cx = COAST * L.p + W * .42 + L.p * 60, m = ss(cx, cx + 700 * (.4 + L.p), X);
  return lerp(y, L.base + dy + 6, m); }                                           // the land comes down to the shore
const coastEnd = L => COAST * L.p + W * .42 + L.p * 60 + 700 * (.4 + L.p);
const front = t => (camB(t) + W * .55 / zoomB(t)) * (t < 9.4 ? 0 : 1);   // how far the light has gone (in near-layer units)
let starList = [], boatsB = [], walkers = [];
function hills(ctx, t) {
  const S = zoomB(t), cam = camB(t), rs = riseB(t), sx = (L, X) => (X - cam * L.p) * S + W / 2, wx = (L, x) => (x - W / 2) / S + cam * L.p;
  // sky
  const sg = ctx.createLinearGradient(0, 0, 0, HZ + 40); sg.addColorStop(0, '#03050f'); sg.addColorStop(.7, '#0b1230'); sg.addColorStop(1, '#1c2647'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  for (const s of starList) { const y = s.y * HZ * 1.05 + rs * 30; if (y > HZ + rs * 30) continue; const tw = .6 + .4 * Math.sin(t * s.f + s.p); ctx.fillStyle = `rgba(230,236,255,${s.a * tw * .9})`; ctx.fillRect(s.x * W, y, s.r, s.r); }
  const mx = V ? W * .74 : W * .8, my = (V ? H * .14 : H * .17) + rs * 40;
  { const g = ctx.createRadialGradient(mx, my, 0, mx, my, 260); g.addColorStop(0, 'rgba(200,214,255,.28)'); g.addColorStop(1, 'rgba(200,214,255,0)'); ctx.fillStyle = g; ctx.fillRect(mx - 260, my - 260, 520, 520);
    ctx.fillStyle = '#eef0f6'; ctx.beginPath(); ctx.arc(mx, my, V ? 30 : 26, 0, 6.283); ctx.fill(); ctx.fillStyle = 'rgba(180,186,200,.35)'; ctx.beginPath(); ctx.arc(mx - 6, my - 4, 7, 0, 6.283); ctx.arc(mx + 8, my + 6, 5, 0, 6.283); ctx.fill(); }
  // far away the horizon begins to glow: the light reaching the ends of the earth
  { const hg = ss(15.5, 19.8, t), hx = W * .62, hy = HZ + riseB(t) * .06 * RISE; if (hg > 0) { const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, W * .7);
    g.addColorStop(0, `rgba(255,200,140,${.32 * hg})`); g.addColorStop(.4, `rgba(200,140,110,${.12 * hg})`); g.addColorStop(1, 'rgba(120,90,110,0)');
    ctx.save(); ctx.translate(hx, hy); ctx.scale(1, .32); ctx.translate(-hx, -hy); ctx.fillStyle = g; ctx.fillRect(hx - W * .7, hy - W * .7, W * 1.4, W * 1.4); ctx.restore(); } }

    ctx.fillStyle = 'rgba(60,74,120,.10)'; ctx.fillRect(0, 0, W, H);       // atmosphere between layers

    if (pts.length < 2) return;
    const pe = pts[pts.length - 1], shore = pe[0] >= xe - 9 ? (H - pe[1]) * (1.6 - L.p) : 0;   // past the coast the shore runs away toward the horizon
    ctx.beginPath(); ctx.moveTo(pts[0][0], H + 10); pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.lineTo(pe[0] + shore, H + 10); ctx.closePath(); ctx.fillStyle = rgb(L.col); ctx.fill();
    ctx.strokeStyle = `rgba(170,190,240,${.2 + .15 * (1 - L.p)})`; ctx.lineWidth = 1.6; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    const sz = (.55 + .8 * L.p) * S * (V ? 1.2 : 1.05);
    // villages: dark until the light reaches them

      for (let i = 0; i < n; i++) { const hx = x + (i - n / 2) * 13 * sz * s0 * 1.4 + (r() - .5) * 6, hy = ridge(L, wx(L, hx), t) + 5 * sz, hw = (9 + r() * 6) * sz * s0, hh = (8 + r() * 8) * sz * s0;
        ctx.fillStyle = rgb(L.col.map(c => c * .7)); ctx.fillRect(hx - hw / 2, hy - hh, hw, hh + 6); ctx.beginPath(); ctx.moveTo(hx - hw * .6, hy - hh); ctx.lineTo(hx, hy - hh - hw * .35); ctx.lineTo(hx + hw * .6, hy - hh); ctx.fill();
        if (on > 0 && r() < .8) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,200,120,${on * (.7 + .3 * Math.sin(t * 2 + i))})`; ctx.fillRect(hx - 1.5 * sz, hy - hh * .6, 3 * sz, 3 * sz); ctx.restore(); } }
      if (on > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const gy = ridge(L, X, t), g = ctx.createRadialGradient(x, gy, 0, x, gy, 55 * sz); g.addColorStop(0, `rgba(${WARM},${.5 * on})`); g.addColorStop(1, `rgba(${WARM},0)`); ctx.fillStyle = g; ctx.fillRect(x - 90 * sz, gy - 90 * sz, 180 * sz, 180 * sz); ctx.restore(); } }

    if (L.road && fr > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const w of walkers) { const X = fr * L.p - w.o * (90 + 60 * L.p) - 40; if (X < 0) continue; const x = sx(L, X); if (x < -20 || x > W + 20) continue;
        const y = ridge(L, X, t) + (4 + w.dy) * sz, a = clamp((fr * L.p - X) / 80) * (.6 + .4 * Math.sin(t * 5 + w.o * 9)), r = 2.2 * sz + 1;

    PEOPLE.forEach(([fx, yb, s], i) => { for (let k = 0; k < 7; k++) motesA.push({ from: [W * fx, yb - 150 * s], t0: 6.6 + r() * 2.2, d: 1.2 + r() * 1.2, dx: (r() - .5) * WIN.w * .6, dy: (r() - .5) * WIN.h * .5, r: 2 + r() * 3, ph: r() * 6 }); });
    for (let i = 0; i < 46; i++) walkers.push({ o: i + r() * .6, dy: (r() - .5) * 4 });
  },
  draw });
</script>
