<script>
/* 14 교회의 시작 — low-poly isometric island at blue hour, an orthographic camera, everything arriving with a bounce.
   A  one small island, one house with an upper room; a rushing wind, then tongues of fire come down and rest on it
   B  from that island the tiles rise ring by ring (예루살렘 → 온 유대), boats carry the light across the sea (사마리아),

// ---------- the world ----------

// ---------- drawing the island world ----------

    const k2 = clamp((t - t0) / 1.6); if (k2 <= 0) continue; const T = toV(lon, lat), om = Math.acos(clamp(JV[0] * T[0] + JV[1] * T[1] + JV[2] * T[2], -1, 1)), so = Math.sin(om);
    ctx.strokeStyle = 'rgba(255,206,110,.85)'; ctx.lineWidth = Math.max(1.6, R / 260); ctx.shadowColor = 'rgba(255,190,90,.9)'; ctx.shadowBlur = 10; ctx.beginPath(); let started = false;
    for (let i = 0; i <= 40 * k2; i++) { const s = i / 40, a1 = Math.sin((1 - s) * om) / so, a2 = Math.sin(s * om) / so, p = [JV[0] * a1 + T[0] * a2, JV[1] * a1 + T[1] * a2, JV[2] * a1 + T[2] * a2];
      const lat2 = Math.asin(clamp(p[1], -1, 1)) * 180 / Math.PI, lon2 = Math.atan2(p[0], p[2]) * 180 / Math.PI, q = pj(lon2, lat2, 1 + .12 * Math.sin(Math.PI * s) * om);
      if (q[2] < 0) { started = false; continue; } started ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); started = true; }
    ctx.stroke(); ctx.shadowBlur = 0; }
  ctx.globalCompositeOperation = 'source-over';
  // night shading on the limb
  const sh = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .2, cx, cy, R); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(2,3,16,.55)'); ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.28); ctx.fill();
}

function draw(ctx, t) {
  if (t < CUT) islandShot(ctx, t); else globeShot(ctx, t);
  const sc = V ? 1.05 : 1, cx0 = W / 2, st = { size: 50 * sc, weight: 600, color: '#fffaf0', shadow: 'rgba(20,16,50,.85)', shadowBlur: 22 };
  text(ctx, '14  ·  교회의 시작', V ? 72 : 110, V ? 190 : 120, { align: 'left', size: 30, weight: 600, color: '#fff6e6', alpha: win(t, .6, 5, 1, 1), ls: 4, shadow: 'rgba(30,20,60,.7)' });
  const a1 = win(t, 4.8, 9.6, 1.1, .8), y1 = V ? 380 : 170;
  text(ctx, '“오직 성령이 너희에게 임하시면”', cx0, y1, { ...st, alpha: a1 });
  text(ctx, '사도행전 1:8 (개역개정)', cx0, y1 + 58 * sc, { size: 23 * sc, font: "'Noto Sans KR',sans-serif", color: '#fff0dc', alpha: a1 * .9, ls: 2, shadow: 'rgba(20,16,50,.8)' });
  const a2 = win(t, 21.6, 27.0, 1.2, .8), y2 = V ? 1560 : H - 150;
  if (V) { text(ctx, '“… 땅 끝까지 이르러', cx0, y2, { ...st, alpha: a2 }); text(ctx, '내 증인이 되리라”', cx0, y2 + 80, { ...st, alpha: a2 }); }
  else text(ctx, '“… 땅 끝까지 이르러 내 증인이 되리라”', cx0, y2, { ...st, alpha: a2 });
  text(ctx, '사도행전 1:8 (개역개정)', cx0, V ? y2 + 150 : y2 + 56, { size: 23 * sc, font: "'Noto Sans KR',sans-serif", color: '#d8d2e8', alpha: a2 * .9, ls: 2, shadow: 'rgba(0,0,0,.8)' });
  const a3 = win(t, 27.4, 33.4, 1.2, 1.1), y3 = V ? 1560 : H - 160;
  text(ctx, '아브라함의 약속(“모든 족속”)이', cx0, y3, { ...st, size: 46 * sc, alpha: a3 });
  text(ctx, '실제로 온 세상으로', cx0, y3 + 74 * sc, { ...st, size: 46 * sc, alpha: win(t, 28.0, 33.4, 1.2, 1.1) });
  // the cut: a beat of white light as the speck of islands becomes the earth
  const fl = ss(CUT - .35, CUT, t) * (1 - ss(CUT, CUT + .5, t)); if (fl > 0) { ctx.fillStyle = `rgba(255,236,200,${.5 * fl})`; ctx.fillRect(0, 0, W, H); }
  const f = 1 - ss(0, 1.2, t) + ss(DUR - 1.4, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, audio: 'church.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    buildWorld(); buildGlobe();
    const r = rng(5); for (let i = 0; i < 380; i++) starList.push({ x: r(), y: Math.pow(r(), 1.3) * (r() < .8 ? .6 : 1), r: r() < .9 ? 1.5 : 2.5, a: .3 + r() * .7, f: 1 + r() * 3, p: r() * 6 });
  },
  draw });
</script>
