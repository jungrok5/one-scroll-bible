<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 창조 (목탄)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 01 창조 — Gothic charcoal drawing on toothed paper: light is made by REMOVING darkness (an eraser lifts it out).
   A  0–6.8   a sheet of velvet charcoal; smudged grey waters; the Spirit, a faint breath of lifted grey, moves over them.
              4.9 the eraser touches the black (one point of paper); 6.0 a first stroke.
   B  6.8–14  "빛이 있으라": many fast eraser strokes radiate, kneaded-eraser dabs open a core of bare paper,
              the deep catches it in lifted streaks. The camera pushes in.
   C  14–21   the drawing turns: the waters are smudged away, the rays twist into a spiral galaxy, the camera pulls back
              and the eraser dots the dark with stars, flicks, smudged nebulae and far galaxies.
   D  21–24.2 the Earth: a charcoal sphere modelled with the stump, a lifted crescent, cloud bands erased out.
   E  24.2–26.4 falling through smudged, lifted cloud masses.
   F  26.4–35 Eden as a charcoal landscape lit by the lifted light; the man and the woman by the river (Gen 1:31). */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, mix, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 35, U = 1080;
const T_IGN = 4.9, T_FL = 6.8;
const INK = [18, 17, 17], PAPER = [238, 236, 231], WARM = [244, 228, 196];
const LY = V ? -.17 * U : -.1 * U, HZ = V ? .19 * U : .17 * U;     // the light's height, the horizon of the deep (world)
const val = (v, warm = 0) => { const c = mix(mix(INK, PAPER, clamp(v)), WARM, warm * clamp(v)); return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; };
const fr = t => Math.floor(t * 12);                                 // drawings "boil" on twos (12 fps)
const jit = (t, s, k = 1) => (noise(fr(t) * 1.7 + s, s * .37) - .5) * k;

// ---------------- camera (world → screen), monotone cubic through keys: continuous motion ----------------
const CK = [[0, -28, 14, 1.0], [6.8, 0, 0, 1.06], [14, 0, LY * .45, 1.3], [17.6, .22 * U, LY + .02 * U, .5], [21, .6 * U, LY + .1 * U, .6], [26.5, 1.15 * U, LY + .2 * U, .8]];
const CT = CK.map(k => k[0]);
function hermite(ch) {               // Fritsch–Carlson tangents per channel
  const y = CK.map(k => k[ch]), n = y.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (CT[i + 1] - CT[i]));
  for (let i = 0; i < n; i++) m.push(i === 0 ? d[0] * .5 : i === n - 1 ? d[n - 2] * .5 : d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
  return t => { let i = 0; while (i < n - 2 && t > CT[i + 1]) i++; const h = CT[i + 1] - CT[i], s = clamp((t - CT[i]) / h), s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * y[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * y[i + 1] + (s3 - s2) * h * m[i + 1]; };
}
const CX = hermite(1), CY = hermite(2), CZ = hermite(3);
let CM = [1, 0, 0, 1, 0, 0], CAM = [0, 0, 1];
function setCam(t) {
  const z = CZ(t), cx = CX(t) + (noise(t * .35, 4) - .5) * 10, cy = CY(t) + (noise(t * .3, 8) - .5) * 8;
  CAM = [cx, cy, z]; CM = [z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z];
}
const ws = (x, y) => [CM[0] * x + CM[2] * y + CM[4], CM[1] * x + CM[3] * y + CM[5]];
// draw a mark sprite along +x from world (x,y), rotated by ang; frac = how much of it the hand has drawn so far
function put(ctx, M, spr, x, y, ang, len, wid, a, frac = 1, u0 = 0) {
  if (a < .004 || len < .5 || frac <= 0) return;
  const c = Math.cos(ang), s = Math.sin(ang), [A, B, C, D, E, F] = M;
  ctx.setTransform(A * c + C * s, B * c + D * s, -A * s + C * c, -B * s + D * c, A * x + C * y + E, B * x + D * y + F);
  ctx.globalAlpha = Math.min(1, a);
  const sw = spr.width, sh = spr.height, f0 = u0, f1 = Math.min(1, u0 + frac);
  ctx.drawImage(spr, sw * f0, 0, sw * (f1 - f0), sh, 0, -wid / 2, len * (f1 - f0), wid);
}
function dab(ctx, M, spr, x, y, size, a, rot = 0, sy = 1) {
  if (a < .004 || size < .5) return; const c = Math.cos(rot), s = Math.sin(rot), [A, B, C, D, E, F] = M;
  ctx.setTransform((A * c + C * s), (B * c + D * s), (-A * s + C * c) * sy, (-B * s + D * c) * sy, A * x + C * y + E, B * x + D * y + F);
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(spr, -size / 2, -size / 2, size, size);
}
const I0 = [1, 0, 0, 1, 0, 0];

// ---------------- marks (alpha masks, tinted once) ----------------
function mask(w, h, f) { const c = canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), D = d.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = (j * w + i) * 4; D[k] = D[k + 1] = D[k + 2] = 255; D[k + 3] = 255 * clamp(f(i, j)); }
  x.putImageData(d, 0, 0); return c; }
function tint(m, col) { const c = canvas(m.width, m.height), x = c.getContext('2d'); x.drawImage(m, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return c; }
function strokeMask(seed, soft, dry) {           // an eraser / side-of-stick stroke: crisp ragged edge, streaks along it, a rounded start, a lifting-off end
  const w = 512, h = 64, r = rng(seed), o1 = r() * 60, o2 = r() * 60, t0 = .03 + r() * .05, t1 = .12 + r() * .3;
  return mask(w, h, (i, j) => { const u = i / (w - 1), shape = Math.pow(clamp(u / t0), .5) * Math.pow(clamp((1 - u) / t1), .9);
    if (shape <= 0) return 0;
    const hw = (h / 2 - 6) * (.8 + .2 * noise(u * 5 + o1, o2)) * (.3 + .7 * shape), cy = h / 2 + (noise(u * 2.2 + o2, 3) - .5) * 6, dd = Math.abs(j + .5 - cy);
    const edge = clamp((hw - dd) / (1.4 + soft * 9) + (noise(u * 34 + o1, j * .45) - .5) * .9 * (1 - soft));
    const stri = .45 + .55 * noise(j * 1.1 + o1, u * 1.4 + o2), drag = .78 + .22 * noise(u * 40 + o2, j * .2);
    const skip = lerp(1, ss(.28, .56, noise(u * 16 + o1, j * .33 + o2)), dry);
    return edge * lerp(stri, 1, .3 + soft * .45) * drag * skip * Math.min(1, .5 + shape); }); }
function dabMask(seed) {                          // kneaded eraser: a mottled, irregular soft lift
  const n = 128, r = rng(seed), o = r() * 60;
  return mask(n, n, (i, j) => { const x = (i + .5) / n * 2 - 1, y = (j + .5) / n * 2 - 1, rr = Math.hypot(x, y), th = Math.atan2(y, x);
    const R = .66 + .5 * (fbm(Math.cos(th) * 1.4 + o, Math.sin(th) * 1.4 + o, 3) - .5);
    return clamp((R - rr) / .3) * (.5 + .5 * fbm(i * .06 + o, j * .06 + o * .5, 3)); }); }
function dotMask(seed) {                          // an eraser dot / star
  const n = 32, r = rng(seed), o = r() * 60;
  return mask(n, n, (i, j) => { const x = (i + .5) / n * 2 - 1, y = (j + .5) / n * 2 - 1, rr = Math.hypot(x, y), th = Math.atan2(y, x);
    const R = .5 + .3 * (noise(Math.cos(th) * 1.6 + o, Math.sin(th) * 1.6 + o) - .5); return clamp((R - rr) / .2) * (.65 + .35 * noise(i * .5 + o, j * .5)); }); }
function smudgeMask(seed) {                       // a finger smudge, dragged along +x
  const w = 256, h = 96, r = rng(seed), o = r() * 60;
  return mask(w, h, (i, j) => { const u = i / (w - 1) * 2 - 1, v = (j + .5) / h * 2 - 1, wob = (noise(u * 1.6 + o, 1) - .5) * .5;
    return Math.exp(-u * u * 2.6 - (v - wob) ** 2 * 5.5) * (.5 + .5 * noise(j * .28 + o, u * 1.8)); }); }
let SK = [], SKS = [], DB = [], DT = [], SM = [];   // raw masks
let L = {}, K = {};                                // tinted: L.x lifts (paper), K.x charcoal
function tintAll() {
  const set = (arr, col) => arr.map(m => tint(m, col));
  L = { sk: set(SK, val(1)), skw: set(SK, val(1, .7)), sks: set(SKS, val(1)), db: set(DB, val(1)), dbw: set(DB, val(1, .8)), dt: set(DT, val(1)), sm: set(SM, val(1)), smw: set(SM, val(1, .6)) };
  K = { sk: set(SK, val(0)), sks: set(SKS, val(0)), db: set(DB, val(0)), sm: set(SM, val(0)), dt: set(DT, val(0)),
        sk2: set(SK, val(.16)), db3: set(DB, val(.32)), db5: set(DB, val(.55)), db8: set(DB, val(.84)) };
}

// ---------------- paper ----------------
let TOOTH, MOTTLE, TONE, GROUND;
function buildPaper() {
  // tooth: ~1/600 of the frame width, a little elongated (laid paper), contrast stretched — peaks and valleys
  TOOTH = canvas(W, H); { const x = TOOTH.getContext('2d'), d = x.createImageData(W, H), D = d.data, r = rng(3);
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const v = .55 * noise(i / 1.9, j / 2.4) + .3 * noise(i / 4.6 + 40, j / 3.8 + 9) + .15 * r();
      const s = clamp(.5 + (v - .5) * 2.6), k = (j * W + i) * 4; D[k] = D[k + 1] = D[k + 2] = s * 255; D[k + 3] = 255; }
    x.putImageData(d, 0, 0); }
  // mottle: the sheet's uneven sizing and fibres (soft-light)
  const mw = W / 4 | 0, mh = H / 4 | 0; MOTTLE = canvas(mw, mh); { const x = MOTTLE.getContext('2d'), d = x.createImageData(mw, mh), D = d.data;
    for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) { const v = .5 + .5 * (fbm(i * .02, j * .02, 4) - .5) + .25 * (noise(i * .5 + 3, j * .08) - .5), k = (j * mw + i) * 4;
      D[k] = D[k + 1] = D[k + 2] = clamp(v) * 255; D[k + 3] = 255; } x.putImageData(d, 0, 0); }
  // tone: a warm toned sheet, rubbed darker toward the edges (multiply)
  TONE = canvas(W, H); { const x = TONE.getContext('2d'); x.fillStyle = '#fbf6ec'; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .58); g.addColorStop(0, 'rgba(160,150,140,0)'); g.addColorStop(1, 'rgba(120,112,104,.75)');
    x.fillStyle = g; x.fillRect(0, 0, W, H); }
  // ground: the sheet laid in with charcoal — side-of-the-stick sweeps, never a flat fill
  const GW = W * 1.3 | 0, GH = H * 1.3 | 0; GROUND = canvas(GW, GH); { const x = GROUND.getContext('2d'), r = rng(12);
    x.fillStyle = val(.07); x.fillRect(0, 0, GW, GH);
    for (let i = 0; i < 1300; i++) { const px = r() * GW, py = r() * GH, ang = -.55 + (r() - .5) * .5, len = 180 + r() * 520, wd = 22 + r() * 70;
      put(x, I0, r() < .55 ? K.sk[i % K.sk.length] : K.sk2[i % K.sk2.length], px - Math.cos(ang) * len / 2, py - Math.sin(ang) * len / 2, ang, len, wd, .18 + r() * .4); }
    for (let i = 0; i < 70; i++) { const px = r() * GW, py = r() * GH; put(x, I0, L.sm[i % L.sm.length], px, py, (r() - .5) * .6, 300 + r() * 500, 80 + r() * 140, .025 + r() * .03); }
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; }
}
function ground(ctx, t, par = .25) {   // the charcoal ground follows the camera only a little (it is the sheet)
  const z = 1 + (CAM[2] - 1) * par * .5, gx = -(GROUND.width - W) / 2 - CAM[0] * par * .3, gy = -(GROUND.height - H) / 2 - CAM[1] * par * .3;
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z)); ctx.globalAlpha = 1;
  ctx.drawImage(GROUND, clamp(gx, W - GROUND.width, 0), clamp(gy, H - GROUND.height, 0));
}

// ---------------- A/B: the deep and the light ----------------
let WAVES = [], BURST = [], KNEAD = [], REFL = [];
function buildDeep() {
  const r = rng(41);
  for (let i = 0; i < 260; i++) { const z = 1 + Math.pow(r(), 1.5) * 26; WAVES.push({ z, x: (r() - .5) * U * (1.6 + z * .5), l: (.05 + r() * .22) * U, w: 3 + r() * 16, s: (r() - .5) * 18, a: .4 + r() * .6, sp: i % SK.length, ph: r() * 6 }); }
  for (let i = 0; i < 120; i++) { const z = 1 + Math.pow(r(), 1.3) * 22; REFL.push({ z, x: (r() - .5) * U * (.05 + .55 / z + .02 * z), l: (.03 + r() * .14) * U, w: 2 + r() * 9, t0: T_FL + .15 + Math.pow(r(), 1.5) * 2.6, a: .45 + r() * .55, sp: i % SK.length, ph: r() * 6 }); }
  const lim = th => { const s = Math.sin(th); return s > .05 ? (HZ - LY) / s * .9 : 9e9; };   // rays stop at the deep
  // the first stroke (6.0), then the burst: 76 fast long strokes in .6 s, then 84 more filling in over three seconds
  BURST.push({ th: -Math.PI / 2 - .2, r0: .01 * U, len: .26 * U, lenG: .3 * U, w: 15, t0: 5.95, d: .55, a: .9, sp: 0, warm: 1 });
  for (let i = 0; i < 76; i++) { const th = (i + r() * .7) / 76 * 6.283 - Math.PI, len = Math.min(lim(th), (.3 + .85 * Math.pow(r(), .8)) * U);
    BURST.push({ th, r0: r() * .025 * U, len, lenG: (.25 + .5 * Math.pow(r(), .6)) * U, w: 6 + r() * 30, t0: T_FL + Math.pow(r(), 1.7) * .6, d: .1 + r() * .16, a: .5 + r() * .45, sp: i % SK.length, warm: r() < .4 }); }
  for (let i = 0; i < 84; i++) { const th = r() * 6.283 - Math.PI, r0 = (.04 + r() * .22) * U, len = Math.min(lim(th) - r0, (.12 + .45 * r()) * U);
    if (len < 20) continue;
    BURST.push({ th, r0, len, lenG: len * .8, w: 4 + r() * 20, t0: T_FL + .4 + Math.pow(r(), 1.4) * 3.2, d: .12 + r() * .25, a: .3 + r() * .5, sp: (i + 3) % SK.length, warm: r() < .3 }); }
  for (let i = 0; i < 90; i++) { const t0 = T_FL + .05 + Math.pow(r(), 1.25) * 4, reach = .02 + .2 * Math.pow(r(), 1.3) * clamp((t0 - T_FL) / 3 + .25), a = r() * 6.283;
    KNEAD.push({ x: Math.cos(a) * reach * U, y: Math.sin(a) * reach * U * .85, s: (.05 + .11 * r()) * U * (1 - reach), t0, a: .3 + r() * .45, rot: r() * 6, sp: i % DB.length }); }
}
function drawDeep(ctx, t, fade) {
  if (fade <= 0) return; const lit = ss(T_FL, T_FL + 1.5, t), sx = spiritX(t);
  // the surface of the deep: a smudged grey band at the horizon, a few lifted swells
  const [hx0, hy0] = ws(0, HZ);
  for (let i = 0; i < 7; i++) put(ctx, CM, L.sm[i % L.sm.length], -U * 1.6 + i * U * .5, HZ + 10 + (i % 3) * 10, (i % 2 - .5) * .02, U * 1.1, U * .12, fade * (.05 + .1 * lit));
  for (const w of WAVES) {
    const y = HZ + U * .7 / w.z, x = w.x + (t * w.s) / w.z * 6, wid = Math.max(1.6, w.w * 2.4 / w.z), len = w.l * 3 / Math.sqrt(w.z);
    const breath = Math.exp(-(((x - sx) / (U * .3)) ** 2)) * (1 - lit), col = Math.exp(-((x / (U * (.06 + .45 / w.z))) ** 2));
    let a = (.07 + .1 * breath + .06 * (.5 + .5 * Math.sin(t * .8 + w.ph))) * w.a + lit * (.06 + .5 * col) * w.a * (.6 + .4 * Math.sin(fr(t) * .9 + w.ph));
    a *= fade * clamp((y - HZ) / 6) ; if (a < .01) continue;
    put(ctx, CM, (lit > .3 && col > .3 ? L.skw : L.sk)[w.sp], x - len / 2, y + jit(t, w.ph) * 1.2, jit(t, w.ph + 1, .01), len, wid, a);
  }
  // the reflection: horizontal eraser strokes lifted in a column under the light
  for (const q of REFL) { if (t < q.t0) continue; const p = eo(clamp((t - q.t0) / .25)), y = HZ + U * .7 / q.z, len = q.l * 3 / Math.sqrt(q.z), wid = Math.max(1.4, q.w * 2.6 / q.z);
    const a = q.a * fade * (.55 + .45 * Math.sin(fr(t) * 1.3 + q.ph)); put(ctx, CM, L.skw[q.sp], q.x - len / 2, y, jit(t, q.ph, .01), len, wid, a, p); }
  // mist lifted along the horizon once the light is there
  if (lit > 0) for (let i = 0; i < 5; i++) put(ctx, CM, L.sks[i % L.sks.length], -U * 1.5 + i * U * .62 + (t - T_FL) * 6, HZ - 6 - i % 2 * 8, 0, U * .9, 18 + i % 3 * 8, .16 * lit * fade);
}
const spiritX = t => lerp(-.95, .7, t / 6.6) * (V ? U * .7 : U * .95);
function drawSpirit(ctx, t) {        // "하나님의 영은 수면 위에 운행하시니라": a breath of lifted grey moving over the waters, with the ghosts it leaves behind
  const a0 = ss(.6, 2, t) * (1 - ss(5.6, 7.2, t)); if (a0 <= 0) return;
  for (let g = 6; g >= 0; g--) { const tg = t - g * .45; if (tg < 0) continue; const x = spiritX(tg), y = HZ - .035 * U + Math.sin(tg * 1.4) * 8, a = a0 * (g ? .05 * Math.pow(.72, g) : .16);
    for (let k = 0; k < 3; k++) put(ctx, CM, L.sm[(k + g) % L.sm.length], x - U * (.22 - k * .06), y + (k - 1) * 10 + Math.sin(tg * 2 + k) * 6, Math.sin(tg * .9 + k) * .06 - .03, U * (.42 - k * .08), U * (.06 + k * .015), a * (k === 1 ? 1.3 : 1)); }
}
// the light: kneaded dabs open a core of bare paper; eraser strokes radiate from it. tw = twist into a galaxy (0..1)
function galaxyXY(px, py, tw, t) {
  if (tw <= 0) return [px, py];
  const r0 = Math.hypot(px, py), th = Math.atan2(py, px), rs = r0 * lerp(1, .62, tw), phi = th + tw * (2.6 * Math.pow(r0 / (.6 * U), .65) + .05 * Math.max(0, t - 14));
  let x = Math.cos(phi) * rs, y = Math.sin(phi) * rs * lerp(1, .5, tw); const a = .42 * tw, c = Math.cos(a), s = Math.sin(a);
  return [x * c - y * s, x * s + y * c];
}
function drawLight(ctx, t, tw) {
  if (t < T_IGN) return; const ox = 0, oy = LY;
  // the first touch: one point of paper, the tooth sparkling round it
  const p0 = ss(T_IGN, T_IGN + .5, t);
  dab(ctx, CM, L.dbw[0], ox, oy, (10 + 26 * ss(T_IGN, T_FL, t)) * (1 + 2 * ss(T_FL - .3, T_FL + .3, t)), .9 * p0, .3);
  dab(ctx, CM, L.dt[1], ox, oy, 7 + 3 * Math.sin(fr(t)), p0);
  const keep = 1 - .35 * tw;
  // kneaded dabs (the core)
  for (const k of KNEAD) { if (t < k.t0) continue; const p = ss(k.t0, k.t0 + .12, t), [x, y] = galaxyXY(k.x, k.y, tw, t);
    dab(ctx, CM, (tw > .5 ? L.db : L.dbw)[k.sp], ox + x, oy + y, k.s * lerp(1, .55, tw), k.a * p * keep, k.rot, lerp(1, .6, tw)); }
  // eraser strokes
  for (const s of BURST) { if (t < s.t0) continue; const p = eo(clamp((t - s.t0) / s.d)), spr = (s.warm ? L.skw : L.sk)[s.sp], a = s.a * keep, j = jit(t, s.th * 7, .006);
    const len = lerp(s.len, s.lenG, tw), wid = s.w * lerp(1, .55, tw);
    if (tw <= .001) { put(ctx, CM, spr, ox + Math.cos(s.th + j) * s.r0, oy + Math.sin(s.th + j) * s.r0, s.th + j, len, wid, a, p); continue; }
    const N = 7;   // bend it along the spiral, a slice of the stroke per segment
    for (let i = 0; i < N; i++) { const u0 = i / N, u1 = (i + 1) / N; if (u0 >= p) break;
      const ra = s.r0 + len * u0, rb = s.r0 + len * Math.min(u1, p), A = galaxyXY(Math.cos(s.th) * ra, Math.sin(s.th) * ra, tw, t), B = galaxyXY(Math.cos(s.th) * rb, Math.sin(s.th) * rb, tw, t);
      const dx = B[0] - A[0], dy = B[1] - A[1], sl = Math.hypot(dx, dy); if (sl < .3) continue;
      put(ctx, CM, spr, ox + A[0], oy + A[1], Math.atan2(dy, dx), sl * 1.06 / (Math.min(u1, p) - u0) , wid * lerp(1, .8, u0 * tw), a * (1 - .45 * tw * u0), Math.min(u1, p) - u0, u0); }
  }
}

// ---------------- C: the heavens ----------------
let STARS = [], GALS = [], GALT = [], NEB = [];
function buildHeavens() {
  const r = rng(77);

  // groves along the far banks

function person(x, sx, sy, h, fem, side) {   // a standing figure, head turned a little toward the light; side = which hand reaches out
