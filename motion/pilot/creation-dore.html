<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 창조 (도레 판화)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 01 창조 — after Gustave Doré's wood engravings for the Bible (1866): every tone is made of engraved lines.
   A  0–6.8    engraved black over the deep: long swell lines on the water, a solid hatched sky; the Spirit moves over the
               waters as a travelling brightening + wind in the lines. 4.9 the lines part round one point.
   B  6.8–14   "빛이 있으라": the hatching opens from the centre — lines fan and curve apart round a growing white,
               engraved cloud masses are driven back in rolling banks, the deep catches the light in broken lines.
   C  14–21    the camera plunges into the light; the page goes white; the engraver cuts the heavens back in from the edges:
               stars left as white flicks and stipple, the last light winds into a galaxy of swirling lines.
   D  21–24.2  an engraved globe: contour hatching following the sphere, a lit crescent, night side by line density.
   E  24.2–26.4 falling through Doré's engraved cumulus.
   F  26.4–35  Eden as a Doré landscape: trees of engraved foliage, a glimmering river, the far light, the man and the woman (Gen 1:31).
   Tone/deflection/mode plates are drawn with Canvas 2D (half-res per frame, or pre-built for Eden); a WebGL pass engraves them. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 35;
const HW = W / 2, HH = H / 2;
const T_IGN = 4.9, T_FL = 6.8;
const LA = V ? { cy: H * .4, hz: 240 } : { cy: H * .43, hz: 170 };     // the light on screen (Z = 1); the horizon (world y below the light)
const C3 = (t, d = .5, b = 0) => `rgb(${clamp(t) * 255 | 0},${clamp(d) * 255 | 0},${clamp(b) * 255 | 0})`;
const G8 = v => { const c = clamp(v) * 255 | 0; return `rgb(${c},${c},${c})`; };
let gl, glc, prog, U = {}, TX = {}, BG, bgx, BGD, bgd, DARK, NEB, STARS = [], BANKS = [], GSPR = [], EDEN = null;

// ======================= the engraver (WebGL) =======================
const FS = `#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 uRes; uniform float uT;
uniform sampler2D uBG, uE1, uE2, uBGD;
uniform float uHaze, uRo;
uniform float uEdenA, uDamp, uEDamp, uS;
uniform vec4 uEM; uniform vec2 uES;
uniform vec2 uC, uCam; uniform float uZ, uZc, uR, uEx, uSpace, uRoll;
uniform float uHz, uSea, uWph, uWA, uWC; uniform vec3 uSpirit;
uniform vec4 uG[3]; uniform vec4 uGt[3];
uniform vec4 uGlobe; uniform float uGlobeA;
uniform vec4 uBed; uniform float uBedA;
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1., 0.)), f.x), mix(h21(i + vec2(0., 1.)), h21(i + vec2(1., 1.)), f.x), f.y); }
float h31(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1., 0., 0.)), f.x), mix(h31(i + vec3(0., 1., 0.)), h31(i + vec3(1., 1., 0.)), f.x), f.y),
             mix(mix(h31(i + vec3(0., 0., 1.)), h31(i + vec3(1., 0., 1.)), f.x), mix(h31(i + vec3(0., 1., 1.)), h31(i + vec3(1., 1., 1.)), f.x), f.y), f.z); }
float fb2(vec2 p){ return (.5 * vn(p) + .25 * vn(p * 2.03 + 5.2) + .125 * vn(p * 4.01 + 1.7) + .0625 * vn(p * 8.03 + 9.1)) / .9375; }
float fb3(vec3 p){ return (.5 * vn3(p) + .25 * vn3(p * 2.03 + 3.1) + .125 * vn3(p * 4.01 + 7.7) + .0625 * vn3(p * 8.02 + 1.3)) / .9375; }
// coverage of the nearest engraved line (centres at integer u), box-filtered over one pixel; fw = lines per pixel
float cov(float u, float fw, float w){
  w = min(w, .97 / fw);
  float d = abs(u - floor(u + .5)) / fw;
  float k = clamp(min(d + .5, w * .5) - max(d - .5, -w * .5), 0., 1.);
  return mix(k, clamp(w * fw, 0., 1.), smoothstep(.3, .6, fw));
}
float fam(float u, float w){ return cov(u, max(fwidth(u), 1e-5), w); }
// a line system whose lines split / merge by octaves so they stay about sp px apart (globe, galaxies)
float famO(float u, float fw, float w, float sp){          // w: line width in px at sp spacing (kept as a fraction of the actual spacing)
  fw = max(fw, 1e-6); float k = log2(fw * sp), k0 = floor(k), f = k - k0, fr = w / sp;
  float a = exp2(-k0 - 1.), b = exp2(-k0);
  return max(cov(u * a, fw * a, fr / (fw * a)), (1. - f) * cov(u * b, fw * b, fr / (fw * b)));
}
// darkness → line widths (px) for the three families: one set of lines, then the cross, then a third in the deepest black
float W1(float d, float sp){ return sp * .95 * pow(clamp(d, 0., 1.), .8); }
float W2(float d, float sp){ return sp * .82 * smoothstep(.55, .97, d); }
float W3(float d, float sp){ return sp * .7 * smoothstep(.74, 1., d); }
float hatch(float d, float u1, float u2, float u3, float sp, float wv){
  return max(fam(u1, W1(d, sp) * wv), max(fam(u2, W2(d, sp)), fam(u3, W3(d, sp))));
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y), q = p / uRes;
  float S = uS;
  float bed = uBedA * exp(-pow((p.x - uBed.x) / uBed.z, 2.) - pow((p.y - uBed.y) / uBed.w, 2.));
  // ---------- background plate: the deep and the sky, or space ----------
  vec4 bg = texture2D(uBG, q);
  float tone = bg.r * (1. - bed * .9), Dd = (texture2D(uBGD, q).r - .5) * 2. * uDamp;
  vec2 w = (p - uC) / uZ + uCam, sp = p - uRes * .5;
  float cr = cos(uRoll), sr = sin(uRoll); vec2 vv = vec2(cr * sp.x + sr * sp.y, -sr * sp.x + cr * sp.y);
  float X = mix(w.x, vv.x, uSpace), Y = mix(w.y, vv.y, uSpace), kz = mix(uZ / uZc, 1., uSpace);
  float wob = (vn(vec2(X, Y) * .0035 + 3.) - .5) * 14. + (vn(vec2(X * .002, Y * .03)) - .5) * 3.;
  float r2 = X * X / (uEx * uEx) + Y * Y;
  float psi = uSpace > .5 ? Y : Y * r2 / (r2 + uR * uR + 1e-3);      // lines part and curve round the growing light
  float u1 = (psi + wob) * kz / S + Dd / S + .5;
  float u2 = (psi * .6 + X * .8 + wob * .4) * kz / (S * 1.1) + Dd * .5 / S;
  float u3 = (psi * .52 - X * .855) * kz / (S * 1.2) + Dd * .3 / S;
  float wvS = .82 + .36 * vn(vec2(X * .004, u1 * .23));
  // the deep: long swell lines in perspective
  float hzS = uC.y + (uHz - uCam.y) * uZ, dy = p.y - hzS, dyc = max(dy, 0.), pers = dyc + 3.;
  float zeta = log(dyc + uWC * uZ), Xw = (p.x - uC.x) / (pers + 60.);      // coordinates on the water plane
  float swell = pers * pers / (pers + 160.) * .024 * (sin(Xw * 4.2 + zeta * 6. + uT * .5) + .55 * sin(Xw * 9.5 - zeta * 11. + uT * .8 + 1.3) + 1.2 * (vn(vec2(Xw * 5., zeta * 5. + uT * .08)) - .5));
  float sg = exp(-pow((p.x - uSpirit.x) / uSpirit.z, 2.)) * uSpirit.y;
  swell += sg * pers * .011 * sin(p.x / (8. + pers * .06) - uT * 4.) * (.6 + .4 * sin(zeta * 6. - uT * 2.));
  float uw = uWA * log(dyc + swell + uWC * uZ) - uWph;
  float fww = max(fwidth(uw), 1e-5);
  float wvw = .6 + .75 * vn(vec2(p.x / (26. + dyc * .7), floor(uw) * 1.71));
  float br = smoothstep(.45, .9, tone);
  float glit = smoothstep(.3, .6, vn(vec2(p.x / (9. + dyc * .12) + floor(uw) * 7.3, floor(uw) * 3.1 + uT * 1.4)));
  float iSea = max(cov(uw, fww, (1. / fww) * .96 * pow(clamp(1. - tone, 0., 1.), .75) * wvw * mix(1., glit, br)),
                   fam((p.y * .97 + p.x * .22) / 6.5, W3(1. - tone, 6.5) * .7));
  float iSky = hatch(1. - tone, u1, u2, u3, S, wvS);
  float ink = mix(iSky, iSea, uSea * smoothstep(-1., 1.5, dy));
  // galaxies: swirling line systems
  for (int i = 0; i < 3; i++) {
    vec4 g = uG[i], gt = uGt[i];
    if (gt.z > 0.) {
      vec2 d = p - g.xy; float a = d.x * cos(g.w) + d.y * sin(g.w), b = (-d.x * sin(g.w) + d.y * cos(g.w)) / gt.x;
      float cs = cos(-gt.y), sn = sin(-gt.y); vec2 l = vec2(a * cs - b * sn, a * sn + b * cs);
      float rr = length(l) / g.z + 1e-4, th = atan(l.y, l.x), th2 = atan(-l.y, -l.x);
      float ua = (th - 2.2 * log(rr)) * 40.743665, ub = (th2 - 2.2 * log(rr)) * 40.743665;   // 256 lines / 2π
      float uc = (th + 2.4 * log(rr)) * 40.743665, ud = (th2 + 2.4 * log(rr)) * 40.743665;
      float f1 = min(fwidth(ua), fwidth(ub)), f2 = min(fwidth(uc), fwidth(ud));
      float dg = 1. - tone;
      float ig = max(famO(ua, f1, W1(dg, S) * 1.05, S), famO(uc, f2, W2(dg, S), S * 1.1));
      ink = mix(ink, ig, gt.z * (1. - smoothstep(.55, 1., rr)));
    }
  }
  // ---------- the globe ----------
  if (uGlobeA > 0.) {
    vec2 g = (p - uGlobe.xy) / uGlobe.z; float gr = length(g), gz = sqrt(max(1. - gr * gr, 0.));
    vec3 n = vec3(g, gz), Ld = normalize(vec3(-.62, -.52, .58));
    float ro = uGlobe.w, c1 = cos(ro), s1 = sin(ro);
    vec3 nb = vec3(n.x * c1 + n.z * s1, n.y, -n.x * s1 + n.z * c1);
    nb = vec3(nb.x, nb.y * .92 - nb.z * .39, nb.y * .39 + nb.z * .92);
    float ln = fb3(nb * 1.7 + 4.), land = smoothstep(.535, .55, ln);
    float cl = smoothstep(.56, .8, fb3(nb * 3.2 + vec3(9., uT * .015, 2.))) * (1. - .5 * land);
    float dif = clamp(dot(n, Ld), 0., 1.);
    float alb = mix(.62, .86, land); alb = mix(alb, 1.08, cl);
    float gt = clamp(alb * pow(dif, .7) * 1.12 + .015, 0., 1.);
    gt = mix(gt, max(gt, .9 * dif + .08), pow(1. - gz, 3.) * .7 * smoothstep(.0, .3, dif));     // a lit atmosphere at the limb
    float dg = 1. - gt * (1. - bed * .5);
    vec3 A1 = normalize(vec3(.28, -.95, .1)), A2 = normalize(vec3(-.95, -.22, .2));
    float ug1 = acos(clamp(dot(n, A1), -1., 1.)) * 162.97, ug2 = acos(clamp(dot(n, A2), -1., 1.)) * 162.97;   // 512 lines / π
    float wvg = .8 + .4 * vn(vec2(ug1 * .05, nb.x * 6.));
    float lines = max(famO(ug1, fwidth(ug1), W1(dg, S) * wvg * mix(1., .55, land * gt), S), famO(ug2, fwidth(ug2), W2(dg, S), S * 1.1));
    // land: stipple, as on an engraved atlas globe
    vec2 cc = floor(p / 3.4), co = fract(p / 3.4) - .5 - (vec2(h21(cc), h21(cc + 7.)) - .5) * .5;
    float st = 1. - smoothstep(.0, .12, length(co) - .42 * sqrt(clamp(dg, 0., 1.)));
    float coast = 1. - smoothstep(.6, 1.6, abs(ln - .54) / max(fwidth(ln), 1e-5));
    float ig = max(mix(lines, max(lines, st * .9), land), coast * .85 * smoothstep(.05, .4, dif));
    // the space round the globe brightens a little on the lit side (atmosphere), outside the disc
    float atm = exp(-max(gr - 1., 0.) * 16.) * clamp(dot(normalize(g + 1e-5), normalize(Ld.xy)) * 1.1 + .25, 0., 1.);
    float iAtm = hatch(1. - clamp(tone + atm * .7, 0., 1.), u1, u2, u3, S, wvS);
    ink = mix(ink, iAtm, uGlobeA * step(1., gr));
    float cv = 1. - smoothstep(1. - 1.6 / uGlobe.z, 1. + .4 / uGlobe.z, gr);
    ink = mix(ink, ig, uGlobeA * cv);
  }
  // ---------- Eden ----------
  if (uEdenA > 0.) {
    vec2 ep = (p - uEM.xy) / uEM.z, eq = ep / uES;
    vec4 e1 = texture2D(uE1, eq), e2 = texture2D(uE2, eq);
    float et = e1.r * (1. - bed * .82), ed = (e1.g - .5) * 2. * uEDamp, vt = e1.b, fol = e2.r, wat = e2.g, fig = e2.b;
    float d = 1. - et, se = S * .9;
    float wb = (vn(ep * vec2(.004, .02)) - .5) * 4.;
    float uH = (ep.y + ed + wb) / se, uX = (ep.x * .64 + ep.y * .77 + ed * .6) / (se * 1.1), uY = (-ep.x * .5 + ep.y * .866) / (se * 1.2);
    float wve = .8 + .4 * vn(vec2(ep.x * .006, uH * .3));
    float iE = hatch(d, uH, uX, uY, se, wve);
    // trunks and stems: vertical engraved lines
    float uV = (ep.x + ed * .6 + (vn(ep * vec2(.03, .006)) - .5) * 3.) / (se * .9);
    iE = mix(iE, max(fam(uV, W1(d, se * .9) * wve), fam(uH, W2(d, se))), vt);
    // foliage: clumps of short curved strokes, each clump its own direction, dark seams between them
    vec2 cs = ep / 9.5, ci = floor(cs); float b1 = 9., b2 = 9.; vec2 bc = vec2(0.); float bh = 0.;
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 c = ci + vec2(float(i), float(j)), cp = c + .15 + .7 * vec2(h21(c), h21(c + 17.3));
      float dd = length(cs - cp);
      if (dd < b1) { b2 = b1; b1 = dd; bc = cp; bh = h21(c + 5.1); } else if (dd < b2) b2 = dd;
    }
    float an = (vn(bc * .25) - .5) * 2.4 + (bh - .5) * 1.5 + sin(uT * .7 + bh * 30.) * .05;
    vec2 rel = (cs - bc) * 9.5, nn = vec2(-sin(an), cos(an));
    float uf = (dot(rel, nn) + dot(rel, rel) * .02 * (bh - .3)) / (S * .66);
    float iF = max(fam(uf, W1(d, S * .66) * 1.05), (1. - smoothstep(.0, .06, b2 - b1)) * smoothstep(.5, .85, d) * .85);
    iF = max(iF, fam(uX, W3(d, se)));
    iE = mix(iE, iF, fol);
    // water: level lines, broken into glitter where they catch the light
    float uW = (ep.y + sin(ep.x * .02 + uT * .8) * .6) / (S * .7);
    float gw = smoothstep(.25, .55, vn(vec2(ep.x / 16. + floor(uW) * 13.7, floor(uW) * 2.3 + uT * 1.6)));
    float iW = max(fam(uW, W1(d, S * .7) * mix(1., gw, smoothstep(.62, .95, et)) * (.75 + .5 * vn(vec2(ep.x * .03, floor(uW))))), fam(uV, W3(d, se)));
    iE = mix(iE, iW, wat);
    // the figures: finer lines that wrap round the limbs
    float uF = (ep.y + ed) / (S * .56), uF2 = (ep.x * .7 + ep.y * .714 + ed * .4) / (S * .62);
    float iG = max(fam(uF, W1(d, S * .56)), fam(uF2, W2(d, S * .62)));
    iE = mix(iE, iG, fig);
    ink = mix(ink, iE, uEdenA);
  }
  // ---------- the cumulus we fall through: two layers of billowing masses, lit from above, rising past ----------
  // ---------- into the cloud, and out: the white parts from the centre like the first light, its masses rolling back ----------
  if (uHaze > 0.) {
    vec2 dc = (p - uRes * .5) / vec2(V_EX, 1.); float dist = length(dc);
    float e = (fb2(p * .0032 + vec2(3., uT * .06)) - .5) * (110. + uRo * .45);
    float rr = dist + e, op = step(1., uRo);
    float m = smoothstep(uRo - 22., uRo + 22., rr);
    float shade = smoothstep(uRo + 10., uRo + 420., rr) * op;
    float ht = clamp(.84 - .08 * (1. - op) * smoothstep(.4, .7, fb2(p * .003 + uT * .2)) - .6 * shade * (.55 + .6 * smoothstep(.3, .7, fb2(p * .0038 + 7.))) + .08 * exp(-pow((rr - uRo - 26.) / 34., 2.)) * op, 0., 1.) * (1. - bed * .6);
    float yy = p.y - uRes.y * .5, r2 = dist * dist, ps = yy * r2 / (r2 + uRo * uRo * .5 + 1.) + (vn(p * .003) - .5) * 18.;
    float ih = hatch(1. - ht, ps / S + .5, (ps * .6 + p.x * .8) / (S * 1.1), (ps * .52 - p.x * .855) / (S * 1.2), S, .9 + .2 * vn(p * .01));
    ink = mix(ink, ih, uHaze * m);
  }
  // print: warm paper, ink that does not quite cover
  vec3 paper = vec3(.928, .902, .848) * (.975 + .035 * vn(p * .6) + .012 * vn(p * vec2(.02, .4)));
  vec3 ic = vec3(.075, .066, .06);
  float ik = ink * (.94 + .06 * vn(p * .35 + 4.));
  vec3 col = mix(paper, ic, ik);
  gl_FragColor = vec4(col, 1.);
}`;
const FSV = FS.replace(/V_EX/g, V ? '.8' : '1.35');
const VSH = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }';
function initGL() {
  glc = canvas(W, H);
  gl = glc.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl || !gl.getExtension('OES_standard_derivatives')) { gl = null; return; }
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VSH)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FSV)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const al = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const u = gl.getActiveUniform(prog, i), nm = u.name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(prog, nm); }
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  ['uBG', 'uE1', 'uE2', 'uBGD'].forEach((k, i) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx);
    for (const [p, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, p, v);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 128, 0, 255]));
    gl.uniform1i(U[k], i); TX[k] = [tx, i]; });

}
function upload(k, cv) { const [tx, i] = TX[k]; gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv); }
const u1 = (k, ...v) => U[k] && gl['uniform' + v.length + 'f'](U[k], ...v);

// ======================= time line =======================
function state(t) {
  const s = {};
  const plunge = ss(13.7, 15.6, t);
  s.Z = (1 + .13 * eio(clamp(t / 14))) * Math.exp(2.4 * Math.pow(plunge, 1.7));
  s.Zc = Math.min(s.Z, 1.2);
  s.cam = [lerp(-60, 0, eio(clamp(t / 10.5))), lerp(44, 0, eio(clamp(t / 11)))];
  s.C = [W / 2, LA.cy];
  const u = t - T_FL;
  s.R = t < T_IGN ? 0 : t < T_FL ? 1.5 + 22 * ss(T_IGN, T_FL, t) : 23 + 330 * (1 - Math.exp(-u / .95)) + 11 * u;
  s.space = t >= 15.3;
  s.sx = (wx) => s.C[0] + (wx - s.cam[0]) * s.Z;
  // the globe
  s.Re = 15 * Math.exp(1.36 * (t - 21.2));
  const P0 = V ? [W * .6, H * .56] : [W * .67, H * .55], P1 = [W * .5, H * .5], k = eio(ss(21.2, 24.4, t)), o = [-.44, -.38];
