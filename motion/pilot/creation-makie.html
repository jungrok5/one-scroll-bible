<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 창조 (마키에)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 01 창조 — maki-e: gold and silver powder on black urushi lacquer, with mother-of-pearl inlay (raden).
   Light is never a flare here: it is precious material SPRINKLED onto the black, and it shines only where the
   light gliding over the polished surface (the sheen) catches the grains.
   A  0–6.8    black lacquer; the deep as receding rows of seigaiha waves in faint silver powder; the Spirit,
               a breath of fine gold dust, drifts over them. 4.9 a single grain of gold falls; a thin trickle follows.
   B  6.8–14   "빛이 있으라": a veil of gold powder and cut-foil squares falls over the whole frame and settles,
               densest at the centre, into a burnished radiance (nashiji / bokashi); the waves under it are gilded.
   C  14–21    the camera tilts up into the heavens: the settled grains lift and swirl into galaxies of graded powder;
               gold and silver flecks, kirikane squares and pieces of shell for stars.
   D  21–24.2  the Earth: an inlaid mother-of-pearl orb, raised gold land, a gold rim on the lit side.
   E  24.2–26.4 the camera passes through suyari-gasumi cloud bands of raised gold and silver.
   F  26.4–35  Eden as a maki-e landscape: gold relief hills, gold and nacre trees, a river of silver powder,
               the man and the woman as small gold figures (Gen 1:31). */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, mix, text } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 35, M = Math.min(W, H);
const T_IGN = 4.9, T_FL = 6.8;
const F = 1000, HC0 = H * (V ? .6 : .62), ZL = 40;
const LQ = [8, 6, 7];
const GR = [[58, 36, 12], [110, 74, 24], [160, 114, 40], [198, 150, 62], [228, 188, 94], [244, 216, 144], [253, 240, 204]];
const SR = [[60, 64, 72], [110, 115, 124], [160, 165, 174], [206, 210, 217], [240, 242, 246]];
const CR = [[96, 40, 20], [150, 72, 40], [196, 112, 72], [228, 158, 116]];
const AO = [[50, 46, 20], [100, 96, 50], [150, 146, 84], [196, 192, 128], [230, 228, 180]];   // aokin: green-gold
const rampc = (R, v) => { v = clamp(v) * (R.length - 1); const i = Math.min(R.length - 2, v | 0); return mix(R[i], R[i + 1], v - i); };
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function hsl(h, s, l) { h = (((h % 360) + 360) % 360) / 360; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = u => { u = (u + 1) % 1; return u < 1 / 6 ? p + (q - p) * 6 * u : u < .5 ? q : u < 2 / 3 ? p + (q - p) * (2 / 3 - u) * 6 : p; };
  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255]; }
const nacre = (h, l) => hsl(h, .38 + .14 * Math.sin(h * .07), l);
const gauss = r => (r() + r() + r() + r() - 2) * 1.73;
const fl = (ph, fr, t) => Math.pow(.5 + .5 * Math.sin(t * fr + ph), 16);
function pix(w, h, fn) { const c = canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), D = d.data, o = [0, 0, 0, 0];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { o[3] = 0; fn(i, j, o); if (o[3] <= 0) continue; const k = (j * w + i) * 4;
    D[k] = o[0]; D[k + 1] = o[1]; D[k + 2] = o[2]; D[k + 3] = Math.min(255, o[3] * 255); }
  x.putImageData(d, 0, 0); return c; }

// ---------------- camera: glide over the deep, then tilt up into the heavens (one continuous move) ----------------
function cam(t) { return { x: 0, y: 0, z: .12 * t + 2.6 * eio((t - 6.6) / 8.5) + 8 * eio((t - 13.8) / 11), hc: HC0 + H * 1.45 * eio((t - 13.8) / 6.8) }; }
function proj(c, X, Y, Z) { const d = Z - c.z; if (d < .05) return null; const s = F / d; return [W / 2 + (X - c.x) * s, c.hc + (Y - c.y) * s, s]; }
function unproj(c, sx, sy, d) { return [c.x + (sx - W / 2) * d / F, c.y + (sy - c.hc) * d / F, c.z + d]; }
const C9 = cam(9), D9 = ZL - C9.z, RS = V ? .5 * W : .38 * H;
const LC = unproj(C9, W / 2, H * (V ? .45 : .46), D9), RR = RS * D9 / F;   // the radiance: centre (world) and radius
const C20 = cam(20);

// ---------------- the sheen: the light gliding across the polished lacquer ----------------
const SA = -.38, SNX = -Math.sin(SA), SNY = Math.cos(SA), SL = Math.hypot(W, H), SWD = M * .17;
let SPX = 0, SPY = 0;
function sheenPos(t) { const f = ((((t - 8.5) / 11 + .5) % 1) + 1) % 1, o = (f - .5) * SL * 1.5; SPX = W / 2 + SNX * o; SPY = H / 2 + SNY * o; }
function sheenAt(x, y) { const d = (x - SPX) * SNX + (y - SPY) * SNY; return Math.exp(-(d * d) / (SWD * SWD)); }
let BASE, SHT, GL;
function drawSheen(ctx, a) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = a; ctx.translate(SPX, SPY); ctx.rotate(SA);
  ctx.drawImage(SHT, -SL * .75, -SWD * 2.2, SL * 1.5, SWD * 4.4); ctx.restore(); }
const GLQ = [];
function glint(x, y, s, a) { if (a > .03) GLQ.push(x, y, s, Math.min(1, a)); }
function flushGlints(ctx) { ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < GLQ.length; i += 4) { const s = GLQ[i + 2]; ctx.globalAlpha = GLQ[i + 3]; ctx.drawImage(GL, GLQ[i] - s, GLQ[i + 1] - s, 2 * s, 2 * s); }
  GLQ.length = 0; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }

// ---------------- the deep: rows of seigaiha waves in silver powder, receding to the horizon ----------------
const WR = 150, WN = 16, WSW = WR * 2 * WN, WCY = Math.round(WR * 1.04), WSH = Math.round(WR * 1.62), RW = .22, WDZ = .16;
let WD, WS, WG, FB, FBG;
function buildWaves() {
  const mk = () => { const c = canvas(WSW, WSH); return [c, c.getContext('2d')]; };
  const [dk, dx] = mk(), [sv, sx] = mk(), [gd, gx] = mk();
  for (const x of [dx, sx]) { x.fillStyle = css(LQ); x.fillRect(0, WCY, WSW, WSH - WCY); for (let i = 0; i < WN; i++) { x.beginPath(); x.arc(WR + 2 * WR * i, WCY, WR, 0, 6.2832); x.fill(); } }
  const r = rng(31), rings = [.95, .76, .57, .38, .19];
  for (let i = 0; i < WN; i++) { const cx = WR + 2 * WR * i, sv0 = .7 + .5 * r();
    rings.forEach((f, ri) => { const rr = WR * f, wd = WR * (ri ? .034 : .05), n = Math.PI * rr * (ri ? 2.3 : 3.2);
      for (let k = 0; k < n; k++) { const ph = r() * Math.PI, sn = Math.sin(ph), wgt = (.22 + .78 * Math.pow(sn, .7)) * sv0, rad = rr + gauss(r) * wd * .5;
        const px = cx + Math.cos(ph) * rad, py = WCY - sn * rad, sz = .8 + r() * 1.7, v = r();
        sx.globalAlpha = clamp(wgt * (.4 + .6 * v)); sx.fillStyle = css(rampc(SR, .3 + .7 * v * wgt)); sx.fillRect(px, py, sz, sz);
        const gw = Math.exp(-(((px - WSW / 2) / (WSW * .13)) ** 2));
        if (r() < gw * .95) { gx.globalAlpha = clamp(wgt * (.55 + .45 * v)); gx.fillStyle = css(rampc(GR, .4 + .6 * v * wgt)); gx.fillRect(px, py, sz * 1.1, sz * 1.1); } } });
    for (let k = 0; k < 260; k++) { const ph = r() * Math.PI, rad = WR * Math.sqrt(r()) * .95, px = cx + Math.cos(ph) * rad, py = WCY - Math.sin(ph) * rad;   // a little nashiji in each scale
      sx.globalAlpha = .1 + .25 * r(); sx.fillStyle = css(rampc(SR, .4 + .4 * r())); sx.fillRect(px, py, 1.2, 1.2); }
  }
  WD = dk; WS = sv; WG = gd;
  // the far sea: the rows too small to draw, compressed into fine lines; opaque, its top edge feathered (no ruled horizon)
  const fh = 120;
  FB = pix(W, fh, (i, j, o) => { const v = j / fh, n = noise(i * .02, j * .9), line = Math.pow(.5 + .5 * Math.sin(j * (1.4 + v * 1.2) + n * 2), 6);
    const g = Math.random() < (.15 + .5 * line) * (.3 + .7 * v) ? .25 + .5 * Math.random() : .02;
    const c = mix(LQ, rampc(SR, .5), g * (.45 + .4 * v)); o[0] = c[0]; o[1] = c[1]; o[2] = c[2]; o[3] = ss(0, 10, j); });
  FBG = pix(W, fh, (i, j, o) => { const v = j / fh, cx = (i - W / 2) / (W * (.05 + .1 * v)), col = Math.exp(-cx * cx), line = Math.pow(.5 + .5 * Math.sin(j * (1.4 + v * 1.2) + noise(i * .02, j * .9) * 2), 4);
    if (Math.random() > col * (.25 + .75 * line)) return; const c = rampc(GR, .5 + .5 * Math.random()); o[0] = c[0]; o[1] = c[1]; o[2] = c[2]; o[3] = (.4 + .6 * Math.random()) * ss(0, 10, j) * col; });
}
function drawSea(ctx, t, c, lit, base) {
  const hz = c.hc; if (hz > H + 5) return;
  const wW = RW * 2 * WN, sc0 = RW / WR, y15 = hz + F / 15;
  ctx.globalAlpha = 1; ctx.drawImage(FB, 0, hz - 8, W, y15 - hz + 14);
  if (lit > 0) { ctx.globalAlpha = lit; ctx.drawImage(FBG, 0, hz - 8, W, y15 - hz + 14); }
  for (let k = Math.ceil((c.z + 15) / WDZ); ; k--) { const d = k * WDZ - c.z; if (d < .5) break;
    const s = F / d, y = hz + s, sc = s * sc0, top = y - WCY * sc; if (top > H) break;
    const tw = WSW * sc, th = WSH * sc, hk = Math.abs(Math.sin(k * 12.9898) * 43758.5453) % 1, off = hk * 2 * RW;
    let x0 = W / 2 + (off - c.x) * s; x0 -= Math.ceil(x0 / tw) * tw;
    const a = base * (.3 + .7 * (1 - ss(4, 15, d))) * (.55 + .45 * noise(k * .23, 3.7));
    for (let x = x0; x < W; x += tw) { if (a < .98) { ctx.globalAlpha = 1; ctx.drawImage(WD, x, top, tw, th); } if (a > .02) { ctx.globalAlpha = Math.min(1, a); ctx.drawImage(WS, x, top, tw, th); } }
    if (lit > .01) { ctx.globalAlpha = Math.min(1, lit * (1.15 - .55 * ss(6, 15, d))); ctx.drawImage(WG, W / 2 + (off - wW / 2 - c.x) * s, top, tw, th); }
  }
  ctx.globalAlpha = 1;
}
let SPI = [];
function drawSpirit(ctx, t) {   // "하나님의 영은 수면 위에 운행하시니라": a breath of fine gold dust drifting over the waters
  const vis = ss(.5, 2.2, t) * (1 - ss(6.4, 7.6, t)); if (vis <= 0) return;
  const head = W * (-.2 + .2 * t), L = W * 1.05, y0 = HC0 + (V ? 120 : 62);
  for (const p of SPI) { const x = head - p.u * L + (noise(p.u * 5, t * .3 + p.ph) - .5) * 90; if (x < -4 || x > W + 4) continue;
    const y = y0 - Math.sin(x * .0035 + t * .5) * (V ? 50 : 28) + p.o * (5 + 52 * p.u) - p.u * 30 + (noise(p.ph * 9, t * .6) - .5) * 26 * p.u;
    const sh = sheenAt(x, y), f = fl(p.ph, p.fr, t), a = vis * p.a * Math.pow(1 - p.u, .5) * ss(0, .05, p.u) * (.4 + .6 * f + 1.2 * sh);
    if (a < .02) continue; ctx.globalAlpha = Math.min(1, a); ctx.fillStyle = p.c; ctx.fillRect(x, y, p.s, p.s);
    if (f > .7 && p.s > 1.4) glint(x, y, 4 + 3 * f, a * .6); }
  ctx.globalAlpha = 1;
}

// ---------------- the radiance: gold powder settled on the black, burnished at the centre ----------------
const RT = 1400, RC = RT / 2, RTR = RT / 2 / 1.15;
let RAD, RB, rbx, RG = [], VP = [], TR = [];
const radD = r => (Math.exp(-((r / .46) ** 2)) * .95 + .26 * Math.exp(-((r / .88) ** 2))) * (1 - ss(.92, 1.14, r));
function buildRadiance() {
  const r = rng(41);
  RAD = pix(RT, RT, (i, j, o) => { const dx = (i - RC) / RTR, dy = (j - RC) / RTR, rr = Math.hypot(dx, dy); if (rr > 1.14) return;   // the bokashi underlayer
    const n = fbm(dx * 3 + 7, dy * 3 + 2, 4), D = radD(rr) * (.72 + .56 * n), bur = Math.exp(-((rr / .17) ** 3)), g = r();
    const a = clamp(D * .5 * (.85 + .3 * g) + bur); if (a < .01) return;
    const c = rampc(GR, clamp(.34 + .3 * D + .06 * (g - .5) + .36 * bur * (1 - .25 * rr / .17) + .08 * (n - .5)));
    o[0] = c[0]; o[1] = c[1]; o[2] = c[2]; o[3] = a; });
  { const x = RAD.getContext('2d');   // sprinkled grains: discrete, resolvable, densest at the centre
    for (let k = 0; k < 150000; k++) { const a = r() * 6.2832, rr = Math.sqrt(r()) * 1.1, D = radD(rr); if (r() > D * 1.1) continue;
      const px = RC + Math.cos(a) * rr * RTR, py = RC + Math.sin(a) * rr * RTR, v = r(), s = 1.4 + r() * 1.8, kind = r();
      x.globalAlpha = .45 + .55 * r(); x.fillStyle = css(kind < .05 ? rampc(CR, .5 + .5 * v) : kind < .1 ? rampc(SR, .6 + .4 * v) : rampc(GR, .42 + .5 * v));
      x.fillRect(px, py, s, s); }
    // the burnished pool: a soft highlight polished into the gold
    const g = x.createRadialGradient(RC - RTR * .05, RC - RTR * .06, 0, RC, RC, RTR * .2); g.addColorStop(0, 'rgba(250,228,160,.55)'); g.addColorStop(.6, 'rgba(236,200,120,.18)'); g.addColorStop(1, 'rgba(230,190,110,0)');
    x.globalAlpha = 1; x.fillStyle = g; x.fillRect(0, 0, RT, RT); }
  const x = RAD.getContext('2d');
  // coarse flakes (hirame): irregular, two-toned
  for (let k = 0; k < 2600; k++) { const a = r() * 6.2832, rr = Math.sqrt(r()) * 1.08; if (r() > radD(rr) * 1.3) continue;
    const px = RC + Math.cos(a) * rr * RTR, py = RC + Math.sin(a) * rr * RTR, s = 1.4 + r() * 2.6, cu = r() < .1, si = !cu && r() < .08;
    const col = cu ? rampc(CR, .5 + .5 * r()) : si ? rampc(SR, .6 + .4 * r()) : rampc(GR, .55 + .45 * r());
    x.globalAlpha = .7 + .3 * r(); x.fillStyle = css(col); x.beginPath();
    for (let v = 0; v < 4; v++) { const b = v * 1.57 + r() * .8, q = s * (.6 + .5 * r()); v ? x.lineTo(px + Math.cos(b) * q, py + Math.sin(b) * q) : x.moveTo(px + Math.cos(b) * q, py + Math.sin(b) * q); }
    x.fill(); }
  // kirikane: cut-foil squares set in two sparse rings and scattered — the light's "rays", without spokes
  const kiri = (px, py, s, rot) => { x.save(); x.translate(px, py); x.rotate(rot); x.globalAlpha = .95; x.fillStyle = css(GR[5]); x.fillRect(-s / 2, -s / 2, s, s);
    x.fillStyle = css(GR[3]); x.beginPath(); x.moveTo(-s / 2, s / 2); x.lineTo(s / 2, -s / 2); x.lineTo(s / 2, s / 2); x.fill(); x.restore(); };
  [[.6, 44, 8], [.8, 64, 6.5], [.97, 84, 5]].forEach(([rf, n, s], ri) => { for (let k = 0; k < n; k++) { if (r() < .18) continue; const a = (k + (ri & 1) * .5) / n * 6.2832 + gauss(r) * .01, rr = rf + gauss(r) * .012;
    kiri(RC + Math.cos(a) * rr * RTR, RC + Math.sin(a) * rr * RTR, s * (.8 + .4 * r()), (k + ri) % 2 ? .785 : a); } });
  for (let k = 0; k < 90; k++) { const a = r() * 6.2832, rr = .15 + .8 * Math.sqrt(r()); kiri(RC + Math.cos(a) * rr * RTR, RC + Math.sin(a) * rr * RTR, 3 + r() * 4, r() * 3); }
  x.globalAlpha = 1;
  // glint points: grains that flash as the sheen passes
  while (RG.length < 1000) { const a = r() * 6.2832, rr = Math.sqrt(r()) * 1.05; if (r() > radD(rr) * 1.2 + .03) continue;
    RG.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr, r: rr, ph: r() * 40, fr: 1.5 + r() * 4, s: 3 + r() * 5, b: .5 + r() }); }
}
function rev(t) { if (t < 5.62) return 0; if (t < T_FL) return .05 * ss(5.62, T_FL, t); return .05 + 1.22 * Math.pow(clamp((t - T_FL) / 3.4), .85); }

// ---------------- the heavens ----------------
const GCFG = V ? [[.4, .31, 22, .34 * W, .52, .5, 1], [.76, .6, 40, .19 * W, .42, -.7, -1], [.24, .79, 30, .12 * W, .62, 1.1, 1]]
               : [[.29, .37, 22, .2 * H, .52, .45, 1], [.78, .26, 40, .12 * H, .42, -.7, -1], [.64, .77, 30, .075 * H, .62, 1.1, 1]];
const GAL = GCFG.map(([fx, fy, d, rs, tilt, ang, spin]) => ({ c: unproj(C20, W * fx, H * fy, d), R: rs * d / F, tilt, ang, spin }));
let GTX = [], MWY, MWC, ST = [], NAC = [], NACB = [];
const GTN = 900, GTR = 420;
function buildGalaxy(seed) { const r = rng(seed);
  const c = pix(GTN, GTN, (i, j, o) => { const dx = (i - GTN / 2) / GTR, dy = (j - GTN / 2) / GTR, rr = Math.hypot(dx, dy); if (rr > 1.08) return;
    const th = Math.atan2(dy, dx); let arm = 0;
    for (let a = 0; a < 2; a++) { let d = th - (a * Math.PI + Math.log(Math.max(rr, .02) / .06) * 2); d = ((d % 6.2832) + 9.4248) % 6.2832 - 3.1416; arm = Math.max(arm, Math.exp(-((d / (.26 + .3 * rr)) ** 2))); }
    const n = fbm(dx * 4 + seed, dy * 4, 4), core = Math.exp(-((rr / .12) ** 2)), fall = 1 - ss(.5, 1.06, rr);
    const D = core * 1.2 + arm * fall * (.3 + .9 * n) * ss(.03, .2, rr) + .05 * fall, g = r(), g2 = r();
    const a = D * .4 * (1 - core * .3) + (g2 < D * .9 ? .3 + .7 * g : 0) + core * .7; if (a < .02) return;
    const w = ss(.12, .85, rr), cc = mix(rampc(GR, .5 + .45 * Math.min(1, D) + .1 * g), rampc(SR, .45 + .5 * g), w * .85);
    o[0] = cc[0]; o[1] = cc[1]; o[2] = cc[2]; o[3] = Math.min(1, a); });
  const x = c.getContext('2d');   // a few cut-foil squares along the arms
  for (let k = 0; k < 40; k++) { const [rr, th] = galSample(r); if (rr < .15) continue; const s = 3 + r() * 4; x.save(); x.translate(GTN / 2 + Math.cos(th) * rr * GTR, GTN / 2 + Math.sin(th) * rr * GTR); x.rotate(r() * 3);
    x.fillStyle = css(rr > .6 ? SR[4] : GR[5]); x.globalAlpha = .9; x.fillRect(-s / 2, -s / 2, s, s); x.restore(); }
  return c; }
function galSample(r) { if (r() < .16) return [Math.abs(gauss(r)) * .1, r() * 6.2832]; const rr = .08 + .9 * Math.pow(r(), .9), a = r() < .5 ? 0 : 1;
  return [rr, a * Math.PI + Math.log(rr / .06) * 2 + gauss(r) * (.1 + .13 * rr)]; }
function galPt(g, gr, gth, t) { const ph = gth + g.spin * .05 * (t - 14), lx = gr * Math.cos(ph), ly = gr * Math.sin(ph) * g.tilt, ca = Math.cos(g.ang), sa = Math.sin(g.ang);
  return [g.c[0] + (lx * ca - ly * sa) * g.R, g.c[1] + (lx * sa + ly * ca) * g.R, g.c[2]]; }
function buildSky() {
  // a band of graded silver dust across the heavens (a far plane)
  MWC = unproj(C20, W * .5, H * .45, 140);
  MWY = pix(1600, 900, (i, j, o) => { const u = i / 1600 - .5, v = (j / 900 - .5) * .5625, d = v * Math.cos(.38) + u * Math.sin(.38);
    const n = fbm(i * .006, j * .006, 5), D = Math.exp(-((d / (.07 + .05 * n)) ** 2)) * (.3 + .9 * n) * (1 - ss(.38, .5, Math.abs(u))) * (1 - ss(.22, .28, Math.abs(v)));
    if (Math.random() > D * .14) return; const c = Math.random() < .25 ? rampc(GR, .5 + .5 * Math.random()) : rampc(SR, .3 + .7 * Math.random());
    o[0] = c[0]; o[1] = c[1]; o[2] = c[2]; o[3] = .2 + .45 * Math.random(); });
  // stars: gold and silver flecks, cut-foil squares, a few pieces of shell
  const r = rng(21);
  for (let i = 0; i < 800; i++) { const k = i < 30 ? 2 : i < 160 ? 1 : 0, sx = (-.4 + 1.8 * r()) * W, sy = (-.7 + 2.2 * r()) * H, d = 3 * Math.pow(55, r()), p = unproj(C20, sx, sy, d);
    const gold = r() < .55; ST.push({ X: p[0], Y: p[1], Z: p[2], k, c: css(gold ? rampc(GR, .5 + .5 * r()) : rampc(SR, .45 + .55 * r())), b: .35 + .65 * r(), ph: r() * 40, fr: .8 + r() * 3, n: (r() * 10) | 0, sz: .7 + r() * .8 }); }
