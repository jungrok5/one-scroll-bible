  text(ctx, V ? '수학 공식처럼 강제하는 “증명”은 아닙니다.' : '수학 공식처럼 강제하는 “증명”은 아닙니다.', W / 2, ty, { ...st, size: V ? 44 : 48, alpha: win(t, 32.8, 35.8, .8, .6) });

  const f = 1 - ss(0, 1.1, t) + ss(DUR - 1.2, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}
