<title>시안 · 분열 왕국 · 포로</title>

<script src="lib.js"></script>
<script>
/* 08 분열 왕국 · 포로 — an expressionist woodcut after Käthe Kollwitz (Krieg, 1921–22): big masses of black, faces and
   hands cut out white with a few black features, white gouges round the forms (wider where the light falls), the ground
   left uncut. Four impressions, each carved in as we watch:
   1) the kingdom splits (1 Ki 12:19): the men of the north turn away, the young king stares after them; the block cracks
      and the two halves part, the paper showing white through the rift
   2) Jerusalem falls: a mother clutching her child looks back at the temple burning on the hill (the only light)
   3) the captives: a slow pan along bowed faces, bound hands, a child on a hip
   4) by the rivers of Babylon (Ps 137:1–2): a woman with her face in her hands, a mother cheek to her child, an old man
      bowed on his knees; the harps hang on the willows. At the end one thin warm light (the only colour block) falls on
      them: he went with them into exile and promised restoration.
   Nothing graphic: the city burns far off; grief, not violence. */
const { clamp, lerp, ss, eo, eio, win, rng, fbm, noise, canvas, speckle } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v', DUR = 42;
const INK = '#17130F', PAPER = '#E8DFCA', GOLD = '#D9A04E';
const PL = V ? { x: 50, y: 170, w: 980, h: 1230 } : { x: 70, y: 56, w: 1780, h: 812 };   // the printed plate; the margin below holds captions
const PW = PL.w, PH = PL.h;
const CUTS = [0, 9.6, 16.4, 22.6, DUR];
let paper, inkTex, edge, M, mx, hit, T1, T2;

// ================= the knife =================
// a gouge along a polyline: pointed entry, a swelling body, pointed exit, chipped edges
function gouge(pts, w, r, chip = .2) {
  const n = pts.length, a = [], b = [];
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[Math.min(i + 1, n - 1)], o = pts[Math.max(i - 1, 0)], dx = q[0] - o[0], dy = q[1] - o[1], L = Math.hypot(dx, dy) || 1, u = n > 1 ? i / (n - 1) : .5;
    const ww = w * Math.pow(Math.sin(Math.PI * (.03 + u * .94)), .55) * (1 + (r ? (r() - .5) * chip * 2 : 0)) / 2;
    a.push([p[0] - dy / L * ww, p[1] + dx / L * ww]); b.push([p[0] + dy / L * ww, p[1] - dx / L * ww]); }
  const P = new Path2D(); a.forEach((q, i) => i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1])); for (let i = b.length - 1; i >= 0; i--) P.lineTo(b[i][0], b[i][1]); P.closePath(); return P;
}
const line = (x0, y0, x1, y1, bow = 0, n = 6) => { const pts = [], nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny) || 1; for (let i = 0; i <= n; i++) { const u = i / n, bb = bow * Math.sin(Math.PI * u); pts.push([lerp(x0, x1, u) + nx / L * bb, lerp(y0, y1, u) + ny / L * bb]); } return pts; };
const prefix = (pts, k) => { if (k >= 1) return pts; const f = k * (pts.length - 1), i = Math.floor(f), out = pts.slice(0, i + 1); if (i < pts.length - 1) out.push([lerp(pts[i][0], pts[i + 1][0], f - i), lerp(pts[i][1], pts[i + 1][1], f - i)]); return out.length > 1 ? out : [pts[0], pts[0]]; };
// Catmull-Rom sampling of a closed outline
function samp(pts, per = 6) { const n = pts.length, out = [], P = i => pts[(i + n) % n];
  for (let i = 0; i < n; i++) { const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 0; k < per; k++) { const t = k / per, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } }
  return out; }
const shape = pts => { const s = samp(pts), P = new Path2D(); s.forEach((q, i) => i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1])); P.closePath(); return P; };
const tfm = (ox, oy, s, pts, ang = 0, fx = 1) => { const c = Math.cos(ang), sn = Math.sin(ang); return pts.map(([a, b]) => { a *= fx; return [ox + (a * c - b * sn) * s, oy + (a * sn + b * c) * s]; }); };

// ================= sheets: ops carved in over time, the finished prefix cached =================
// op: { t0, d, f(m, k) } — k: 0..1 progress of the cut
function sheet(build, base = true) { const c = canvas(PW, PH), x = c.getContext('2d'), ops = []; if (base) ops.push({ t0: -1, d: .01, f: m => { m.fillStyle = '#000'; m.fillRect(0, 0, PW, PH); } }); build(ops); ops.forEach(o => o.end = o.t0 + o.d); return { c, x, ops, n: 0, lt: -1e9 }; }
function show(sh, lt, m) {
  if (lt < sh.lt || sh.n === 0) { sh.n = 0; sh.x.setTransform(1, 0, 0, 1, 0, 0); sh.x.globalCompositeOperation = 'source-over'; sh.x.globalAlpha = 1; sh.x.clearRect(0, 0, PW, PH); }
  while (sh.n < sh.ops.length && sh.ops[sh.n].end <= lt) { sh.x.save(); sh.ops[sh.n].f(sh.x, 1); sh.x.restore(); sh.n++; }
  sh.lt = lt; m.drawImage(sh.c, 0, 0);
  for (let i = sh.n; i < sh.ops.length; i++) { const o = sh.ops[i]; if (o.t0 >= lt) continue; m.save(); o.f(m, clamp((lt - o.t0) / o.d)); m.restore(); }
}
// a white gouge that grows along its path
const cutOp = (ops, pts, w, t0, d = .18, seed = 1) => { const r = rng(seed), full = gouge(pts, w, r); ops.push({ t0, d, f: (m, k) => { m.fillStyle = '#fff'; m.fill(k >= 1 ? full : gouge(prefix(pts, k), w * Math.min(1, k * 3), rng(seed))); } }); };
// a filled shape revealed by a carving wipe (dir: angle the knife travels)
const fillOp = (ops, P, col, t0, d, box, dir = 0) => ops.push({ t0, d, f: (m, k) => { if (k < 1) { const [x0, y0, x1, y1] = box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2, c = Math.cos(dir), s = Math.sin(dir), e = -R + 2 * R * k;
    const cl = new Path2D(); cl.moveTo(cx - c * R - s * R, cy - s * R + c * R); cl.lineTo(cx - c * R + s * R, cy - s * R - c * R); cl.lineTo(cx + c * e + s * R, cy + s * e - c * R); cl.lineTo(cx + c * e - s * R, cy + s * e + c * R); cl.closePath(); m.clip(cl); }
  m.fillStyle = col; m.fill(P); } });
// gouges round an outline, broken into runs, wider on the side that faces the light
function contourOps(ops, pts, L, wmin, wmax, t0, d, seed, out = 3) {
  const s = samp(pts, 4), n = s.length, r = rng(seed), cx = s.reduce((a, p) => a + p[0], 0) / n, cy = s.reduce((a, p) => a + p[1], 0) / n;
  let i = Math.floor(r() * 3), j = 0;
  while (i < n - 2) { const len = 4 + Math.floor(r() * 7), seg = []; for (let k = 0; k <= len && i + k < n; k++) seg.push(s[i + k]);
    const mid = seg[seg.length >> 1], nx = mid[0] - cx, ny = mid[1] - cy, nl = Math.hypot(nx, ny) || 1, f = Math.max(0, (nx * L[0] + ny * L[1]) / nl), w = lerp(wmin, wmax, f);
    if (w > .8) { const o = seg.map(p => [p[0] + nx / nl * out, p[1] + ny / nl * out]); cutOp(ops, o, w, t0 + d * (i / n), .12, seed * 31 + j); }
    i += len + Math.floor(r() * 3); j++; }
}
// parallel cuts in bundles across a region (never machine-even)
function hatchOps(ops, inside, o) {
  const r = rng(o.seed || 1), ang = o.ang || 0, ca = Math.cos(ang), sa = Math.sin(ang), [bx0, by0, bx1, by1] = o.box, cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2, R = Math.hypot(bx1 - bx0, by1 - by0) / 2;
  let v = -R;
  while (v < R) { const nb = 2 + Math.floor(r() * 4), sp = (o.sp || 9) * (.8 + r() * .5);
    for (let b = 0; b < nb; b++, v += sp) { let u = -R + r() * 60;
      while (u < R) { const len = lerp(o.len[0], o.len[1], r()), ux = cx + ca * u - sa * v, uy = cy + sa * u + ca * v, mx2 = ux + ca * len / 2, my2 = uy + sa * len / 2;
        if (mx2 > bx0 && mx2 < bx1 && my2 > by0 && my2 < by1 && inside(mx2, my2)) { const w = o.w(mx2, my2, r); if (w > .8) { const a2 = ang + (r() - .5) * .07; cutOp(ops, line(ux, uy, ux + Math.cos(a2) * len, uy + Math.sin(a2) * len, (r() - .5) * 3), w, o.t(mx2, my2, r), o.d || .14, (ux * 7 + uy) | 0); } }
        u += len + (o.gap || 8) * (.4 + r() * 1.2); } }
    v += sp * (1 + r() * 2.2); }
}

// ================= faces and hands (Kollwitz: white shapes, a few black features) =================
// o: s scale (face ≈ 100·s tall), ang tilt, tr turn (-1 left … 1 right), lx light side (-1 from the left, 1 from the right),
//    eyes 'closed' | 'open' | 'down', mouth 'line' | 'open', grief 0..1, beard 'white' | 'black' | 0, t0, seed
function faceOps(ops, cx, cy, o) {
  const s = o.s, tr = o.tr || 0, lx = o.lx || -1, g = o.grief == null ? .8 : o.grief, t0 = o.t0, r = rng(o.seed || 1), sd = -lx;   // sd: the shadow side
  const fx = tr * 9, X = x => { const far = x * tr < 0; return x * (far ? 1 - .32 * Math.abs(tr) : 1 + .06 * Math.abs(tr)) + fx * (1 - Math.abs(x) / 40); };
  const T = pts => tfm(cx, cy, s, pts.map(([x, y]) => [X(x), y]), o.ang || 0);
  const outline = T([[-29, -42], [-14, -50], [2, -51], [18, -48], [30, -38], [34, -14], [31, 14], [24, 36], [12, 50], [0, 54], [-12, 50], [-24, 36], [-31, 14], [-34, -14]]);
  const P = shape(outline), box = [Math.min(...outline.map(p => p[0])), Math.min(...outline.map(p => p[1])), Math.max(...outline.map(p => p[0])), Math.max(...outline.map(p => p[1]))];
  fillOp(ops, P, '#fff', t0, .45, box, o.ang + Math.PI / 2 * 0);
  // the shadow side: black, its edge jagged down the line of the nose; a few reflected-light cuts inside it
  const shd = T([[fx * .1 + sd * 3, -60], [sd * 4 + fx * .3, -24], [sd * 6 + fx * .8, -4], [sd * 9 + fx, 16], [sd * 5 + fx * .7, 30], [sd * 9 + fx * .5, 44], [sd * 6, 70], [sd * 70, 70], [sd * 70, -70]]);
  ops.push({ t0: t0 + .35, d: .25, f: (m, k) => { m.save(); m.clip(P); m.globalAlpha = k; m.fillStyle = '#000'; m.fill(shape(shd)); m.restore(); } });
  for (let i = 0; i < 4; i++) { const y = -20 + i * 15 + r() * 5, a = T([[sd * (12 + i * 2) + fx * .5, y], [sd * (26 - i * 1.5) + fx * .3, y + 9]]); cutOp(ops, line(a[0][0], a[0][1], a[1][0], a[1][1], 1), 3.2 * s, t0 + .7 + i * .05, .1, (o.seed || 1) * 13 + i); }
  const blk = (pts, w, dt) => { const pp = T(pts); ops.push({ t0: t0 + dt, d: .12, f: (m, k) => { m.fillStyle = '#000'; m.fill(gouge(prefix(pp, k), w * s, rng(5))); } }); };
  const blob = (pts, dt) => { const pp = shape(T(pts)); ops.push({ t0: t0 + dt, d: .1, f: (m, k) => { m.globalAlpha = k; m.fillStyle = '#000'; m.fill(pp); } }); };
  // brows: heavy, the inner ends lifted by grief
  blk([[-28, -14], [-18, -20 - g * 2], [-5, -22 - g * 7]], 7.5, .5); blk([[28, -14], [18, -20 - g * 2], [5, -22 - g * 7]], 7.5, .52);
  // eyes
  for (const e of [-1, 1]) { const ex = e * 15;
    if (o.eyes === 'open') { blob([[ex - 9, -8], [ex, -13], [ex + 9, -8], [ex, -4]], .58); ops.push({ t0: t0 + .7, d: .1, f: (m, k) => { const q = T([[ex, -8.5]])[0]; m.fillStyle = '#fff'; m.beginPath(); m.arc(q[0], q[1], 1.6 * s, 0, 6.29); m.fill(); } }); }
    else { blob([[ex - 10, -9], [ex, -13 - g * 1.5], [ex + 10, -9], [ex, -5]], .58); blk([[ex - 9, -1], [ex, 2], [ex + 8, -1]], 2.4, .62); } }
  // nose: the shadow plane and the nostril
  blob([[sd * 2 + fx * .5, -6], [sd * 6 + fx * 1.25, 17], [fx * 1.1 - sd * 1, 22], [sd * 1 + fx * .5, 8]], .66);
  blob([[fx - 7, 20], [fx - 3, 18], [fx - 2, 22]], .7); blob([[fx + 7, 20], [fx + 3, 18], [fx + 2, 22]], .7);
  // grief lines from the nose wings to the mouth
  blk([[fx - 11, 20], [fx - 15, 30], [fx - 15, 38]], 2.6 * (.4 + g), .74); blk([[fx + 11, 20], [fx + 15, 30], [fx + 15, 38]], 2.6 * (.4 + g), .76);
  // mouth
  if (o.mouth === 'open') blob([[fx - 8, 32], [fx, 29], [fx + 8, 32], [fx, 38]], .8); else blk([[fx - 13, 35 + g * 3], [fx - 4, 32], [fx + 4, 32], [fx + 13, 35 + g * 3]], 4.2, .8);
  blk([[fx - 5, 45], [fx + 5, 45]], 3, .84);
  if (o.beard) { const bp = T([[-26, 30], [-16, 40], [0, 44], [16, 40], [26, 30], [24, 60], [10, 86], [0, 92], [-10, 86], [-24, 60]]), BP = shape(bp);
    if (o.beard === 'white') { ops.push({ t0: t0 + .86, d: .2, f: (m, k) => { m.globalAlpha = k; m.fillStyle = '#fff'; m.fill(BP); } });
      for (let i = 0; i < 7; i++) { const x = -18 + i * 6; blk([[x, 46], [x * .7, 66], [x * .4, 86]], 2.2, .95 + i * .02); } }
    else { ops.push({ t0: t0 + .86, d: .2, f: (m, k) => { m.globalAlpha = k; m.fillStyle = '#000'; m.fill(BP); } });
      for (let i = 0; i < 6; i++) { const x = -16 + i * 6.4, a = T([[x, 50], [x * .7, 70], [x * .45, 86]]); cutOp(ops, a, 2.4 * s, t0 + 1 + i * .03, .12, (o.seed || 1) * 7 + i); } } }
  return { P, outline, box };
}
// a big hand: palm, four fingers and a thumb cut out white, black lines between the fingers
// o: s (hand ≈ 100·s long, wrist at x,y pointing along ang), spread, curl (0 open … 1 fist), flip, t0
function handOps(ops, x, y, ang, o) {
  const s = o.s, f = o.flip ? -1 : 1, sp = o.spread || 0, cu = o.curl || 0, T = pts => tfm(x, y, s, pts, ang, f);
  const palm = T([[-19, 2], [19, 2], [23, -24], [22, -46], [-21, -46], [-23, -22]]);
  const segs = [], fing = [[-15, 36], [-5, 44], [6, 42], [16, 34]];
  fing.forEach(([bx, L], i) => { const a = (i - 1.5) * .13 * sp, L2 = L * (1 - cu * .45); segs.push([T([[bx, -44], [bx + Math.sin(a) * L2 * .55, -44 - Math.cos(a) * L2 * .55 + cu * 8], [bx + Math.sin(a) * L2 - cu * 6, -44 - Math.cos(a) * L2 + cu * 22]]), 10.5 - i * .6]); });
  segs.push([T([[-20, -12], [-30, -28 + cu * 6], [-36 + cu * 10, -44 + cu * 14]]), 11]);
  ops.push({ t0: o.t0, d: .4, f: (m, k) => { m.globalAlpha = Math.min(1, k * 1.6); m.fillStyle = '#fff'; m.fill(shape(palm)); m.strokeStyle = '#fff'; m.lineCap = 'round'; m.lineJoin = 'round';
    for (const [pts, w] of segs) { m.lineWidth = w * s; m.beginPath(); prefix(pts, clamp(k * 1.4 - .2)).forEach((p, i) => i ? m.lineTo(p[0], p[1]) : m.moveTo(p[0], p[1])); m.stroke(); } } });
  // the gaps between the fingers, knuckle creases, the shadow under the palm
  for (let i = 0; i < 3; i++) { const bx = -10 + i * 10.5, pp = T([[bx, -46], [bx + (i - 1) * 2 * sp, -60 + cu * 6], [bx + (i - 1) * 3 * sp, -74 + cu * 14]]); ops.push({ t0: o.t0 + .4, d: .1, f: (m, k) => { m.fillStyle = '#000'; m.fill(gouge(prefix(pp, k), 2.6 * s, rng(i))); } }); }
  for (let i = 0; i < 4; i++) { const bx = -15 + i * 10.5, pp = T([[bx - 3, -50 + cu * 4], [bx + 3, -50 + cu * 4]]); ops.push({ t0: o.t0 + .45, d: .1, f: (m, k) => { m.fillStyle = '#000'; m.fill(gouge(prefix(pp, k), 1.8 * s, rng(9 + i))); } }); }
  { const pp = T([[18, -4], [20, -26], [14, -44]]); ops.push({ t0: o.t0 + .45, d: .12, f: (m, k) => { m.fillStyle = '#000'; m.fill(gouge(prefix(pp, k), 4 * s, rng(3))); } }); }
}
// a body mass: black, with gouges round it; fold cuts on its lit side
function bodyOps(ops, pts, L, o) {
  const P = shape(pts), b = [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
  ops.push({ t0: o.t0, d: .01, f: m => { m.fillStyle = '#000'; m.fill(P); } });
  contourOps(ops, pts, L, o.wmin || 1.5, o.wmax || 7, o.t0, o.d || 1, o.seed || 3, o.out == null ? 3 : o.out);
  if (o.folds) { const r = rng(o.seed || 3), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    for (let i = 0; i < o.folds; i++) { const u = r(), a = o.foldAng == null ? Math.PI / 2 : o.foldAng, x0 = lerp(b[0], b[2], .5 + L[0] * (.25 + r() * .2)) + (r() - .5) * (b[2] - b[0]) * .25, y0 = lerp(b[1], b[3], .15 + u * .6), len = (b[3] - b[1]) * (.12 + r() * .2);
      if (!hit.isPointInPath(P, x0, y0)) continue; cutOp(ops, line(x0, y0, x0 + Math.cos(a) * len, y0 + Math.sin(a) * len, (r() - .5) * 10), (o.foldW || 4) * (.6 + r() * .6), o.t0 + .3 + r() * (o.d || 1), .2, (x0 * 3 + y0) | 0); } }
  return P;
}

// ---------- people: a head covering, a face, a body ----------
// cov: 'cloth' (men's headcloth), 'veil' (falls to the shoulders and down the back), 'hair', 'crown'
function personOps(ops, o) {
  const { hx, hy, s, t0 } = o, tr = o.tr || 0, ang = o.ang || 0, L = o.L || [o.lx || -1, -.4], back = tr >= 0 ? -1 : 1;
  if (o.body) bodyOps(ops, o.body, L, { t0: t0 - .2, d: 1.2, seed: o.seed || 3, folds: o.folds || 6, wmax: o.wmax || 8 * s / 1.6, foldW: 4 * s / 1.6 });
  const cv = o.cov || 'cloth', C = (pts) => tfm(hx, hy, s, pts, ang);
  const cover = cv === 'veil' ? C([[0, -66], [back * 34, -60], [back * 52, -26], [back * 58, 30], [back * 62, 100], [back * 40, 130], [0, 80], [-back * 40, 40], [-back * 44, -20], [-back * 30, -56]])
              : cv === 'hair' ? C([[0, -62], [back * 34, -56], [back * 46, -20], [back * 42, 26], [back * 26, 40], [-back * 30, 20], [-back * 40, -24], [-back * 26, -54]])
              : C([[0, -68], [back * 36, -62], [back * 52, -30], [back * 54, 20], [back * 50, 74], [back * 22, 70], [-back * 36, 30], [-back * 46, -18], [-back * 30, -58]]);
  bodyOps(ops, cover, L, { t0: t0 - .1, d: .8, seed: (o.seed || 3) + 50, wmax: 7 * s / 1.6, folds: cv === 'veil' ? 4 : 2, foldW: 3 * s / 1.6, foldAng: Math.PI / 2 + back * .3 });
  const F = faceOps(ops, hx, hy, { s, ang, tr, lx: o.lx || -1, eyes: o.eyes, mouth: o.mouth, grief: o.grief, beard: o.beard, t0, seed: o.seed || 3 });
  contourOps(ops, F.outline, L, 1.2, 5 * s / 1.6, t0 + .9, .6, (o.seed || 3) + 90, 2);
  if (cv === 'crown') { const cr = C([[-34, -46], [-36, -78], [-24, -62], [-12, -92], [0, -66], [12, -92], [24, -62], [36, -78], [34, -46]]);
    ops.push({ t0: t0 + 1.0, d: .01, f: m => { m.fillStyle = '#000'; m.fill(shape(cr.concat([[cr[8][0], cr[8][1]]]))); } });
    contourOps(ops, cr, [0, -1], 3, 6, t0 + 1.0, .6, 77, 2);
    for (const q of C([[-20, -54], [0, -55], [20, -54]])) ops.push({ t0: t0 + 1.5, d: .1, f: (m, k) => { m.fillStyle = '#fff'; m.beginPath(); m.arc(q[0], q[1], 4.5 * s / 1.6 * k, 0, 6.29); m.fill(); } }); }
  return F;
}

// ================= plate 1: the kingdom splits =================
const RIFT = (() => { const r = rng(4), pts = []; for (let i = 0; i <= 16; i++) pts.push([PW * (V ? .5 : .5) + (r() - .5) * 46 + (i % 2 ? 16 : -16), -10 + i * (PH + 20) / 16]); return pts; })();
let S1L, S1R;
