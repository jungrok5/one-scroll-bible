   The ONLY red in the scene is the blood on the doorposts.

   B  the plagues as piece swaps on drum hits — frogs, hail, locusts, darkness (the lamps gutter)
   C  Passover night: one lamp; a father marks lintel and posts; a great dark shape passes over the house (출 12:13)
   D  the sea: water strips lift into two walls, the people walk the dry floor between, the pillar of fire behind (출 14:22)

const X = f => CL.x + CL.w * f, Y = f => CL.y + CL.h * f;

const CF = V ? Y(.6) : Y(.62);                           // dry floor through the sea (D)

let T, tx, clothTex, audC, bloomC, bx, hideC, grains = [], shade;

const HOUSE = () => [X(V ? .62 : .6), GY];
