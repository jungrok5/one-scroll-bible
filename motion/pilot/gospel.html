<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 · 복음의 핵심 7가지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;700&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script>
/* 17 복음의 핵심 7가지 — one unbroken tracking shot along the gold line (the film's motif), in the dark.
   The line runs left to right; at each of the seven truths it stops and draws the truth in light, the words appear
   below it like a title and a subtitle, and the camera moves on with the line — no numbers, no grid, no slides:
     1 every life reaches up and falls short of the line of glory · 2 a ladder crumbles; a mirror shows 죄
     3 a tower of works crumbles; a gift comes down in light · 4 a grey figure is clothed in a robe of light
     5 66 points of light turn toward the One · 6 a dial fills with light: 때가 찼고
     7 “행하라” is struck through and falls away, “이루어졌다” stands — then the line itself becomes the cross: “다 이루었다”.
   Same beat grid as the score (101 BPM: B = one beat), so cues land on the music. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, canvas, speckle } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
// each truth gets 14 beats (≈ 8.3 s) — time to read the verse and watch it drawn; the drawings run on an 8-beat clock (KA)
// slowed to fit, and the last truth is held before the cross (FS)
const B = 4.75 / 8, IB = 14, KA = 8 / IB, T0 = 4 * B, ITEM = IB * B, T7 = T0 + 6 * ITEM, FS = 3.2, DUR = T7 + 9.2 + FS + 2.2;
const SANS = "'Noto Sans KR',sans-serif", SERIF = "'Noto Serif KR',serif";
const GOLD = '255,212,138', WARM = '255,244,222', ASH = '150,144,136';
// hl: the line's height · eh/ew: the room above it for each drawing · tt/ts/tl: title y/size/leading · vs/vl/vw: verse size/leading/width
const LY = V ? { hl: 960, eh: 560, ew: 860, tt: 1104, ts: 58, tl: 78, vs: 34, vl: 56, vw: 900, lab: 360 }
             : { hl: 600, eh: 430, ew: 760, tt: 704, ts: 54, tl: 72, vs: 33, vl: 50, vw: 1480, lab: 132 };
const SP = W * 1.05;                                   // distance between two truths along the line
const FIN = V ? { X: 880, Y: 470, arm: 150, x: 72, y: 1300, size: 124, cite: 1356, r: [1470, 38, 58], rc: 1588 }
              : { X: 520, Y: 350, arm: 230, x: 972, y: 520, size: 150, cite: 588, r: [736, 38, 58], rc: 852 };
const RTL = () => Pilot.dir === 'rtl';

// ---------- the statements (index.html CORE: title + vref + vtext; vtext checked against 개역개정 with gae.py) ----------
const CORE = [
  { t: ['원죄 —', '누구도 의롭지 않다'], ref: '로마서 3:10, 23 (개역개정)', cap: '롬 3:10-12, 23', v: '“의인은 없나니 하나도 없으며 … 모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니”' },
  { t: ['율법은 나를', '구원하지 못한다'], ref: '로마서 3:20 · 갈라디아서 3:24 (개역개정)', cap: '롬 3:20 · 갈 3:24', v: '“율법으로는 죄를 깨달음이니라 … 율법이 우리를 그리스도께로 인도하는 초등교사가 되어”' },
  { t: ['은혜로, 노력이 아니라', '선물로'], ref: '에베소서 2:8-9 (개역개정)', cap: '엡 2:8-9', v: '“너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 … 행위에서 난 것이 아니니”' },
  { t: ['믿음으로 의롭다 하심', '(이신칭의)'], ref: '로마서 5:1 · 갈라디아서 2:16 (개역개정)', cap: '롬 5:1 · 갈 2:16', v: '“우리가 믿음으로 의롭다 하심을 받았으니 … 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로”' },
  { t: ['성경은', '예수님을 가리킨다'], ref: '요한복음 5:39 · 누가복음 24:27 (개역개정)', cap: '요 5:39 · 눅 24:27', v: '“이 성경이 곧 내게 대하여 증언하는 것이니라 … 모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라”' },
  { t: ['하나님 나라 —', '예수님의 중심 메시지'], ref: '마가복음 1:15 (개역개정)', cap: '막 1:15', v: '“때가 찼고 하나님의 나라가 가까이 왔으니 회개하고 복음을 믿으라”' },
  { t: ['복음 —', '그분이 다 이루셨다'], ref: '', cap: '요 19:30 · 롬 5:8', v: '' },
];

// ---------- camera and line ----------
const PAN = i => T0 + i * ITEM + (IB - 1.2) * B;              // the camera leaves truth i …
function camX(t) { let p = 0; for (let i = 0; i < 6; i++) p += eio(clamp((t - PAN(i)) / (1.5 * B))); return p * SP + 4 * Math.sin(t * .4); }
function headX(t) {                                    // how far the line has drawn (world x)
  const i0 = T0 + .5 * B; if (t < i0) return lerp(-W * .62, LY.ew * .55, eio(clamp((t - .3) / (i0 - .3))));
  return camX(t) + LY.ew * .55 + (t > T7 ? W : 0) * 0; }
const lineY = x => LY.hl + 5 * Math.sin(x * .0045) + 3 * Math.sin(x * .011 + 1.3);

// ---------- drawing in light ----------
function glow(ctx, path, a, w = 2.2, col = GOLD, core = WARM) {   // a stroke of light: wide soft bloom, glow, white-hot core
  if (a <= .004) return; ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (const [lw, al, c] of [[w * 8, .045, col], [w * 3.2, .17, col], [w, .95, core]]) { ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${c},${Math.min(1, al * a)})`; ctx.beginPath(); path(ctx); ctx.stroke(); }
  ctx.restore();
}
function plen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
function part(p, k) { return x => { k = clamp(k); if (k <= 0) return; let rem = plen(p) * k; x.moveTo(p[0][0], p[0][1]);   // the first k of a polyline
  for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d >= rem) { const f = d ? rem / d : 0; x.lineTo(lerp(p[i - 1][0], p[i][0], f), lerp(p[i - 1][1], p[i][1], f)); return; } rem -= d; x.lineTo(p[i][0], p[i][1]); } }; }
const seg = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];
const ell = (cx, cy, rx, ry, a0 = -Math.PI / 2, n = 72) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + i / n * 6.2832; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
const rect = (x, y, w, h) => [[x, y + h], [x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function dust(ctx, polys, u, seed, a = 1) {            // light crumbling: points along the shapes drift down and go out
  if (u <= 0 || u >= 1) return; const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of polys) { const L = plen(p), n = Math.max(6, Math.round(L / 7));
    for (let j = 0; j < n; j++) { let rem = r() * L, q = p[0]; for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (d >= rem) { const f = d ? rem / d : 0; q = [lerp(p[i - 1][0], p[i][0], f), lerp(p[i - 1][1], p[i][1], f)]; break; } rem -= d; }
      const vx = (r() - .5) * 70, vy = -10 - r() * 30, de = r() * .35, uu = clamp((u - de) / (1 - de)), al = (1 - uu) * (uu > 0 ? 1 : 0) * a; if (al <= .01) continue;
      const x = q[0] + vx * uu, y = q[1] + vy * uu + 140 * uu * uu, s = 1.2 + r() * 2.2;
      ctx.fillStyle = `rgba(${r() < .3 ? WARM : GOLD},${.9 * al})`; ctx.fillRect(x - s / 2, y - s / 2, s, s); } }
  ctx.restore();
}

// ---------- words ----------
function say(ctx, s, x, y, o) {                        // o: size, weight, font, color, alpha, align, maxW, ls, glow, raw
  if (!o.raw) s = Pilot.tr(s); if (!s) return; const a = o.alpha == null ? 1 : o.alpha; if (a <= .003) return;
  let size = o.size; const f = o.font || SERIF, wt = o.weight || 400, set = () => { ctx.font = `${wt} ${size}px ${f}`; ctx.letterSpacing = (o.ls || 0) * size / o.size + 'px'; };
  ctx.save(); set(); if (RTL()) ctx.direction = 'rtl';
  // a translation may break a long line with \n (Korean never does): the lines stack around y, the widest one sets the shrink
  const lines = s.split('\n');
  if (o.maxW && Pilot.lang !== 'ko') { const wd = Math.max(...lines.map(l => ctx.measureText(l).width)); if (wd > o.maxW) { size *= o.maxW / wd; set(); } }
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha *= a;   // multiplies: a drawing's fade-out carries to its words
  ctx.shadowColor = o.glow ? `rgba(${GOLD},.75)` : 'rgba(0,0,0,.85)'; ctx.shadowBlur = o.glow || 14;
  if (o.blur) ctx.filter = `blur(${o.blur}px)`;
  ctx.fillStyle = o.color || `rgb(${WARM})`;
  lines.forEach((l, i) => ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * size * 1.15)); ctx.restore();
}
function wrap(ctx, s, maxW, f) { ctx.font = f; const out = []; let cur = '';
  for (const w of s.split(' ')) { const n = cur ? cur + ' ' + w : w; if (ctx.measureText(n).width > maxW && cur) { out.push(cur); cur = w; } else cur = n; } if (cur) out.push(cur); return out; }

// ---------- the seven drawings (ox: the truth's place on screen; oy: the line; b: beats since it began) ----------
const R0 = rng(17), HTS = Array.from({ length: 12 }, () => .34 + R0() * .4);
const EH = LY.eh, EW = LY.ew, LAB = (ctx, s, b, b0, ox, o = {}) => say(ctx, s, ox, LY.lab + (o.dy || 0), { size: V ? 30 : 26, color: o.color || `rgb(${WARM})`, alpha: ss(b0, b0 + 1.2, b) * (o.a == null ? .92 : o.a), maxW: W - 120, glow: o.glow });
const ART = [
  // 1 — every life reaches up and falls short of the line of glory
  (ctx, b, ox, oy) => { const gy = oy - EH * .9, gw = EW * .92, gk = eio(clamp((b - .5) / 1.1));
    if (gk > 0) { const hg = ctx.createRadialGradient(ox, gy, 0, ox, gy, gw * .6); hg.addColorStop(0, `rgba(${GOLD},${.3 * gk})`); hg.addColorStop(1, `rgba(${GOLD},0)`);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(ox, gy); ctx.scale(1, .28); ctx.translate(-ox, -gy); ctx.fillStyle = hg; ctx.fillRect(ox - gw, gy - gw, gw * 2, gw * 2); ctx.restore(); }
    glow(ctx, part(seg(ox - gw / 2, gy, ox + gw / 2, gy), gk), 1, 2.8);
    say(ctx, '하나님의 영광', ox, gy - 30, { size: V ? 30 : 26, alpha: ss(1, 2.2, b) * .9 });
    const n = V ? 9 : 11, dim = 1 - .6 * ss(4.4, 5.6, b);
    for (let i = 0; i < n; i++) { const x = ox - gw * .42 + i * gw * .84 / (n - 1), e = eo(clamp((b - (1.5 + i * .26)) / 1.3)), top = oy - HTS[i] * (oy - gy) * e - 14; if (e <= 0) continue;
      glow(ctx, part(seg(x, oy, x, top + 14), 1), .8 * dim, 2); glow(ctx, x2 => x2.arc(x, top, 7, 0, 6.2832), .8 * dim * ss(0, .3, e), 1.8); } },
  // 2 — a ladder up to glory crumbles; in its place a mirror shows 죄
  (ctx, b, ox, oy) => { const lw = V ? 170 : 150, top = oy - EH * .86, rk = eio(clamp((b - .4) / 1.1)), u = clamp((b - 3.3) / 1.6), fa = 1 - ss(0, .25, u);
    const rails = [seg(ox - lw / 2, oy, ox - lw / 2, top), seg(ox + lw / 2, oy, ox + lw / 2, top)], rungs = Array.from({ length: 7 }, (_, i) => { const y = oy - 30 - i * (oy - top - 50) / 6; return seg(ox - lw / 2, y, ox + lw / 2, y); });
    rails.forEach(p => glow(ctx, part(p, rk), .85 * fa, 2.2)); rungs.forEach((p, i) => glow(ctx, part(p, clamp((b - (1.2 + i * .3)) / .45)), .85 * fa, 2));
    dust(ctx, [...rails, ...rungs], u, 21);
    const m = eio(clamp((b - 4.1) / 1.1)), my = oy - EH * .5, rx = EH * .27, ry = EH * .4;
    if (m > 0) { const g = ctx.createRadialGradient(ox - rx * .3, my - ry * .3, 0, ox, my, ry); g.addColorStop(0, `rgba(210,220,235,${.16 * m})`); g.addColorStop(1, `rgba(120,130,150,${.04 * m})`);
      ctx.save(); ctx.beginPath(); ctx.ellipse(ox, my, rx, ry, 0, 0, 6.2832); ctx.fillStyle = g; ctx.fill(); ctx.restore();
      glow(ctx, part(ell(ox, my, rx, ry), m), 1, 2.4); glow(ctx, part(seg(ox, my + ry, ox, oy), m), .7, 2);
      say(ctx, '죄', ox, my + EH * .11, { size: EH * .3, weight: 900, color: 'rgb(214,206,196)', alpha: ss(4.5, 5.6, b) * .9, maxW: rx * 1.7, blur: (1 - ss(4.5, 5.6, b)) * 6 }); }
    LAB(ctx, '사다리가 아니라 거울', b, 4.8, ox); },
  // 3 — a tower of works crumbles; a gift comes down in light
  (ctx, b, ox, oy) => { const bw = V ? 300 : 260, n = 6, bh = (EH * .82) / n - 8, u = clamp((b - 2.8) / 1.6), fa = 1 - ss(0, .25, u), boxes = [];
    for (let i = 0; i < n; i++) { const e = clamp((b - (.7 + i * .35)) / .5), x = ox - bw / 2 + (i % 2 ? 16 : -12) + (i === n - 1 ? 10 : 0), y = oy - (i + 1) * (bh + 8) + 8, p = rect(x, y, bw, bh); boxes.push(p);
      glow(ctx, part(p, e), .8 * fa, 1.8); say(ctx, '행위', x + bw / 2, y + bh * .64, { size: Math.min(24, bh * .42), font: SANS, color: `rgb(${GOLD})`, alpha: ss(.4, 1, e) * fa * .8, maxW: bw - 30 }); }
    dust(ctx, boxes, u, 33);
    const s = EH * .5, e = eio(clamp((b - 3.9) / .9)), y = lerp(oy - EH * 1.25 - s, oy - s, e), ga = ss(3.9, 4.25, b);
    if (ga > 0) { const land = Math.exp(-Math.max(0, b - 4.8) * 1.2) * ss(4.75, 4.85, b);
      if (land > 0) { const lg = ctx.createRadialGradient(ox, oy, 0, ox, oy, s * 1.6); lg.addColorStop(0, `rgba(${GOLD},${.4 * land})`); lg.addColorStop(1, `rgba(${GOLD},0)`); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = lg; ctx.fillRect(ox - s * 1.6, oy - s * 1.6, s * 3.2, s * 3.2); ctx.restore(); }
      const x0 = ox - s / 2, by = y + s * .3;
      glow(ctx, x => { x.rect(x0, y, s, s); }, ga, 2.2);
      glow(ctx, x => { x.moveTo(ox, y); x.lineTo(ox, y + s); x.moveTo(x0, by); x.lineTo(x0 + s, by);
        x.moveTo(ox, y); x.bezierCurveTo(ox - s * .3, y - s * .28, ox - s * .42, y + s * .02, ox, y); x.moveTo(ox, y); x.bezierCurveTo(ox + s * .3, y - s * .28, ox + s * .42, y + s * .02, ox, y); }, ga * .9, 1.8);
      say(ctx, '선물', ox, y + s * .74, { size: s * .17, color: `rgb(${WARM})`, alpha: ga * ss(4.4, 5, b), maxW: s * .9, glow: 18 }); }
    LAB(ctx, '거저 주시는 하나님의 선물', b, 4.6, ox); },
  // 4 — a grey figure, clothed in a robe of light
  (ctx, b, ox, oy) => { const fh = EH * .82, hr = fh * .075, hy = oy - fh + hr, sy = hy + hr + fh * .06, k = clamp((b - .5) / 1.5), c = eio(clamp((b - 2.8) / 1.1));
    const fig = [ell(ox, hy, hr, hr, -Math.PI / 2, 40), [[ox, hy + hr], [ox, oy - fh * .42]], [[ox - fh * .16, sy + fh * .3], [ox - fh * .13, sy], [ox + fh * .13, sy], [ox + fh * .16, sy + fh * .3]], [[ox - fh * .08, oy], [ox, oy - fh * .42], [ox + fh * .08, oy]]];
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = `rgba(${ASH},${.8 * (1 - c * .7)})`; ctx.lineWidth = 2.2; for (const p of fig) { ctx.beginPath(); part(p, k)(ctx); ctx.stroke(); } ctx.restore();
    if (c > 0) { const beam = ctx.createLinearGradient(0, oy - EH * 1.1, 0, oy); beam.addColorStop(0, `rgba(${GOLD},0)`); beam.addColorStop(1, `rgba(${GOLD},${.16 * c})`);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.beginPath(); ctx.moveTo(ox - fh * .12, oy - EH * 1.1); ctx.lineTo(ox + fh * .12, oy - EH * 1.1); ctx.lineTo(ox + fh * .45, oy); ctx.lineTo(ox - fh * .45, oy); ctx.fillStyle = beam; ctx.fill(); ctx.restore();
      const robe = [[ox - fh * .3, oy - 2], [ox - fh * .2, sy + fh * .2], [ox - fh * .14, sy - 2], [ox, sy - fh * .03], [ox + fh * .14, sy - 2], [ox + fh * .2, sy + fh * .2], [ox + fh * .3, oy - 2]];
      const reveal = sy - 10 + (oy - sy + 20) * c;
      ctx.save(); ctx.beginPath(); ctx.rect(ox - fh, 0, fh * 2, reveal); ctx.clip();
      const rg = ctx.createLinearGradient(0, sy, 0, oy); rg.addColorStop(0, `rgba(${GOLD},.32)`); rg.addColorStop(1, `rgba(${GOLD},.1)`);
      ctx.beginPath(); robe.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fillStyle = rg; ctx.globalCompositeOperation = 'lighter'; ctx.fill();
      glow(ctx, x => robe.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])), 1, 2.2); ctx.restore();
      glow(ctx, x => x.arc(ox, hy, hr, 0, 6.2832), c, 2); }
    LAB(ctx, '내 의가 아니라', b, 1.2, ox, { dy: -(V ? 44 : 38), color: `rgb(${ASH})`, a: .95 - .35 * ss(3.5, 4.5, b) });
    LAB(ctx, '그분의 의를 입는 것', b, 3.5, ox, { glow: 16 }); },
  // 5 — 66 points of light turn, one by one, toward the One
  (ctx, b, ox, oy) => { const cy = oy - EH * .5, rx = V ? EW * .46 : EW * .5, ry = EH * .43, st = eo(clamp((b - 2.1) / .9));
    if (st > 0) { const sg = ctx.createRadialGradient(ox, cy, 0, ox, cy, 140); sg.addColorStop(0, `rgba(${WARM},${.85 * st})`); sg.addColorStop(.15, `rgba(${GOLD},${.35 * st})`); sg.addColorStop(1, `rgba(${GOLD},0)`);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = sg; ctx.fillRect(ox - 140, cy - 140, 280, 280); ctx.restore();
      const L1 = 46 * st * (1 + .05 * Math.sin(b * 3)); glow(ctx, x => { x.moveTo(ox, cy - L1); x.lineTo(ox, cy + L1 * 1.5); x.moveTo(ox - L1 * .8, cy - L1 * .2); x.lineTo(ox + L1 * .8, cy - L1 * .2); }, st, 2.2); }
    for (let i = 0; i < 66; i++) { const a = -Math.PI / 2 + (i + .5) / 66 * 6.2832, x = ox + rx * Math.cos(a), y = cy + ry * Math.sin(a), e = clamp((b - (.5 + i * .022)) / .4); if (e <= 0) continue;
      const tw = eio(clamp((b - (2.7 + 1.8 * i / 66)) / 1.1)), din = Math.atan2(cy - y, ox - x), ang = lerp(a + Math.PI / 2, din, tw), len = 16 * e, ot = i < 39;
      if (tw > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${GOLD},${.07 * tw})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lerp(x, ox, tw * .82), lerp(y, cy, tw * .82)); ctx.stroke(); ctx.restore(); }
      glow(ctx, q => { q.moveTo(x - Math.cos(ang) * len, y - Math.sin(ang) * len); q.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); }, e * (ot ? .55 : .9), 1.6, ot ? '230,196,150' : GOLD); }
    LAB(ctx, '구약 39  ·  신약 27  =  66', b, 1.2, ox, { a: .8 }); },
  // 6 — a dial fills with light: 때가 찼고
  (ctx, b, ox, oy) => { const cy = oy - EH * .5, R = EH * .43, n = 48, full = ss(4.3, 4.9, b); let fill = 0;
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * 6.2832, tf = .7 + 3.4 * Math.pow(i / n, .75), e = clamp((b - tf) / .25), ap = ss(.2, .9, b);
      const p = seg(ox + Math.cos(a) * R * .84, cy + Math.sin(a) * R * .84, ox + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.save(); ctx.strokeStyle = `rgba(${ASH},${.45 * ap * (1 - e)})`; ctx.lineWidth = 2; ctx.beginPath(); part(p, 1)(ctx); ctx.stroke(); ctx.restore();
      if (e > 0) { glow(ctx, part(p, 1), e * (.8 + .2 * full), 2); fill = Math.max(fill, (i + e) / n); } }
    if (fill > 0) glow(ctx, x => x.arc(ox, cy, R * .76, -Math.PI / 2, -Math.PI / 2 + fill * 6.2832), .55 + .45 * full, 1.4);
    if (full > 0) { const g = ctx.createRadialGradient(ox, cy, 0, ox, cy, R * 1.5); g.addColorStop(0, `rgba(${GOLD},${.3 * full})`); g.addColorStop(1, `rgba(${GOLD},0)`);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(ox - R * 1.5, cy - R * 1.5, R * 3, R * 3); ctx.restore();
      say(ctx, '때가 찼고', ox, cy + (V ? 26 : 24), { size: V ? 76 : 66, weight: 900, color: '#fff6e2', alpha: ss(4.5, 5.3, b), maxW: R * 1.35, glow: 30 }); } },
  // 7 — “행하라” is struck through and falls away; “이루어졌다” stands
  (ctx, b, ox, oy) => { const y = oy - EH * .36, s = V ? 140 : 132, mw = V ? W - 140 : EW * 1.3, u = ss(2.3, 3.2, b);
    say(ctx, '행하라', ox, y + 40 * u * u, { size: s, weight: 900, color: `rgb(${ASH})`, alpha: ss(.4, 1, b) * (1 - u), maxW: mw, blur: u * 8 });
    const k = eio(clamp((b - 1.7) / .45)); ctx.font = `900 ${s}px ${SERIF}`; const hw = Math.min(mw, ctx.measureText(Pilot.tr('행하라')).width) / 2 + 50;
    glow(ctx, part(seg(ox - hw, y - s * .32, ox + hw, y - s * .32), k), 1 - u, 2.4);
    say(ctx, '이루어졌다', ox, y + EH * .02, { size: s, weight: 900, color: '#fff6e2', alpha: ss(2.9, 3.7, b), maxW: mw, glow: 34 });
    LAB(ctx, '“행하라”가 아니라 “이루어졌다”', b, 3.3, ox, { a: .85 }); },
];

// ---------- the room: dark, warm, a little dust in the air; grain ----------
let grains = [], motes, bokeh;
function room(ctx, t, cx) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07070b'); g.addColorStop(.62, '#0e0c10'); g.addColorStop(1, '#09080a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const pool = ctx.createRadialGradient(W / 2, LY.hl - LY.eh * .4, 0, W / 2, LY.hl - LY.eh * .4, Math.max(W, H) * .6); pool.addColorStop(0, 'rgba(70,52,34,.32)'); pool.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const q of bokeh) { const x = ((q.x - cx * q.p) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * .3, y = q.y + 20 * Math.sin(t * .2 + q.ph), gg = ctx.createRadialGradient(x, y, 0, x, y, q.r);
    gg.addColorStop(0, `rgba(${GOLD},${q.a})`); gg.addColorStop(1, `rgba(${GOLD},0)`); ctx.fillStyle = gg; ctx.fillRect(x - q.r, y - q.r, q.r * 2, q.r * 2); }
  for (const q of motes) { const x = ((q.x - cx * q.p + t * q.vx) % (W + 40) + W + 40) % (W + 40) - 20, y = ((q.y - t * q.vy) % H + H) % H, a = q.a * (.6 + .4 * Math.sin(t * q.sp + q.ph));
    ctx.fillStyle = `rgba(${WARM},${a})`; ctx.fillRect(x, y, q.s, q.s); }
  ctx.restore();
}
function grade(ctx, t) {
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .14; ctx.drawImage(grains[Math.floor(t * 24) % grains.length], 0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ---------- frame ----------
const verseLines = [];
function draw(ctx, t) {
  const cx = camX(t), f = t - T7 - FS;   // f: time into the finale
  room(ctx, t, cx);
  // the line: from off-screen left to its head; in the finale it gives itself up to the cross
  const hx = headX(t), lo = cx - W * .6, la = 1 - ss(2.6, 3.8, f);
  if (hx > lo && la > 0) { const pts = []; for (let x = lo; x <= hx; x += 10) pts.push([x - cx + W / 2, lineY(x)]); pts.push([hx - cx + W / 2, lineY(hx)]);
    glow(ctx, q => pts.forEach((p, i) => i ? q.lineTo(p[0], p[1]) : q.moveTo(p[0], p[1])), .9 * la, 2.2);
    const tip = [hx - cx + W / 2, lineY(hx)], tg = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], 60); tg.addColorStop(0, `rgba(${WARM},${.6 * la})`); tg.addColorStop(1, `rgba(${GOLD},0)`);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = tg; ctx.fillRect(tip[0] - 60, tip[1] - 60, 120, 120); ctx.restore(); }
  // chapter label
  say(ctx, '17  ·  복음의 핵심', RTL() ? W - (V ? 80 : 110) : (V ? 80 : 110), V ? 190 : 120, { size: 30, weight: 600, align: RTL() ? 'right' : 'left', color: '#e8e2d6', alpha: win(t, .6, 5.6, 1, 1), ls: 4, maxW: W * .6 });
  // intro: the title over the dark, the line arriving beneath it
  say(ctx, '복음의 핵심 7가지', W / 2, LY.hl - LY.eh * .45, { size: V ? 70 : 66, weight: 600, alpha: win(t, .5, T0 + .3, .8, .5), maxW: W - 160, glow: 20 });

  for (let i = 0; i < 7; i++) {
    const s = T0 + i * ITEM, e = i < 6 ? s + (IB - 1.1) * B : T7 + 2.8 + FS; if (t < s - .1 || t > e + 1.2) continue;
    const c = CORE[i], b = (t - s) / B, ox = i * SP - cx + W / 2, oy = LY.hl, out = 1 - ss(e - .45, e, t);
    if (ox > -W * .7 && ox < W * 1.7) { ctx.save(); ctx.globalAlpha = i === 6 ? out : 1; ART[i](ctx, b * KA, ox, oy); ctx.restore(); }
    // title and Scripture: like a title card and its subtitle, they come and go with the truth
    const tl = c.t.map(x => Pilot.tr(x)).filter(Boolean);
    tl.forEach((ln, j) => { const a = ss(s + (.2 + j * .15) * B, s + (.2 + j * .15) * B + .7, t) * out;
      say(ctx, ln, W / 2, LY.tt + j * LY.tl + 10 * (1 - a), { raw: true, size: LY.ts, weight: 600, alpha: a, maxW: W - (V ? 120 : 200) }); });
    if (c.v) { const vl = verseLines[i], y0 = LY.tt + (tl.length - 1) * LY.tl + (V ? 96 : 84);
      vl.forEach((ln, j) => { const a = ss(s + (.6 + j * .15) * B, s + (.6 + j * .15) * B + .8, t) * out * .9;
        say(ctx, ln, W / 2, y0 + j * LY.vl, { raw: true, size: LY.vs, color: '#dccfb6', alpha: a }); });
      say(ctx, c.ref, W / 2, y0 + vl.length * LY.vl + (V ? 6 : 4), { size: V ? 24 : 21, font: SANS, color: '#a89a82', ls: 1, alpha: ss(s + 1 * B, s + 1 * B + .8, t) * out * .9, maxW: W - 160 }); }
  }

  // ---------- finale: the line becomes the cross ----------
  if (f > 2.9) {
    const X = RTL() ? W - FIN.X : FIN.X, Y = FIN.Y, fall = clamp((f - 2.9) / .6), py = lerp(-40, Y, fall), vk = eo(clamp((f - 3.55) / .55)), hk = eo(clamp((f - 3.95) / .5));
    const bl = ss(3.5, 4.6, f), bg = ctx.createRadialGradient(X, Y, 0, X, Y, Math.max(W, H) * .7);
    bg.addColorStop(0, `rgba(${GOLD},${.24 * bl})`); bg.addColorStop(.3, `rgba(120,80,40,${.12 * bl})`); bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (vk <= 0) glow(ctx, q => { q.moveTo(X, py - 90); q.lineTo(X, py); }, 1, 2.6);
    else glow(ctx, q => { q.moveTo(X, Y - (Y + 40) * vk); q.lineTo(X, Y + (H - Y + 40) * vk); }, 1, 3.2 + 1.2 * bl);
    if (hk > 0) glow(ctx, q => { q.moveTo(X - FIN.arm * hk, Y); q.lineTo(X + FIN.arm * hk, Y); }, 1, 3.2 + 1.2 * bl);
    const hg = ctx.createRadialGradient(X, Y, 0, X, Y, 120); hg.addColorStop(0, `rgba(${WARM},${.7 * ss(3.4, 3.6, f)})`); hg.addColorStop(1, `rgba(${GOLD},0)`);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hg; ctx.fillRect(X - 120, Y - 120, 240, 240); ctx.restore();
    // “다 이루었다” — the only words left
    const fx = RTL() ? W - FIN.x : FIN.x, al = RTL() ? 'right' : 'left', fw = V ? FIN.X - 36 - FIN.x - 30 : W - FIN.x - 96, a1 = ss(T7 + FS + 4.5, T7 + FS + 5.4, t);
    say(ctx, '다 이루었다', fx, FIN.y + 12 * (1 - a1), { size: FIN.size, weight: 900, align: al, color: '#fff6e2', alpha: a1, maxW: fw, glow: 30 });
    say(ctx, '요한복음 19:30 (개역개정)', fx, FIN.cite, { size: 22, font: SANS, align: al, color: '#a89a82', ls: 1, alpha: ss(T7 + FS + 4.9, T7 + FS + 5.6, t) * .9, maxW: fw });
    ['우리가 아직 죄인 되었을 때에', '그리스도께서 우리를 위하여 죽으심으로'].forEach((ln, j) =>
      say(ctx, ln, fx, FIN.r[0] + j * FIN.r[2], { size: FIN.r[1], weight: 600, align: al, color: '#efe4cf', alpha: ss(T7 + FS + 5.2 + j * .15, T7 + FS + 6 + j * .15, t), maxW: fw }));
    say(ctx, '로마서 5:8 (개역개정)', fx, FIN.rc, { size: 22, font: SANS, align: al, color: '#a89a82', ls: 1, alpha: ss(T7 + FS + 5.6, T7 + FS + 6.3, t) * .9, maxW: fw });
  }
  grade(ctx, t);
  const k = 1 - ss(0, .9, t) + ss(DUR - .8, DUR, t); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(k)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, fonts: ["600 40px 'Noto Serif KR'", "900 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    const c = canvas(4, 4).getContext('2d'); CORE.forEach((q, i) => { verseLines[i] = q.v ? wrap(c, Pilot.tr(q.v), LY.vw, `400 ${LY.vs}px ${SERIF}`) : []; });
    for (let i = 0; i < 6; i++) grains.push(speckle(W / 2, H / 2, 46, 500 + i, .6));
    const r = rng(9); motes = Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H, p: .15 + r() * .5, vx: (r() - .5) * 6, vy: 3 + r() * 8, s: .8 + r() * 1.8, a: .08 + r() * .22, sp: .5 + r() * 2, ph: r() * 6.3 }));
    bokeh = Array.from({ length: 12 }, () => ({ x: r() * W * 1.6, y: r() * H, r: 60 + r() * 160, a: .015 + r() * .03, p: .08 + r() * .15, ph: r() * 6.3 }));
  },
  draw });
</script>
