/* 16 거울 — 이스라엘의 악순환은 나의 모습. A Warhol photo-silkscreen (OPUSCAR 98 · 1969 Midnight Cowboy / Double Elvis):
   a high-contrast black halftone photo plate at 45° pulled over loose, off-register blocks of flat colour on brushed
   silver. The camera is handheld on the studio wall while the screen comes down and the squeegee pulls each print.
     · the golden calf is printed; the cycle runs under it — the print floods with ink (고난), the ground turns red
       (부르짖음), a clean cream coat is rolled over it (하나님의 구원) — and the calf is pulled again, twice, three times.
     · the series multiplies along the wall: money, the trophy, the thumbs-up — every idol pulled again and again,
       colours shifting per print, until the squeegee is printing a person: me, six times, faster.
     · the camera pulls back: a squeegee wave reprints every panel as a mirror — and every mirror shows me.
       The serial wall itself is the point: we keep printing our idols. The golden thread comes down to one mirror.
   The photo plates are shaded from signed-distance fields (as sculpture), screened to dots, and given uneven squeegee
   pressure (flooded blotches, dry streaks, pinholes) once in init. Pure function of t. */

// ---------- signed distance fields (Felzenszwalb EDT) ----------
function edt1(f, n, d, v, z) {

    k++; v[k] = q; z[k] = s; z[k + 1] = 1e30;

  for (let y = 0; y < FH; y++) { for (let x = 0; x < FW; x++) f[x] = out[y * FW + x]; edt1(f, FW, d, v, z); for (let x = 0; x < FW; x++) out[y * FW + x] = d[x]; }
  return out;
}

  const c = canvas(FW, FH), x = c.getContext('2d'); x.fillStyle = '#fff'; x.strokeStyle = '#fff'; fn(x);
  const a = x.getImageData(0, 0, FW, FH).data, m = new Uint8Array(FW * FH); for (let i = 0; i < FW * FH; i++) m[i] = a[i * 4 + 3] > 127 ? 1 : 0;
