/* 09 포로 귀환 — "a blueprint developing into a lit 3D dusk" (after the 1997 Titanic sequence), one unbroken camera move.
   A  Prussian-blue drafting paper, seen from straight above: white lines draw the plan of Jerusalem's broken walls and
      gates; a dashed road comes home from the east; a small lamp traces Nehemiah's night survey (Neh 2:13-15).

    const p = P(c, lerp(pt[0], NEH[0] + .3, hold), lerp(1.4, 2.0, hold), lerp(pt[1], NEH[1], hold)); if (p) { const g = x.createRadialGradient(p[0], p[1], 0, p[0], p[1], 26); g.addColorStop(0, BPW + '.9)'); g.addColorStop(1, BPW + '0)'); x.fillStyle = g; x.fillRect(p[0] - 26, p[1] - 26, 52, 52); x.fillStyle = BPW + '1)'; x.beginPath(); x.arc(p[0], p[1], 3.4, 0, 6.2832); x.fill(); } }

const SURVEY = [[-172, -40], [-168, -120], [-146, -238], [-110, -360], [-64, -476], [0, -548], [56, -480], [96, -390], [124, -300]];

// ================= frame =================
function draw(ctx, t) {

    if (dv < 1) {   // the drawing develops: colour spreads from Nehemiah along a warm soft edge, ghost lines fading
      const np0 = P(c, NEH[0], 1.2, NEH[1]) || [W * .3, H / 2, 1, 1], np = [clamp(np0[0], W * .1, W * .9), clamp(np0[1], H * .2, H * .8)], R = Math.hypot(W, H) * 1.2 * Math.pow(eio(dv), 1.2), soft = 14 + R * .06 + 26 * (1 - clamp(R / 500)), amp = (60 + R * .12) * clamp(R / 520);   // small at first: a round, soft pool of lamplight, not a ragged stain
      bpx.globalCompositeOperation = 'source-over'; bpx.clearRect(0, 0, W, H); blueprint(bpx, c, t, false);
      ctx.save(); ctx.globalAlpha = .6 * (1 - ss(.3, .85, dv)); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(BP, 0, 0); ctx.restore();   // ghost lines in the developed part
      bpx.globalCompositeOperation = 'destination-over'; bpx.drawImage(PAPER, 0, 0); bpx.globalCompositeOperation = 'source-over';
      const w = DM.width, h = DM.height, sc = W / w, cx = np[0] / sc, cy = np[1] / sc, md = DMD.data, ed = DED.data;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = j * w + i, d = Math.hypot(i - cx, j - cy) * sc + (DNZ[k] - .5) * amp, a = clamp((R - d) / soft), e = a * (1 - a) * 4;

        lg.addColorStop(0, `rgba(255,232,186,${.5 * lk})`); lg.addColorStop(.35, `rgba(255,200,130,${.2 * lk})`); lg.addColorStop(1, 'rgba(255,180,110,0)'); ctx.fillStyle = lg; ctx.fillRect(np[0] - lr, np[1] - lr, lr * 2, lr * 2); }

// ================= words: chapter label, subtitles like a film =================
function subtitle(ctx, lines, cite, a, speaker) {
  if (a <= 0) return; lines = String(Pilot.tr(lines.join('\n'))).split('\n');   // translate the whole line, then lay out its lines

  const top = y0 - size * 1.7 - (speaker ? 50 : 0), bg = ctx.createLinearGradient(0, top, 0, y0 + (n - 1) * lh + 110); bg.addColorStop(0, 'rgba(6,6,14,0)'); bg.addColorStop(.45, `rgba(6,6,14,${.42 * a})`); bg.addColorStop(1, 'rgba(6,6,14,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, top, W, y0 + (n - 1) * lh + 110 - top);

  ctx.save(); ctx.globalAlpha = a; ctx.font = `600 ${size}px 'Noto Serif KR',serif`; ctx.textAlign = 'center'; if (RTL()) ctx.direction = 'rtl'; ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 16; ctx.fillStyle = '#fbf4e6';
  lines.forEach((s, i) => ctx.fillText(s, W / 2, y0 + i * lh)); ctx.restore();
  if (cite) text(ctx, cite, W / 2, y0 + (n - 1) * lh + 54, { size: V ? 25 : 23, font: "'Noto Sans KR',sans-serif", color: '#eadcc2', alpha: a * .9, ls: 2, shadow: 'rgba(0,0,0,.85)' });
}
function words(ctx, t) {
  const la = win(t, .8, 5.6, 1.1, 1.1), lx = RTL() ? W - (V ? 80 : 120) : (V ? 80 : 120), ly = V ? 200 : 130, al = RTL() ? 'right' : 'left';
  if (la > 0) { text(ctx, '09  ·  포로 귀환', lx, ly, { align: al, size: 32, weight: 600, color: '#f4ecdc', alpha: la, ls: 8, shadow: 'rgba(0,0,20,.6)', maxW: W * .7 });
    ctx.save(); ctx.globalAlpha = la * .8; const g = ctx.createLinearGradient(lx, 0, lx + (RTL() ? -420 : 420), 0); g.addColorStop(0, 'rgba(240,246,255,.9)'); g.addColorStop(1, 'rgba(240,246,255,0)'); ctx.fillStyle = g; ctx.fillRect(RTL() ? lx - 420 : lx, ly + 18, 420, 1.5); ctx.restore();
    text(ctx, 'BC 538 – 430  ·  에스라 · 느헤미야 · 에스더', lx, ly + 58, { align: al, size: 22, font: "'Noto Sans KR',sans-serif", color: '#e6ecf6', alpha: la * .9, ls: 2, shadow: 'rgba(0,0,20,.6)', maxW: W * .8 }); }
  subtitle(ctx, V ? ['70년 후, 하나님이 길을 여십니다 —', '고향으로 돌아갑니다…'] : ['70년 후, 하나님이 길을 여십니다 — 고향으로 돌아갑니다…'], null, win(t, 4.3, 10.0, .7, .8));
  subtitle(ctx, V ? ['성벽 역사가 오십이 일 만인', '엘룰월 이십오일에 끝나매'] : ['성벽 역사가 오십이 일 만인 엘룰월 이십오일에 끝나매'], '느헤미야 6:15 (개역개정)', win(t, 21.6, 28.6, .9, .9));

Pilot.run({ W, H, dur: DUR, audio: 'return.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    buildWorld(); buildStone();
    // Prussian-blue drafting paper: uneven exposure, fibres, two folds
    PAPER = canvas(W, H); { const x = PAPER.getContext('2d'), g = x.createRadialGradient(W * .45, H * .42, 0, W / 2, H / 2, Math.hypot(W, H) * .6); g.addColorStop(0, '#2a5597'); g.addColorStop(.55, '#1f4687'); g.addColorStop(1, '#12306b'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      const w = W / 6 | 0, h = H / 6 | 0, s = canvas(w, h), sx = s.getContext('2d'), d = sx.createImageData(w, h);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const v = fbm(i * .02, j * .02, 5), k = (j * w + i) * 4; d.data[k] = d.data[k + 1] = d.data[k + 2] = v > .5 ? 255 : 0; d.data[k + 3] = Math.abs(v - .5) * 120; }

      fold(W * .5 + 30, 0, W * .5 - 10, H); fold(0, H * .5 - 20, W, H * .5 + 14);
      const sp = Pilot.speckle(W / 2, H / 2, 40, 3); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .25; x.drawImage(sp, 0, 0, W, H); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; }

    BLOB = [0, 1].map(k => { const c = canvas(128, 128), x = c.getContext('2d'), d = x.createImageData(128, 128);
      for (let j = 0; j < 128; j++) for (let i = 0; i < 128; i++) { const dx = (i - 64) / 64, dy = (j - 64) / 64, rr = Math.hypot(dx, dy), n = fbm(i * .05 + k * 9, j * .05, 4), a = clamp((1 - rr) * 1.6) * clamp((n - .32) * 2.4), o = (j * 128 + i) * 4;

      for (let j = 0; j < 256; j++) for (let i = 0; i < 1024; i++) { const v = fbm(i * .006, j * .03, 5) * .7 + fbm(i * .02 + 9, j * .07, 3) * .3, band = Math.sin(j / 256 * Math.PI), a = clamp((v - .46) * 3.6) * band, o = (j * 1024 + i) * 4;

    { const r = rng(83); for (let i = 0; i < 220; i++) MOTES.push({ x: -158 + r() * 40, y: .3 + r() * 7, z: -70 + r() * 150, p: r() * 6, a: .3 + r() * .7 });
      for (let i = 0; i < 120; i++) MOTES.push({ x: 40 + r() * 80, y: .3 + r() * 7, z: -120 + r() * 70, p: r() * 6, a: .3 + r() * .7 }); }
