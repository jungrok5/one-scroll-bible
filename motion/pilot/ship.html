  say(ctx, V ? '그 배 위에서 아무리 갑판을 깨끗이 닦고,\n동료에게 친절하고, 누구보다 모범적으로 산다 해도 —' : '그 배 위에서 아무리 갑판을 깨끗이 닦고, 동료에게 친절하고,\n누구보다 모범적으로 산다 해도 —', win(t, 12.2, 18.7, .6, .5));
  say(ctx, '당신은 여전히 ‘해적’입니다.', win(t, 18.9, 23.5, .6, .5));
  say(ctx, '그 배가 향하는 곳(심판의 항구)으로\n배와 함께 실려 가기 때문입니다.', win(t, 23.7, 29.9, .6, .5));
  say(ctx, '문제는 ‘행동의 점수’가 아니라\n‘어느 배에 속했는가’(신분)입니다.', win(t, 30.1, 36.3, .6, .5));
  say(ctx, '그래서 복음은 “더 착해져라”가 아니라\n“배를 옮겨 타라”고 말합니다.', win(t, 36.5, 42.7, .6, .5));
  say(ctx, '죄의 배에서 내려, 예수님께로 —\n하나님의 자녀라는 새 신분으로 건너가는 것입니다.', win(t, 42.9, 49.3, .6, .5));
  const va = win(t, 49.7, DUR - .25, .9, .6);
  if (va > 0) { const vy = V ? 330 : 128, vs = V ? 46 : 50, maxW = W - (V ? 90 : 200);
    ctx.save(); ctx.globalAlpha = va; ctx.translate(W / 2, vy + vs * 1.3); ctx.scale(Math.min(W * .6, 900), vs * 3.2); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, 'rgba(242,232,206,.92)'); g.addColorStop(.6, 'rgba(242,232,206,.75)'); g.addColorStop(1, 'rgba(242,232,206,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
    const vt = '“그가 우리를 흑암의 권세에서 건져내사\n그의 사랑의 아들의 나라로 옮기셨으니”';
    text(ctx, vt, W / 2, vy, { size: vs, weight: 600, color: 'rgba(239,227,196,1)', alpha: va, shadow: 'rgba(239,227,196,1)', shadowBlur: 16, maxW });
    text(ctx, vt, W / 2, vy, { size: vs, weight: 600, color: '#24180E', alpha: va, maxW });
    text(ctx, '골로새서 1:13 (개역개정)', W / 2, vy + 2 * vs * 1.55 + 2, { size: 24, font: SANS, color: '#5A3A1E', alpha: va, ls: 2, shadow: 'rgba(239,227,196,1)', shadowBlur: 10 }); }
  const f = 1 - ss(0, 1.3, t) + ss(DUR - 1.1, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, audio: 'ship.m4a', fonts: ["600 40px 'Noto Serif KR'", "italic 400 17px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    // the chart is engraved once at 1.25× and cut into tiles small enough to stay on the GPU (≤ 1504 px), overlapping by 2 px so no seam shows
    const big = buildChart(), TS = 1500, PD = 2;
    for (let ty = 0; ty < big.height; ty += TS) for (let tx = 0; tx < big.width; tx += TS) { const w = Math.min(TS, big.width - tx) + PD * 2, h = Math.min(TS, big.height - ty) + PD * 2, c = canvas(w, h);
      c.getContext('2d').drawImage(big, tx - PD, ty - PD, w, h, 0, 0, w, h); TILES.push({ c, x: (tx - PD) / TF, y: (ty - PD) / TF, w: w / TF, h: h / TF }); }
    big.width = big.height = 1;
    CLOUD = buildCloud(); SHIP.old = buildShip('old'); SHIP.new = buildShip('new');
    const warm = canvas(4, 4).getContext('2d'); for (const c of [...TILES.map(T => T.c), CLOUD, SHIP.old.back, SHIP.old.hull, SHIP.new.back, SHIP.new.hull]) warm.drawImage(c, 0, 0, 4, 4);   // rasterise now, not on the first frame
  },
  draw });
</script>
