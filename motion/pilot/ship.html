  say(ctx, '문제는 ‘행동의 점수’가 아니라\n‘어느 배에 속했는가’(신분)입니다.', win(T, 24.05, 29.45, .5, .4));
  say(ctx, '그래서 복음은 “더 착해져라”가 아니라\n“배를 옮겨 타라”고 말합니다.', win(T, 29.55, 34.95, .5, .4));
  say(ctx, '죄의 배에서 내려, 예수님께로 —\n하나님의 자녀라는 새 신분으로 건너가는 것입니다.', win(T, 35.05, 40.45, .5, .4));
  const va = win(T, 40.6, DUR - .2, .7, .5), vy = V ? 250 : 140, vs = V ? 44 : 50, vst = { weight: 600, color: '#fff6e2', shadow: 'rgba(40,20,5,.95)', shadowBlur: 16, alpha: va };
  if (va > 0) { const sg = ctx.createLinearGradient(0, 0, 0, vy + 220); sg.addColorStop(0, `rgba(30,16,6,${.7 * va})`); sg.addColorStop(1, 'rgba(30,16,6,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, vy + 220); }
  text(ctx, '“그가 우리를 흑암의 권세에서 건져내사\n그의 사랑의 아들의 나라로 옮기셨으니”', W / 2, vy, { ...vst, size: vs });
  text(ctx, '골로새서 1:13 (개역개정)', W / 2, vy + 2 * vs * 1.55 + 4, { size: 24, font: SANS, color: '#f3dcb4', alpha: va * .95, ls: 2, shadow: 'rgba(40,20,5,.9)' });
  const f = 1 - ss(0, 1.2, T) + ss(DUR - .9, DUR, T); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

// right-to-left scripts: every string in Arabic script is laid out right-to-left at the same anchor (the scene's own
// left / centre / right alignment is kept, so the layout does not move). Only installed for a right-to-left language.
function rtlCanvas() {
  const P = CanvasRenderingContext2D.prototype, AR = /[\u0600-\u06ff\u0750-\u077f\ufb50-\ufdff\ufe70-\ufeff]/, ft = P.fillText, st = P.strokeText;
  const wrap = (c, s, fn) => { if (!AR.test(s)) return fn(); const d = c.direction, a = c.textAlign;
    c.direction = 'rtl'; c.textAlign = a === 'start' ? 'left' : a === 'end' ? 'right' : a; try { return fn(); } finally { c.direction = d; c.textAlign = a; } };
  P.fillText = function (s, ...r) { return wrap(this, String(s), () => ft.call(this, s, ...r)); };
  P.strokeText = function (s, ...r) { return wrap(this, String(s), () => st.call(this, s, ...r)); };
}

Pilot.run({ W, H, dur: DUR, audio: 'ship.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'", "700 40px 'Noto Sans KR'"],
  init: async () => {
    if (Pilot.dir === 'rtl') rtlCanvas();
    grain = speckle(1024, 1024, 46, 19, .6); buildRoom();
    const pw = 560, ph = 470;
    SP.pBack = cut(pw, ph, x => shipBack(x, false)); SP.pHull = cut(pw, ph, x => shipHull(x, false));
    SP.bBack = cut(pw, ph, x => shipBack(x, true)); SP.bHull = cut(pw, ph, x => shipHull(x, true));
    SP.arm = cut(340, 90, armArt, 7); SP.sign = cut(300, 230, signArt); SP.cliff = cut(620, 320, cliffArt); SP.cloud = cut(560, 260, x => cloudArt(x, 560, 260, ['#5b5f6e', '#454957'], 3));
    SP.sky = cut(300, 120, x => cloudArt(x, 300, 120, ['#fbf7ee', '#e6ddcc'], 8), 6);
    SP.wave1 = cut(2060, 110, x => waveArt(x, 2060, ['#62b9c8', '#4aa1b2'])); SP.wave2 = cut(1840, 110, x => waveArt(x, 1840, ['#3f9fb5', '#2f8199'])); SP.wave3 = cut(1720, 110, x => waveArt(x, 1720, ['#2f8aa3', '#21718a']));
    SP.sun = cut(240, 320, sunArt); SP.banner = cut(480, 130, bannerArt); SP.heart = cut(90, 94, heartArt, 6); SP.star = cut(88, 88, starArt, 6);
    SP.q = V ? cut(720, 260, x => qSignArt(x, 720, 260, '예수님 안 믿어도,\n그냥 착하게 살면\n되는 것 아닌가요?', 50)) : cut(900, 230, x => qSignArt(x, 900, 230, '예수님 안 믿어도,\n그냥 착하게 살면 되는 것 아닌가요?', 52));
    // warm the pose cache so the first frames don't stall
    for (const p of ['stand', 'reach', 'jump', 'joy']) { kidSprite(p, 0, false); kidSprite(p, 0, true); }
  },
  draw });
