function buildRoute() {

  const [a0, a1, b0, b1] = WIN[i], lt = clamp((t - a0) / (b1 - a0)), z = lerp(1.0, 1.09, eio(lt)), dx = (V ? 0 : lerp(14, -14, lt) * W / 1920), img = PAINT[i];
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, W, H);
  lx.translate(W / 2 + dx, H / 2); lx.scale(z, z); lx.drawImage(img, -PW / 2, -PH / 2); lx.setTransform(1, 0, 0, 1, 0, 0);
  // living light: the fire flickers, the people cross
  const fl = .5 + .5 * noise(t * 6, i * 3);
  if (i === 0) { const px = W / 2 + dx + (PW * (V ? .56 : .6) - PW / 2) * z, py = H / 2 + (PH * (V ? .3 : .27) - PH / 2) * z; lx.globalCompositeOperation = 'screen'; const g = lx.createRadialGradient(px, py, 0, px, py, W * .14); g.addColorStop(0, `rgba(255,170,90,${.25 + .2 * fl})`); g.addColorStop(1, 'rgba(255,150,80,0)'); lx.fillStyle = g; lx.fillRect(0, 0, W, H); }
  if (i === 1) { const px = W / 2 + dx, py = H / 2 + (PH * (V ? .5 : .52) + PH * (V ? .04 : .07) - PH / 2) * z; lx.globalCompositeOperation = 'screen'; const g = lx.createRadialGradient(px, py, 0, px, py, W * .2); g.addColorStop(0, `rgba(255,180,100,${.18 + .2 * fl})`); g.addColorStop(1, 'rgba(255,150,80,0)'); lx.fillStyle = g; lx.fillRect(0, 0, W, H); }
  if (i === 2) { lx.globalCompositeOperation = 'source-over'; const cyv = PH * (V ? .7 : .72), r = rng(7);
    for (let k = 0; k < 34; k++) { const u = ((t - a0) * .06 + k * .031 + r() * .01) % 1.2; if (u > 1) continue; const f = .55 + .45 * u * .0, rvx = (fv => PW * (.42 - .3 * fv + .06 * Math.sin(fv * 5)))(.77), ww = PW * (.012 + .07 * .77);
      const wx = lerp(rvx - ww * 1.6, rvx + ww * 1.6, u), wy = cyv - PH * .006 + (r() - .5) * PH * .02, sx = W / 2 + dx + (wx - PW / 2) * z, sy = H / 2 + (wy - PH / 2) * z, sc = S1 * z * (V ? 1.1 : 1);

function bloomMask(k) {         // watercolour bloom: the painting opens from wet spots outward, along a noise field
  const d = maskD.data; for (let i = 0; i < NZ.length; i++) d[i * 4 + 3] = clamp((k * 1.5 - .25 - NZ[i]) * 7) * 255; maskX.putImageData(maskD, 0, 0);
}
function note(ctx, s, x, y, a, o = {}) {   // a hand note: written in from left to right over a paper halo, with a leader
  if (a <= 0) return; const size = (o.size || 34) * (V ? 1.05 : 1); ctx.save(); ctx.font = `600 ${size}px 'Noto Serif KR'`; ctx.letterSpacing = '3px'; const tw = ctx.measureText(s).width, x0 = o.align === 'center' ? x - tw / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 30, y - size * 1.4, (tw + 60) * clamp(o.reveal == null ? 1 : o.reveal), size * 2.2); ctx.clip(); ctx.globalAlpha = a;
  ctx.textAlign = 'left'; ctx.lineJoin = 'round'; ctx.lineWidth = size * .3; ctx.strokeStyle = o.halo || 'rgba(240,230,208,.85)'; ctx.strokeText(s, x0, y); ctx.fillStyle = o.color || INK; ctx.fillText(s, x0, y); ctx.restore();
  if (o.to) { const k = clamp(((o.reveal == null ? 1 : o.reveal) - .4) / .6); ctx.save(); ctx.globalAlpha = a * .8; ctx.strokeStyle = o.color || INK; ctx.lineWidth = 2; ctx.setLineDash([]); ctx.beginPath(); const sx = o.from ? o.from[0] : x0 + tw / 2, sy = o.from ? o.from[1] : y + 14;
    ctx.moveTo(sx, sy); ctx.lineTo(lerp(sx, o.to[0], k), lerp(sy, o.to[1], k)); ctx.stroke(); ctx.restore(); }
}

function draw(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const cam = drawMap(ctx, t);
  for (let i = 0; i < 3; i++) { const [a0, a1, b0, b1] = WIN[i]; if (t < a0 || t > b1) continue; const k = t < a1 ? (t - a0) / (a1 - a0) : t > b0 ? 1 - (t - b0) / (b1 - b0) : 1;
    drawPainting(ctx, t, i); if (k < 1) { bloomMask(eio(k)); lx.globalCompositeOperation = 'destination-in'; lx.imageSmoothingEnabled = true; lx.drawImage(maskC, 0, 0, W, H); lx.globalCompositeOperation = 'source-over'; }
    ctx.drawImage(layer, 0, 0); }
  // paper grain over everything, a soft vignette toward umber
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .18; ctx.drawImage(grain, 0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .45, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(58,36,24,0)'); vg.addColorStop(1, 'rgba(58,36,24,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // words
  const toS = (lon, lat) => { const [mx, my] = mp(lon, lat); const [cx, cy] = mp(cam.lon, cam.lat); return [W / 2 + (mx - cx) * cam.z, H / 2 + (my - cy) * cam.z]; };
  const lx0 = V ? 80 : 110, ly0 = V ? 250 : 120;
  note(ctx, '05  ·  광야 여정', lx0, ly0, win(t, .6, 5.0, 1, .8), { size: 30 });
  note(ctx, '약 BC 1446–1406  ·  출애굽기–여호수아', lx0, ly0 + 44, win(t, 1.1, 5.0, 1, .8) * .9, { size: 21 });
  const vy = V ? 340 : 170;
  // P1: Sinai
  note(ctx, '시내산 · 십계명', V ? W * .08 : W * .1, V ? H * .64 : H * .5, win(t, 6.8, 10.9, .4, .7), { size: 40, reveal: (t - 6.8) / 1.1, color: '#f6ead2', halo: 'rgba(40,26,40,.6)' });
  // map 2: forty years
  { const [px, py] = toS(34.45, 30.3); note(ctx, '40년 광야', px + (V ? -40 : 150) * S1, py + (V ? 170 : -110) * S1, win(t, 12.9, 15.0, .3, .5), { size: 38, reveal: (t - 12.9) / 1.0, to: [px + 40 * S1, py - 10 * S1], from: [px + (V ? 40 : 200) * S1, py + (V ? 140 : -96) * S1] }); }
  // P2: the verse in the dusk sky
  const v1 = win(t, 16.0, 21.6, 1.1, .8), cream = { weight: 600, color: '#fbf1dc', shadow: 'rgba(30,18,30,.85)', shadowBlur: 22 };
  text(ctx, '“너희를 내 백성으로 삼고', W / 2, vy, { ...cream, size: V ? 52 : 50, alpha: v1 });
  text(ctx, '나는 너희의 하나님이 되리니”', W / 2, vy + (V ? 78 : 74), { ...cream, size: V ? 52 : 50, alpha: ss(16.8, 17.9, t) * (1 - ss(20.8, 21.6, t)) });
  text(ctx, '출애굽기 6:7 (개역개정)', W / 2, vy + (V ? 136 : 128), { size: V ? 24 : 22, font: "'Noto Sans KR',sans-serif", color: '#eadcf0', alpha: v1 * .9, ls: 2, shadow: 'rgba(30,18,30,.8)' });
  // P3: the site's line
  const p3 = win(t, 26.3, 30.2, 1, .7), ink = { weight: 600, color: '#3A2418', shadow: 'rgba(250,240,215,.95)', shadowBlur: 20 };
  text(ctx, V ? '약속의 땅 문 앞에 선 백성,\n이제 들어갑니다…' : '약속의 땅 문 앞에 선 백성, 이제 들어갑니다…', W / 2, vy, { ...ink, size: V ? 50 : 48, alpha: p3 });
  // the whole road: Deuteronomy 1:31 in two cards
  const c1 = win(t, 33.0, 36.4, 1, .6), c2 = win(t, 36.3, DUR - .4, .7, 1), sz = V ? 46 : 44;
  text(ctx, '“사람이 자기의 아들을 안는 것 같이\n너희의 하나님 여호와께서', W / 2, vy, { ...ink, size: sz, alpha: c1, lh: 1.5 });
  text(ctx, '너희가 걸어온 길에서 너희를 안으사\n이 곳까지 이르게 하셨느니라”', W / 2, vy, { ...ink, size: sz, alpha: c2, lh: 1.5 });
  text(ctx, '신명기 1:31 (개역개정)', W / 2, vy + sz * 1.5 + (V ? 58 : 54), { size: V ? 24 : 22, font: "'Noto Sans KR',sans-serif", color: '#5a4030', alpha: Math.max(c1, c2) * .9, ls: 2, shadow: 'rgba(250,240,215,.95)', shadowBlur: 12 });
  const f = 1 - ss(0, 1.3, t) + ss(DUR - 1.1, DUR, t); if (f > 0) { ctx.fillStyle = `rgba(14,9,6,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

Pilot.run({ W, H, dur: DUR, audio: 'wilderness.m4a', fonts: ["600 40px 'Noto Serif KR'", "400 40px 'Noto Serif KR'", "400 20px 'Noto Sans KR'"],
  init: async () => {
    MAP = buildMap(); buildRoute(); PAINT = [P1(PW, PH), P2(PW, PH), P3(PW, PH)];
    layer = canvas(W, H); lx = layer.getContext('2d'); grain = speckle(W >> 1, H >> 1, 40, 5, .5);
    NW = W >> 3; NH = H >> 3; maskC = canvas(NW, NH); maskX = maskC.getContext('2d'); maskD = maskX.createImageData(NW, NH); NZ = new Float32Array(NW * NH);
    for (let j = 0; j < NH; j++) for (let i = 0; i < NW; i++) { const d = Math.hypot(i / NW - .5, (j / NH - .5) * NH / NW); NZ[j * NW + i] = .65 * fbm(i * .06, j * .06, 4) + .55 * d; }
    for (let i = 0; i < NZ.length; i++) { maskD.data[i * 4] = maskD.data[i * 4 + 1] = maskD.data[i * 4 + 2] = 255; }
